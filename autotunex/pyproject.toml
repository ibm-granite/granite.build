[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotunex"
# Read from `src/autotunex/__init__.py`, the one place to bump it: `/health` and the
# OpenAPI document report `__version__`.
dynamic = ["version"]
description = "Automated fine-tuning and hyperparameter optimization of LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "IBM Research" }]
keywords = ["llm", "fine-tuning", "hyperparameter-optimization", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# Versions are pinned exactly, not floored: installs are reproducible without a
# lockfile, and no upstream release can change a build behind our back. Upgrade
# deliberately: bump the pin, then run `make check` and `make audit`.
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.11.10",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.51",
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "uvicorn[standard]==0.52.2",
  # Transitive, but pinned directly: the upstream ranges admit vulnerable releases.
  #   starlette: fastapi allows >=0.46.0 (PYSEC-2026-161, PYSEC-2026-249).
  "starlette==1.3.1",
  #   h11: uvicorn allows >=0.8 (CVE-2025-43859).
  "h11==0.16.0",
  # OIDC bearer-token verification (RS256 needs the crypto extra).
  "pyjwt[crypto]==2.13.0",
  # Used by pyjwt (RS256) and asyncmy (caching_sha2_password); pinned identically
  # in the mysql extra. >=50.0.0 clears GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww
  # and GHSA-m2h6-j472-rp4c.
  "cryptography==50.0.1",
  # Server-side call to the OIDC token endpoint (`/auth/callback`).
  "httpx==0.28.1",
  # Parquet read/write for dataset uploads. >=23.0.1 clears PYSEC-2026-113.
  "pyarrow==23.0.1",
  # Multipart form parsing for dataset uploads. >=0.0.31 clears PYSEC-2026-1852
  # and PYSEC-2026-3036 through -3040.
  "python-multipart==0.0.31",
  # Renders the llmb build spec. Floored, not pinned: serialization only, with no
  # security-sensitive surface.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.31.0"]
# asyncmy needs cryptography for caching_sha2_password (MySQL 8.4's default) but
# does not declare it. asyncmy must stay >=0.2.14: older releases answer correct
# credentials with 1045 Access denied over TLS when the server's auth cache is
# cold (asyncmy issue #117).
mysql = ["asyncmy==0.2.15", "cryptography==50.0.1"]
# Floored, not pinned: an opt-in leaf feature (`settings.enable_mcp`). >=2.3,<4 is
# verified to leave the fastapi/starlette/pydantic pins above untouched (see
# api/mcp.py).
mcp = ["fastmcp>=2.3,<4"]
# A git dependency, so it cannot take an exact PyPI pin; pinned to the upstream
# `stable` tag instead. `stable` moves with each release; use `@vX.Y.Z` for an
# immutable ref. Requires `allow-direct-references` below.
# autotune (fm-tune) is not listed: it is vendored at src/fm-tune and installed from
# that path (`make install` for the slim catalog, `make install-training` for the rest).
granite-build = [
  "granite.build @ git+https://github.com/ibm-granite/granite.build.git@stable",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
  "mypy==2.3.0",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ibm-granite/granite.build/tree/main/autotunex"
Repository = "https://github.com/ibm-granite/granite.build/tree/main/autotunex"
Issues = "https://github.com/ibm-granite/granite.build/issues"

[tool.hatch.version]
path = "src/autotunex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autotunex"]

# Required by the granite-build extra's git reference. Without it, hatchling refuses
# to generate metadata for every install, not just that extra.
[tool.hatch.metadata]
allow-direct-references = true

# ---------------------------------------------------------------------------
# Lint + format (ruff replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# docs: ruff would reformat the illustrative snippets in markdown code fences.
# src/api-bridge, src/fm-tune: subprojects with their own [tool.ruff], linted by path
# from the Makefile. .claude: internal tooling and nested git worktrees.
extend-exclude = ["docs", "src/api-bridge", "src/fm-tune", ".claude"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ASYNC",# flake8-async
  "RUF",  # ruff-specific
  "ANN",  # flake8-annotations (enforce typed signatures)
  "D",    # pydocstyle
]
ignore = [
  "D100",  # missing docstring in public module
  "D104",  # missing docstring in public package
  "D107",  # missing docstring in __init__ (documented on the class)
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
  "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings, but are held to the same typing bar as src/.
"tests/**" = ["D101", "D102", "D103"]
# Alembic generates these files from a template; don't fight it.
"alembic/**" = ["D", "ANN", "E501", "I001", "UP", "W291", "W293"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
# Subprojects with their own configs. fm-tune is still imported by
# services/autotune.py, which is what the `autotune` override below is for.
exclude = "^src/api-bridge/|^src/fm-tune/"

# pyarrow ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# autotune (src/fm-tune, excluded above) ships no stubs; services/autotune.py imports
# it lazily.
[[tool.mypy.overrides]]
module = ["autotune", "autotune.*"]
ignore_missing_imports = true

# fastmcp is the optional [mcp] extra, absent from the `.[dev]` install CI type-checks.
[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

# numpy 2.x stubs use the 3.12-only `type` statement, which halts mypy under
# python_version 3.11. Nothing in src imports numpy.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# ray (only in src/fm-tune[full,mlx]) is skipped even when installed, so mypy sees
# services/local/trainer.py the same either way and its `# type: ignore[misc]` is
# never flagged as unused.
[[tool.mypy.overrides]]
module = ["ray", "ray.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# gbcli (the granite.build CLI) is absent from `.[dev]` and ships no stubs. Use this
# override, not per-import ignores: those miss the import-not-found case CI hits.
[[tool.mypy.overrides]]
module = ["gbcli", "gbcli.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/autotunex"]
branch = true
