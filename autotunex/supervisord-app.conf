; supervisord config for the combined API + UX container (docker-compose).
; Runs ONLY the AutoTuneX API server, which also serves the prebuilt SvelteKit
; SPA from UX_BUILD_DIR. The API Bridge runs in its own container, so it is not
; started here (contrast supervisord-combined.conf, which runs both).

[supervisord]
nodaemon=true
user=root

[program:autotune-server]
command=python server.py
directory=/app/api
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
