# Run AutoTuneX standalone with Docker Compose. This starts just the
# `autotunex` service; the all-in-one `aio` service below is held back by a
# profile and is not started unless that profile is activated.
#   docker compose up --build
# Docker Compose only: these builds rely on BuildKit reading
# autotunex/Dockerfile*.dockerignore, which Podman ignores (it applies the root
# .dockerignore, which excludes autotunex/). With Podman, build directly:
#   podman build --ignorefile Dockerfile.dockerignore -f Dockerfile -t autotunex:local ..
#
# All defaults are baked into the image (see Dockerfile); uncomment the
# environment / args blocks only to override them.
#
# The build context is the repository root (..): the llmb variant and the aio
# image install granite.build from the same checkout.
services:
  autotunex:
    build:
      context: ..
      dockerfile: autotunex/Dockerfile
      # args:
      #   PUBLIC_AUTOTUNEX_API_URL: ""   # set only if the API is fronted elsewhere
      #   JOB_BACKEND: llmb              # the llmb backend instead of local
    image: autotunex:local
    ports:
      - "8000:8000"
    volumes:
      - autotunex-data:/data
    # environment:
    #   AUTOTUNEX_STANDALONE_EMAIL: you@example.com
    #   AUTOTUNEX_JOB_BACKEND: none
    restart: unless-stopped

  # All-in-one image: AutoTuneX (+UI) on 8000, granite.build gbserver (+UI) on
  # 8080, and the api-bridge on 8001 (loopback only, not published). Run with:
  #   cp .env.aio.example .env.aio   # fill in real secrets first
  #   docker compose --profile aio up --build
  aio:
    # Behind a profile, so a bare `up` never tries to build or start it: it
    # requires .env.aio, which is gitignored and absent from a fresh clone.
    profiles: ["aio"]
    build:
      context: ..
      dockerfile: autotunex/Dockerfile.aio
      # args:
      #   PUBLIC_AUTOTUNEX_API_URL: ""             # set only if the API is fronted elsewhere
      #   INSTALL_AUTOTUNE_CORE: "1"               # also install the vendored fm-tune core (src/fm-tune[core,mlx], local backend)
    image: autotunex-aio:local
    ports:
      - "8000:8000"   # AutoTuneX API + UI
      - "8080:8080"   # granite.build gbserver + UI
      # 8001 (api-bridge) is intentionally NOT published — loopback only.
    env_file:
      - .env.aio      # secrets + external MySQL + GB_TOKEN (see .env.aio.example)
    volumes:
      - aio-data:/data
      # If your MySQL requires verified TLS, mount the CA cert and point
      # AUTOTUNEX_DATABASE_SSL_CA / AUTOTUNEX_DATABASE_SSL_MODE at it in .env.aio
      # (shared by both AutoTuneX and the api-bridge):
      # - ./mysql-ca.pem:/certs/mysql-ca.pem:ro
    restart: unless-stopped

  # GPU build of the same image: the CUDA kernel base (docker/cuda-base/Dockerfile)
  # plus the fm-tune [full] extras (verl/vLLM, flash-attn, deepspeed). Run with:
  #   docker compose --profile cuda up --build
  cuda:
    # Behind a profile, like `aio`, so a bare `up` never pulls the multi-GB CUDA
    # base or tries to reserve a GPU on a machine that has none.
    profiles: ["cuda"]
    # The CUDA wheels and kernels are amd64-only, so on Apple silicon (arm64) this
    # build runs under emulation and is much slower.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: autotunex/Dockerfile
      args:
        DEVICE: cuda
      # CUDA_KERNEL_BASE overrides the kernel base (docker/cuda-base/Dockerfile),
      # e.g. with one built locally:
      #   CUDA_KERNEL_BASE: autotunex-cuda-base:local
    image: autotunex:cuda
    ports:
      - "8000:8000"
    # A volume of its own: sharing one SQLite file with the `autotunex` service
    # would mean two containers writing the same database.
    volumes:
      - autotunex-cuda-data:/data
    # Compose's device reservation. Podman passes GPUs through with CDI instead:
    #   podman run --device nvidia.com/gpu=all ...
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  autotunex-data:
  aio-data:
  autotunex-cuda-data:
