[project]
name = "autotune"
version = "0.9.0"
description = "AutoTune: Automated Tuning for Foundation Models"
authors = [
    {name = "RADU MARINESCU", email = "radu.marinescu@ie.ibm.com"},
    {name = "Daniel Karl I. Weidele", email = "daniel.karl@ibm.com"},
    {name = "Priyanshu Rai", email = "Priyanshu.Rai@ibm.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0.2",
]

## The base install (`dependencies` above) is deliberately slim: just enough
## (pyyaml) for a wizard-only consumer (autotune.catalog) to `pip install
## autotune` without dragging in torch. `core` is the lean training stack —
## single-device SFT and offline RL (DPO/KTO) — for CPU / macOS / demo use
## (the AutoTuneX AIO image and its in-process `local` job backend install it).
## `full` builds on `core` with the online-RL stack (PPO/GRPO/DAPO via
## verl/vLLM) plus flash-attn and deepspeed — the GPU / multi-GPU deps that
## don't build on a CPU-only box. `full` is defined as `core` + those heavy
## deps so every shared pin lives in exactly one place.
##
## (`core` previously existed to spare a downstream consumer from verl/flash-attn
## and was removed when that consumer retired; it is back because the lean CPU/demo install
## it provided is needed independently — e.g. the AIO `local` backend.)
[project.optional-dependencies]
core = [
    "datasets==4.8.5",
    "ray[tune,default]==2.59.0",
    "pyzmq==27.2.0",
    "accelerate>=1.15.0",
    "tokenizers>=0.22.0",
    "sentencepiece>=0.2.0",
    "hyperopt==0.2.7",
    "packaging>=25.0",
    "tabulate>=0.10",
    "tensorboardx>=2.6.4",
    "torch==2.11.0",
    "transformers==5.9.0",
    # 0.19.1, not 0.21.x: 0.21.0 rebuilt get_peft_model_state_dict on module-name
    # prefixes that strip `_fsdp_wrapped_module.` only when leading, so a
    # multi-rank FSDP save (per-layer wraps put it mid-path) writes a 0-tensor
    # adapter. Also the version shadow-residual pins.
    "peft==0.19.1",
    # 1.12.0 is the last release with trl.experimental.ppo, which verl's PPO
    # critic falls back to for AutoModelForCausalLMWithValueHead (Granite has no
    # *ForTokenClassification). 1.13 removed it.
    "trl==1.12.0",
    "bitsandbytes==0.50.2",
]
# full = core + the online-RL / GPU-only stack. Keep these markers: verl and
# deepspeed skip macOS; flash-attn is Linux-only and compiled from source at
# install time (needs nvcc 13; see [tool.uv.extra-build-dependencies] below).
full = [
    "autotune[core]",
    # verl[vllm]==0.9.1 pins torch==2.11.0, vllm==0.24.0 and transformers==5.9.0,
    # which is what fixes the torch / transformers pins above.
    "verl[vllm]==0.9.1; sys_platform != 'darwin'",
    "flash-attn==2.8.3; sys_platform == 'linux'",
    # Fast Mamba kernels for hybrid bases (Granite 4.0-H): without them
    # transformers falls back to a pure-torch scan that is several times slower
    # and needs far more memory (KTO on 1 GPU ran out at 80 GB). Compiled at
    # install time like flash-attn. mamba-ssm 2.3.1 exactly: 2.2.x's top-level
    # import pulls GreedySearchDecoderOnlyOutput, which transformers 5 removed
    # (and transformers imports that top-level module, so it silently falls
    # back to the slow path); 2.3.2 adds tilelang / apache-tvm-ffi /
    # quack-kernels runtime deps.
    "mamba-ssm==2.3.1; sys_platform == 'linux'",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
    "deepspeed==0.19.7; sys_platform != 'darwin'",
]
dev = [
    "ruff>=0.17.0",
    "pre-commit>=3.7.0",
]
mlx = [
    "mlx>=0.29.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.28.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
namespaces = false

[tool.setuptools.package-data]
autotune = ["configs/*.yaml"]

# --- uv configuration ---
[tool.uv]
prerelease = "if-necessary"

# flash-attn is compiled from source at install time: there is no official
# prebuilt wheel for torch 2.11 + CUDA 13. Run `uv pip install -e ".[full]"` on
# a GPU node (or any host with nvcc 13 under /usr/local/cuda or $CUDA_HOME);
# the compile takes ~10 min with 32 cores. Its setup.py imports torch, so the
# build env gets the *same* torch as the runtime env (match-runtime) rather than
# whatever torch an isolated build would resolve.
[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "ninja",
    "psutil",
    "einops",
    "packaging",
    "setuptools",
    "wheel",
]
# mamba-ssm's own build-system deliberately omits torch (an isolated build would
# resolve CPU torch), which is exactly what match-runtime fixes.
mamba-ssm = [
    { requirement = "torch", match-runtime = true },
    "ninja",
    "einops",
    "packaging",
    "setuptools",
    "wheel",
]
causal-conv1d = [
    { requirement = "torch", match-runtime = true },
    "ninja",
    "packaging",
    "setuptools",
    "wheel",
]

# sm80 + sm90 (A100 + H100), the combination fm-tune is tested on; add "100" for
# Blackwell. FLASH_ATTENTION_FORCE_BUILD skips setup.py's attempt to download a
# prebuilt wheel that does not exist for this torch/CUDA pair. MAX_JOBS caps
# parallel nvcc jobs (each needs several GB of RAM); override it in the shell.
[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTN_CUDA_ARCHS = "80;90", FLASH_ATTENTION_FORCE_BUILD = "TRUE", MAX_JOBS = "16" }
# The mamba-ssm / causal-conv1d setup.py hard-code their arch list (sm75-sm121 on
# CUDA 13, no env override), so they compile longer than flash-attn. *_FORCE_BUILD
# skips the prebuilt-wheel download attempt, as for flash-attn.
mamba-ssm = { MAMBA_FORCE_BUILD = "TRUE", MAX_JOBS = "16" }
causal-conv1d = { CAUSAL_CONV1D_FORCE_BUILD = "TRUE", MAX_JOBS = "16" }

# --- Tool configuration ---
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "scratchpad",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
# verl driver deliberately runs GPU / env sanity checks at module load time
# BEFORE importing torch/verl/ray, to fail fast on incompatible environments.
# The late imports are load-bearing — E402 is the wrong call here.
"autotune/trainers/driver_multi_verl.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that download or load HF model weights (>50MB)",
    "gpu: tests that require CUDA",
    "mps: tests that require an Apple Silicon MPS device",
    "full: tests that import the [full] online-RL stack (verl, hydra, omegaconf)",
]
