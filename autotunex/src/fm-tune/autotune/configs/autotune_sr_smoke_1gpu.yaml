  sr:
    # Shadow Residual: a dual-stream Granite decoder (frozen base stream that
    # stays bit-exact with the unadapted base + a trainable adapter stream fed by
    # stock LoRA deltas and a per-layer rank-R cross_stream injection from the
    # base). Only norm(h_adapt) reaches the LM head.
    #
    # The adapter itself is 100% stock PEFT LoRA -- the architecture change
    # happens when the model is *built* (autotune/shadow_residual.py), not in a
    # custom PEFT layer -- so the tunable surface is LoRA's plus the one
    # SR-specific knob, cross_stream_r.
    #
    # Requires: --tuning_algo sr, a dense Granite base, train_implementation: FSDP
    # (full_shard recommended; DeepSpeed is rejected), rl_algo none, and
    #   git clone https://github.com/generative-computing/shadow-residual && pip install -e shadow-residual --no-deps
    description: "Shadow Residual (dual-stream Granite) fine-tuning"
    tuner_name: "tuner.sr"
    title: "Shadow Residual"
    dataset_type: "dataset_type_a"
    hyperparams:
      r:
        description: "LoRA rank on the q/o/gate/up/down projections (K/V are base-only and cannot be adapted)"
        options: ["choice", "uniform"]
        strategy: "choice"
        values: [16, 32, 64]
        min_val: 0
        max_val: 1024
        default: 32
        type: int
        for_tuner: true
      cross_stream_r:
        description: "Rank of the per-layer cross_stream injection from the base stream into the adapter stream"
        options: ["choice", "uniform"]
        strategy: "choice"
        values: [16, 32, 96]
        min_val: 0
        max_val: 1024
        default: 32
        type: int
        for_tuner: true
      alpha_ratio:
        # for_tuner: true here, UNLIKE every other tuner -- and deliberately so.
        # The drivers compute lora_alpha = int(alpha_ratio * peft_kwargs["r"]),
        # but SR's `r` is the *minimum* rank (PEFT's scalar default, with
        # per-name overrides in rank_pattern), so that formula would yield
        # 2 x min_rank where SR wants 2 x max_rank. Routing alpha_ratio into
        # peft_kwargs instead leaves the drivers' train_kwargs.pop("alpha_ratio")
        # returning None -- so they never touch lora_alpha -- and lets
        # build_sr_lora_config compute it correctly from max(r, cross_stream_r).
        # for_tuner controls only which bucket a sampled value lands in; every
        # hyperparam here is sampled either way.
        description: "Scaling ratio; lora_alpha = alpha_ratio * max(r, cross_stream_r)"
        options: ["choice", "uniform"]
        strategy: "choice"
        values: [1.0, 2.0]
        min_val: 0.1
        max_val: 10.0
        default: 2.0
        type: float
        for_tuner: true
      lora_dropout:
        description: "Dropout rate"
        options: ["choice", "uniform"]
        strategy: "choice"
        values: [0.0, 0.05, 0.1]
        min_val: 0.0
        max_val: 0.1
        default: 0.05
        type: float
        for_tuner: true
      bias:
        description: "Bias value (non-'none' is untested for SR)"
        options: ["choice"]
        strategy: "choice"
        values: ["none"]
        min_val: null
        max_val: null
        default: "none"
        type: str
        for_tuner: true
      learning_rate:
        description: "Learning rate"
        options: ["choice", "uniform", "loguniform"]
        strategy: "choice"
        values: [0.00005, 0.0001, 0.0002]
        min_val: 0.000001
        max_val: 0.001
        default: 0.0002
        type: float
        for_tuner: false
      lr_scheduler_type:
        description: "Learning rate scheduler type"
        options: ["choice"]
        strategy: "choice"
        values: ["cosine"]
        min_val: null
        max_val: null
        default: "cosine"
        type: str
        for_tuner: false
      warmup_ratio:
