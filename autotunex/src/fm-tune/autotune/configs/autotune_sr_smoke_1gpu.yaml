# Tokenizer customization (optional, all fields default to null)
# Every default here must stay null for SR: adding tokens would make
# get_tokenizer report num_new_tokens > 0, and resize_model_embeddings is not a
# supported operation on an SR model (transfer_base_weights slices the upstream
# checkpoint at its original vocab size, and on non-rank-0 the embedding is still
# a meta tensor). autotune/shadow_residual.py::assert_no_vocab_resize raises
# rather than letting that through silently.
tokenizer_config:
  tokenizer_name_or_path:
    description: "Path or name for a custom tokenizer (defaults to model_name_or_path if null)"
    default: null
    type: str
  additional_special_tokens:
    description: "List of new special tokens to add to the tokenizer"
    default: null
    type: list
  additional_tokens:
    description: "List of new regular tokens to add to the vocabulary"
    default: null
    type: list
  pad_token:
    description: "Override the pad token (default: use eos_token)"
    default: null
    type: str
  eos_token:
    description: "Override the eos token"
    default: null
    type: str
  bos_token:
    description: "Override the bos token"
    default: null
    type: str
