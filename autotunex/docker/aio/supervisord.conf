; supervisord configuration for the all-in-one AutoTuneX image (Dockerfile.aio).
;
; Runs three services in one container. supervisord is PID 1 (nodaemon=true) and
; forwards its own environment — the baked ENV plus everything passed via
; --env-file — to each child, so AUTOTUNEX_*, GB_*, DB_* and SESSION_SECRET all
; reach the process that needs them without being re-declared here.
;
; Runs as the non-root `appuser`, so the pidfile/socket live under /tmp and all
; logs are sent to the container's stdout/stderr (maxbytes=0 = no rotation).

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

; A unix socket + RPC interface so `supervisorctl` works inside the container
; (optional, but cheap and useful for debugging). Kept under /tmp for appuser.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- granite.build gbserver (standalone) + dashboard, 127.0.0.1:8090 ------------
; cwd is the repo so the relative --space-dir resolves; serves plain HTTP.
; Bound to LOOPBACK on an INTERNAL port (8090), deliberately NOT the exposed
; port. The front proxy (gbproxy, below) owns the exposed :8080 and dials
; gbserver over loopback, so gbserver's peer is always 127.0.0.1 — which is what
; its standalone/apikey auth requires (gbserver api/auth.py:_is_localhost).
; Binding 127.0.0.1 (not 0.0.0.0) also means nothing can bypass the proxy to
; reach gbserver directly. See docker/aio/Caddyfile for the full rationale.
[program:gbserver]
command=/opt/venv/gb/bin/gbserver standalone --host 127.0.0.1 --port 8090 --space-dir configurations/spaces/local
directory=/opt/granite.build
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; --- front reverse proxy (Caddy), :8080 (exposed) -------------------------------
; Terminates the exposed :8080 and forwards to gbserver on 127.0.0.1:8090, so
; gbserver sees a loopback peer for EVERY caller (browser, AutoTuneX reconcile,
; llmb, gbcli) — the fix for standalone's localhost-only auth behind Podman /
; OpenShift NAT. Every client keeps using :8080 unchanged. Caddy streams SSE and
; upgrades WebSockets automatically. XDG_* point at /tmp (set in the Dockerfile)
; so it needs no root-owned paths as the non-root appuser.
[program:gbproxy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
directory=/tmp
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15

; --- api-bridge (MySQL write-path), :8001 (loopback only) -----------------------
; Run as a module (not `uvicorn ...:app`) to preserve its __main__ startup:
; log_config=None and env-driven host/port via API_BRIDGE_SERVER_PORT.
[program:apibridge]
command=/opt/venv/apibridge/bin/python -m api_bridge.server
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; --- AutoTuneX API + SvelteKit SPA, :8000 ---------------------------------------
[program:autotunex]
command=/opt/venv/autotunex/bin/uvicorn autotunex.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
