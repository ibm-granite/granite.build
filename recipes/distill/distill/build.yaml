######
# distill -- ONE logit-distillation recipe: off-policy, a linear lambda ramp, or
# on-policy, chosen by LMBDA_MODE. Model-agnostic and scheduler-neutral: the pair,
# the data, the hosts, the partitions and the accelerator model all come from a
# site file (recipes/distill/site.example.yaml lists every key), and every launcher
# uses only SkyPilot's generic keys (cluster, zone, accelerators, memory).
#
#   gb build start -f recipes/distill/distill/build.yaml \
#     --parameters-path <site.yaml> [--parameters-path recipes/distill/distill/smoke.yaml] \
#     --param RUN_NAME=<name> --param LMBDA_MODE=off-policy|ramp|on-policy
#
# Layers: this directory's parameters.yaml (the experiment), then the site file,
# then smoke.yaml (a plumbing-scale run), then each --param. Later layers win.
#
# The graph:
#
#   sources -> corpus ----------------------------.       (corpus-validate instead
#   align ---------------> [train-sft] -> train --+-> export-N -> divergence-N   of both
#     |                          [rollout-server]-'       |  `-> repetition-check  when
#     `-> divergence-baseline (t=0)      [teardown] <-----'       [benchmark evals] CORPUS_DIR
#                                                                                 is set)
#
# Two templating layers meet in this file. The CLI resolves the dollar-dollar-brace
# values and the less-than-percent blocks before submission; gbserver resolves the
# double-brace templates (bindings, run_metadata) per step. The CLI renders the file
# IN FULL, comments included, so comments here name parameters bare.
#
# Every directory a target writes hangs off WORKDIR_ROOT/RUN_NAME/<build id>. An
# absolute shared root is forced, not chosen: each target run gets its own
# GB_BUILD_WORKDIR, so one target can only name another's output (the corpus's
# eval split, an export) through a root they share. The build id keeps that root
# distinct BETWEEN builds, which is a correctness setting: gbserver refuses to
# register an artifact URI another build already registered, the target still
# reports SUCCESS with an EMPTY output list, and on a retry every consumer of it
# waits forever while the build reports SUCCESS having skipped them (b5f030cd).
######
<%- set YES = ("true", "yes", "1", "on") %>
<%- set SFT = INCLUDE_SFT | string | trim | lower in YES %>
<%- set IS_SMOKE = SMOKE | string | trim | lower in YES %>
<%- set PINNED = (CORPUS_DIR | string | trim).rstrip("/") %>
<%- set RUN_DIR = (WORKDIR_ROOT | string).rstrip("/") ~ "/" ~ RUN_NAME ~ "/{{ run_metadata.build_id }}" %>
<%- set EXP = EXPERIMENT | string | trim or RUN_NAME %>
# The trainer's failure signal to the rollout server: rank 0 writes it when the
# trainer exits non-zero, and the server, polling for it, stops and fails its own
# target instead of holding its GPUs until VLLM_MAX_LIFETIME_SECONDS. Under the
# build's directory, which both allocations share and no other build writes.
<%- set STOP_FILE = RUN_DIR ~ "/rollout-stop" %>
# ── LMBDA_MODE, mapped once ────────────────────────────────────────────────
# Off-policy trains on corpus text only; on-policy has the student generate
# every sequence on a separate rollout server; ramp moves linearly from the
# first to the second over the ramp window. An unknown mode references an
# undefined name, which is how this renderer fails with a message.
<%- set MODE = LMBDA_MODE | string | trim | lower %>
<%- set _ = none %>
<%- set L, SCHEDULE, ONLINE = 0.0, "constant", false %>
<%- if MODE == "off-policy" %>
<%- set L, SCHEDULE, ONLINE = 0.0, "constant", false %>
<%- elif MODE == "ramp" %>
<%- set L, SCHEDULE, ONLINE = 1.0, "linear", true %>
<%- elif MODE == "on-policy" %>
<%- set L, SCHEDULE, ONLINE = 1.0, "constant", true %>
<%- else %>
$${ LMBDA_MODE_must_be_one_of_off_policy_ramp_on_policy }
<%- endif %>
# LMBDA overrides the mode's end value: a fractional constant lambda with
# on-policy, or a ramp that stops short of 1 with ramp. Any lambda above 0 has
# the student generate, so it needs the server; 0 is off-policy's own mode.
<%- if LMBDA | string | trim %>
<%- if not ONLINE %>
$${ LMBDA_MODE_must_be_ramp_or_on_policy_when_LMBDA_is_set }
<%- endif %>
<%- if not (0 < LMBDA | float <= 1) %>
$${ LMBDA_must_be_above_0_and_at_most_1 }
<%- endif %>
<%- set L = LMBDA | float %>
<%- endif %>
# Settings a mode does not render are refused rather than silently dropped: the
# ramp window outside ramp, and a generation floor off-policy, where nothing
# generates. 0 is never refused. An empty floor is the default: 16 tokens
# whenever a server runs.
<%- if SCHEDULE != "linear" and ((LMBDA_RAMP_START_STEP | int) != 0 or (LMBDA_RAMP_STEPS | int) != 0) %>
$${ LMBDA_RAMP_START_STEP_and_LMBDA_RAMP_STEPS_must_be_0_unless_LMBDA_MODE_is_ramp }
<%- endif %>
<%- set FLOOR = MIN_COMPLETION_LENGTH | string | trim %>
<%- if not ONLINE and FLOOR and (FLOOR | int) > 0 %>
$${ MIN_COMPLETION_LENGTH_must_be_empty_or_0_when_LMBDA_MODE_is_off_policy }
<%- endif %>
<%- set FLOOR = (FLOOR or "16") | int %>
# ── CKPT_LADDER, checked once ──────────────────────────────────────────────
# Every rung binds a checkpoint the trainer emits MID-RUN. A rung it never
# writes is not a late error but a target that never dispatches, so the ladder
# must sit on the save grid, end where training ends, and fit under the
# save limit.
<%- set LADDER = [] %>
<%- for n in (CKPT_LADDER | string | replace(" ", "")).split(",") if n %>
<%- set _ = LADDER.append(n | int) %>
<%- endfor %>
<%- set MAX_STEPS = GOLD_MAX_STEPS | int %>
<%- set STOP = STOP_AT_STEP | int %>
<%- set END = STOP if STOP > 0 else MAX_STEPS %>
<%- if MAX_STEPS <= 0 %>
$${ GOLD_MAX_STEPS_must_be_positive_so_the_last_rung_is_known }
<%- endif %>
<%- if not LADDER or LADDER[-1] != END %>
$${ CKPT_LADDER_must_end_at_GOLD_MAX_STEPS_or_at_STOP_AT_STEP }
<%- endif %>
<%- if LADDER != LADDER | unique | sort | list %>
$${ CKPT_LADDER_must_be_strictly_ascending }
<%- endif %>
<%- for n in LADDER %>
<%- if n <= 0 or n % (GOLD_SAVE_STEPS | int) != 0 %>
$${ CKPT_LADDER_rungs_must_be_multiples_of_GOLD_SAVE_STEPS }
<%- endif %>
<%- endfor %>
<%- if (GOLD_SAVE_TOTAL_LIMIT | int) < LADDER | length %>
$${ GOLD_SAVE_TOTAL_LIMIT_must_cover_every_CKPT_LADDER_rung }
<%- endif %>
# distill evaluates the rungs of its own ladder, each through the export it
# binds; it has no per-rung eval list (distill-eval's EVALS).
<%- set RUNG_PICK = {} %>
<%- macro model_input(N) %>
        model:
          binding: export-$${N}.hf_model
<%- endmacro %>
# >>> shared eval protocol (keep identical to recipes/distill/distill-eval/build.yaml)
# ── The benchmark protocol ─────────────────────────────────────────────────
# Every rung runs the SCREEN_EVALS subset; a rung in FULL_EVAL_RUNGS runs the
# whole battery. RUNG_PICK, when the recipe sets one (distill-eval's EVALS),
# names each rung's evals instead. A name that is neither an EVAL_CATALOG entry
# nor bfcl, or a rung off the ladder, fails the render rather than silently not
# running. WANT maps each rung to its evals, so the targets below test one list.
<%- set CATS = [] %>
<%- for c in (EVAL_CATEGORIES | string | replace(" ", "") | lower).split(",") if c %>
<%- set _ = CATS.append(c) %>
<%- endfor %>
<%- set SCREEN = [] %>
<%- for s in (SCREEN_EVALS | string | replace(" ", "") | lower).split(",") if s %>
<%- set _ = SCREEN.append(s) %>
<%- endfor %>
<%- set FULL = [] %>
<%- for n in (FULL_EVAL_RUNGS | string | replace(" ", "")).split(",") if n %>
<%- set _ = FULL.append(n | int) %>
<%- endfor %>
<%- set KNOWN = ["bfcl"] %>
<%- for e in EVAL_CATALOG %>
<%- set _ = KNOWN.append(e.name) %>
<%- endfor %>
<%- for s in SCREEN %>
<%- if s not in KNOWN %>
$${ SCREEN_EVALS_must_name_EVAL_CATALOG_entries_or_bfcl }
<%- endif %>
<%- endfor %>
<%- for n in FULL %>
<%- if n not in LADDER %>
$${ FULL_EVAL_RUNGS_must_be_rungs_on_the_ladder }
<%- endif %>
<%- endfor %>
<%- for n, names in RUNG_PICK.items() %>
<%- if n not in LADDER %>
$${ EVALS_must_name_rungs_on_the_ladder }
<%- endif %>
<%- for s in names if s not in KNOWN %>
$${ EVALS_must_name_EVAL_CATALOG_entries_or_bfcl }
<%- endfor %>
<%- endfor %>
<%- set WANT = {} %>
<%- set SAGE_RUNGS = [] %>
<%- set BFCL_RUNGS = [] %>
<%- for N in LADDER %>
<%- set picked = [] %>
<%- for e in EVAL_CATALOG + [{"name": "bfcl", "category": "bfcl"}] %>
<%- set chosen = (e.name in RUNG_PICK[N]) if N in RUNG_PICK else (not RUNG_PICK and (N in FULL or e.name in SCREEN)) %>
<%- if e.category in CATS and chosen %>
<%- set _ = picked.append(e.name) %>
<%- endif %>
<%- endfor %>
<%- set _ = WANT.update({N: picked}) %>
<%- if picked | reject("equalto", "bfcl") | list %>
<%- set _ = SAGE_RUNGS.append(N) %>
<%- endif %>
<%- if "bfcl" in picked %>
<%- set _ = BFCL_RUNGS.append(N) %>
<%- endif %>
<%- endfor %>
# <<< shared eval protocol
# The corpus every reader of it binds. A reused corpus (CORPUS_DIR) is read
# DIRECTLY, as a uri: `corpus` does not render, so a binding to it would block
# on a producer that does not exist. corpus_pin carries the ordering edge
# instead, with the manifest check on it: nothing reads a reused corpus before
# corpus-validate accepts it.
<%- macro corpus_inputs() %>
<%- if PINNED %>
        corpus:
          uri: "env://$${PINNED}/train.jsonl"
          type: dataset
        corpus_pin:
          binding: corpus-validate.pin_check
<%- else %>
        corpus:
          binding: corpus.corpus
<%- endif %>
<%- endmacro %>
<%- set SPLITS = [SMOKE_DATASET_URI] if IS_SMOKE else [] %>
<%- set EVAL_SPLIT = PINNED ~ "/eval.jsonl" if PINNED else RUN_DIR ~ "/corpus/eval.jsonl" %>
<%- set STUDENT = "train-sft.checkpoint" if SFT else "align.retagged_student" %>
granite.build:
  name: distill
  # target_reuse_enabled: a retry re-runs only the FAILED targets and reuses what
  # succeeded, so a fault three targets deep does not re-train. train resumes from
  # its own train_dir on a retry, and refuses a retry that made no progress (see
  # train below), so a deterministic failure does not burn every retry.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:

<%- if not PINNED %>
    # ─── sources ────────────────────────────────────────────────────────────
    # ONE corpus file from the dataset's splits, because data-prep takes one path
    # (it refuses a directory), reads only `messages` (raw SFT splits spell it
    # `conversations`; unchanged, every row would be dropped), and its row limit
    # stops after N kept rows IN INPUT ORDER, so a concatenation plus a limit would
    # silently be all of the largest split. data-mixture renames, samples each
    # split in proportion, and shuffles, seeded, so SHUFFLE_SEED alone reproduces
    # the file. A single-file dataset (the smoke dataset, or DATASET_SPLITS empty)
    # goes through the same step, so the graph has one shape.
    sources:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # Declared inputs: the corpus's provenance is recorded as artifacts, and
        # any scheme the environment resolves (env://, hf://, s3://) works because
        # the step reads the RESOLVED paths below, never the URIs.
<%- if not IS_SMOKE %>
<%- for s in DATASET_SPLITS %>
<%- set _ = SPLITS.append((DATASET_URI | string).rstrip("/") ~ "/" ~ s) %>
<%- endfor %>
<%- if not SPLITS %>
<%- set _ = SPLITS.append(DATASET_URI) %>
<%- endif %>
<%- endif %>
<%- for uri in SPLITS %>
        source_$${ loop.index0 }:
          uri: "$${uri}"
          type: dataset
<%- endfor %>
      outputs:
        corpus_source:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/train/distill/data-mixture
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${SOURCES_CPUS}
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_PARTITION}"
                # Holds the sampled rows in memory while it shuffles them.
                memory: $${SOURCES_MEMORY}
            sources_config:
              # Order names the per-split RNG streams; reordering changes the file.
              sources:
<%- for uri in SPLITS %>
                - "{{ bindings.source_$${ loop.index0 }.binding.path }}"
<%- endfor %>
              target_rows: $${TARGET_ROWS}
              shuffle_seed: $${SHUFFLE_SEED}
              output_dir: "$${RUN_DIR}/sources"
<%- endif %>

    # ─── align ──────────────────────────────────────────────────────────────
    # Re-embeds the student onto the teacher's tokenizer and installs the chat
    # template. Cheap, and everything after it is wrong without it.
    align:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        teacher:
          uri: "$${TEACHER_MODEL_URI}"
          type: model
        student:
          uri: "$${STUDENT_MODEL_URI}"
          type: model
        # Not optional for this pipeline: without a template carrying generation
        # markers, prep cannot build assistant masks and the trainers fail deep
        # inside the trainer.
        chat_template:
          uri: "$${CHAT_TEMPLATE_URI}"
          type: dataset
      outputs:
        # All three declared: an undeclared output makes the resolver drop the
        # NEWARTIFACT event, and the target completes with no output AND no error.
        retagged_student:
          uri: "env://{{ binding.path }}"
          type: model
        teacher_overlay:
          uri: "env://{{ binding.path }}"
          type: model
        student_overlay:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/train/distill/tokenizer-align
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_PARTITION}"
                memory: $${CPU_ONLY_MEMORY}
            align_config:
              out_dir: "$${RUN_DIR}/align"
              # See REQUIRE_CHATML: it must agree with the chat template's family.
              require_chatml: $${REQUIRE_CHATML}
              verify: true
              dry_run: false

<%- if not PINNED %>
    # ─── corpus ─────────────────────────────────────────────────────────────
    corpus:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # The tokenizer that DEFINES this corpus, and the edge that guarantees it
        # exists before this target starts.
        tokenizer:
          binding: align.retagged_student
        source_dataset:
          binding: sources.corpus_source
      outputs:
        # The FILE, not out_dir: the trainers dispatch on the .jsonl suffix and find
        # the manifest beside it. eval.jsonl is NOT an output -- a declared-but-absent
        # output is a resolver failure -- so its readers compose its path instead.
        corpus:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/train/distill/data-prep
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_PARTITION}"
                memory: $${CPU_ONLY_MEMORY}
            corpus_config:
              out_dir: "$${RUN_DIR}/corpus"
              # One budget for prep, the trainers and the divergence reads; see
              # MAX_LENGTH.
              max_length: $${MAX_LENGTH}
              think_policy: "$${THINK_POLICY}"
              # Couples to teacher-divergence, which scores the FINAL assistant turn:
              # a different boundary would score a different span than was trained.
              completion_boundary: "last_message"
              eval_fraction: $${EVAL_FRACTION}
              max_examples: $${MAX_EXAMPLES}
              # Free, and makes a row traceable back through the manifest.
              emit_row_id: true
              documents_policy: "$${DOCUMENTS_POLICY}"
              seed: $${SEED}
<%- else %>
    # ─── corpus-validate (CORPUS_DIR is set) ────────────────────────────────
    # A corpus is DEFINED by the retagged tokenizer and the prep policies. One
    # reused from a run that differed in either trains on a corpus this build does
    # not describe, and every metric downstream would still look normal. This reads
    # the manifest and fails in seconds, before any GPU allocation is held.
    corpus-validate:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # The only place the reused corpus is named as an input, so it is in this
        # build's lineage at all.
        pinned_corpus:
          uri: "env://$${PINNED}/train.jsonl"
          type: dataset
        tokenizer:
          binding: align.retagged_student
        # Bound for its resolved path: the manifest's tokenizer identity is the
        # teacher directory's basename.
        teacher:
          uri: "$${TEACHER_MODEL_URI}"
          type: model
      outputs:
        pin_check:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/train/distill/data-validate
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${CPU_ONLY_CPUS}
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_PARTITION}"
                memory: $${CPU_ONLY_MEMORY}
            pin_check_config:
              corpus_dir: "$${PINNED}"
              teacher_model: "{{ bindings.teacher.binding.path }}"
              max_length: $${MAX_LENGTH}
              think_policy: "$${THINK_POLICY}"
              documents_policy: "$${DOCUMENTS_POLICY}"
              eval_fraction: $${EVAL_FRACTION}
              output_dir: "$${RUN_DIR}/corpus-validate"
<%- endif %>

<%- if SFT %>
    # ─── train-sft (INCLUDE_SFT) ────────────────────────────────────────────
    # Plain SFT over the same corpus, no teacher; distillation continues from its
    # checkpoint. The ZeRO-3 config saves 16-bit weights and the trainer calls
    # save_model, so the checkpoint is HF-native and no export sits in between.
    train-sft:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        student:
          binding: align.retagged_student
$${ corpus_inputs() }
      outputs:
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/train/distill/student-sft
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${SFT_NUM_GPUS}
            launcher_config:
              resources:
                accelerators: "$${GPU_ACCELERATOR}:$${SFT_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${GPU_PARTITION}"
                memory: $${GPU_MEMORY}
            workload:
              # MUST match the allocation: the step asserts it against the GPUs the
              # container sees, since a mismatch trains at a different effective
              # batch than the config says. More than one node is refused.
              gpus_per_node: $${SFT_NUM_GPUS}
              nodes: 1
            sft_config:
              output_dir: "$${RUN_DIR}/train-sft"
              response_template: "$${RESPONSE_TEMPLATE}"
              max_length: $${MAX_LENGTH}
              per_device_train_batch_size: $${SFT_PER_DEVICE_TRAIN_BATCH_SIZE}
              gradient_accumulation_steps: $${SFT_GRADIENT_ACCUMULATION_STEPS}
              learning_rate: "$${SFT_LEARNING_RATE}"
              num_train_epochs: $${SFT_NUM_TRAIN_EPOCHS}
              save_steps: $${SFT_SAVE_STEPS}
              seed: $${SEED}
              # -1, the whole corpus. Not a way to make a run small: the trainer
              # compares its kept rows with prep's manifest and raises ManifestDrift
              # on a shortfall. Shrink the corpus (MAX_EXAMPLES) instead.
              max_dataset_size: -1
              # logging_steps is not a contract key; extra_config_yaml is the
              # documented escape hatch for the rest of the trainer's config.
              extra_config_yaml: "logging_steps: 1"
              # EMPTY makes this plain SFT; a logits dir would make it a second,
              # forward-KL distillation.
              precomputed_logits_dir: ""
<%- endif %>

<%- if ONLINE %>
    # ─── rollout-server (ramp, on-policy, or LMBDA set) ─────────────────────
    # Serves the STUDENT for on-policy rollouts in its OWN allocation: the trainer
    # reaches it through the mem:// URL below, every trainer node trains, and the
    # trainer pushes its weights to it every VLLM_SYNC_FREQUENCY steps. This is the
    # topology that has run (9973e766); the in-allocation split vllm_num_servers
    # alone selects is never used here.
    #
    # The model is the SAME binding the trainer's student is, so the copy served and
    # the copy trained cannot be different weights.
    rollout-server:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        model:
          binding: $${STUDENT}
      outputs:
        # mem://, not env://: the payload is a URL, and env:// would normalise
        # http://host:port into a path. Suffixed with RUN_NAME, because a second
        # build registering the same URI is refused; the value still reaches the
        # trainer, but a retry reusing this target would replay nothing.
        vllm_url:
          uri: "mem://distill-rollout-$${RUN_NAME}"
        # For teardown: a SERVICE cluster never autostops on an HPC cloud.
        cluster_name:
          uri: "mem://distill-rollout-cluster-$${RUN_NAME}"
      steps:
        - step_uri: space://steps/train/distill/student-rollout-generator
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${VLLM_NUM_GPUS}
            launcher_config:
              resources:
                accelerators: "$${GPU_ACCELERATOR}:$${VLLM_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${GPU_PARTITION}"
                memory: $${GPU_MEMORY}
            vllm_config:
              port: $${VLLM_PORT}
              # >= the trainer's max_length, or a prompt the trainer accepts is one
              # the server refuses mid-run.
              max_model_len: $${MAX_LENGTH}
              health_timeout_seconds: $${VLLM_HEALTH_TIMEOUT_SECONDS}
              # The backstop for teardown's one hole: teardown is gated on the
              # trainer's checkpoint, which a FAILED trainer never emits. stop_file
              # below covers a trainer that exits; this ceiling covers a rank 0
              # killed outright, which writes nothing (d77546a9).
              max_lifetime_seconds: $${VLLM_MAX_LIFETIME_SECONDS}
              # The trainer's rollout_stop_file, the same path: its appearance means
              # the trainer failed, so the server stops instead of waiting for a
              # teardown that will never run.
              stop_file: "$${STOP_FILE}"
<%- endif %>

    # ─── train ──────────────────────────────────────────────────────────────
    # The distillation (GOLD, generalized JSD at BETA). Off-policy every sequence is
    # corpus text; on-policy the student generates on rollout-server and the teacher
    # scores it; ramp moves from one to the other.
    train:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
<%- if ONLINE %>
        # The ordering primitive AND the health gate: the URL is published only once
        # the server answers /health, so this target cannot start early.
        vllm:
          binding: rollout-server.vllm_url
<%- endif %>
        # One binding either way, so the recorded lineage and the model the trainer
        # loads cannot disagree.
        student:
          binding: $${STUDENT}
$${ corpus_inputs() }
        teacher:
          uri: "$${TEACHER_MODEL_URI}"
          type: model
      outputs:
        # <train_dir>/checkpoints/<RUN_NAME>_node<N>; the node count comes from the
        # allocation, so it always describes the run that wrote it. Teardown gates
        # on it.
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
        # One output per rung, emitted MID-RUN by the step's watcher as
        # checkpoint_<N> once checkpoint-<N> is completely written. binding.path is
        # that directory, so each rung has a distinct URI.
<%- for N in LADDER %>
        checkpoint_$${N}:
          uri: "env://{{ binding.path }}"
          type: model
<%- endfor %>
      steps:
        - step_uri: space://steps/train/distill/logit-distill
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            # Half of a rung's detection latency (the watch interval is the other):
            # the watcher's line reaches the build only when the logs are next pulled.
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            # What makes the rungs mid-run. Off, only the final `checkpoint` is
            # emitted and every export target waits forever.
            emit_checkpoint_artifacts: true
            checkpoint_watch_interval_seconds: $${CKPT_WATCH_INTERVAL_SECONDS}
            # Stable for the whole build and outside the per-run tree, which a
            # build-level retry replaces and post-build cleanup reaps. A retry
            # therefore resumes from its own highest checkpoint and re-emits the
            # rungs it already wrote, so their exports re-dispatch. A new build gets
            # a new directory.
            train_dir: "$${RUN_DIR}/train"
            # Refuse an attempt that starts no further than the last one did: a
            # deterministic failure would otherwise spend every retry at the same
            # step, holding the allocation each time.
            require_progress: true
            # A stopped run's <RUN_NAME>_node<N> directory, to continue it in a new
            # build; ignored once train_dir holds checkpoints. See parameters.yaml.
            resume_from_checkpoint_dir: "$${RESUME_FROM_CHECKPOINT_DIR}"
            resume_emit_seeded: $${RESUME_EMIT_SEEDED}
<%- if ONLINE %>
            # The rollout server's stop_file, the same path; see STOP_FILE above.
            rollout_stop_file: "$${STOP_FILE}"
<%- endif %>
            compute_config:
              num_nodes: $${GOLD_NUM_NODES}
              num_gpus_per_node: $${GOLD_NUM_GPUS}
            launcher_config:
              resources:
                # accelerators is PER NODE. memory is host memory per node and must
                # be stated: on SLURM and LSF the compute_config floor is skipped,
                # and a host-memory kill presents as a cross-node NCCL hang.
                accelerators: "$${GPU_ACCELERATOR}:$${GOLD_NUM_GPUS}"
                memory: $${GPU_MEMORY}
                cluster: "$${CLUSTER}"
                zone: "$${GPU_PARTITION}"
            gold_config:
              run_name: "$${RUN_NAME}"
              # Inert: max_steps (required positive, see the ladder check) overrides
              # it, but the renderer needs it to build the schedule.
              num_train_epochs: 1.0
              max_steps: $${GOLD_MAX_STEPS}
              data_seed: $${GOLD_DATA_SEED}
              adam_beta2: $${ADAM_BETA2}
              train_sampling_strategy: "$${TRAIN_SAMPLING_STRATEGY}"
              stop_at_step: $${STOP_AT_STEP}
              learning_rate: $${GOLD_LEARNING_RATE}
              min_lr: $${GOLD_MIN_LR}
              warmup_ratio: $${WARMUP_RATIO}
              lr_scheduler_type: "$${LR_SCHEDULER_TYPE}"
              per_device_train_batch_size: $${GOLD_PER_DEVICE_TRAIN_BATCH_SIZE}
              gradient_accumulation_steps: $${GOLD_GRADIENT_ACCUMULATION_STEPS}
              max_length: $${MAX_LENGTH}
              max_completion_length: $${MAX_COMPLETION_LENGTH}
              gradient_checkpointing: true
              save_strategy: "steps"
              save_steps: $${GOLD_SAVE_STEPS}
              save_total_limit: $${GOLD_SAVE_TOTAL_LIMIT}
              logging_steps: 1
              dataset_num_proc: $${DATASET_NUM_PROC}
              temperature: $${TEMPERATURE}
              lmbda: $${L}
              beta: $${BETA}
              use_liger_fused_jsd: $${USE_LIGER_FUSED_JSD}
              loss_arm: "$${LOSS_ARM}"
              # Stated in every target: the step's default is ChatML's marker, and a
              # marker that matches nothing trains on NOTHING while still producing a
              # loss curve and checkpoints.
              response_template: "$${RESPONSE_TEMPLATE}"
              nccl_debug: "$${NCCL_DEBUG}"
              nccl_debug_subsys: "$${NCCL_DEBUG_SUBSYS}"
              nccl_timeout_ms: $${NCCL_TIMEOUT_MS}
              nccl_enable_monitoring: true
              nccl_ib_hca: "$${NCCL_IB_HCA}"
<%- if ONLINE %>
              # ── on-policy ───────────────────────────────────────────────────
              # 1 EXTERNAL server, the bound `vllm` input. The renderer refuses the
              # URL with 0 (the run would train off-policy beside an idle server).
              vllm_num_servers: 1
              # The external-server path talks HTTP to it.
              vllm_mode: "server"
              vllm_sync_frequency: $${VLLM_SYNC_FREQUENCY}
              top_p: $${TOP_P}
              use_sampled_opd_loss: $${USE_SAMPLED_OPD_LOSS}
              last_message_only: $${LAST_MESSAGE_ONLY}
              clip_alpha: $${CLIP_ALPHA}
              opd_importance_sampling: $${OPD_IMPORTANCE_SAMPLING}
              lmbda_schedule: "$${SCHEDULE}"
<%- if SCHEDULE == "linear" %>
              # From 0 (all corpus) at the window's start to lmbda at its end. The
              # window keys are refused above in any other mode, and the step's
              # renderer refuses them under a constant schedule.
              lmbda_init: 0.0
              lmbda_ramp_start_step: $${LMBDA_RAMP_START_STEP}
              lmbda_ramp_steps: $${LMBDA_RAMP_STEPS}
<%- endif %>
              # The generation floor, sent by the trainer with every request.
              min_completion_length: $${FLOOR}
<%- else %>
              # Off-policy: no server count, schedule or floor. The step's renderer
              # refuses each of them at lmbda 0 as silently inert, and this file
              # refuses a floor or ramp window set here (above).
              vllm_num_servers: 0
<%- endif %>

<%- if ONLINE %>
    # ─── teardown ───────────────────────────────────────────────────────────
    # Not optional: a SERVICE cluster on an HPC cloud never autostops, so without
    # this the server's GPUs stay held after training. Gated on the trainer's final
    # checkpoint, so a FAILED trainer never triggers it -- gbserver has no
    # on-failure edges. The stop file covers a trainer that exits non-zero, and
    # VLLM_MAX_LIFETIME_SECONDS one killed outright.
    teardown:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # Ordering only: checkpoint is the trainer's last line.
        trained:
          binding: train.checkpoint
        vllm_cluster:
          binding: rollout-server.cluster_name
      steps:
        - step_uri: space://steps/skypilot-teardown
          config:
            teardown_config:
              # A LIST, even with one entry.
              cluster_names:
                - "{{ bindings.vllm_cluster.binding.state }}"
<%- endif %>

    # ─── export-N, one per rung, each gated on ITS OWN checkpoint ───────────
    # A selector, not a converter: every checkpoint-N is already HF-native. The
    # export prunes the resumable-run state and asserts the tokenizer, giving a
    # self-contained directory. Because each binds train.checkpoint_N, rung N is
    # exported and measured while training continues -- and an on-policy collapse
    # shows up at the first rung, while there is still a run to cancel.
<%- for N in LADDER %>
    export-$${N}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        train_output:
          binding: train.checkpoint_$${N}
        # So the export asserts the tokenizer the run trained with, not whatever was
        # copied into the checkpoint.
        expected_tokenizer:
          binding: align.retagged_student
      outputs:
        hf_model:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/misc/hf-export
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_cpus_per_node: $${EXPORT_CPUS}
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_PARTITION}"
                memory: $${EXPORT_MEMORY}
            export_config:
              # train_output IS checkpoint-N, so the checkpoint is named by that
              # absolute path. Empty would glob for checkpoint-* UNDER it and find
              # nothing.
              checkpoint: "{{ bindings.train_output.binding.path }}"
              dest: "$${RUN_DIR}/export-$${N}"
              padding_side: "right"
              chat_template_thinking: "$${CHAT_TEMPLATE_THINKING}"
              # A distributed run writes one rng_state_<rank>.pth per rank, which the
              # pruner does not classify; false would refuse every checkpoint this
              # pipeline writes, after training was paid for. The manifest still
              # records what was dropped.
              allow_unknown: true
              verify: true
<%- endfor %>

    # ─── divergence-baseline and divergence-N ───────────────────────────────
    # JSD, forward and reverse KL, and entropy against the same teacher on the same
    # held-out split. The baseline is the aligned student BEFORE training -- a
    # divergence without it is a number without a direction -- and runs beside
    # training. An instrument: nothing is gated on what it says. Entropy is the
    # metric to read first: per rung it is the curve that shows where a run turned.
<%- for RUNG in ["baseline"] + LADDER %>
    divergence-$${RUNG}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        student:
<%- if RUNG == "baseline" %>
          binding: align.retagged_student
<%- else %>
          binding: export-$${RUNG}.hf_model
<%- endif %>
        # Also the ordering edge that guarantees the held-out split exists.
$${ corpus_inputs() }
        teacher:
          uri: "$${TEACHER_MODEL_URI}"
          type: model
      outputs:
        eval_metrics:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/train/distill/teacher-divergence
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${EVAL_NUM_GPUS}
            launcher_config:
              resources:
                accelerators: "$${EVAL_ACCELERATOR}:$${EVAL_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${EVAL_PARTITION}"
                memory: $${GPU_MEMORY}
            eval_config:
              corpus: "$${EVAL_SPLIT}"
              output_dir: "$${RUN_DIR}/divergence-$${RUNG}"
              metrics: "$${EVAL_METRICS}"
              max_samples: $${EVAL_MAX_SAMPLES}
              seed: $${SEED}
              # The training budget: a smaller one scores truncated completions.
              max_length: $${MAX_LENGTH}
              max_incomplete_fraction: $${MAX_INCOMPLETE_FRACTION}
              batch_size: $${EVAL_BATCH_SIZE}
              dtype: "$${EVAL_DTYPE}"
              # The retag exists so the two tokenizers agree on ids.
              allow_tokenizer_mismatch: false
<%- endfor %>

    # ─── repetition-check ───────────────────────────────────────────────────
    # Does the model still write text? Nothing else here asks. A distilled model
    # once emitted one line fifty times and stopped, invisible to every training
    # metric and plain in the first greedy sample. One target over the whole ladder:
    # it loads each export in turn on one GPU, so it runs after the last rung.
    #
    # It REPORTS AND NEVER FAILS: every rung is measured anyway, and a failure here
    # would only remove evidence. Read the `degenerate` flags and pick the rung.
    repetition-check:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
<%- for N in LADDER %>
        export_$${N}:
          binding: export-$${N}.hf_model
<%- endfor %>
      outputs:
        repetition_report:
          uri: "env://{{ binding.path }}"
          type: fileset
      steps:
        - step_uri: space://steps/train/distill/repetition-check
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
            launcher_config:
              resources:
                accelerators: "$${EVAL_ACCELERATOR}:1"
                cluster: "$${CLUSTER}"
                zone: "$${EVAL_PARTITION}"
                memory: $${GPU_MEMORY}
            gen_smoke_config:
              # One per rung, in ladder order, each the export's resolved path.
              rungs:
<%- for N in LADDER %>
                - "$${N}:{{ bindings.export_$${N}.binding.path }}"
<%- endfor %>
              max_repetition: $${REPETITION_MAX}
              new_tokens: $${REPETITION_NEW_TOKENS}
              gate_final_rung: false
              output_dir: "$${RUN_DIR}/repetition-check"

    # >>> shared eval targets (keep identical to recipes/distill/distill-eval/build.yaml)
    # ═══ BENCHMARK EVALS, PER RUNG (off by default) ═════════════════════════
    # The sage battery from EVAL_CATALOG plus BFCL, each rung's evals as WANT lists
    # them. Each reads its rung's EXPORT through the recipe's model_input macro,
    # never a raw checkpoint, which would measure a model nobody can download.
    # Evals are short, idempotent and retryable, so they run on EVAL_PARTITION;
    # the images come from EVAL_IMAGE_REGISTRY.
    #
    # The BigCodeBench URL cannot travel as catalog data -- a parameter marker
    # inside a parameter VALUE is emitted literally -- so the entry carries
    # needs_bcb_url and this template writes the value.
<%- for N in SAGE_RUNGS %>
<%- for e in EVAL_CATALOG %>
<%- if e.name in WANT[N] %>
    eval-$${e.name}-ck$${N}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
$${ model_input(N) }
      outputs:
        sage_eval_results:
          type: dataset
          uri: "env://$${SAGE_OUTPUT_DIR}/$${EXP}-ckpt_$${N}/$${e.output_subpath}"
      steps:
        - step_uri: space://steps/sage-eval
          config:
            # TOP LEVEL: nested under sage_eval_config it is silently ignored.
            poll_interval_seconds: $${EVAL_STATUS_POLL_INTERVAL_SECONDS}
            sage_eval_config:
              gb_script: "$${e.gb_script}"
              # A FLAT suffix: sage builds a job-script FILENAME from it, so a "/"
              # would make that a nested path and the write fails.
              experiment: "$${EXP}-ckpt_$${N}"
              batch_size: $${e.batch_size | default(SAGE_BATCH_SIZE)}
              max_length: $${e.max_length | default(SAGE_MAX_LENGTH)}
              num_gpus: $${SAGE_NUM_GPUS}
              output_dir: "$${SAGE_OUTPUT_DIR}"
              image_id: "docker:$${EVAL_IMAGE_REGISTRY}/$${e.image}"
<%- if e.extra_env | default({}) or e.needs_bcb_url | default(false) %>
              extra_env:
<%- for k, v in (e.extra_env | default({})).items() %>
                $${k}: "$${v}"
<%- endfor %>
<%- if e.needs_bcb_url | default(false) %>
                OE_EVAL_BCB_API_URL: "$${OE_EVAL_BCB_API_URL}"
<%- endif %>
<%- else %>
              extra_env: {}
<%- endif %>
            launcher_config:
              resources:
                accelerators: "$${EVAL_ACCELERATOR}:$${SAGE_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${EVAL_PARTITION}"
                memory: $${EVAL_MEMORY}
<%- endif %>
<%- endfor %>
<%- endfor %>

    # ─── eval-bfcl-ckN ──────────────────────────────────────────────────────
    # Tool calling against ground truth, its own harness and image. A different
    # question from the divergence: one run improved every divergence metric while
    # this sat at 0.000. A 0.000 on a new pair has more than once been a tool-FORMAT
    # failure (no tool-call markup), not a capability one; read the outputs first.
<%- for N in BFCL_RUNGS %>
    eval-bfcl-ck$${N}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
$${ model_input(N) }
      outputs:
        bfcl_results:
          type: dataset
          uri: "env://$${BFCL_OUTPUT_DIR}/$${EXP}-ckpt_$${N}/$${BFCL_EVAL_NAME}"
      steps:
        - step_uri: space://steps/bfcl-eval
          config:
            poll_interval_seconds: $${EVAL_STATUS_POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            bfcl_config:
              model_id: "$${BFCL_MODEL_ID}"
              experiment: "$${EXP}-ckpt_$${N}"
              eval_name: "$${BFCL_EVAL_NAME}"
              test_categories: "$${BFCL_TEST_CATEGORIES}"
              num_gpus_generate: $${BFCL_NUM_GPUS}
              num_gpus_evaluate: $${BFCL_NUM_GPUS}
              gpu_memory_utilization: "$${BFCL_GPU_MEMORY_UTILIZATION}"
              # The step appends experiment and eval_name.
              output_dir: "$${BFCL_OUTPUT_DIR}"
            launcher_config:
              # The step's default image names one site's registry.
              image_id: "docker:$${EVAL_IMAGE_REGISTRY}/$${BFCL_IMAGE}"
              resources:
                accelerators: "$${EVAL_ACCELERATOR}:$${BFCL_NUM_GPUS}"
                cluster: "$${CLUSTER}"
                zone: "$${EVAL_PARTITION}"
                memory: $${EVAL_MEMORY}
<%- endfor %>

    # ═══ AGGREGATION ════════════════════════════════════════════════════════
    # A CSV per rung and eval kind, each gated on that rung's own evals, so an early
    # rung's CSV is written while later rungs still evaluate and a preempted eval
    # delays only its own rung. Then one benchmark x checkpoint table.
<%- for N in SAGE_RUNGS %>
    export-sage-ck$${N}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
<%- for e in EVAL_CATALOG %>
<%- if e.name in WANT[N] %>
        gate_$${e.name | replace("-", "_")}:
          binding: eval-$${e.name}-ck$${N}.sage_eval_results
<%- endif %>
<%- endfor %>
      outputs:
        sage_export_csv:
          type: dataset
          uri: "env://$${SAGE_RESULTS_DIR}/$${EXP}/ckpt_$${N}-sage.csv"
      steps:
        - step_uri: space://steps/sage-export
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            sage_export_config:
              experiment: "$${EXP}-ckpt_$${N}"
              export_stack: "$${EXPORT_STACK}"
              input_dir: "$${SAGE_OUTPUT_DIR}"
              # ckpt_<N> stays NUMERIC: the roll-up keys each column on ckpt_(digits).
              output_csv: "$${SAGE_RESULTS_DIR}/$${EXP}/ckpt_$${N}-sage.csv"
            launcher_config:
              image_id: "docker:$${EVAL_IMAGE_REGISTRY}/$${SAGE_EXPORT_IMAGE}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${EXPORT_PARTITION}"
                memory: $${EXPORT_MEMORY}
<%- endfor %>
<%- for N in BFCL_RUNGS %>
    export-bfcl-ck$${N}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        gate_bfcl:
          binding: eval-bfcl-ck$${N}.bfcl_results
      outputs:
        bfcl_export_csv:
          type: dataset
          uri: "env://$${BFCL_RESULTS_DIR}/$${EXP}/ckpt_$${N}-bfcl.csv"
      steps:
        - step_uri: space://steps/bfcl-export
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            bfcl_export_config:
              experiment: "$${EXP}-ckpt_$${N}"
              eval_name: "$${BFCL_EVAL_NAME}"
              input_dir: "$${BFCL_OUTPUT_DIR}"
              output_csv: "$${BFCL_RESULTS_DIR}/$${EXP}/ckpt_$${N}-bfcl.csv"
              filter: "$${BFCL_FILTER}"
            launcher_config:
              image_id: "docker:$${EVAL_IMAGE_REGISTRY}/$${BFCL_IMAGE}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${EXPORT_PARTITION}"
                memory: $${EXPORT_MEMORY}
<%- endfor %>

<%- if SAGE_RUNGS or BFCL_RUNGS %>
    # ─── export-combined ────────────────────────────────────────────────────
    # Rows are benchmarks, columns are rungs; each row reads left to right as one
    # metric's trajectory. It pivots the per-rung CSVs (sage cannot nest experiment
    # dirs, so there is no tree to re-scan) and is gated on every one of them, so
    # its completion means the run has been fully measured.
    export-combined:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
<%- for N in SAGE_RUNGS %>
        gate_sage_$${N}:
          binding: export-sage-ck$${N}.sage_export_csv
<%- endfor %>
<%- for N in BFCL_RUNGS %>
        gate_bfcl_$${N}:
          binding: export-bfcl-ck$${N}.bfcl_export_csv
<%- endfor %>
      outputs:
        combined_csv:
          type: dataset
          uri: "env://$${SAGE_RESULTS_DIR}/$${EXP}/combined.csv"
      steps:
        - step_uri: space://steps/combined-export
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            combined_export_config:
              # Empty on a side that did not run, so the step skips it.
              sage_input_dir: "$${SAGE_RESULTS_DIR ~ '/' ~ EXP if SAGE_RUNGS else ''}"
              bfcl_input_dir: "$${BFCL_RESULTS_DIR ~ '/' ~ EXP if BFCL_RUNGS else ''}"
              output_csv: "$${SAGE_RESULTS_DIR}/$${EXP}/combined.csv"
            launcher_config:
              image_id: "docker:$${EVAL_IMAGE_REGISTRY}/$${SAGE_EXPORT_IMAGE}"
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${EXPORT_PARTITION}"
                memory: $${EXPORT_MEMORY}
<%- endif %>
    # <<< shared eval targets
