granite.build:
  name: granite-eval-extended
  # the extended benchmark suite, all reading the same checkpoint. Each benchmark is two
  # targets on one output dir: `<bench>-generate` holds the GPU only while the model
  # generates, and `<bench>` grades that output (sandboxes, verifiers, paid judges) with
  # no vLLM, on CPUs except wmt24pp (XCOMET-XXL on a GPU). `<bench>` binds the generate
  # target's output, so selecting it runs both. terminal-bench-2.1 and mmlu-prox-lite
  # grade inside generation and stay one GPU target. The full list and bring-up status
  # is `granite-evals list --suite extended` (toolathlon and pinchbench are not in yet).
  targets:
    swebench-verified-generate:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/granite-swebench-verified
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            granite_config:
              image: "$${GRANITE_EVALS_IMAGE_SWEBENCH}"
              model_path: "$${MODEL_PATH}"
              served_model_name: "$${SERVED_MODEL_NAME}"
              output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/swebench-verified"
              limit: "$${GRANITE_EVALS_LIMIT}"
              repeats: "$${GRANITE_EVALS_REPEATS}"
              workers: "$${SWEBENCH_WORKERS}"
              dataset: "$${SWEBENCH_DATASET}"
              options: "$${SWEBENCH_OPTIONS}"
              phase: "generate"
              tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
              hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                accelerators: "H100:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    swebench-verified:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        generation:
          binding: swebench-verified-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
