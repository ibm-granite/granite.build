######
# BigCodeBench multi-step eval (generate → execute) against an existing checkpoint.
#
# Usage:
#   gb build start -f recipes/granite4-350m/aws/bcb-eval-multistep/build.yaml \
#     --param NAME=test2-l40s-8-e0-bcb \
#     --param MODEL_S3=s3://granite-build-checkpoints/test2-l40s-8/v0-20260628_194701-hf/epoch_hf_0
######
granite.build:
  name: $${NAME}
  targets:
    bcb-generate:
      environment_uri: space://environments/skypilot/aws
      inputs: {}
      outputs:
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
        predictions:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/sage-eval-bcb-generate
          config:
            sage_eval_config:
              model_source_s3: "$${MODEL_S3}"
              eval_results_s3: "s3://granite-build-eval-results"
              experiment: "$${NAME}"

    bcb-execute:
      environment_uri: space://environments/skypilot/aws
      inputs:
        checkpoint:
          binding: bcb-generate.checkpoint
      outputs: {}
      steps:
        - step_uri: space://steps/sage-eval-bcb-execute
          retry_enabled: true
          retry_transparently: true
          config:
            sage_eval_config:
              model_source_s3: "s3://{{ bindings.checkpoint.binding.path | replace('/s3path/', '') }}"
              eval_results_s3: "s3://granite-build-eval-results"
              experiment: "$${NAME}"
              oe_eval_bcb_api_url: "http://localhost:7860/evaluate/"
