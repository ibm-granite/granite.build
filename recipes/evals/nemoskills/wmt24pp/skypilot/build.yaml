granite.build:
  name: eval-wmt24pp
  # wmt24pp (nemoskills family). Two targets: generate on a GPU, then score on a GPU (the scorer, XCOMET-XXL, needs one).
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    wmt24pp-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "wmt24pp"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/wmt24pp"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    wmt24pp:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: wmt24pp-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "wmt24pp"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/wmt24pp"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
