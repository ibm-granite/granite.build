granite.build:
  name: eval-hmmt-feb25
  # hmmt-feb25 (nemoskills family). Two targets on one output dir: `hmmt-feb25-generate` holds a GPU only while the model generates, and `hmmt-feb25` grades that output on a CPU node (no vLLM), binding the generate target, so selecting `hmmt-feb25` runs both.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    hmmt-feb25-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "hmmt-feb25"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/hmmt-feb25"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    hmmt-feb25:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: hmmt-feb25-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "hmmt-feb25"
            image: "$${IMAGE_CPU}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/hmmt-feb25"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_QUEUE}"
                memory: $${SCORE_MEMORY}
                cpus: "$${SCORE_CPUS}"
