granite.build:
  name: eval-ns-math-500
  # nemoskills (the generic bridge, nemoskills family) on ns's own math-500 protocol, its download pinned by DATASET/DATASET_REVISION. Two targets on one output dir: `ns-math-500-generate` holds a GPU only while the model generates, and `ns-math-500` grades that output on a CPU node (no vLLM), binding the generate target, so selecting `ns-math-500` runs both.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    ns-math-500-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "nemoskills"
            image: "$${IMAGE}"
            dataset: "$${DATASET}"
            dataset_revision: "$${DATASET_REVISION}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_root: "$${OUTPUT_ROOT}"
            run_name: "$${RUN_NAME}"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS} benchmark=math-500"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    ns-math-500:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: ns-math-500-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nemoskills
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "nemoskills"
            image: "$${IMAGE_CPU}"
            dataset: "$${DATASET}"
            dataset_revision: "$${DATASET_REVISION}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_root: "$${OUTPUT_ROOT}"
            run_name: "$${RUN_NAME}"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS} benchmark=math-500"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_QUEUE}"
                memory: $${SCORE_MEMORY}
                cpus: "$${SCORE_CPUS}"
