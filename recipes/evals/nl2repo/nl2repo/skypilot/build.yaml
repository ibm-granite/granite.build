granite.build:
  name: eval-nl2repo
  # nl2repo (nl2repo family). Two targets on one output dir: `nl2repo-generate` holds a
  # GPU only while the model generates, and `nl2repo` grades that output on a CPU node
  # (no vLLM), binding the generate target, so selecting `nl2repo` runs both.
  #
  # LICENSE NOTE: the task data comes from an UNLICENSED upstream repository, fetched at
  # run start by the adapter (never baked into the image); see steps/eval/nl2repo/skypilot/USAGE.md
  # ("Why this shape is safe"). Scored runs are pending OSPO sign-off.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    nl2repo-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nl2repo
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "nl2repo"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/nl2repo"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            sandbox_cache: "$${SANDBOX_CACHE if SANDBOX_CACHE else OUTPUT_ROOT ~ '/' ~ RUN_NAME ~ '/enroot-cache'}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    nl2repo:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: nl2repo-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/nl2repo
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "nl2repo"
            image: "$${IMAGE_CPU}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/nl2repo"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            sandbox_cache: "$${SANDBOX_CACHE if SANDBOX_CACHE else OUTPUT_ROOT ~ '/' ~ RUN_NAME ~ '/enroot-cache'}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_QUEUE}"
                memory: $${SCORE_MEMORY}
                cpus: "$${SCORE_CPUS}"
