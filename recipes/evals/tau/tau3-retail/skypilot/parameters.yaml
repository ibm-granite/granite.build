# tau3-retail on SkyPilot/SLURM, tau family image.
# Data: pinned inside the image (GitHub/PyPI/task data baked by the family's extras.sh), nothing to fetch.
#
# LIMIT is empty: the full benchmark. For a quick functional check, score only the first N
# examples (3-10 is enough to prove the plumbing):
#   gb build start -f recipes/evals/tau/tau3-retail/skypilot/build.yaml --space <space> --param OUTPUT_ROOT=<root> --param LIMIT=5
# Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# https://huggingface.co/ibm-granite/granite-4.2-3b (vLLM downloads a hub id into the HF cache).
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
# Unique per run: re-running the same model with the same RUN_NAME re-resolves the same
# artifact URIs, so a reused SUCCESS target's downstream (score) never dispatches.
# Empty derives it from MODEL_PATH's basename (the step's own defaulting).
RUN_NAME: ""
# Runs land in $OUTPUT_ROOT/$RUN_NAME/<benchmark>. Required, no default: pass
# --param OUTPUT_ROOT=<root>, somewhere the dispatching user can write.
OUTPUT_ROOT: ""
# HF cache the container reads and writes (model + datasets). Empty = the image's /opt/hf-cache.
HF_HOME: ""

# ─── Images (GPU generate + CPU score) ────────────────────────────────────
IMAGE: "us.icr.io/cil15-shared-registry/gb-step-eval-tau:de4d8818"
IMAGE_CPU: "us.icr.io/cil15-shared-registry/gb-step-eval-tau-cpu:de4d8818"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: ""
REPEATS: ""
WORKERS: 16
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── Paid APIs (user simulator + judge) ────────────────────────────────
# The generate target declares GRANITE_EVALS_USER_API_KEY (the user simulator,
# default aws/claude-sonnet-5, runs there) and the score target
# GRANITE_EVALS_JUDGE_API_KEY (its NL assertions are LLM-judged). The gateways are
# OpenAI-compatible; no default, set them for your site. USER_BASE_URL defaults
# to the judge gateway; each role is metered separately. OPTIONS=user_model=self
# drops the user simulator's paid calls (smoke run) but the declared secrets must
# still exist in the space.
USER_BASE_URL: ""
JUDGE_BASE_URL: ""

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 256
CPU_QUEUE: "cpu"
SCORE_CPUS: 8
SCORE_MEMORY: 64
MAX_RETRIES: 2
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
