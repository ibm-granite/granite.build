granite.build:
  name: eval-tau3-telecom
  # tau3-telecom (tau family). Two targets on one output dir: `tau3-telecom-generate` holds a GPU only while the model generates, and `tau3-telecom` grades that output on a CPU node (no vLLM), binding the generate target, so selecting `tau3-telecom` runs both.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    tau3-telecom-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "tau3-telecom"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/tau3-telecom"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS} judge_base_url=$${JUDGE_BASE_URL}"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
                memory: $${GPU_MEMORY}
    tau3-telecom:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: tau3-telecom-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "tau3-telecom"
            image: "$${IMAGE_CPU}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/tau3-telecom"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS} judge_base_url=$${JUDGE_BASE_URL}"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            launcher_config:
              resources:
                cluster: "$${CLUSTER}"
                zone: "$${CPU_QUEUE}"
                memory: $${SCORE_MEMORY}
                cpus: "$${SCORE_CPUS}"
