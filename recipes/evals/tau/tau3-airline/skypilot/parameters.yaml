# tau3-airline on BlueVela (SkyPilot / SLURM), tau family image.
# Data: pinned inside the image (GitHub/PyPI/task data baked by the family's extras.sh), nothing to fetch.
#
# LIMIT is empty: the full benchmark. For a quick functional check, score only the first N
# examples (3-10 is enough to prove the plumbing):
#   gb build start -f recipes/evals/tau/tau3-airline/skypilot/build.yaml --space <space> --param LIMIT=5
# Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# https://huggingface.co/ibm-granite/granite-4.2-3b (vLLM downloads a hub id into the HF cache).
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
# Unique per run: re-running the same model with the same RUN_NAME re-resolves the same
# artifact URIs, so a reused SUCCESS target's downstream (score) never dispatches.
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: "/proj/granite-build/g4os/granite/runs"
# HF cache the container reads and writes (model + datasets). Empty = the image's /opt/hf-cache.
HF_HOME: ""

# ─── Images (GPU generate + CPU score) ────────────────────────────────────
IMAGE: "us.icr.io/cil15-shared-registry/gb-step-eval-tau:9f341f75"
IMAGE_CPU: "us.icr.io/cil15-shared-registry/gb-step-eval-tau-cpu:9f341f75"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: ""
REPEATS: ""
WORKERS: 16
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── Judge (unused: this domain scores rule-based) ──────────────────────
# LLM judging exists only for the tau NL domains (retail, banking_knowledge);
# airline grades with the harness's own DB/action/communicate evaluators, so
# the score target declares no judge secret. JUDGE_BASE_URL is still threaded
# into the step options for family-shape consistency but is never read here.
JUDGE_BASE_URL: ""

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/ibm-bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 256
CPU_QUEUE: "cpu"
SCORE_CPUS: 8
SCORE_MEMORY: 64
MAX_RETRIES: 2
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
