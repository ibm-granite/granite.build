# mcpmark (the generic bridge) on filesystem, easy suite -- BlueVela (SkyPilot / SLURM), mcpmark family image.
# Harness + task definitions: github.com/eval-sys/mcpmark @ cd45b7f57923b9b3985467f5139927575f83141c
# (pinned in the image's code; Apache-2.0). Task state (the per-category zips) is NOT
# baked: the harness downloads it at run time from storage.mcpmark.ai, and results.json
# records digests of what it got. Tasks need outbound internet (state downloads, the
# npx filesystem MCP server).
#
# LIMIT is empty: the full 30-task standard (MCPMark Verified) suite. For a quick
# functional check, the first N tasks of the easy suite:
#   gb build start -f recipes/evals/mcpmark/mcpmark-filesystem-easy/skypilot/build.yaml \
#     --space <space> --param RUN_NAME=<unique> --param LIMIT=5 --param "OPTIONS=task_suite=easy"
# Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# https://huggingface.co/ibm-granite/granite-4.2-3b (vLLM downloads a hub id into the HF cache).
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
# Unique per run: re-running the same model with the same RUN_NAME re-resolves the same
# artifact URIs, so a reused SUCCESS target's downstream (score) never dispatches.
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: ""
# HF cache the container reads and writes (model). Empty = the image's /opt/hf-cache.
HF_HOME: ""

# ─── Image (GPU only) ────────────────────────────────────
# Pinned by tag to a published image (public on quay.io/granitebuild; the tag is the
# short SHA of the commit the image was built from). To run your own build instead:
#   make -C steps/eval image-mcpmark REGISTRY=quay.io/granitebuild publish-image-mcpmark REGISTRY=...
# (the tag defaults to the building checkout's git short SHA), then repoint here.
IMAGE: "quay.io/granitebuild/steps/eval/mcpmark/images/gpu:2b22d21d"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: ""
REPEATS: ""
# Upstream's pipeline runs one service's tasks serially (the module validates
# workers to 1); run the three services as separate targets for parallelism.
WORKERS: 1
# Extra options, e.g. "timeout=1800" (seconds per task); the selection itself
# (service=filesystem task_suite=easy) is fixed in build.yaml, which appends it to these.
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1
# The agent requests max_tokens=32768 per turn; leave headroom for the prompt +
# tools schema. Empty = vLLM's model default.
MAX_MODEL_LEN: ""

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 64
# A retried target resumes per task from the harness's own results tree.
MAX_RETRIES: 3
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
