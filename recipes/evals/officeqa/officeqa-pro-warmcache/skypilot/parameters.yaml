# officeqa-pro from a warm HF cache (no token in the job) -- BlueVela (SkyPilot / SLURM), officeqa family image.
#
# Data: huggingface.co/datasets/databricks/OfficeQA @ 763a8366abf2a3605c381d53586d844dc60fa756
# — the 133 officeqa_pro.csv questions plus the parsed U.S. Treasury Bulletin corpus
# (treasury_bulletins_parsed/jsons/, ~600 MiB), CC-BY-SA-4.0 behind the Hub's
# click-through gate. Nothing is baked into the image or mirrored. Unlike
# recipes/evals/officeqa/officeqa-pro (which fetches with an HF_TOKEN space secret),
# both targets here run with HF_HUB_OFFLINE=1 and no token: the pinned snapshot
# resolves from the HF cache, and the adapter still verifies it against the pinned
# blob sha1s and corpus tree digest.
#
# RUN FROM A WARM HF CACHE. Accept the dataset's terms once, then warm the cache the
# job reads -- by default $OUTPUT_ROOT/hf-cache, or any shared cache you pass as
# HF_HOME -- with a token that has access, from a host that sees the cluster's
# filesystem (the token never enters the repo or the job):
#   HF_TOKEN=<token> python steps/eval/scripts/prefetch_datasets.py \
#     --hf-home <OUTPUT_ROOT>/hf-cache --benchmark officeqa-pro
# (either officeqa entry warms the other). An unwarmed cache fails fast at the
# fetch. The model is staged by hfpull (public, no token), so offline mode never
# needs the Hub for it either.
#
# The model is served with vLLM and answers in <FINAL_ANSWER> tags; the ported
# upstream scorer grades each answer at numeric tolerances, the headline metric
# being accuracy@0%.
#
# LIMIT is empty: the full benchmark (133 questions). For a quick functional
# check, score only the first N questions (3-10 is enough to prove the plumbing):
#   gb build start -f recipes/evals/officeqa/officeqa-pro-warmcache/skypilot/build.yaml --space <space> \
#     --param OUTPUT_ROOT=<root> --param LIMIT=3
# (the model-free gold check, OPTIONS=answers=gold with no model, is the online
# officeqa-pro recipe's). Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# Staged by the queued hfpull step (the hf:/// binding in build.yaml); the served
# name is pinned because the staged path's basename is not the model name.
# https://huggingface.co/ibm-granite/granite-4.2-3b (public, no token).
MODEL: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: "granite-4.2-3b"
# Unique per run: re-running the same model with the same RUN_NAME re-resolves the same
# artifact URIs, so a reused SUCCESS target's downstream (score) never dispatches.
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: ""
# The warm cache both targets read (see the runbook above), writable by the job.
# Empty = $OUTPUT_ROOT/hf-cache, beside the runs; point it at a cache shared across
# users to warm the gated dataset once for everyone.
HF_HOME: ""

# ─── Images (GPU generate + CPU score) ────────────────────────────────────
# Pinned by tag to a published image (public on quay.io/granitebuild; the tag is the
# short SHA of the commit the image was built from). To run your own build instead:
#   make -C steps/eval image-officeqa REGISTRY=quay.io/granitebuild publish-image-officeqa REGISTRY=...
#   make -C steps/eval image-cpu-officeqa REGISTRY=... publish-image-cpu-officeqa REGISTRY=...
# (the tag defaults to the building checkout's git short SHA), then repoint here. The family image adds
# only pandas and lxml (both BSD-3) on top of granite-evals, so any officeqa image
# tag is license-clean to redistribute; the gated dataset is never baked in.
IMAGE: "quay.io/granitebuild/steps/eval/officeqa/images/gpu:89bc7311"
IMAGE_CPU: "quay.io/granitebuild/steps/eval/officeqa/images/cpu:89bc7311"

# ─── Warm cache ────────────────────────────────────────────────────────
# On: the job runs offline against HF_HOME's cache, no token, no Hub.
HF_OFFLINE: "1"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: ""
REPEATS: ""
# Concurrent questions (vLLM requests + context builds) in the generate phase.
WORKERS: 16
# e.g. "questions=1941" (a regex on the question uid), "temperature=0.6".
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 256
CPU_QUEUE: "cpu"
SCORE_CPUS: 8
SCORE_MEMORY: 64
MAX_RETRIES: 2
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
