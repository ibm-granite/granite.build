granite.build:
  name: eval-officeqa-pro
  # officeqa-pro (officeqa family). Two targets on one output dir:
  # `officeqa-pro-generate` holds a GPU only while the model generates, and
  # `officeqa-pro` grades that output on a CPU node (no vLLM), binding the
  # generate target, so selecting `officeqa-pro` runs both.
  #
  # LICENSE NOTE: the questions and the parsed corpus are CC-BY-SA-4.0 behind the
  # Hub's click-through gate, so nothing is baked into the image or mirrored;
  # each phase fetches the pinned revision at run start (the generate target
  # also the ~600 MiB parsed corpus, the score target only the two question
  # CSVs) and verifies it against the pins before running. HF_TOKEN must belong
  # to an account that has accepted the dataset's terms.
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    officeqa-pro-generate:
      environment_uri: "$${ENVIRONMENT_URI}"
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/officeqa
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "officeqa-pro"
            image: "$${IMAGE}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/officeqa-pro"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "generate"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
              launcher_config:
                resources:
                  accelerators: "H200:$${TENSOR_PARALLEL_SIZE}"
                  cluster: "$${CLUSTER}"
                  zone: "$${QUEUE}"
                  memory: $${GPU_MEMORY}
    officeqa-pro:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        generation:
          binding: officeqa-pro-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/officeqa
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            benchmark: "officeqa-pro"
            image: "$${IMAGE_CPU}"
            model_path: "$${MODEL_PATH}"
            served_model_name: "$${SERVED_MODEL_NAME}"
            output_dir: "$${OUTPUT_ROOT}/$${RUN_NAME}/officeqa-pro"
            limit: "$${LIMIT}"
            repeats: "$${REPEATS}"
            workers: "$${WORKERS}"
            options: "$${OPTIONS}"
            phase: "score"
            tensor_parallel_size: "$${TENSOR_PARALLEL_SIZE}"
            hf_home: "$${HF_HOME}"
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - env_name: HF_TOKEN
              launcher_config:
                resources:
                  cluster: "$${CLUSTER}"
                  zone: "$${CPU_QUEUE}"
                  memory: $${SCORE_MEMORY}
                  cpus: "$${SCORE_CPUS}"
