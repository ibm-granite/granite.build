# officeqa-pro on BlueVela (SkyPilot / SLURM), officeqa family image.
#
# Data: huggingface.co/datasets/databricks/OfficeQA @ 763a8366abf2a3605c381d53586d844dc60fa756
# — the 133 officeqa_pro.csv questions plus the parsed U.S. Treasury Bulletin corpus
# (treasury_bulletins_parsed/jsons/, ~600 MiB), CC-BY-SA-4.0 behind the Hub's
# click-through gate. Nothing is baked into the image or mirrored: the adapter
# fetches the pinned revision at run start (the generate target the corpus, the
# score target only the CSVs) and verifies it against pinned blob sha1s and a
# corpus tree digest; a fetch that does not match refuses to run. HF_TOKEN must
# belong to an account that has accepted the dataset's terms. Warm a shared HF
# cache once per node instead of re-downloading:
#   make -C steps/eval prefetch HF_HOME=/path/to/hf-cache
# (both officeqa entries fetch the same snapshot, so either warms the other).
#
# The model is served with vLLM and answers in <FINAL_ANSWER> tags; the ported
# upstream scorer grades each answer at numeric tolerances, the headline metric
# being accuracy@0%. The only secret is HF_TOKEN (the model checkpoint pull and
# the gated dataset fetch).
#
# LIMIT is empty: the full benchmark (133 questions). For a quick functional
# check, score only the first N questions (3-10 is enough to prove the plumbing):
#   gb build start -f recipes/evals/officeqa/officeqa-pro/skypilot/build.yaml --space <space> --param LIMIT=3
# For a model-free plumbing check (fetch, pins, page extraction, scorer), score
# the gold answers through the same path:
#   gb build start -f recipes/evals/officeqa/officeqa-pro/skypilot/build.yaml --space <space> \
#     --param MODEL_PATH=none --param OPTIONS=answers=gold
# Override any value with --param KEY=VALUE.

# ─── Model ────────────────────────────────────────────────────────────
# https://huggingface.co/ibm-granite/granite-4.2-3b (vLLM downloads a hub id into the HF cache).
MODEL_PATH: "ibm-granite/granite-4.2-3b"
SERVED_MODEL_NAME: ""
# Unique per run: re-running the same model with the same RUN_NAME re-resolves the same
# artifact URIs, so a reused SUCCESS target's downstream (score) never dispatches.
RUN_NAME: "granite-4.2-3b"
OUTPUT_ROOT: "/proj/granite-build/g4os/granite/runs"
# HF cache the container reads and writes (model + the gated dataset). Empty = the
# image's /opt/hf-cache.
HF_HOME: ""

# ─── Images (GPU generate + CPU score) ────────────────────────────────────
# Fill with the tag of a built + pushed family image before the first run:
#   make -C steps/eval image-officeqa REGISTRY=us.icr.io/cil15-shared-registry publish-image-officeqa REGISTRY=...
#   make -C steps/eval image-cpu-officeqa REGISTRY=... publish-image-cpu-officeqa REGISTRY=...
# (the tag defaults to the building checkout's git short SHA). The family image adds
# only pandas and lxml (both BSD-3) on top of granite-evals, so any officeqa image
# tag is license-clean to redistribute; the gated dataset is never baked in.
IMAGE: "us.icr.io/cil15-shared-registry/gb-step-eval-officeqa:<tag>"
IMAGE_CPU: "us.icr.io/cil15-shared-registry/gb-step-eval-officeqa-cpu:<tag>"

# ─── Scale ────────────────────────────────────────────────────────────
LIMIT: ""
REPEATS: ""
# Concurrent questions (vLLM requests + context builds) in the generate phase.
WORKERS: 16
# e.g. "answers=gold" (model-free plumbing check; then MODEL_PATH can be "none"),
# "questions=1941" (a regex on the question uid), "temperature=0.6".
OPTIONS: ""
TENSOR_PARALLEL_SIZE: 1

# ─── Cluster ──────────────────────────────────────────────────────────
ENVIRONMENT_URI: "space://environments/skypilot/slurm/ibm-bluevela"
CLUSTER: "bluevela"
QUEUE: "gpu-mid"
GPU_MEMORY: 256
CPU_QUEUE: "cpu"
SCORE_CPUS: 8
SCORE_MEMORY: 64
MAX_RETRIES: 2
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
