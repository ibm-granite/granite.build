# gold-sweep-100 — the lambda=0.0 off-policy arm of the 100-step GOLD sweep, for
# BlueVela (SkyPilot / LSF).
#
# This is the arm the published sweep found on the cost/quality frontier: it buys
# mathematical reasoning (+0.073 gsm8k strict over a plain-SFT control, 2x the 2-sigma
# gate) for 14.9 GPU-h, against 135.7 GPU-h for the on-policy arm whose small edge over
# it is inside noise. Reproducing it here is what makes that number ours rather than
# quoted.
#
# Run gold-sweep-smoke first. It is this file's shape at 2 steps and 4096 context, and
# it exists so a wrong path or an OOM costs minutes rather than two hours.
#
# Override any value with: gb build start --param KEY=VALUE

# ─── Run identification ───────────────────────────────────────────────
RUN_NAME: "gold-sweep-100"

# ─── Trainer code and image ───────────────────────────────────────────
# The GOLD trainer comes from code_config's pinned public-repo clone -- the same
# mechanism every ported step uses -- recorded automatically as distill_code_commit.
# This is NOT the same trainer the published sweep ran, which is why a numeric
# mismatch against the published arm is a finding rather than a bug: see README,
# "What this does and does not reproduce".
DS_CONFIG: "steps/distill-gold-train/configs/deepspeed/accelerate_deepspeed_zero3.yaml"
# SM90 (H100) build — it will not run on A100.
IMAGE_ID: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"

# ─── Model pair and data ──────────────────────────────────────────────
# The published sweep's own three artifacts, read directly rather than copied. All three
# are readable from the granitebuild account (/proj/data-eng is drwxrws--- root
# proj_data-eng and we are in proj_data-eng); verified 2026-09-13.
#
# The teacher is a raw HF snapshot rather than a /proj overlay, and the student is
# RETAGGED — re-embedded onto the teacher's tokenizer by the upstream
# distill-tokenizer-align step, which does not exist in this repo. That is why these
# paths are used as-is: substituting our own overlays would change the tokenizer
# relationship the corpus was prepared against, and GOLD compares distributions
# position-by-position, so that is not a cosmetic difference.
TEACHER_MODEL: "/proj/data-eng/hew/.cache/hf/hub/models--ibm-granite--granite-4.2-30b/snapshots/a0057a78b9d98a88aba90b6ef6e00d292440a222"
STUDENT_MODEL: "/proj/data-eng/hew/gb-steps-collection-post-training/data/distillation/work/model_copies/granite-4.1-3b-base_retagged_v2"
# prep's output: 802,027 rows kept / 9,145 dropped, schema {messages, row_id}, 3.2 GB.
# NOT named *_nothink, unlike every kd-sandbox dataset — the filename convention does
# not travel to prep's output, so think-filtering was checked by sampling instead: zero
# <think> occurrences in the first 20,000 rows (2026-09-13). An inline <think>...</think>
# in an assistant turn breaks gold's completion extraction, so re-check by sampling if
# this path is ever repointed. test_gold_sweep_recipe.py holds an allowlist of corpora
# checked this way, so swapping in an unchecked one fails a test rather than a run.
TRAINING_DATASET: "/proj/data-eng/hew/gb-steps-collection-post-training/data/distillation/prepped/en-sft-4.1-0.2-16K-v2/merged/train.jsonl"

# ─── Training hyperparameters ─────────────────────────────────────────
# 100 optimizer steps x 192 rows = 19,200 row visits = 2.4% of one epoch, every row
# unique. Bounding by steps rather than epochs is the whole point: one epoch of this
# corpus is 4,177 steps, 2.9 days and 554 GPU-h. num_train_epochs stays 1.0 because the
# LR schedule is built from it; max_steps truncates the run, it does not reshape it.
MAX_STEPS: 100
NUM_TRAIN_EPOCHS: 1.0
# Quote the scientific-notation values. Unquoted, PyYAML loads 1.0e-05 as a float whose
# repr is "1e-05", which is then re-read from the rendered build.yaml as a STRING.
LEARNING_RATE: "1.0e-05"
MIN_LR: "1.0e-06"
WARMUP_RATIO: 0.05
LR_SCHEDULER_TYPE: "cosine_with_min_lr"
# Effective batch = PER_DEVICE x GRAD_ACCUM x NUM_NODES x NUM_GPUS_PER_NODE
#                 = 4 x 6 x 1 x 8 = 192, the published sweep's geometry exactly. Held
# equal across arms is what makes arms comparable, so do not change one of these four
# without compensating in another.
PER_DEVICE_TRAIN_BATCH_SIZE: 4
GRADIENT_ACCUMULATION_STEPS: 6
# The full reference context, not gold-smoke's 4096/1024.
MAX_LENGTH: 16384
MAX_COMPLETION_LENGTH: 4096
GRADIENT_CHECKPOINTING: true
# 4 checkpoints turn a single end-point number into a learning curve eval can read. Each
# is ~40 GB: ZeRO-3 shards carry fp32 optimizer state, so a checkpoint is far larger
# than the 6.4 GB end-of-training model.
SAVE_STRATEGY: "steps"
SAVE_STEPS: 25
SAVE_TOTAL_LIMIT: 4
# t_gen is per-log-line and reset at each emit, so a value above 1 would aggregate away
# the per-step timing the cost model is read from.
LOGGING_STEPS: 1
# 32, not gold-smoke's 8: the trainer maps and filters the WHOLE 802,027-row dataset
# before step 1 regardless of max_steps, so on a 96-core node 8 workers would make
# startup rather than training the long pole. It cannot change the optimization.
DATASET_NUM_PROC: 32

# ─── GOLD / distillation loss ─────────────────────────────────────────
TEMPERATURE: 1.0
# 0 => off-policy: every node trains on the fixed dataset, no vLLM server to coordinate.
LMBDA: 0.0
# The published sweep's value, and the one genuinely-mixture setting of the three: the
# trainer short-circuits beta 0.0 to forward KL and 1.0 to reverse KL. gold-smoke runs
# 0.0, i.e. forward KL, so this is a real objective change and not a tuning nudge.
BETA: 0.5
# UNRESOLVED, and deliberately NOT the published sweep's value. See README, "The liger
# question". The sweep set this true; our step pins it false because granite's
# logits_scaling=10 overflows the fused bf16 JSD kernel and yields NaN loss. false is
# the setting that is known to produce a finite loss here, so it is the default; the
# cost is memory, since the non-fused path materialises the [batch, seq, vocab] logit
# tensor the fused kernel avoids, and at 16384 x 4 that may not fit. gold-sweep-smoke
# is what settles it — resolve there before spending this recipe's two hours.
USE_LIGER_FUSED_JSD: false
# The trailing newline is load-bearing — it is where loss masking begins, and the
# published sweep's own repo carries a check script for it — and it travels as a
# literal two-character escape rather than as a real newline. It has to: gbserver
# fills every config string through Jinja (fill_objtemplate, whose environment is
# built without keep_trailing_newline), which strips exactly one trailing newline
# from each VALUE. Build d8470f14 carried a real newline, the step received
# "<|im_start|>assistant", and two steps trained against a span one token off while
# reporting success.
#
# Hence SINGLE quotes with a DOUBLED backslash: YAML leaves '\\n' alone, so a
# literal \n reaches build.yaml's double-quoted scalar, which decodes it to the
# two characters backslash-n — no trailing whitespace for anything to strip.
# distill-gold's render_gold_config.py decodes it once, inside the container.
# test_gold_sweep_recipe.py asserts the escape survives the render;
# test_distill_gold.py asserts the decode and that the fill cannot eat it.
RESPONSE_TEMPLATE: '<|im_start|>assistant\\n'

# ─── NCCL / distributed diagnostics ───────────────────────────────────
# Single-node, so there are no cross-node collectives to diagnose and INFO would only
# add noise to a two-hour log. Monitoring stays on: with it off a deadlock does not
# fail, it hangs holding the allocation and produces nothing to read.
NCCL_DEBUG: ""
NCCL_DEBUG_SUBSYS: "INIT,NET"
# 1 h, the reference value, to survive a slow 30B teacher forward without a spurious
# abort. gold-smoke lowers this because a smoke run wants a fast failure; a real run
# does not.
NCCL_TIMEOUT_MS: 3600000
NCCL_ENABLE_MONITORING: true

# ─── On-policy (off for this recipe) ──────────────────────────────────
# Inert at LMBDA 0.0. Kept explicit and diffable against the on-policy recipe so that
# the difference between the two arms is visible as values rather than as absent keys.
VLLM_NUM_SERVERS: 0
TOP_P: 0.95
USE_SAMPLED_OPD_LOSS: false
LAST_MESSAGE_ONLY: false
CLIP_ALPHA: 0.1
OPD_IMPORTANCE_SAMPLING: false

# ─── Topology and resources ───────────────────────────────────────────
# ONE node. The lambda=0.0 arm spends its whole allocation on training — there is no
# vLLM server to carve a node off for. This exercises less plumbing than gold-smoke's
# 2-node run by design; gold-smoke remains the multi-node proof.
NUM_NODES: 1
NUM_GPUS_PER_NODE: 8
ACCELERATORS: "H100:8"
# HOST memory per node, and it has to be stated: the LSF provisioner defaults to 16G,
# which killed an earlier build with TERM_MEMLIMIT at 46.5G — presenting as a cross-node
# NCCL hang, since a host-memory kill produces no CUDA OOM and no watchdog message. 256
# leaves real headroom, and this recipe's dataset_num_proc 32 over a 3.2 GB corpus wants
# more host memory than gold-smoke's 8 over a 2,000-row slice.
MEMORY: 256
CLUSTER: "bluevela"
# Where every target runs. One value rather than one literal per target, so moving this
# recipe to another environment (a gbspace-public one, say) is a one-line change.
ENVIRONMENT_URI: "space://environments/skypilot/lsf/ibm-bluevela"
# SkyPilot's `zone` is the LSF queue name for this cloud. `normal` is non-preemptable;
# an earlier sweep attempt died on the preemptable queue.
QUEUE: "normal"

# ─── Monitoring ───────────────────────────────────────────────────────
# ~1.9 h expected, so a 5-minute poll is frequent enough to follow without flooding.
POLL_INTERVAL_SECONDS: 300
LOG_RETRIEVAL_INTERVAL_SECONDS: 300
