# gold-onpolicy-full-smoke — FULLY on-policy GOLD (lmbda 1.0) with vLLM as a
# separate target, on BlueVela (SkyPilot / LSF).
#
# Same shape as gold-onpolicy-smoke (proven: build 9973e766 synced all 362
# parameter tensors over NCCL across two LSF allocations), same shared-path model
# pair as gold-smoke (proven: build 86ccd562, off-policy, loss 0.282, checkpoint
# saved). Only LMBDA and the topology comment differ from gold-blend-smoke — this
# is the lmbda=1.0 endpoint of the same arm family.
#
# lmbda 1.0 means EVERY sample is generated by the student under vLLM — nothing
# is drawn from the fixed corpus. Not yet run against this pair — this is the
# recipe that tests it.
#
# Override any value with: gb build start --param KEY=VALUE

# ─── Run identification ───────────────────────────────────────────────
RUN_NAME: "gold-onpolicy-full-smoke"

# ─── Trainer code and image ───────────────────────────────────────────
# One code_config clone for BOTH targets: run_vllm_serve.py and gold.py come from
# the same pinned public repo, so a server built from different code than the
# trainer expects is not a failure mode this recipe can produce.
DS_CONFIG: "steps/distill-gold-train/configs/deepspeed/accelerate_deepspeed_zero3.yaml"
IMAGE_ID: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"

# ─── Model pair and data ──────────────────────────────────────────────
# The same shared-path artifacts gold-smoke already proved end to end (build
# 86ccd562). STUDENT_MODEL is used TWICE — as the trainer's init and as the model
# vLLM serves — which is the on-policy contract: the student generates, the
# teacher scores those generations.
#
# For a REAL on-policy run this should name a good off-policy checkpoint rather
# than the base retagged student: on-policy continues from one, and a base
# student generates noise. For a smoke run noise is fine — the NCCL sync path is
# exercised either way — so the base student is used here deliberately.
TEACHER_MODEL: "/proj/granite-build/g4os/kd-sandbox/teacher_overlays/granite-4.2-30b"
STUDENT_MODEL: "/proj/granite-build/g4os/kd-sandbox/student_overlays/granite-4.1-3b-base-hub"
TRAINING_DATASET: "/proj/granite-build/g4os/gbtest/gold-distill-smoke/smoke_2000_nothink.jsonl"

# ─── Training hyperparameters ─────────────────────────────────────────
# Two steps: one proves the trainer reaches the server, two prove a weight sync
# happens between steps — which is the actual thing under test, since
# VLLM_SYNC_FREQUENCY is 1.
MAX_STEPS: 2
NUM_TRAIN_EPOCHS: 1.0
LEARNING_RATE: "1.0e-05"
MIN_LR: "1.0e-06"
WARMUP_RATIO: 0.05
LR_SCHEDULER_TYPE: "cosine_with_min_lr"
# Effective batch 8 (1 x 1 x 1 x 8). Not meaningful at two steps; kept small so each
# step is cheap.
PER_DEVICE_TRAIN_BATCH_SIZE: 1
GRADIENT_ACCUMULATION_STEPS: 1
# 4096, and MAX_LENGTH is also handed to the server as --max-model-len, so the two
# cannot disagree. A server with a smaller window than the trainer refuses prompts
# the trainer happily builds.
MAX_LENGTH: 4096
MAX_COMPLETION_LENGTH: 1024
GRADIENT_CHECKPOINTING: true
SAVE_STRATEGY: "steps"
# Save at step 1: the checkpoint is what gates the teardown target, so a run that
# never saves also never tears the server down.
SAVE_STEPS: 1
SAVE_TOTAL_LIMIT: 1
LOGGING_STEPS: 1
DATASET_NUM_PROC: 32

# ─── GOLD / distillation loss ─────────────────────────────────────────
TEMPERATURE: 1.0
# 1.0 => FULLY on-policy: every sample is generated by the student under vLLM. The
# renderer refuses a server URL at lmbda 0, because the server would then be
# allocated and never asked for anything.
LMBDA: 1.0
BETA: 0.5
# false, as in gold-sweep-*/gold-onpolicy-smoke: granite's logits_scaling=10
# overflows the fused bf16 JSD kernel. Note the upstream constraint too —
# CustomGOLDConfig rejects liger with several on-policy options, so true here
# risks a validation error deep in a dataclass rather than an obviously wrong
# recipe.
USE_LIGER_FUSED_JSD: false
# SINGLE-quoted with a DOUBLED backslash: the trailing newline travels as a literal
# escape because gbserver's config fill strips a real one before the step sees it.
# See ../gold-sweep-100/parameters.yaml for the mechanism and the build it cost.
RESPONSE_TEMPLATE: '<|im_start|>assistant\\n'

# ─── On-policy ─────────────────────────────────────────────────────────
# ONE external server. This counts external servers, not nodes taken from the
# trainer, so 1-of-1 is fine here where the in-allocation path would refuse it. It
# must be >= 1: it is what makes the renderer emit the on-policy config block, and
# at 0 the run would train off-policy while a server sat idle. The renderer refuses
# that combination rather than letting it run.
VLLM_NUM_SERVERS: 1
# The reference launcher's values.
VLLM_MODE: "server"
# Every optimizer step. On-policy means generating from the CURRENT student, so a
# larger value samples from a staler policy — and at 2 steps a larger value would
# mean the sync path never runs, which is the thing being tested.
VLLM_SYNC_FREQUENCY: 1
VLLM_PORT: 8001
TOP_P: 0.95
USE_SAMPLED_OPD_LOSS: false
LAST_MESSAGE_ONLY: false
CLIP_ALPHA: 0.1
OPD_IMPORTANCE_SAMPLING: false

# ─── NCCL / distributed diagnostics ───────────────────────────────────
# INFO, and this is not optional on this shape. The open question this recipe
# family exists to answer is whether a NCCL group forms across two allocations;
# INIT,NET is the only way to see which transport each side chose and where a
# stalled group is stuck.
NCCL_DEBUG: "INFO"
NCCL_DEBUG_SUBSYS: "INIT,NET"
# 10 min. A cross-allocation group that cannot form will HANG rather than error, so
# the timeout is what turns a held pair of allocations into a diagnostic. Monitoring
# on for the same reason: with it off, a stalled collective is not aborted at all.
NCCL_TIMEOUT_MS: 600000
NCCL_ENABLE_MONITORING: true

# ─── Topology and resources ───────────────────────────────────────────
# ONE trainer node, in its own allocation. All 8 of its GPUs train, because the
# server is elsewhere — that is what binding the trainer's `vllm` input changes.
NUM_NODES: 1
NUM_GPUS_PER_NODE: 8
ACCELERATORS: "H100:8"
# The server's own allocation. 8 GPUs to serve a 3B student is generous, but the
# step's data_parallel_size defaults to the whole node and matching the trainer's
# shape keeps one fewer thing different from the reference launcher.
VLLM_NUM_GPUS_PER_NODE: 8
VLLM_ACCELERATORS: "H100:8"
# 30 min for the server to answer /health. Generous on purpose: this is a cold
# multi-GB load off a shared filesystem plus CUDA graph capture, and a timeout here
# is indistinguishable from a hang in the log.
VLLM_HEALTH_TIMEOUT_SECONDS: 1800
# Backstop, not a schedule. This smoke run is minutes long once healthy, so an
# hour is loose enough never to interrupt a working run and tight enough that a
# stranded server costs one node-hour rather than a night.
VLLM_MAX_LIFETIME_SECONDS: 3600
# Host memory per node, for both targets. The LSF provisioner defaults to 16G, which
# has killed a build with TERM_MEMLIMIT presenting as a cross-node NCCL hang.
MEMORY: 256
CLUSTER: "bluevela"
# Where every target runs. One value rather than one literal per target, so moving this
# recipe to another environment (a gbspace-public one, say) is a one-line change.
ENVIRONMENT_URI: "space://environments/skypilot/lsf/ibm-bluevela"
QUEUE: "normal"

# ─── Monitoring ───────────────────────────────────────────────────────
# 30s for BOTH targets, and it matters more here than anywhere else: the server's
# URL binding is scraped from its log on the periodic pull, so this interval is the
# granularity at which the trainer can start once the server is ready.
POLL_INTERVAL_SECONDS: 30
LOG_RETRIEVAL_INTERVAL_SECONDS: 30
