name: hello
version: v1
type: custom
config: {}
# No named inputs: a smoke-test step with no data inputs.
inputs:
  allow_unknown: true

environment_configs:
  Runpod:
    launchers:
      hello:
        type: runpod
        monitors:
        - pod_status_monitor
        config:
          image: alpine:latest
    monitors:
      pod_status_monitor:
        type: pod_status_monitor
