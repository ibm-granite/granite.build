name: hello
version: v1
type: custom
config: {}
environment_configs:
  Bash:
    launchers:
      hello:
        type: nohup
        monitors:
        - log_monitor
    monitors:
      # Uses the shared monitor library (space://monitors/bash). hello emits no artifact
      # markers, so the monitor's artifact events simply never fire — only the
      # MESSAGE_EVENT stream applies, matching this step's original behavior.
      log_monitor:
        ref: space://monitors/bash
