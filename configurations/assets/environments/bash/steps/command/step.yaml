name: command
version: v1
type: custom
# A general-purpose Bash step that runs an arbitrary shell command supplied by
# the build.yaml under `config.bash_config.command` — mirroring how the docker
# `image` step takes `config.image_config.command`.  The step exits with that
# command's status, so e.g. `command: "exit 1"` hard-FAILS the target.  Useful
# for tests and quick experiments that need a controllable bash workload.
config:
  bash_config:
    command: ""    # shell command to execute on the launcher node
environment_configs:
  Bash:
    launchers:
      command:
        type: nohup
        monitors:
        - log_monitor
        # The build.yaml's command is templated into the launcher env; command.sh
        # exec's $LLMB_COMMAND so the step's exit status is the command's status.
        config:
          env:
            LLMB_COMMAND: '{{ config.bash_config.command }}'
    monitors:
      log_monitor:
        type: log_monitor
        config:
          event_configs:
          - event_type: MESSAGE_EVENT
            line_regex: .*
            is_json: false
            event_fields:
            - field_name: msg
              field_regex: .*
          # Artifact detection: a line that BEGINS with
          #   LLMB_ARTIFACT_ID:<output-name> LLMB_ARTIFACT_PATH:<path>
          # registers <path> as the artifact for the named output binding. Only
          # commands that emit these markers produce artifacts; all others are
          # unaffected. Mirrors the Skypilot/LSF `command` step so env:// (and
          # other) outputs can be registered from an arbitrary bash command.
          # The `^` anchor is required: command.sh echoes the full command back
          # ("command step start: <cmd>"), so a command that contains the marker
          # text would otherwise be matched on that diagnostic line too — and the
          # trailing shell quote there breaks the `binding` JSON template.
          - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
            line_regex: "^LLMB_ARTIFACT_ID:.* LLMB_ARTIFACT_PATH:.*"
            is_json: false
            event_fields:
            - field_name: binding_id
              field_regex: "(?<=LLMB_ARTIFACT_ID:)[^ ]+"
            - field_name: path
              field_regex: "(?<=LLMB_ARTIFACT_PATH:).*"
              is_data: true
            - field_name: binding
              field_value_template: '{ "path": "{{ fields.data.path }}" }'
              is_json: true
          # mem:// output variant: a line that BEGINS with
          #   LLMB_ARTIFACT_ID:<output-name> LLMB_ARTIFACT_STATE:<value>
          # registers <value> as the artifact's `state` for the named output.
          # Unlike LLMB_ARTIFACT_PATH (a filesystem path for env://), the mem://
          # store passes binding["state"] to the consumer verbatim (no path
          # normalisation), so a value like a service URL survives intact and the
          # consumer reads it via {{ bindings.<input>.binding.state }}. Mirrors how
          # the skypilot code-server/rm-server steps emit mem:// bindings. The two
          # markers are mutually exclusive per line, so this event and the
          # PATH event above never both match the same line.
          - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
            line_regex: "^LLMB_ARTIFACT_ID:.* LLMB_ARTIFACT_STATE:.*"
            is_json: false
            event_fields:
            - field_name: binding_id
              field_regex: "(?<=LLMB_ARTIFACT_ID:)[^ ]+"
            - field_name: state
              field_regex: "(?<=LLMB_ARTIFACT_STATE:).*"
              is_data: true
            - field_name: binding
              field_value_template: '{ "state": "{{ fields.data.state }}" }'
              is_json: true
