name: bash
type: Bash
config: {}
assetstores:
  # HuggingFace Hub — load models/datasets from hf:// URIs (push not enabled).
  - store_uri: space://assetstores/hf/
    load:
      - mode: default
  # file: URIs are handled by the implicitly-registered builtin file store
