name: bash
type: Bash
config: {}
assetstores:
  # HuggingFace Hub — load models/datasets and push artifacts via hf:// URIs.
  - store_uri: space://assetstores/hf/
    pull:
      - mode: default
    push:
      - mode: default
  # Local filesystem — load/push artifacts via file: URIs (builtin file store).
  - store_uri: space://assetstores/file/
    pull:
      - mode: default
    push:
      - mode: default
