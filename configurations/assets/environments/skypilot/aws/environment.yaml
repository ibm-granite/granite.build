name: skypilot-standalone
type: Skypilot
subtype: aws
config:
  # Uncomment ONE of the following cloud backends:

  # AWS — provisions EC2 instances directly (requires ~/.aws/credentials)
  default_cloud: aws

  # Kubernetes — uses existing K8s cluster (requires ~/.kube/config)
  # default_cloud: kubernetes

  idle_minutes_to_autostop: 5
  retry:
    max_retries: 10
    delay_seconds: 1800
  # AWS credentials materialized from the space secret manager into a NON-default
  # profile in ~/.aws/credentials (avoids clobbering an existing [default]). The
  # values are secret NAMES resolved by the space's secret_manager (local file
  # store in standalone; server-managed in shared) — never literals.
  aws_credentials:
    - profile: gb-skypilot
      aws_access_key_id: GB_AWS_ACCESS_KEY_ID
      aws_secret_access_key: GB_AWS_SECRET_ACCESS_KEY
  # Select that profile: deep-merged into ~/.sky/config.yaml so SkyPilot's boto3
  # uses boto3.Session(profile_name='gb-skypilot'), which (being an explicit
  # profile) also disables the AWS_* env-var provider. NOTE: `profile` is only a
  # valid SkyPilot config key under workspaces.<name>.aws (not the global aws
  # block) — the global form is rejected with "unsupported field 'profile'" and
  # crashes the API server. 'default' is SkyPilot's default active workspace.
  cloud_config:
    workspaces:
      default:
        aws:
          profile: gb-skypilot
  # Optional: a BYO pre-provisioned EFS filesystem so multi-step data flow works
  # across the separate EC2 instances SkyPilot allocates per step. Opt-in; when
  # set it PRODUCES the shared_workdir root (do NOT also set shared_workdir).
  # Requires: EFS + mount targets per worker AZ + an SG allowing NFS 2049, and the
  # EFS root chmod'd 1777 (see docs/environments/skypilot-aws.md).
  # shared_filesystem:
  #   provider: efs
  #   mount_point: /mnt/gb-shared
  #   efs:
  #     file_system_id: fs-0abc123
  #     region: us-east-1
  #     tls: true
  #     # cleanup_zone: us-east-1a   # pin the teardown VM to a mount-target AZ
  #
  # When enabling shared_filesystem, ALSO change the hf assetstore below to drop
  # `cache_path: /tmp/hf_cache` and `inline: true`, so hfpull runs as its own step
  # and caches to ${mount_point}/hf_cache (otherwise it caches instance-locally and
  # the model never reaches EFS). i.e. replace the hf pull config with `config: {}`.
assetstores:
  - store_uri: space://assetstores/s3/
    pull:
      - mode: default
        config: {}
    push:
      - mode: default
        config: {}
  - store_uri: space://assetstores/hf
    pull:
      - mode: default
        config:
          cache_path: /tmp/hf_cache
          inline: true
    push:
      - mode: default
        config: {}
