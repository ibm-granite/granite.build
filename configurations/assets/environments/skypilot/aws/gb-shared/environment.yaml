# space://environments/skypilot/aws/gb-shared: SkyPilot on AWS EC2 in
# us-east-1, with a pre-provisioned EFS filesystem shared by every step.
#
# The committed file_system_id is a PLACEHOLDER: this file is the template.
# To run, put a copy with your EFS id under another name in a space you
# control (for example an uncommitted local space whose base_uris lists its
# own dir ahead of configurations/assets), and point the recipe's
# ENVIRONMENT_URI at that name. See skypilot/aws/gb-shared-usw2 for the
# us-west-2 twin.
#
# space://environments/skypilot/aws (the directory above) has no shared
# filesystem: each step runs on its own EC2 instance and keeps nothing after it
# ends. A multi-target build that passes data between targets, or that must keep
# an output after its instance is gone, needs one. This copy of that environment
# adds:
#
#   * shared_filesystem: the EFS, mounted at /mnt/gb-shared on every step's
#     instance (and inside its container);
#   * hf pulls as their own steps, cached on the EFS (`config: {}`), so a model
#     is downloaded once and reused by later targets and builds;
#   * every step pinned to us-east-1, the only region the EFS has mount targets in.
#
# Used by recipes/granite-switch/skypilot/aws/answerability-{lora,sr}.
name: skypilot-aws-gb-shared
type: Skypilot
subtype: aws
config:
  default_cloud: aws
  idle_minutes_to_autostop: 5
  # p5-family capacity is often short. A launch that finds none is retried with
  # backoff (30 s, doubling, capped at provision_backoff_max), up to max_retries
  # attempts: about 2 h of trying before the build fails. max_retries also caps
  # re-runs of a step whose workload failed after it started (hfpull's are on
  # by default); re-run n waits 60 s x 2^n, capped at delay_seconds.
  retry:
    max_retries: 12
    provision_backoff_max: 900
    delay_seconds: 600
  # Credentials: secret NAMES resolved by the space's secret manager, written to
  # a non-default profile in ~/.aws/credentials (as in the shipped environment).
  aws_credentials:
    - profile: gb-skypilot
      aws_access_key_id: GB_AWS_ACCESS_KEY_ID
      aws_secret_access_key: GB_AWS_SECRET_ACCESS_KEY
  cloud_config:
    workspaces:
      default:
        aws:
          profile: gb-skypilot
  # The EFS. Another AWS account: replace file_system_id and region with your
  # own filesystem's; it needs a mount target in every AZ of the region, a
  # security group allowing NFS (TCP 2049) from the workers, and its root
  # chmod'd 1777 (docs/environments/skypilot-aws.md, "Runbook: provision a
  # shared EFS filesystem").
  #
  # tls: true encrypts NFS traffic only where amazon-efs-utils (mount.efs) is
  # installed. The hf-peft-sft image and the bare workers lack it, so their
  # mounts fall back to plain NFSv4 inside the VPC, with a warning in the step
  # log. Data at rest is encrypted by the filesystem.
  shared_workdir: /mnt/gb-shared/gbroot
  shared_filesystem:
    provider: efs
    mount_point: /mnt/gb-shared
    efs:
      file_system_id: fs-REPLACE-ME
      region: us-east-1
      tls: true
  # Pin each step type to the EFS region. hfpull and hfpush are the hidden
  # steps queued for every hf:// input and output; they take no launcher_config
  # from build.yaml, so the pin has to live here. A build running another step
  # type here must pin it too (launcher_config.resources.infra: aws/us-east-1),
  # or add it to this list.
  steps:
    hfpull:
      launcher_config: { resources: { infra: aws/us-east-1 } }
    hfpush:
      launcher_config: { resources: { infra: aws/us-east-1 } }
    command:
      launcher_config: { resources: { infra: aws/us-east-1 } }
    hf-peft-sft:
      launcher_config: { resources: { infra: aws/us-east-1 } }
    byoc:
      launcher_config: { resources: { infra: aws/us-east-1 } }
assetstores:
  # No cache_path and no inline: hfpull runs as its own step and caches to
  # ${shared_workdir}/hf_cache on the EFS.
  - store_uri: space://assetstores/hf
    pull:
      - mode: default
        config: {}
    push:
      - mode: default
        config: {}
