name: hello
version: v1
type: custom
config: {}
environment_configs:
  Skypilot:
    default_launcher: hello
    launchers:
      hello:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          resources:
            cpus: 2+
            memory: 4+
          run: |
            set -e
            echo 'hello step start'
            echo "Hello from gbserver standalone (SkyPilot)!"
            echo "Running on: $(hostname)"
            echo "Cloud: ${SKYPILOT_CLUSTER_NAME:-unknown}"
            echo 'hello step end'
    monitors:
      skypilot_monitor:
        # References the shipped monitor library (space://monitors/skypilot) for
        # the standard artifact convention + on_completion profile. hello is a
        # quick smoke step and emits no artifacts, so keep a small poll override
        # for fast completion detection (the base default is 300s).
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(15) }}"
