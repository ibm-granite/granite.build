name: rm-server
version: 1.0.0
type: SERVICE
config:
  workload:
    cwd: "."
  gb:
    mock: false
    step_contents_in_env: false
  rm_server_config:
    model_path: "/proj/checkpoints/ashishagr/model_downloads/phi4-multilingual"
    idle_timeout: ""
    hf_token: ""
outputs:
  optional:
    rm_server_url:
      type: dataset

environment_configs:
  Skypilot:
    default_launcher: rm-server
    launchers:
      rm-server:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/open-instruct-3:0.1.0-noconda"
          resources:
            accelerators: "1"
          run: |
            set -e
            echo "=== Open Instruct RM Server on $(hostname) ==="
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader

            {% if config.rm_server_config.model_path %}
            export RM_SERVER_MODEL="{{ config.rm_server_config.model_path }}"
            {% endif %}
            {% if config.rm_server_config.idle_timeout %}
            export IDLE_TIMEOUT="{{ config.rm_server_config.idle_timeout }}"
            {% endif %}
            {% if config.rm_server_config.hf_token %}
            export HF_TOKEN="{{ config.rm_server_config.hf_token }}"
            {% endif %}

            # RM server runs from /stage with no PYTHONPATH override
            # (matches gbansible bluevela_rm_server CONTAINER_CMD).
            cd /stage
            if [[ -x /opt/miniconda3/bin/python ]]; then
                PYTHON_BIN=/opt/miniconda3/bin/python
            else
                PYTHON_BIN=python3.11
            fi
            echo "Using Python: $PYTHON_BIN ($($PYTHON_BIN --version 2>&1))"
            exec $PYTHON_BIN -u -m open_instruct.servers.rm_server
    monitors:
      skypilot_monitor:
        type: skypilot_monitor
        config:
          poll_interval_seconds: 30
          event_configs:
          - event_type: WORKLOAD_STATUS_EVENT
            line_regex: "Starting FastAPI server on"
            event_fields:
              - field_name: status
                field_value_template: "RUNNING"
          - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
            line_regex: "Starting FastAPI server on .+"
            event_fields:
              - field_name: binding_id
                field_value_template: "rm_server_url"
              - field_name: path
                field_regex: "(?<=Starting FastAPI server on )\\S+"
                is_data: true
              - field_name: binding
                field_value_template: '{ "path": "http://{{ fields.data.path }}" }'
                is_json: true
