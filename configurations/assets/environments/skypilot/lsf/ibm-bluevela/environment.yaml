name: sky-lsf
type: Skypilot
subtype: lsf
config:
  default_cloud: lsf
  # Env-level shared filesystem root for per-run build workdirs. gbserver
  # derives ${shared_workdir}/builds/<build_id>/runs/<targetrun_id>/ from this
  # (see skypilot.py:setup_skypilot), exports it as GB_BUILD_WORKDIR, and makes
  # it the CWD of both the setup and run scripts (falling back to $HOME when no
  # shared_workdir is configured). On bluevela this must be on /proj (the shared
  # network FS that is bind-mounted identity into the enroot container), so a
  # step's relative file_mounts destination — remapped under this dir — is
  # visible inside the container at the same relative path.
  shared_workdir: /proj/data-eng/llmb-read-write/builds/
  # SkyPilot's `zone` is overloaded per-cloud: for LSF it maps to the queue name
  # (e.g. `normal`, `preemptable`); recipes exposing a `QUEUE` param plumb it
  # through `zone`. Override layers + precedence:
  # docs/environments/skypilot-lsf.md#zone--lsf-queue.
  #
  # Autostop is omitted: gbserver forces autostop=None for the lsf cloud (LSF
  # does not support cluster autostop), so any value here has no effect.

  # Inline LSF cluster SSH reachability. gbserver materializes this into
  # ~/.lsf/config at launch so SkyPilot's LSF provisioner can reach the cluster
  # and enumerate its nodes. Each field is secret-name-or-literal (no matching
  # secret -> literal). If a ~/.lsf/config already exists on the host with a
  # bluevela entry, remove it first — gbserver refuses to overwrite foreign
  # entries (refuse-on-conflict). Testing a changed key? See the
  # GBTEST_SKY_SSH_RESET re-keying caveat in docs/environments/skypilot-lsf.md.
  #
  # MULTIPLE LOGIN NODES: `HostName` may be a single value OR (as below) a list of
  # interchangeable candidate login hostnames under one `Host` block. gbserver picks
  # one at random at launch (spreading load); all candidates share this block's
  # User/IdentityFile/etc. The candidates are also a failover pool: on a transient
  # SSH control-plane error during provisioning (late banner, wedged session,
  # key-exchange reset) gbserver rewrites ~/.lsf/config to the next candidate before
  # retrying the launch. Capacity failures and SSH auth rejections do not fail over.
  cluster_ssh_configs:
    lsf:
      - Host: bluevela
        # Candidate login nodes: gbserver picks one at random at launch and fails
        # over to the next on a transient SSH control-plane error during provisioning.
        HostName:
          - login3.bluevela.rmf.ibm.com
          - login4.bluevela.rmf.ibm.com
          - login5.bluevela.rmf.ibm.com
        User: granitebuild
        # Set GBTEST_SKY_SSH_RESET=true (env) when testing modified credentials.
        IdentityFile: ~/.ssh/ibm-bluevela.key
        #IdentityKey: BV_SSH_PRIVATE_KEY
        IdentitiesOnly: "yes"

  # Inline LSF behavioral config. gbserver deep-merges this into the API server's
  # ~/.sky/config.yaml at launch (see merge_cloud_config): the env's values win
  # and unrelated keys are preserved.
  cloud_config:
    lsf:
      allowed_clusters:
        - bluevela
      cluster_configs:
        bluevela:
          workdir: /proj/granite-build/g4os/skypilot
          tmpdir: /opt/nvme/$USER/skypilot-tmp
          enroot:
            enabled: true
            share_path: /proj/granite-build/g4os
            use_local_nvme: true
            squash_options: "-comp lz4 -Xhc -no-xattrs"
          nccl_tuning_file: /proj/granite-build/g4os/bv-nccl-tuning.sh
          enroot_mounts:
            - "/dev/shm /dev/shm"
            - "/dev/infiniband /dev/infiniband"
            # GPFS's own tools, read-only, for the weight-residency preflight
            # (steps/distill-*/src/check_weight_residency.py). Without them the
            # container has no mmlsattr and the preflight falls back to block-count
            # arithmetic, which can condemn a file but never clear one and misses a
            # partial recall. The script puts the lib/ beside the tool on
            # LD_LIBRARY_PATH itself; this mount alone fails to load libgpfs.so.
            # Measured on p3-r20-n3, 2026-09-25 (LSF job 1918919).
            - "/usr/lpp/mmfs /usr/lpp/mmfs none x-create=dir,rbind,ro"
          bsub_options:
            G: grp_granite_dot_build
            M: 64G
            # EXCLUDE BROKEN HOSTS. p2-r03-n1 accepts a GPU allocation and then
            # fails inside torch at cuda_init with "CUDA unknown error": 3 runs,
            # 3 failures (builds 7853d33b and b5f030cd), against 0 failures on
            # every other host across several hundred runs. In b5f030cd the same
            # distill-eval step succeeded on p3-r27-n2 and failed here two
            # minutes later. p5-r03-n1, p4-r31-n2 and p6-r06-n2 are excluded on
            # the same grounds. p5-r02-n1 is a CPU-only node with no /opt/nvme, so
            # the provisioner's `mkdir -p /opt/nvme/$USER` (tmpdir and
            # use_local_nvme above) exits 1 before the job starts: 8 of 8 attempts
            # there failed on builds f856247d and feeaaa3f, 2026-09-29, while the
            # same corpus-pin-check succeeded on p6-r12-n3. Each host is listed
            # TWICE, short name and FQDN (see below). DROP A HOST FROM THE LIST
            # once the node is repaired.
            #
            # -R is the one accumulating bsub flag (provision/lsf/instance.py:150),
            # so this is ANDed with the derived span[] requirement rather than
            # replacing it.
            #
            # Both spellings per host, because which one LSF matches on could
            # not be checked from here (no LSF client on the API server host) and
            # a name that matches no host makes the exclusion a silent no-op. If
            # a job still lands on an excluded host, the name form is what to
            # look at.
            # NO surrounding double quotes and NO spaces, both load-bearing.
            # sky/templates/lsf-ray.yml.j2:75 emits each bsub_options entry as
            # `{{key}}: "{{val}}"`, so a value carrying its own double quotes
            # produces `R: ""select[...]""` and the generated cluster YAML fails to
            # parse (ParserError; builds 8d5000fd and 1884d108 died there before any
            # job was submitted). And instance.py emits the directive UNQUOTED as
            # `#BSUB -R <val>`, so a space would end the argument early — hence `&&`
            # with no spaces around it, which LSF's select grammar accepts.
            R: "select[hname!='p2-r03-n1'&&hname!='p2-r03-n1.bluevela.rmf.ibm.com'&&hname!='p5-r03-n1'&&hname!='p5-r03-n1.bluevela.rmf.ibm.com'&&hname!='p4-r31-n2'&&hname!='p4-r31-n2.bluevela.rmf.ibm.com'&&hname!='p6-r06-n2'&&hname!='p6-r06-n2.bluevela.rmf.ibm.com'&&hname!='p5-r02-n1'&&hname!='p5-r02-n1.bluevela.rmf.ibm.com']"
          queue_configs:
            preemptable:
              bsub_options:
                G: grp_preemptable
assetstores:
  - store_uri: space://assetstores/hf
    pull:
      - mode: default
        config:
          cache_path: /tmp/hf_cache
    push:
      - mode: default
        config: {}
  # s3:// / cos:// — lets a recipe source a teacher/student model, dataset or
  # chat template from S3-compatible object storage instead of only /proj or
  # the Hub, via cosrclone (same mechanism the AWS and RunPod environments
  # already use). Credentials are the store's own defaults
  # (COS_ACCESS_KEY_ID / COS_SECRET_ACCESS_KEY, see
  # configurations/assets/assetstores/s3/store.yaml) resolved from the space's
  # secret manager, so nothing IBM-internal is required to use it.
  - store_uri: space://assetstores/s3/
    pull:
      - mode: default
        config: {}
    push:
      - mode: default
        config: {}
  # NOTE: mem:// (in-memory) store is no longer declared here — it is now
  # auto-registered for every environment by the base class
  # (Environment._register_default_memstore), so no per-environment entry is
  # needed. The rm-server/code-server service URL bindings consumed by the IFRL
  # trainer use mem:// to pass values (e.g. http://host:8000) verbatim, bypassing
  # the env:// filesystem-path normalisation that would mangle them.
