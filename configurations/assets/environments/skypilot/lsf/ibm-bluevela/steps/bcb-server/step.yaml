name: bcb-server
version: 1.0.0
type: SERVICE
config:
  workload:
    cwd: "."
  gb:
    mock: false
    step_contents_in_env: false
  bcb_server_config:
    port: 7860
outputs:
  optional:
    bcb_server_url:
      type: dataset

environment_configs:
  Skypilot:
    default_launcher: bcb-server
    launchers:
      bcb-server:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/oe-eval-bcb-lite-evaluator:0.01"
          resources:
            cpus: "8"
            memory: "100+"
          ports:
            - 7860
          run: |
            set -e
            BCB_PORT={{ config.bcb_server_config.port }}
            HOST=$(hostname -f)

            echo "=== BCB Lite Evaluator Server ==="
            echo "  Host: ${HOST}"
            echo "  Port: ${BCB_PORT}"
            echo "  URL:  http://${HOST}:${BCB_PORT}/evaluate/"

            # Emit the server URL as artifact so dependents can discover it
            echo "GB_ARTIFACT_ID:bcb_server_url GB_ARTIFACT_PATH:http://${HOST}:${BCB_PORT}/evaluate/"

            # Start the server (blocks until killed)
            echo "=== Starting BCB server ==="
            /prod.sh
    monitors:
      skypilot_monitor:
        # Artifact convention comes from the monitor library (space://monitors/skypilot);
        # a service overrides the retrieval profile to a startup window (scrape
        # only during bring-up, then stop) and appends its status banner. The
        # status and artifact lines are distinct, so ordering is irrelevant.
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(900) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('startup_window') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(15) }}"
            startup_window_seconds: "{{ config.log_retrieval_startup_window_seconds | default(120) }}"
          extra_event_configs:
          - event_type: WORKLOAD_STATUS_EVENT
            line_regex: "Starting BCB server"
            event_fields:
              - field_name: status
                field_value_template: "RUNNING"
