name: dpk
version: 1.0.0
type: exec
config:
  dpk_config:
    # ---- which DPK transform to run -------------------------------------------
    # A DPK transform short name, e.g. "tokenization2arrow", "pii_redactor",
    # "ededup". Two things are DERIVED from it, so a build never repeats them:
    #   module -> python -m dpk_<transform>.runtime
    #   pip    -> data-prep-toolkit-transforms[<transform with _ as ->]==<dpk_version>
    # Every DPK transform exposes dpk_<name>.runtime (a PythonTransformLauncher),
    # and data-prep-toolkit-transforms declares one pip extra per transform, so
    # both rules hold for any transform — including ones added upstream later,
    # with no change to this step.
    # Mutually exclusive with `command` below: set exactly one.
    transform: ""
    # DPK release installed for `transform`. Ignored when `image` is set (the
    # image already provides DPK) or when running a raw `command`.
    dpk_version: "1.1.8"
    # Transform flags, rendered in order as `--<key> '<value>'`.
    # Keys are the FULL flag name as DPK spells it, WITHOUT the leading dashes —
    # e.g. tkn_tokenizer, pii_redactor_entities. They are NOT derived from
    # `transform`: DPK's own flag prefix is an arbitrary abbreviation for ~40% of
    # transforms (dpk_tokenization uses tkn_, gopher_repetition_annotator uses
    # gra_, doc_quality uses docq_), so the step cannot infer them. See a
    # transform's DPK docs or `--help` for its flag names.
    # A `true` value renders as a bare `--<key>`; `false`/null is omitted.
    args: {}
    # Escape hatch for flags `args` cannot express: appended VERBATIM to the
    # transform's argv, after everything `args` rendered. Unquoted, so the remote
    # shell word-splits it — which is the point (it is how you pass a flag whose
    # value needs shell interpretation), and also why `args` stays the default:
    # a value containing spaces or quotes is yours to quote correctly here,
    # whereas `args` quotes it for you. Ignored in command mode.
    extra_args: ""
    # Names of a declared target input / output. The step turns these into the
    # transform's --data_local_config input_folder / output_folder. Both are
    # required in transform mode.
    #   input  -> read as $LLMB_INPUT_<input>  (the binding's staged path)
    #   output -> used as the LLMB_ARTIFACT_ID the step emits
    input: ""
    output: ""
    # Where the transform WRITES. OPTIONAL: empty (the default) means ./output in
    # the step's working directory, resolved to an absolute path at run time so
    # the emitted artifact marker is absolute.
    #
    # WHEN YOU MUST SET IT EXPLICITLY: when the declared output `uri` names a
    # path, it must match, because the step cannot derive it — declared output
    # URIs are not in the runtime render context (they reach static validation
    # only; see targetstep.py's _get_validation_context vs the runtime context of
    # bindings + run_metadata + setup_config). So:
    #   env:///shared/x  -> output_path: /shared/x   (shared FS; slurm/lsf, cross-node safe)
    #   s3://bucket/x    -> output_path: <local dir> (staged, then pushed by the assetstore)
    #
    # The default is safe ONLY for output the same target consumes or that an
    # assetstore pushes (e.g. s3://). It is NOT safe for a cross-target env://
    # handoff: the working directory is the per-run workdir
    # (${shared_workdir}/builds/<build_id>/runs/<targetrun_id>), which is keyed
    # per TARGET and `rm -rf`'d by teardown_skypilot when that target finishes —
    # so a downstream target would read a deleted directory. Give such an output
    # an explicit shared path (see USAGE.md, "Choosing the output URI").
    output_path: ""

    # ---- escape hatch: run an arbitrary command instead of a transform --------
    # A verbatim bash command, for work that is not a DPK transform — e.g. the
    # bundled src/validate_tokens.py. Injected as-is (like the byoc step's
    # `command`), with $LLMB_INPUT_<name> exported for every declared input.
    # Mutually exclusive with `transform`.
    command: ""

    # ---- overrides / extras --------------------------------------------------
    # Override the derived module (e.g. a transform whose runtime is not
    # dpk_<name>.runtime, or a *.ray.runtime variant).
    module: ""
    # Override the derived pip extra(s). Set to a non-empty list to replace it,
    # e.g. ["ray"], or to [] via `no_extras: true` for the few transforms that
    # declare no extra at all (noop, c4_annotator).
    extras: []
    no_extras: false
    # Additional pip requirements installed alongside the transform, e.g.
    # ["pyarrow"] for a command-mode script.
    packages: []
    pip_index_url: "https://pypi.org/simple"
    # Public container image to run in. Empty (the default) => run on the bare
    # launcher node, which is required on clusters without the Pyxis SPANK plugin
    # (the local Docker SLURM cluster from `make slurm-setup` has none). When set,
    # the venv/pip install is skipped entirely — the image must already provide
    # DPK. This is a RUNTIME choice rendered by Jinja, not an image this step
    # builds.
    image: ""
  compute_config:
    num_gpus_per_node: 0
    total_memory_per_node: "4Gi"

environment_configs:
  Skypilot:
    # No `subtypes:` restriction, so this step resolves on ALL FOUR SkyPilot
    # endpoints (slurm / kubernetes / aws / lsf) — they share the SkyPilot
    # launcher and the pure-python DPK runtime needs nothing endpoint-specific.
    default_launcher: dpk
    launchers:
      dpk:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          # Runtime Jinja: an empty image renders to "" (bare launcher node);
          # otherwise the public image is wrapped as SkyPilot `docker:<ref>`.
          image_id: '{{ ("docker:" ~ config.dpk_config.image) if config.dpk_config.image else "" }}'
          # Cloud-agnostic: the build supplies cpus/memory/accelerators via
          # config.launcher_config.resources.
          resources: {}
          # Bundled helpers (validate_tokens.py) land at ./src, relative to the
          # step's working directory — the same directory setup and run start in.
          # A relative file_mounts source resolves against the step's own asset
          # dir, which is the supported mechanism (the builtin `command` step has
          # no such dir, which is why a template cannot ship files this way).
          file_mounts:
            src: src
          # setup runs ONCE at cluster bring-up, so the dependency install is
          # paid once per cluster rather than once per step. The launcher also
          # prepends `hf download ...` here for any hf:// input binding.
          setup: |
            set -eu
            {%- if not config.dpk_config.image %}
            {%- set t = config.dpk_config.transform %}
            {%- set extras = config.dpk_config.extras if config.dpk_config.extras
                             else ([] if (config.dpk_config.no_extras or not t)
                                   else [t | replace("_", "-")]) %}
            {%- set dpk_req = ("data-prep-toolkit-transforms[" ~ extras | join(",") ~ "]==" ~ config.dpk_config.dpk_version)
                              if extras
                              else (("data-prep-toolkit-transforms==" ~ config.dpk_config.dpk_version) if t else "") %}
            # The dependency install is delegated to the bundled src/dpk_setup.sh
            # (file-mounted at ./src). Safe from `setup` because SkyPilot syncs
            # file mounts first: its stage order is PROVISION -> SYNC_WORKDIR ->
            # SYNC_FILE_MOUNTS -> SETUP -> PRE_EXEC -> EXEC. See that file's
            # header for the uv/UV_CACHE_DIR rationale, and dpk_run.sh's for why
            # the shell lives in scripts rather than inline.
            #
            # Jinja computes only the VALUES: the venv path, the index, and the
            # pip requirements, passed as real argv after `--` so a specifier
            # containing "[extra]" needs no shell re-quoting.
            bash ./src/dpk_setup.sh \
              --venv ./venv \
              --index-url '{{ config.dpk_config.pip_index_url }}' \
              --{% if dpk_req %} '{{ dpk_req }}'{% endif %}{% for p in config.dpk_config.packages %} '{{ p }}'{% endfor %}
            {%- endif %}
          # run starts in the same working directory as setup, so ./venv and
          # ./src are both relative.
          run: |
            set -euo pipefail
            {%- if not config.dpk_config.image %}
            . ./venv/bin/activate
            {%- endif %}
            # Every declared input is exported as $LLMB_INPUT_<name> holding its
            # staged local path, so a command never hardcodes or duplicates one.
            {%- for name, b in bindings.items() %}
            export LLMB_INPUT_{{ name }}='{{ b.binding.path }}'
            {%- endfor %}
            {%- if config.dpk_config.transform %}
            {%- set module = config.dpk_config.module if config.dpk_config.module
                             else ("dpk_" ~ config.dpk_config.transform ~ ".runtime") %}
            # Transform mode delegates the shell to the bundled src/dpk_run.sh
            # (file-mounted at ./src). Jinja's job here is only to compute VALUES;
            # the script creates and absolutizes the output dir, assembles DPK's
            # --data_local_config, and emits the artifact marker. See that file's
            # header for why the shell lives there rather than inline.
            #
            # An omitted output_path defaults to ./output in the step's working
            # directory; the script absolutizes whichever path it is given before
            # the marker is emitted, since the server consumes it off-node.
            #
            # Flags are passed as REAL ARGV after `--`, one Jinja-rendered
            # single-quoted word each, so the remote shell splits them exactly
            # once and the script forwards them untouched via "$@". An embedded
            # single quote is escaped as '"'"' because several DPK transforms take
            # python-literal values containing quotes (pii_redactor's
            # --pii_redactor_entities is ast.literal_eval'd, so it needs
            # "['PERSON','EMAIL_ADDRESS']" to reach python intact).
            # A `true` value renders as a bare flag; false/null are omitted.
            bash ./src/dpk_run.sh \
              --module '{{ module }}' \
              --input-path "$LLMB_INPUT_{{ config.dpk_config.input }}" \
              --output-path '{{ config.dpk_config.output_path if config.dpk_config.output_path else "./output" }}' \
              --artifact-id '{{ config.dpk_config.output }}' \
              --{% for k, v in config.dpk_config.args.items() %}{% if v is sameas true %} --{{ k }}{% elif v is not none and v is not sameas false %} --{{ k }} '{{ v | string | replace("'", "'\"'\"'") }}'{% endif %}{% endfor %}{% if config.dpk_config.extra_args %} {{ config.dpk_config.extra_args }}{% endif %}
            {%- else %}
            # Raw command mode: injected verbatim, like the byoc step. The command
            # is responsible for its own LLMB_ARTIFACT_ID/PATH marker(s):
            #   echo "LLMB_ARTIFACT_ID:<output-id> LLMB_ARTIFACT_PATH:<abs-path>"
            {{ config.dpk_config.command }}
            {%- endif %}
    monitors:
      # Standard artifact/status convention from the shipped monitor library.
      skypilot_monitor:
        ref: space://monitors/skypilot
