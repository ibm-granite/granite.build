name: tau
version: 0.1.0
# The granite-evals "tau" image family: τ³-bench domains, each run through the pinned
# tau2-bench harness (sierra-research/tau2-bench v1.0.1). `benchmark`
# selects which one; see `granite-evals list` for the current set. As of this writing:
#   tau3-airline            τ³-bench airline, pass@1 (50 tasks)
#   tau3-banking-knowledge   τ³-bench banking knowledge, pass@1
#   tau3-bench               τ³-bench Overall, pass@1 (avg of 3: the mean of airline,
#                            retail and telecom's per-domain pass@1, as the τ²-bench
#                            leaderboard's Overall)
#   tau3-retail              τ³-bench retail, pass@1 (114 tasks)
#   tau3-telecom             τ³-bench telecom, pass@1 (114 tasks)
#
# ONE STEP PER GRANITE_EVALS IMAGE FAMILY. Every steps/eval/*/ template has the same
# shape and differs only in `name`, the family's image env var, and its defaults.
# skypilot/test/test_step_template.py holds them to that. Recipes
# (recipes/evals/tau/...) choose which benchmarks a model family is scored on
# and set `benchmark` per target.
#
# THE CODE LIVES IN THIS REPO. The benchmark runtime is vendored under steps/eval/src
# (core + this family's modules) and baked into the family's image by
# the Dockerfile.gpu / Dockerfile.cpu in this family's directory (see
# steps/eval/Makefile). The image is chosen at run time from config.image.
# Nothing is cloned or mounted at launch.
#
# WHAT RUNS. `granite-evals run <benchmark>` serves model_path with vLLM inside the job;
# the served model is the tool-calling agent, an LLM user simulator plays the
# customer, and the harness's own evaluators grade each simulation (DB state, env
# assertions, actions, NL assertions via a judge). Writes one results.json
# (schema: granite_evals/results.py).
#
# PAID APIS. The user simulator (and retail's NL-assertion judge) default to
# aws/claude-sonnet-5 on a LiteLLM gateway, keyed by $EVAL_USER_API_KEY /
# $EVAL_JUDGE_API_KEY in the job env; every call is metered against
# $GRANITE_EVALS_SPEND_LEDGER / $GRANITE_EVALS_SPEND_BUDGET_USD. `user_model=self judge_model=self`
# uses the served model instead (smoke runs, no key).
#
# PHASES. So that no job holds an idle GPU, recipes run this step twice on one
# output_dir: phase generate on a GPU (vLLM + the model's work only) and phase score
# on CPU (grading, no vLLM; it refuses to generate). phase all does both in one job.
#
# CUSTOM, not EVAL: gbcommon's StepType has no EVAL member.
type: custom
config:
  # The benchmark id passed to `granite-evals run`. Required, e.g. "tau3-airline".
  # See `granite-evals list` for this family's benchmark ids.
  benchmark: ""
  # The granite-evals image for this benchmark family (`make image-tau` in
  # steps/eval), pinned by its tag; results.json records the versions inside.
  # Recipes set it once, as the GRANITE_EVALS_IMAGE_TAU parameter.
  image: ""
  # The checkpoint to score, as a LOCAL PATH (normally a distill-hf-export `hf_model`
  # or an hfpull binding). Required.
  model_path: ""
  # Name the model is served under; empty = basename of model_path.
  served_model_name: ""
  # Full output dir as given. Empty (the recipes' form): output_root composes
  # it as $output_root/$run_name/$benchmark, run_name empty = the model_path
  # basename (like served_model_name). Relative values -- output_dir itself or
  # an output_root so composed -- resolve against $GB_BUILD_WORKDIR. With
  # neither output_dir nor output_root set the run fails fast.
  output_dir: ""
  output_root: ""
  run_name: ""
  # SMOKE KNOB: score only the first N tasks of each domain (in the harness's task
  # order, so two smoke runs are comparable). Empty = all 278.
  limit: ""
  # Trials per task. Empty = benchmark default (1, pass^1). k > 1 reports pass^1
  # averaged over k trials plus pass^k in details.pass_at_k.
  repeats: ""
  # Simulations run concurrently (each one agent + one user-simulator conversation).
  workers: "16"
  # Task data: empty = data/tau2 of the tau2-bench commit pinned in granite-evals (baked
  # into the image). A local data dir, or dataset_revision = another tau2-bench commit,
  # overrides it.
  dataset: ""
  dataset_revision: ""
  # Space-separated key=value benchmark options passed as --option, e.g.
  # "user_model=self judge_model=self" (no paid API), "user_model=<id> user_base_url=<url>",
  # "temperature=0.6", "tasks=<regex>", or "agent=gold" (replay the reference actions:
  # checks data + environments + grading without a model; model_path may be "none").
  # The run script word-splits this on whitespace (no quoting), so neither key
  # nor value text can contain spaces.
  options: ""
  # all | generate | score. "generate" serves the model and saves its outputs
  # (generation.json, the granite_generation artifact); "score" serves nothing and
  # grades them on CPU in the same output_dir (results.json). Recipes run
  # generate on a GPU target and score on a CPU-only target bound to it.
  phase: "all"
  # vLLM.
  tensor_parallel_size: "1"
  gpu_memory_utilization: "0.9"
  max_model_len: ""
  # vLLM tool-call and reasoning parsers; "auto" detects them from the
  # checkpoint (its chat template / shipped *_parser.py), "" disables one.
  tool_call_parser: "auto"
  reasoning_parser: "auto"
  # Space-separated extra `vllm serve` arguments, each passed as --vllm-arg
  # (e.g. "--enable-prefix-caching --max-num-seqs=64"). Values containing
  # spaces are not supported, as in `options`.
  vllm_args: ""
  # An existing OpenAI-compatible endpoint (e.g. http://host:8000/v1): skips
  # starting vLLM in the job; served_model_name must name the model there.
  base_url: ""
  # Seed for the benchmark's own sampling (shuffles, subsets).
  seed: "0"
  # Unused: tau3-bench runs no sandboxes. Kept for the shared granite-* config contract.
  # A relative path resolves against $GB_BUILD_WORKDIR (per-build).
  sandbox_cache: ""
  # Empty leaves the image's HF cache default alone.
  hf_home: ""
  # Warm-cache mode: run with HF_HUB_OFFLINE=1 (HF_DATASETS_OFFLINE=1), so every
  # hub read -- datasets, and the model if model_path is a hub id -- resolves from
  # hf_home's cache instead of the hub. Warm the cache first (HF_TOKEN=... make -C
  # steps/eval prefetch HF_HOME=<same cache>; gated datasets need a token with
  # access granted): it fetches each pinned snapshot and prepares the
  # datasets.load_dataset configs the benchmarks request, which an offline
  # load_dataset needs. Data the cache lacks fails fast; steps/eval/README.md
  # ("The warm HF cache") lists what runs offline (not terminal-bench; lm-eval
  # bridge tasks only once prepared). Bind the model (hf://) or warm it too;
  # hf_offline without hf_home is refused.
  hf_offline: ""
outputs:
  optional:
    # phase all | score: the scored results.json.
    granite_results:
      type: dataset
    # phase generate: generation.json, which the score target binds to.
    granite_generation:
      type: dataset

# No named inputs: the model checkpoint arrives as the config string
# model_path, not a binding, and recipes bind ordering-only inputs (the score
# target's generation, whose name varies by recipe) only to order targets.
# Nothing is read through bindings; allow_unknown keeps every binding valid.
inputs:
  allow_unknown: true

environment_configs:
  Skypilot:
    default_launcher: granite
    launchers:
      granite:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: '{{ ("docker:" ~ config.image) if config.image else "" }}'
          resources: {}
          run: |
            set -e
            set -o pipefail
            {#- included from steps/eval/shared/output_dir.j2 -#}
            {#- granite_output_dir(config): the run-script block every granite-evals family
                template shares (steps/eval/<family>/skypilot): the HF cache and warm-cache
                env, the options read once as words (OPT_WORDS, never globbed), and the
                composed, created $OUTPUT_DIR. After an edit, re-run make publish-step in
                all eleven (CI's test_published_steps_match_their_templates.py fails until
                then). -#}
            {%- macro granite_output_dir(config) -%}
            {% if config.hf_home %}export HF_HOME="{{ config.hf_home }}"; mkdir -p "$HF_HOME"{% endif %}
            {% if config.hf_offline and not config.hf_home %}echo "granite: hf_offline needs hf_home pointing at a cache warmed by make -C steps/eval prefetch" >&2; exit 1{% endif %}
            {% if config.hf_offline %}export HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1  # warm-cache mode: hub reads hit HF_HOME's cache only, never the hub{% endif %}

            # options, split on whitespace (no quoting) and never glob-expanded: read -a
            # over a single-quoted word, not an unquoted for, so a * or ? in a value (a
            # tasks= pattern) stays literal here and in the harness call below.
            read -r -a OPT_WORDS <<< '{{ config.options | replace("'", "'\"'\"'") }}'

            OUTPUT_DIR="{{ config.output_dir }}"
            OUTPUT_ROOT="{{ config.output_root }}"
            RUN_NAME="{{ config.run_name }}"
            # run_name defaults to the model_path basename (the same defaulting as
            # served_model_name), so one output_root serves every model.
            if [ -z "$RUN_NAME" ]; then RUN_NAME="$(basename "{{ config.model_path }}")"; fi
            # The generic bridges run many benchmarks through one id, so a run that
            # selects (a selection option, or a dataset-pinned bridge's dataset) gets
            # its own dir, named after EVERY selection value, so two runs that select
            # differently never share a dir (results.json would overwrite):
            #   <id>@<key>=<value>[@<key>=<value>...]
            # in a fixed key order (the dataset pin first, then the options below),
            # e.g. lm-eval@tasks=hellaswag, tau3@domains=airline,retail,
            # mcpmark@service=filesystem@task_suite=easy. The @ keeps it apart from
            # every curated id's dir (no id has one), so a bridge run never lands in a
            # curated recipe's dir. A repeated key takes its last value, as the harness
            # reads it. Each value is escaped into ONE path segment: [A-Za-z0-9._,-]
            # stay, any other byte becomes ~XX (hex; a / is ~2F, a * ~2A, ~ itself
            # ~7E), so distinct values stay distinct; no %, which URI handling could
            # decode. A name over 200 bytes keeps its first 180 and appends ~h and 16
            # hex of its sha256. With no selection the dir is the benchmark id, as for
            # every curated benchmark.
            granite_enc() {
              # byte by byte (LC_ALL=C); no length expansions, whose brace-hash would
              # open a Jinja comment in this template
              local LC_ALL=C s="$1" out="" c
              while [ -n "$s" ]; do
                c="${s:0:1}"; s="${s:1}"
                case "$c" in
                  [A-Za-z0-9._,-]) out="$out$c" ;;
                  *) printf -v c '%d' "'$c"; out="$out$(printf '~%02X' $((c & 255)))" ;;
                esac
              done
              printf '%s' "$out"
            }
            SEL=""
            {% if config.dataset and config.benchmark in ("swebench", "terminal-bench", "nemoskills") %}
            SEL="@dataset=$(granite_enc "{{ config.dataset }}")@dataset_revision=$(granite_enc "{{ config.dataset_revision }}")"
            {% endif %}
            for key in benchmark service task_suite domains categories tasks exclude instances split; do
              found=""
              for kv in "${OPT_WORDS[@]}"; do
                case "$kv" in "$key"=*) found=1; val="${kv#*=}" ;; esac
              done
              if [ -n "$found" ]; then SEL="$SEL@$key=$(granite_enc "$val")"; fi
            done
            BENCH_DIR="$BENCHMARK$SEL"
            if [ "$(printf '%s' "$BENCH_DIR" | wc -c)" -gt 200 ]; then
              h="$(printf '%s' "$BENCH_DIR" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-16)"
              BENCH_DIR="${BENCH_DIR:0:180}~h$h"
            fi
            # Either a full output_dir, or output_root composed per benchmark; with
            # neither set, fail here rather than deep inside a harness.
            if [ -z "$OUTPUT_DIR" ]; then
              if [ -z "$OUTPUT_ROOT" ]; then
                echo "granite: set output_root (the run writes \$OUTPUT_ROOT/\$RUN_NAME/\$BENCH_DIR) or output_dir" >&2
                exit 1
              fi
              OUTPUT_DIR="$OUTPUT_ROOT/$RUN_NAME/$BENCH_DIR"
            fi
            case "$OUTPUT_DIR" in /*) ;; *) OUTPUT_DIR="${GB_BUILD_WORKDIR:-$PWD}/$OUTPUT_DIR" ;; esac
            mkdir -p "$OUTPUT_DIR"
            {%- endmacro %}
            BENCHMARK="{{ config.benchmark }}"
            echo "=== granite $BENCHMARK on $(hostname) ==="
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
            # vLLM refuses to start inside an initialised torch.distributed env.
            unset RANK WORLD_SIZE LOCAL_RANK MASTER_ADDR MASTER_PORT
            # SLURM's pyxis/enroot injects the NVIDIA driver libraries at launch, after the image
            # is built, so the image's ld.so cache has no libcuda.so and Triton/torch.compile
            # fail with "libcuda.so cannot found!". Refreshing the cache is a per-step runtime
            # job (no image can do it; pyxis bypasses ENTRYPOINT). Harmless where it is not needed.
            ldconfig 2>/dev/null || true
            # The image's ENV PATH can be lost when a provider flattens enroot's
            # layers in reverse order, so enroot's layer 0 (/etc/environment) ends up
            # under the base image's (seen on LSF; belt-and-braces under SLURM). The
            # venv path is fixed by the image.
            export PATH="/opt/granite-evals/.venv/bin:$PATH"
            command -v granite-evals >/dev/null || { echo "granite: granite-evals not on PATH; is config.image set to a granite-evals image?"; exit 1; }
            test -n "{{ config.model_path }}" || { echo "granite: config.model_path is required"; exit 1; }

            {{ granite_output_dir(config) }}

            {% if config.sandbox_cache %}
            # Sandboxes: enroot inside this job's container. Image squashfs files go to
            # the cache; the per-sandbox rootfs goes to node-local scratch. A relative
            # cache path resolves against $GB_BUILD_WORKDIR (the output_dir rule), so
            # no step needs a cluster-specific absolute path.
            export GRANITE_EVALS_SANDBOX=enroot
            SANDBOX_CACHE="{{ config.sandbox_cache }}"
            case "$SANDBOX_CACHE" in /*) ;; *) SANDBOX_CACHE="${GB_BUILD_WORKDIR:-$PWD}/$SANDBOX_CACHE" ;; esac
            export GRANITE_EVALS_ENROOT_CACHE="$SANDBOX_CACHE"
            SCRATCH="${TMPDIR:-/tmp}/granite-$$"
            export ENROOT_DATA_PATH="$SCRATCH/enroot-data" ENROOT_CACHE_PATH="$SCRATCH/enroot-cache" ENROOT_RUNTIME_PATH="$SCRATCH/enroot-run" ENROOT_TEMP_PATH="$SCRATCH/enroot-tmp"
            mkdir -p "$GRANITE_EVALS_ENROOT_CACHE" "$ENROOT_DATA_PATH" "$ENROOT_CACHE_PATH" "$ENROOT_RUNTIME_PATH" "$ENROOT_TEMP_PATH"
            # Nested enroot bind-mounts this job's cgroup path into each sandbox; SLURM's
            # step cgroup path carries ../.. segments that do not exist lexically, so the
            # enroot cgroup mount fails until the resolved source directory exists. Create
            # it (validated as probe6, SLURM job 432842: REPRO_EXIT=1 -> FIX_EXIT=0).
            CG=$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)
            LEX=$(readlink -m "/sys/fs/cgroup/$CG")
            mkdir -p "$LEX" 2>/dev/null || true
            trap 'rm -rf "$SCRATCH"' EXIT
            {% endif %}

            OPTS=()
            for kv in "${OPT_WORDS[@]}"; do OPTS+=(--option "$kv"); done
            VLLM_ARGS=()
            for a in {{ config.vllm_args }}; do VLLM_ARGS+=(--vllm-arg="$a"); done

            granite-evals run "$BENCHMARK" \
              --model "{{ config.model_path }}" \
              --output-dir "$OUTPUT_DIR" \
              {% if config.served_model_name %}--served-model-name "{{ config.served_model_name }}"{% endif %} \
              {% if config.limit %}--limit {{ config.limit }}{% endif %} \
              {% if config.repeats %}--repeats {{ config.repeats }}{% endif %} \
              --workers {{ config.workers }} \
              {% if config.dataset %}--dataset "{{ config.dataset }}"{% endif %} \
              {% if config.dataset_revision %}--dataset-revision "{{ config.dataset_revision }}"{% endif %} \
              --tensor-parallel-size {{ config.tensor_parallel_size }} \
              --gpu-memory-utilization "{{ config.gpu_memory_utilization }}" \
              --phase "{{ config.phase }}" \
              {% if config.max_model_len %}--max-model-len {{ config.max_model_len }}{% endif %} \
              --tool-call-parser "{{ config.tool_call_parser }}" \
              --reasoning-parser "{{ config.reasoning_parser }}" \
              {% if config.base_url %}--base-url "{{ config.base_url }}"{% endif %} \
              --seed {{ config.seed }} \
              "${VLLM_ARGS[@]}" \
              "${OPTS[@]}" \
              2>&1 | tee "$OUTPUT_DIR/granite.log"
            if [ "{{ config.phase }}" = generate ]; then
              RESULT_FILE="$OUTPUT_DIR/generation.json"
              test -s "$RESULT_FILE" || { echo "granite: no $RESULT_FILE"; exit 1; }
              echo "GB_ARTIFACT_ID:granite_generation GB_ARTIFACT_PATH:${RESULT_FILE}"
            else
              RESULT_FILE="$OUTPUT_DIR/results.json"
              test -s "$RESULT_FILE" || { echo "granite: no $RESULT_FILE"; exit 1; }
              echo "GB_ARTIFACT_ID:granite_results GB_ARTIFACT_PATH:${RESULT_FILE}"
            fi
    monitors:
      skypilot_monitor:
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(900) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(900) }}"
          extra_event_configs:
            - event_type: WORKLOAD_STATUS_EVENT
              line_regex: "(vLLM ready at|granite-evals: {{ config.benchmark }} =|granite-evals: \\S+ generated)"
              event_fields:
                - field_name: status
                  field_value_template: "RUNNING"
                - field_name: message
                  field_regex: ".+"
