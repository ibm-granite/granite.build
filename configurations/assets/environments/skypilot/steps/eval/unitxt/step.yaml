name: unitxt
version: 1.0.0
# Runs a unitxt evaluation of the bound `model` input with the `unitxt-evaluate` CLI
# (`--model hf`, a local Hugging Face checkpoint) and registers its output directory
# as an artifact. The CLI is used as a black box: the step installs unitxt and the
# packages its hf mode needs, passes the configured arguments through, and registers
# what the CLI wrote.
#
# `custom` rather than EVAL: there is no EVAL member in StepType (see bfcl-eval's
# step-template.yaml for the longer note).
type: custom
config:
  unitxt_config:
    # unitxt task(s), passed as --tasks. A catalog recipe such as
    # "card=cards.mmlu_pro.engineering", a benchmark such as "benchmarks.tool_calling",
    # or several joined with "+". REQUIRED.
    tasks: ""
    # Extra --model_args, as comma-separated key=value pairs (e.g.
    # "torch_dtype=bfloat16,device=cuda"). The step always passes
    # pretrained=<the bound `model` input> first and appends these, so they must not
    # name `pretrained` themselves, and the JSON form of --model_args is not accepted.
    model_args: ""
    # Passed as --batch_size (inference batch size for hf).
    batch_size: 1
    # Instances per task, passed as --limit. 0 (the default) passes no --limit, so
    # every instance is evaluated.
    limit: 0
    # Directory the CLI writes into (--output_path), registered as the `results`
    # artifact. Relative paths resolve in the step's working directory.
    output_path: "output"
    # Passes --trust_remote_code. Catalog cards that filter their HF dataset with a
    # code expression (cards.mmlu_pro.* among them) refuse to load without it.
    trust_remote_code: true
    # unitxt release installed in setup. Ignored when `unitxt_image` is set.
    unitxt_version: "1.26.10"
    # hf mode needs torch, which unitxt does not depend on. It is installed on its
    # own, BEFORE everything else, so it can come from a different index: set
    # torch_index_url to a PyTorch wheel index to pick the build, e.g.
    # https://download.pytorch.org/whl/cpu on a CPU-only node or .../whl/cu128 to
    # match a node's CUDA driver. Empty => pip_index_url (PyPI's default Linux
    # wheel, which bundles CUDA). Pin the version in torch_package, e.g.
    # "torch==2.8.0". Ignored when `unitxt_image` is set.
    torch_package: "torch"
    torch_index_url: ""
    # Installed with unitxt, after torch, from pip_index_url: hf mode also needs
    # transformers and accelerate, and the CLI's score summary needs tabulate. The
    # torch already installed satisfies their torch requirement, so it is kept.
    # Ignored when `unitxt_image` is set.
    hf_packages: ["transformers", "accelerate", "tabulate"]
    pip_index_url: "https://pypi.org/simple"
    # Container image that already provides unitxt-evaluate, torch and hf_packages. Setting
    # it skips the venv and install entirely (dpk's `dpk_image` pattern). Empty =>
    # bare node.
    unitxt_image: ""
  # GPUs are not read from here: request them in the build's
  # launcher_config.resources (e.g. accelerators: "A10G:1"). Memory is the floor
  # for loading the checkpoint on cloud catalogs (ignored on slurm/lsf).
  compute_config:
    num_gpus_per_node: 0
    total_memory_per_node: "16Gi"

# I/O schema, validated against the build.yaml target at build time: a target that
# does not bind `model` fails validation before anything is queued. The run block
# reads it as {{ bindings.model.binding.path }}; for an hf:// URI the SkyPilot
# launcher downloads it into that path ahead of setup. allow_unknown stays true so a
# recipe can bind extra inputs purely to order targets.
inputs:
  allow_unknown: true
  required:
    model:
      type: model
      accept: [uri, binding]
outputs:
  optional:
    results:
      type: dataset

environment_configs:
  Skypilot:
    # No `subtypes:` restriction: resolves on all four SkyPilot endpoints.
    default_launcher: unitxt
    launchers:
      unitxt:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          # Not shell-escaped: passed to sky.Resources(image_id=...) as a python
          # value, never through a shell (same as dpk).
          image_id: '{{ ("docker:" ~ config.unitxt_config.unitxt_image) if config.unitxt_config.unitxt_image else "" }}'
          # Cloud-agnostic: the build supplies cpus/memory/accelerators via
          # config.launcher_config.resources.
          resources: {}
          setup: |
            set -eu
            {#- Shell-quote escaping for author-supplied values. Jinja macros are
                block-scoped, so `run` carries its own identical copy. #}
            {%- macro q(v) -%}
            {{ v | string | replace("'", "'\"'\"'") }}
            {%- endmacro %}
            {%- if not config.unitxt_config.unitxt_image %}
            # Install unitxt into a venv with uv, as dpk does. --break-system-packages
            # is needed on PEP 668 interpreters; older pip lacks it, so fall back.
            if ! pip install --quiet --no-cache-dir --break-system-packages uv 2>/dev/null; then
              pip install --quiet --no-cache-dir uv
            fi
            # The launcher starts setup in $GB_BUILD_WORKDIR, so the cache stays inside
            # the build's own workdir. (Not $GB_SHARED_WORKDIR, as dpk uses: sharing it
            # across builds is a possible optimization, deferred so the step does not
            # write outside its build.)
            export UV_CACHE_DIR="$PWD/.uv-cache"
            uv venv ./venv
            . ./venv/bin/activate
            uv pip install --index-url '{{ q(config.unitxt_config.torch_index_url or config.unitxt_config.pip_index_url) }}' \
              '{{ q(config.unitxt_config.torch_package) }}'
            uv pip install --index-url '{{ q(config.unitxt_config.pip_index_url) }}' \
              'unitxt=={{ q(config.unitxt_config.unitxt_version) }}'
              {%- for pkg in config.unitxt_config.hf_packages %} '{{ q(pkg) }}'{% endfor %}
            {%- endif %}
          # run starts in the same working directory as setup, so ./venv is relative.
          run: |
            set -euo pipefail
            {%- macro q(v) -%}
            {{ v | string | replace("'", "'\"'\"'") }}
            {%- endmacro %}
            {%- if config.unitxt_config.model is defined %}
            # The model used to be named in config (`model` + `model_args`). It is now
            # the bound `model` input, so refuse the old key rather than ignore it.
            echo "eval/unitxt: ERROR unitxt_config.model is no longer read; bind the target's 'model' input instead (see USAGE.md)." >&2
            exit 1
            {%- endif %}
            {%- if not config.unitxt_config.unitxt_image %}
            . ./venv/bin/activate
            {%- endif %}
            TASKS='{{ q(config.unitxt_config.tasks) }}'
            MODEL_PATH='{{ q(bindings.model.binding.path) }}'
            EXTRA_ARGS='{{ q(config.unitxt_config.model_args) }}'
            if [ -z "$TASKS" ]; then
              echo "eval/unitxt: ERROR unitxt_config.tasks is required." >&2; exit 1
            fi
            case "$EXTRA_ARGS" in
              *pretrained*)
                echo "eval/unitxt: ERROR unitxt_config.model_args must not set pretrained; the step passes the bound 'model' input." >&2; exit 1 ;;
              "{"*)
                echo "eval/unitxt: ERROR unitxt_config.model_args must be key=value pairs, not JSON." >&2; exit 1 ;;
            esac
            MODEL_ARGS="pretrained=${MODEL_PATH}${EXTRA_ARGS:+,$EXTRA_ARGS}"
            OUTPUT_DIR='{{ q(config.unitxt_config.output_path) }}'
            mkdir -p "$OUTPUT_DIR"
            # Absolute, because the server reads the artifact marker off-node.
            OUTPUT_DIR="$(cd "$OUTPUT_DIR" && pwd)"
            unitxt-evaluate \
              --tasks "$TASKS" \
              --model hf \
              --model_args "$MODEL_ARGS" \
              --batch_size '{{ q(config.unitxt_config.batch_size) }}' \
              {%- if config.unitxt_config.trust_remote_code %}
              --trust_remote_code \
              {%- endif %}
              {%- if config.unitxt_config.limit %}
              --limit '{{ q(config.unitxt_config.limit) }}' \
              {%- endif %}
              --output_path "$OUTPUT_DIR"
            # Must start the line for skypilot_monitor's regex to capture it.
            echo "GB_ARTIFACT_ID:results GB_ARTIFACT_PATH:${OUTPUT_DIR}"
    monitors:
      # Standard artifact/status convention from the shipped monitor library.
      skypilot_monitor:
        ref: space://monitors/skypilot
