######
# gen-smoke — does the model still write text?
#
# Greedy-decodes eight raw prompts from each exported checkpoint and reports, per rung,
# the fraction of generated lines inside a run of >= 3 identical lines. Was an inline
# `command` target in four granite4-350m recipes. The detector and the measurements
# behind its threshold live in src/gen_smoke.py; this file only passes the configuration
# through.
#
# Needs torch + transformers (present in the kd-sandbox image's venv) and one GPU, but
# no trainer source, which is why it carries none of the distill-* steps' code_config /
# source-delivery contract.
######
name: gen-smoke
version: 1.0.0
type: custom
config:
  gen_smoke_config:
    # One "<step>:<hf_model_dir>" entry per rung, in ladder order. The LAST entry is the
    # one gate_final_rung judges.
    rungs: []
    # A rung is degenerate when its mean looped fraction exceeds this.
    max_repetition: 0.15
    new_tokens: 256
    # true: fail the target when the final rung is degenerate. false: report only, for
    # a recipe whose job is to measure a whole ladder without acting on any of it.
    gate_final_rung: true
    # Where repetition.json is written. A relative path lands under GB_BUILD_WORKDIR.
    output_dir: "gen-smoke"

# No named inputs, by design: gen_smoke_config.rungs is a variable-length list, one
# entry per exported checkpoint, so there is no fixed set of input names to declare.
# Recipes bind each export (e.g. `export_<N>`) purely to order this target after it;
# allow_unknown keeps those valid.
inputs:
  allow_unknown: true

outputs:
  required:
    repetition_report:
      type: fileset

environment_configs:
  Skypilot:
    subtypes:
      - lsf
      - slurm
    default_launcher: gen_smoke
    launchers:
      gen_smoke:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/gb-step-distillation-gpu:e9501415"
          # Cloud-agnostic: the build supplies the GPU, cpus and memory via
          # config.compute_config and config.launcher_config.resources.
          resources: {}
          envs:
            # The SLURM executor runs the task under `env -u PYTHONPATH` and without
            # VIRTUAL_ENV, so the image's ENV values for both are gone at run time.
            PYTHONPATH: /opt/distill/src
            VIRTUAL_ENV: /stage/.venv
            HF_HUB_OFFLINE: "1"
          # The rungs go into an array, one append per entry, and NOT into a
          # backslash-continued argument list. Jinja block tags are not trimmed here, so
          # every one of them leaves a blank line where it stood, and a blank line after
          # a `\` ends the command -- bash then runs the next rung as a program name.
          # That is build bb779f1f: `line 26: 500:/proj/.../export-500: No such file or
          # directory`, python reached with no rungs, and `bash -n` green throughout,
          # because `500:/path` is a valid command. Blank lines BETWEEN array appends
          # are inert, which is the whole point.
          run: |
            set -euo pipefail
            echo "=== gen-smoke on $(hostname) ==="
            WORK="${GB_BUILD_WORKDIR:-$PWD}"
            OUT_DIR="{{ config.gen_smoke_config.output_dir }}"
            case "$OUT_DIR" in /*) ;; *) OUT_DIR="$WORK/$OUT_DIR" ;; esac
            mkdir -p "$OUT_DIR"

            # GPU visibility normalization -- same guard as distill/gold and
            # distill/eval (see gold's step-template for the full analysis):
            # inside a pyxis/enroot container only the allocated GPUs are
            # mounted and CUDA renumbers them 0..N-1, so a CUDA_VISIBLE_DEVICES
            # mask written against a different view of the node is invalid
            # here, and torch silently drops every entry from the first
            # out-of-range ordinal on -- the smoke generation then silently
            # runs on fewer GPUs than requested. Only rewrite when the value
            # cannot be valid in this container: empty, or a numeric ordinal
            # at or beyond the mounted-GPU count (UUID/MIG entries are valid
            # as-is; a shorter subset mask is a legitimate partial bind).
            # Unset is safe because the mounted /dev/nvidia* set IS the
            # allocation.
            echo "gen-smoke: container CUDA_VISIBLE_DEVICES='${CUDA_VISIBLE_DEVICES:-<unset>}'"
            if [ "${CUDA_VISIBLE_DEVICES+set}" = set ]; then
              # The || true differs from the other steps' guard on purpose:
              # this script runs set -euo pipefail, and ls/grep exit nonzero
              # on no match -- wc's count (0) and the empty MAX_ORD are the
              # answers we want, not failures.
              N_GPU="$(ls /dev/nvidia[0-9]* 2>/dev/null | wc -l || true)"
              MAX_ORD="$(printf '%s\n' "$CUDA_VISIBLE_DEVICES" | tr ',' '\n' | tr -d '[:space:]' | grep -xE '[0-9]+' | sort -n | tail -n 1 || true)"
              if [ "$N_GPU" -gt 0 ] && { [ -z "$CUDA_VISIBLE_DEVICES" ] || { [ -n "$MAX_ORD" ] && [ "$MAX_ORD" -ge "$N_GPU" ]; }; }; then
                echo "gen-smoke: CUDA_VISIBLE_DEVICES='$CUDA_VISIBLE_DEVICES' is invalid inside the container ($N_GPU GPU(s) mounted, ordinals 0..$((N_GPU-1))); unsetting so CUDA exposes the mounted -- allocated -- set"
                unset CUDA_VISIBLE_DEVICES
              fi
            fi
            RUNGS=()
            {% for rung in config.gen_smoke_config.rungs %}
            RUNGS+=("{{ rung }}")
            {% endfor %}
            python "$DISTILL_HOME/steps/gen-smoke/gen_smoke.py" \
              "$OUT_DIR/repetition.json" \
              "{{ config.gen_smoke_config.max_repetition }}" \
              "{{ config.gen_smoke_config.new_tokens }}" \
              "{{ 'true' if config.gen_smoke_config.gate_final_rung else 'false' }}" \
              "${RUNGS[@]}"
    monitors:
      skypilot_monitor:
        ref: space://monitors/skypilot
