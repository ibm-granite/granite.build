name: skypilot-teardown
version: 1.0.0
type: custom
config:
  workload:
    cwd: "."
  gb:
    mock: false
    step_contents_in_env: false
  teardown_config:
    # Cluster names are filled from upstream cluster_name bindings in build.yaml.
    cluster_names: []

# No named inputs: teardown_config.cluster_names is a variable-length list of
# cluster names (each typically a server target's mem:// `cluster_name`, rendered
# as {{ bindings.<name>.binding.state }} in the recipe), read by the skypilot_teardown
# launcher in Python. Recipes also bind the consumer's output (e.g. `trained`) purely
# to gate the teardown; allow_unknown keeps those valid.
inputs:
  allow_unknown: true

environment_configs:
  Skypilot:
    default_launcher: teardown
    launchers:
      teardown:
        # Selects Skypilot.launch_skypilot_teardown, an in-process launcher that
        # downs the clusters named in config.teardown_config.cluster_names. It
        # provisions nothing and declares no monitors, so the step completes as
        # soon as the launch coroutine returns.
        type: skypilot_teardown
        config: {}
