name: docker-image-hf
type: Docker
config:
  defaults:
    pull_policy: "if-not-present"
    env: {}
assetstores:
  - store_uri: space://assetstores/hf/
    pull:
      - mode: default
    push:
      - mode: default
  # Local filesystem — push artifacts via file: URIs (builtin file store).
  # Docker implements file: push only (no pullasset_filestore), so no load mode.
  - store_uri: space://assetstores/file/
    push:
      - mode: default
