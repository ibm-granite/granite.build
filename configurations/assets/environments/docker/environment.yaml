name: docker-image-hf
type: Docker
config:
  defaults:
    pull_policy: "if-not-present"
    env: {}
assetstores:
  - store_uri: space://assetstores/hf/
    load:
      - mode: default
    push:
      - mode: default
  # file: URIs are handled by the implicitly-registered builtin file store
  # (see Environment._register_default_filestore) — no entry required here.
