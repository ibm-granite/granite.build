name: autotune
version: v1
type: custom
# No `config.bash.skip_finding_output_artifacts` here: that key is read only by the
# gbstep bash/lsf wrapper templates, and the Docker environment never scans the
# output dir for artifacts, so run.py's GB_ARTIFACT_ID marker is the only source.
config: {}

inputs:
  allow_unknown: true
  required:
    model:
      type: model
      accept: [uri, binding]
    dataset_files:
      type: dataset
      accept: [uri, binding]
  optional:
    hpo_config:
      type: fileset
      accept: [uri, binding]
outputs:
  allow_unknown: true
  optional:
    custom:
      type: model

environment_configs:
  Docker:
    launchers:
      autotune:
        type: docker
        monitors:
          - docker_log
        config:
          # No `image:` here on purpose. Docker._resolve_image checks launcher_config
          # FIRST and only then config.docker.image, so pinning an image here would
          # make it impossible to override per build. Supply the fm-tune runtime
          # image (CUDA + deps + fm-tune baked in) via `config.docker.image`.
          #
          # The step asset dir is bind-mounted at /gb-workspace (docs/environments/docker.md).
          command: "bash /gb-workspace/bash_scripts/autotune/command.sh"
          # NOTE: launcher env WINS over config.docker.env (Docker.get_launch_env_vars
          # merges config.docker.env first, then updates with launcher env) — the
          # inverse of the Bash environment. So only values that are intrinsic to
          # running this step in a container belong here; anything a build should be
          # able to tune (BACKEND, FM_TUNE_ROOT, …) must stay out.
          env:
            # Docker does NOT auto-export inputs — wire resolved bindings explicitly.
            LLMB_BASH_INPUT_MODEL: "{{ bindings.model.binding.path }}"
            LLMB_BASH_INPUT_DATASET_FILES: "{{ bindings.dataset_files.binding.path }}"
            # Optional input: guarded so an unbound hpo_config does not raise under
            # the step dir's strict=True render. command.sh treats empty as unset.
            LLMB_BASH_INPUT_HPO_CONFIG: "{{ bindings.hpo_config.binding.path if bindings is defined and bindings.hpo_config is defined and bindings.hpo_config.binding is defined else '' }}"
            LLMB_BASH_OUTPUT_DIR: "/gb-workspace/output"
            # Deps are prebaked in the image — do not build a venv.
            BASH_BUILD_VENV: "false"
            # BACKEND is deliberately absent: run.py already defaults to torch, and
            # setting it here would make `config.docker.env: BACKEND: mlx` a no-op.
            # FM_TUNE_ROOT (the image's fm-tune checkout) likewise comes from the
            # build via config.docker.env.
    monitors:
      docker_log:
        ref: space://monitors/docker
