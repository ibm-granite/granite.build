name: slurm-local
type: Skypilot
config:
  default_cloud: slurm
  idle_minutes_to_autostop: 0
  # Inline cluster SSH config — gbserver materializes this into ~/.slurm/config
  # at launch time (setup-slurm.sh no longer writes it). The referenced key is
  # generated on the host by `make slurm-setup`.
  cluster_ssh_configs:
    slurm:
      - host: slurm-docker
        hostname: 127.0.0.1
        user: root
        port: 2222
        identity_file: ~/.ssh/slurm_docker_key
        options:
          StrictHostKeyChecking: "no"
          UserKnownHostsFile: /dev/null
assetstores:
  - store_uri: space://assetstores/hf/
    load:
      - mode: hf_pull
  - store_uri: space://assetstores/cos/
    push:
      - mode: default
        config:
          step_uri: space://steps/s3push
