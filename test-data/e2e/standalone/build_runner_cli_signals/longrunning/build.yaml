granite.build:
  name: bash-cli-longrunning
  # Long-running 1-step bash build used by the gbserver build-runner CLI e2e test
  # (test/e2e/standalone/test_build_runner_cli_signals.py). The command sleeps so
  # the build stays RUNNING long enough for the test to deliver SIGINT/SIGTERM and
  # observe the resulting CANCELLED / FAILED terminal status.
  targets:
    sleep-target:
      allow_unknown: true
      environment_uri: space://environments/bash
      steps:
        # General-purpose bash `command` step runs an arbitrary shell command.
        - step_uri: space://steps/command
          config:
            command_config:
              command: "sleep 60"
            compute_config:
              num_nodes: 1
