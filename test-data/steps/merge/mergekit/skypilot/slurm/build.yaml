granite.build:
  name: skypilot-slurm-mergekit
  # MergeKit's examples/gradient-slerp.yml, scaled to a public 135M base / instruct pair
  # (HuggingFaceTB/SmolLM2-135M and -Instruct: Llama architecture, 30 layers, Apache-2.0,
  # not gated, so no HF_TOKEN). Same shape as the example: `slices` with both models
  # over every layer, `base_model`, and a per-filter `t` gradient. Measured on an M5
  # Max with mergekit 0.1.5: 2-4 s, 1.25 GB peak RSS, 259 MB output, and the merged
  # model still answers "The capital of France is" with " Paris.".
  #
  # Both models come in as step inputs (one hfpull each) and the recipe names them by
  # input name, so the run exercises the substitution in slices[].sources[].model and
  # base_model. The merged model goes to the cluster's shared filesystem (/shared),
  # as fm-tune's slurm fixture does.
  #
  # Memory: no launcher_config.resources.memory here. On the local Docker SLURM cluster,
  # memory is not scheduled (SelectTypeParameters=CR_CORE) or enforced
  # (ConstrainRAMSpace=no), and the nodes advertise RealMemory=1024, so asking for more
  # than 1G is refused at scheduling ("Memory specification can not be satisfied"),
  # while a job that asks for nothing can use the ~6 GB the node has free.
  targets:
    merge:
      environment_uri: space://environments/skypilot/slurm/local
      inputs:
        model_1:
          uri: hf:///HuggingFaceTB/SmolLM2-135M-Instruct
        base_model:
          uri: hf:///HuggingFaceTB/SmolLM2-135M
      outputs:
        model:
          # env:// moves no bytes, so no push step runs. The path must equal
          # mergekit_config.output_path below.
          uri: "env:///shared/mergekit-test/slurm/model"
          type: model
      steps:
        - step_uri: space://steps/merge/mergekit
          config:
            poll_interval_seconds: 5
            mergekit_config:
              output_path: /shared/mergekit-test/slurm/model
              merge_config:
                slices:
                  - sources:
                      - model: base_model
                        layer_range: [0, 30]
                      - model: model_1
                        layer_range: [0, 30]
                merge_method: slerp
                base_model: base_model
                parameters:
                  t:
                    - filter: self_attn
                      value: [0, 0.5, 0.3, 0.7, 1]
                    - filter: mlp
                      value: [1, 0.5, 0.7, 0.3, 0]
                    - value: 0.5
                dtype: bfloat16
