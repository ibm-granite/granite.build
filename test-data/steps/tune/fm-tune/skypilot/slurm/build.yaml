granite.build:
  name: skypilot-slurm-fm-tune
  # One fm-tune LoRA run on the local podman Slurm cluster (CPU-only, arm64
  # nodes). Proves wiring (resolve, venv on the bare node, train, register),
  # not GPU training.
  targets:
    tune:
      environment_uri: space://environments/skypilot/slurm
      inputs:
        dataset:
          uri: hf:///datasets/axolotl-ai-co/alpaca_100_test
        base_model:
          uri: hf:///hf-internal-testing/tiny-random-LlamaForCausalLM
      outputs:
        model:
          type: model
          uri: "env:///shared/fm-tune-test/model"
      steps:
        - step_uri: space://steps/tune/fm-tune
          config:
            poll_interval_seconds: 15
            fm_tune_config:
              source:
                repo: https://github.com/ibm-granite/granite.build.git
                # upstream main at #470: its autotunex/src/fm-tune is the tree the step was proven on
                ref: "b6aea3cac22eb178e816312e4553095671f26de9"
              train_file: data/train-00000-of-00001.parquet
              validation_file: data/train-00000-of-00001.parquet
              tuning_algo: lora
              run_name: fm-tune-slurm-test
              autotune: false
              # Inline instead of a preset, adapted from autotune_mac.yaml:
              #  - num_train_epochs stays 1 (autotune.yaml uses 10, ~430 s for 30 steps);
              #  - training_config.max_length is 1024, not 512: one alpaca_100_test
              #    row has a 515-token output and fails with "Not enough capacity for
              #    output + EOS" at 512 (build a2313afe);
              #  - eager attention and no_shard are kept as in autotune_mac.yaml;
              #  - tuners_rl_config and the non-lora tuners_config entries are dropped:
              #    --tuning_algo lora --no_autotune with no rl_algo never reads them.
              # fm-tune loads this whole file in place of a preset, so it must be complete.
              hpo_config:
                tune_config:
                  search_alg:
                    description: Search algorithm used by ray/tune to explore the hyperparameter search space
                    default: random
                    values:
                    - lds
                    - hyperopt
                    - random
                    - bohb
                    - blds
                    min_val: null
                    max_val: null
                    type: str
                    required: true
                  scheduler:
                    description: The scheduler used by ray/tune to schedult the trials
                    default: fifo
                    values:
                    - fifo
                    - asha
                    - hyperbandforbohb
                    min_val: null
                    max_val: null
                    type: str
                    required: true
                  num_samples:
                    description: Number of samples from the hyperparameter search space
                    default: 4
                    values: null
                    min_val: 1
                    max_val: 10000
                    type: int
                    required: true
                  max_concurrent_trials:
                    description: Maximum number of trials running concurrently
                    default: 1
                    values: null
                    min_val: 1
                    max_val: 8
                    type: int
                    required: true
                  max_discrepancy:
                    description: Maximum discrepancy value for LDS / BLDS
                    default: 6
                    values: null
                    min_val: 1
                    max_val: 100
                    type: int
                    search_alg:
                    - lds
                    - blds
                    required: true
                  fidelity_schedule:
                    description: 'BLDS fidelity ladder: monotone-increasing list of hpo_dataset_percentage rungs in (0, 1]; max defines the top rung (need not be 1.0)'
                    default:
                    - 0.1
                    - 0.25
                    - 0.5
                    values: null
                    min_val: null
                    max_val: null
                    type: list
                    search_alg:
                    - blds
                    required: true
                  blds_delta:
                    description: BLDS confidence parameter delta in (0,1); smaller delta widens UCB/LCB
                    default: 0.1
                    values: null
                    min_val: 0.001
                    max_val: 0.999
                    type: float
                    search_alg:
                    - blds
                    required: true
                  blds_c:
                    description: BLDS exploration constant c (must be > 4)
                    default: 4.0001
                    values: null
                    min_val: 4.0001
                    max_val: 100.0
                    type: float
                    search_alg:
                    - blds
                    required: false
                  blds_log_exploration:
                    description: Use the paper's log-based exploration term in UCB/LCB; if false, use the simpler reference formula
                    default: true
                    values: null
                    min_val: null
                    max_val: null
                    type: bool
                    search_alg:
                    - blds
                    required: false
                  asha_time_attr:
                    description: 'ASHA: which reported attribute to track for rung decisions'
                    default: training_iteration
                    values: null
                    min_val: null
                    max_val: null
                    type: str
                    scheduler:
                    - asha
                    required: false
                  asha_grace_period:
                    description: 'ASHA: minimum time_attr count before a trial may be stopped'
                    default: 1
                    values: null
                    min_val: 1
                    max_val: 100000
                    type: int
                    scheduler:
                    - asha
                    required: true
                  asha_reduction_factor:
                    description: 'ASHA: trials at each rung are culled by 1/reduction_factor'
                    default: 3
                    values: null
                    min_val: 2
                    max_val: 100
                    type: int
                    scheduler:
                    - asha
                    required: true
                  asha_brackets:
                    description: 'ASHA: number of brackets (parallel SHA runs)'
                    default: 1
                    values: null
                    min_val: 1
                    max_val: 100
                    type: int
                    scheduler:
                    - asha
                    required: false
                  time_budget_s:
                    description: Maximum allowed time for completing the hyperparameter search.
                    default: null
                    values: null
                    min_val: 60
                    max_val: 1209600
                    type: int
                    required: false
                training_config:
                  num_train_epochs:
                    description: Number of training epochs
                    default: 1
                    values: null
                    min_val: 1
                    max_val: 100
                    type: int
                    required: true
                  ds_strategy:
                    description: DeepSpeed strategy used for distributed training
                    default: zero2_gpu
                    values:
                    - auto
                    - zero1_gpu
                    - zero2_gpu
                    - zero3_gpu
                    - zero2_cpu
                    - zero3_cpu
                    min_val: null
                    max_val: null
                    type: str
                    train_implementation:
                    - DeepSpeed
                    required: true
                  fsdp_strategy:
                    description: FSDP strategy used for distributed training
                    default: no_shard
                    values:
                    - auto
                    - no_shard
                    - shard_grad_op
                    - full_shard
                    - hybrid_shard
                    min_val: null
                    max_val: null
                    type: str
                    train_implementation:
                    - FSDP
                    required: true
                  train_implementation:
                    description: Distributed training implementation (DeepSpeed or FSDP)
                    default: FSDP
                    values:
                    - DeepSpeed
                    - FSDP
                    min_val: null
                    max_val: null
                    type: str
                    required: true
                  use_flash_attention:
                    description: Use flash attention (eager or flash_attention_2)
                    default: eager
                    values:
                    - eager
                    - flash_attention_2
                    min_val: null
                    max_val: null
                    type: str
                    required: true
                  precision:
                    description: 'Compute precision: bf16 (GPU/MPS macOS>=14) or fp32 (MPS/CPU fallback)'
                    default: bf16
                    values:
                    - bf16
                    - fp32
                    min_val: null
                    max_val: null
                    type: str
                    required: false
                  num_gpus_per_trial:
                    description: GPUs per trial (worker)
                    default: 1
                    values: null
                    min_val: 1
                    max_val: 16
                    type: int
                    required: true
                  max_length:
                    description: Maximum sequence length used by the tokenizer (input + output)
                    default: 1024
                    values: null
                    min_val: 1
                    max_val: 128000
                    type: int
                    required: true
                  hpo_dataset_percentage:
                    description: Percentage training data used for HPO
                    default: 0.1
                    values: null
                    min_val: 0.01
                    max_val: 1.0
                    type: float
                    required: true
                  hpo_num_epochs:
                    description: Number of training epochs used for HPO
                    default: 3
                    values: null
                    min_val: 1
                    max_val: 10
                    type: int
                    required: true
                  data_backend:
                    description: Data backend for sharding during distributed training
                    default: arrow
                    values:
                    - arrow
                    - ray_data
                    min_val: null
                    max_val: null
                    type: str
                    required: true
                training_rl_config:
                  reward_function_path:
                    description: Path to custom reward function Python script (for verl online RL)
                    default: autotune/rewards/gsm8k_reward.py
                    values: null
                    min_val: null
                    max_val: null
                    type: str
                  reward_function_name:
                    description: Function name inside the reward function script
                    default: compute_score
                    values: null
                    min_val: null
                    max_val: null
                    type: str
                  reward_model_path:
                    description: Path to a learned reward model (for verl online RL)
                    default: null
                    values: null
                    min_val: null
                    max_val: null
                    type: str
                  rollout_temperature:
                    description: Temperature for vLLM generation during rollout
                    default: 1.0
                    values: null
                    min_val: 0.0
                    max_val: 2.0
                    type: float
                  rollout_top_p:
                    description: Top-p sampling for vLLM generation during rollout
                    default: 1.0
                    values: null
                    min_val: 0.0
                    max_val: 1.0
                    type: float
                  rollout_n:
                    description: Number of generations per prompt for GRPO group sampling
                    default: 5
                    values: null
                    min_val: 1
                    max_val: 64
                    type: int
                  max_prompt_length:
                    description: Maximum prompt token length for online RL
                    default: 1024
                    values: null
                    min_val: 1
                    max_val: 128000
                    type: int
                  max_response_length:
                    description: Maximum response token length for online RL
                    default: 512
                    values: null
                    min_val: 1
                    max_val: 128000
                    type: int
                  gpu_memory_utilization:
                    description: vLLM GPU memory utilization fraction for rollout
                    default: 0.6
                    values: null
                    min_val: 0.1
                    max_val: 0.95
                    type: float
                  tensor_model_parallel_size:
                    description: Tensor parallelism degree for vLLM rollout. null=auto-detect from model size.
                    default: null
                    values: null
                    min_val: 1
                    max_val: 8
                    type: int
                  overlong_buffer_len:
                    description: 'DAPO overlong penalty buffer: responses longer than max_response_length - overlong_buffer_len are penalised'
                    default: 128
                    values: null
                    min_val: 64
                    max_val: 1024
                    type: int
                  overlong_penalty_factor:
                    description: Penalty factor for overlong responses in DAPO
                    default: 1.0
                    values: null
                    min_val: 0.1
                    max_val: 5.0
                    type: float
                tuners_config:
                  lora:
                    description: Low rank adapter fine-tuning
                    tuner_name: tuner.lora
                    title: LoRA
                    dataset_type: dataset_type_a
                    hyperparams:
                      alpha_ratio:
                        description: scaling ratio
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 0.5
                        - 1.0
                        - 2.0
                        min_val: 0.1
                        max_val: 10.0
                        default: 2.0
                        type: float
                        for_tuner: false
                      lora_dropout:
                        description: dropout rate
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 0.0
                        - 0.05
                        - 0.1
                        min_val: 0.0
                        max_val: 0.1
                        default: 0.05
                        type: float
                        for_tuner: true
                      r:
                        description: Rank size
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 8
                        - 16
                        - 32
                        min_val: 0
                        max_val: 256
                        default: 32
                        type: int
                        for_tuner: true
                      bias:
                        description: Bias value
                        options:
                        - choice
                        strategy: choice
                        values:
                        - none
                        default: none
                        min_val: null
                        max_val: null
                        type: str
                        for_tuner: true
                      learning_rate:
                        description: Learning rate
                        options:
                        - choice
                        - uniform
                        - loguniform
                        strategy: choice
                        values:
                        - 1.0e-06
                        - 3.0e-06
                        - 5.0e-06
                        min_val: 1.0e-06
                        max_val: 5.0e-05
                        default: 5.0e-06
                        type: float
                        for_tuner: false
                      lr_scheduler_type:
                        description: Learning rate scheduler type
                        options:
                        - choice
                        strategy: choice
                        values:
                        - linear
                        - cosine
                        min_val: null
                        max_val: null
                        default: cosine
                        type: str
                        for_tuner: false
                      gradient_accumulation_steps:
                        description: Gradient accumulation steps
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 1
                        min_val: 1
                        max_val: 50
                        default: 8
                        type: int
                        for_tuner: false
                      per_device_train_batch_size:
                        description: Batch size used during training
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 8
                        - 16
                        - 32
                        min_val: 1
                        max_val: 128
                        default: 1
                        type: int
                        for_tuner: false
                      warmup_ratio:
                        description: Warmup ratio
                        options:
                        - choice
                        - uniform
                        strategy: choice
                        values:
                        - 0.1
                        - 0.2
                        min_val: 0.0
                        max_val: 1.0
                        default: 0.1
                        type: float
                        for_tuner: false
                tokenizer_config:
                  tokenizer_name_or_path:
                    description: Path or name for a custom tokenizer (defaults to model_name_or_path if null)
                    default: null
                    type: str
                  additional_special_tokens:
                    description: List of new special tokens to add to the tokenizer
                    default: null
                    type: list
                  additional_tokens:
                    description: List of new regular tokens to add to the vocabulary
                    default: null
                    type: list
                  pad_token:
                    description: 'Override the pad token (default: use eos_token)'
                    default: null
                    type: str
                  eos_token:
                    description: Override the eos token
                    default: null
                    type: str
                  bos_token:
                    description: Override the bos token
                    default: null
                    type: str
              output_path: /shared/fm-tune-test/model
            launcher_config:
              # Read by SkyPilotEnvironment._launch_env_layers (skypilot.py:3052).
              # Ray's off-CUDA object store defaults to 2 GiB; 256 MiB is plenty here.
              envs:
                FMTUNE_OBJECT_STORE_BYTES: "268435456"
            compute_config:
              # Asking for CPUs is what Slurm matches here: the local nodes advertise
              # CPUs=2. Memory is not a consumable resource on this cluster
              # (SelectTypeParameters=CR_Core), so no memory request.
              num_cpus_per_node: 2
              num_gpus_per_node: 0
