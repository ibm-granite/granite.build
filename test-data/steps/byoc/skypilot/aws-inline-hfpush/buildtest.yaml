# YAML-driven spec for test_skypilot_aws_inline_hfpush.py (located by the
# test/ <-> test-data/ helper, so the pairing holds in both test modes; see
# steps/README.md). The target runs the byoc step (space://steps/byoc) on the
# SkyPilot aws environment (real EC2) with NO shared_filesystem, so hf pull and
# push both run inline (issue #390): one instance does pull -> compute -> push.
#
# This spec covers the build-success + artifact-count assertions of the shared
# framework. The extra, task-specific assertions (the pushed artifact exists on
# HF, and ARTIFACT_PUSHED_EVENT is emitted only after the upload completes) are
# added by the test's test_runner override; the HF repo is a throwaway created
# by the test at load time and deleted in teardown.
targets:
  - inline-hfpush
target_expectations:
  - target_name: inline-hfpush
    # step_count 1: inline pull and inline push are injected into the byoc step's
    # setup/epilogue (NOT queued as separate hfpull/hfpush steps), because the aws
    # env has no shared_filesystem. One input (seed), one output (pushed).
    step_count: 1
    input_artifact_count: 1
    output_artifact_count: 1
    jobstats_count: 1
# See the byoc/aws fixture: in the step dir (Mode 1) this is the local Space
# rendered by `make space`; `make publish-step` rewrites it for Mode 2. Either
# way the build references the step by space://steps/byoc. Same depth as the
# sibling aws/ fixture, so the relative path is identical.
space_uri: ../../../../../configurations/spaces/local
# Run only the basic build (no cancellation variant): the byoc command finishes
# near-instantly once the node is up, leaving no stable RUNNING window to cancel.
tests:
  - runner
# A single clean run with no injected synthetic failure: a failed
# clone/command/inline-push fails the build, so reaching SUCCESS proves the
# inline pull -> compute -> inline push path ran end to end on real EC2.
simulate_step_failure: false
# EC2 cold-start bring-up + SkyPilot setup + the inline HF download/upload are
# far slower than a local cluster; allow generous headroom.
timeout_minutes: 40
