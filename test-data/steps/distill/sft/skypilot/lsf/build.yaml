granite.build:
  name: distill-sft-smoke
  # Smoke build for the distill-sft step on BlueVela (SkyPilot / LSF).
  #
  # THREE targets, because this step's two data inputs are both produced by the pipeline
  # and neither can be faked from anything already on /proj:
  #   - the student must be the RETAGGED model, for the same reason the distillation arms
  #     use it: a control has to differ from the treatment in the OBJECTIVE only, and a
  #     control trained on the base student would also differ in its embedding rows for the
  #     control tokens;
  #   - the corpus must be built with THAT tokenizer, because prep measured its length
  #     filter and its assistant-mask check in tokens — and prep itself needs align's chat
  #     template to locate assistant spans at all (measured: no pre-existing /proj overlay
  #     carries a {% generation %} tag).
  #
  # The chain also means this fixture exercises the real bindings rather than paths typed
  # by hand.
  targets:
    align:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        teacher:
          uri: "env:///proj/granite-build/g4os/models/granite-4.2-3b-nothink"
          type: model
        # DENSE (granite / GraniteForCausalLM), and that matters for the eval
        # target downstream rather than for align itself. The only genuinely
        # un-retagged base model on this cluster,
        # granite-4.0-1b-base-prerelease-castlerock-final, is granitemoehybrid —
        # and a hybrid model makes transformers lazily load
        # kernels-community/mamba-ssm, whose cached build imports
        # GreedySearchDecoderOnlyOutput and so cannot import under this image's
        # transformers 5.8.0 (measured, build 96868683). Every model this pipeline
        # actually uses (granite-4.1-3b-base, granite-4.2-30b) is dense, which is
        # why the real training runs never hit it.
        #
        # The retag is therefore near-a-no-op here (this student is already aligned
        # to the 4.2 tokenizer). That is fine for THIS fixture, whose subject is the
        # eval target: what it needs is a dense, tokenizer-matched student carrying
        # a chat template with {% generation %} markers, which align installs.
        # distill-tokenizer-align's OWN fixture keeps the hybrid student on purpose,
        # because that is what exercises a real retag (transplant=12, mean_init=4) —
        # and align never instantiates the model, so no kernel is requested there.
        student:
          uri: "env:///proj/granite-build/g4os/kd-sandbox/student_overlays/granite-4.1-3b-base-hub"
          type: model
      outputs:
        retagged_student:
          uri: "env://{{ binding.path }}"
          type: model
        teacher_overlay:
          uri: "env://{{ binding.path }}"
          type: model
        student_overlay:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/distill/tokenizer-align
          config:
            poll_interval_seconds: 20
            log_retrieval_interval_seconds: 20
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 1
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "normal"
                memory: 32
            align_config:
              out_dir: "align"

    corpus:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        tokenizer:
          binding: align.retagged_student
        source_dataset:
          uri: "env:///proj/granite-build/g4os/gbtest/gold-distill-smoke/smoke_2000_nothink.jsonl"
          type: dataset
      outputs:
        corpus:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/distill/corpus-prep
          config:
            poll_interval_seconds: 20
            log_retrieval_interval_seconds: 20
            compute_config:
              num_nodes: 1
              num_cpus_per_node: 1
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "normal"
                memory: 32
            corpus_config:
              # ABSOLUTE, and not the usual relative-to-workdir value, because the eval
              # target below has to name eval.jsonl and CANNOT compose that path itself:
              # every target run gets its OWN $GB_BUILD_WORKDIR (.../runs/<targetrun-id>/),
              # so a path built from the eval target's workdir would point at the wrong
              # directory. eval.jsonl is also deliberately not a declared artifact, so
              # there is no binding to carry it. A shared absolute root is what upstream's
              # recipe uses for the same reason.
              #
              # Re-running this fixture is therefore a resume case rather than a fresh one:
              # corpus-prep's expectation is keyed on the tokenizer IDENTITY (not its path),
              # so a second run with the same pair reports SKIP and republishes the corpus.
              # That is correct behaviour and worth exercising.
              out_dir: "/proj/granite-build/g4os/gbtest/distill-sft-smoke/corpus"
              max_length: 4096
              max_examples: 64
              # Must be > 0, or there is no eval split for the target below to measure on.
              # No eval split needed: this fixture trains on train.jsonl,
              # which IS the declared corpus artifact, so it comes through the
              # binding rather than a composed path.
              eval_fraction: 0.0

    train-sft:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        student:
          binding: align.retagged_student
        corpus:
          binding: corpus.corpus
      outputs:
        checkpoint:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/distill/sft
          config:
            poll_interval_seconds: 30
            log_retrieval_interval_seconds: 30
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
            launcher_config:
              resources:
                accelerators: "H100:1"
                cluster: "bluevela"
                zone: "normal"
                memory: 96
            workload:
              # MUST match the allocation above: run-sft.sh asserts this against the GPUs
              # visible in the container, because a mismatch trains at a different effective
              # batch size than the config says.
              gpus_per_node: 1
              # More is refused by the script, and deliberately so — see USAGE.md.
              nodes: 1
            sft_config:
              output_dir: "sft-smoke"
              # The corpus's own budget. A different value here would train on records the
              # corpus was not filtered for.
              max_length: 4096
              # LEFT AT THE DEFAULT (-1, the whole corpus) ON PURPOSE, and this is the
              # non-obvious part of sizing a smoke run for this step.
              #
              # max_dataset_size and corpus_config.max_examples are NOT interchangeable
              # ways to make a run small. sft.py builds a train manifest and compares its
              # kept-row count against PREP'S manifest, raising ManifestDrift on any
              # shortfall — because the only shortfall it knows how to cause is a row whose
              # tokenization produced no prompt, which means prep and the trainer are
              # rendering the corpus differently. That guard is worth keeping: it is how a
              # chat-template or tokenizer mismatch is caught before a long run.
              #
              # max_dataset_size: 16 against prep's 64 rows therefore FAILS, and says so:
              #   "off-policy, but the trainer kept 16 of prep's 64 training rows"
              # (build 9d95bf7e). Shrink the CORPUS instead — corpus_config.max_examples
              # above — so the two counts agree by construction. 64 rows at the default
              # grad-accum of 8 on one GPU is eight optimizer steps, which is still minutes.
              # Checkpoint on the first step, so publication is exercised rather than assumed.
              save_steps: 1
              num_train_epochs: 1
              # logging_steps is NOT a contract key — it comes from CustomSFTConfig's own
              # default of 10, which logs NOTHING on a run this short: build d33262d2 ran 8
              # steps and reported only the final summary, so there was no loss trajectory
              # to read when its train_loss of 9.125 alongside a mean_token_accuracy of
              # 0.7302 looked internally inconsistent.
              #
              # It reaches the trainer through extra_config_yaml, the documented escape
              # hatch for the long tail of CustomSFTConfig. That merge REFUSES on collision
              # with a contract key, so this is only legal because the step does not own
              # logging_steps — verified offline against the real renderer.
              extra_config_yaml: "logging_steps: 1"
              # EMPTY, which is what makes this the control rather than a forward-KL arm.
              precomputed_logits_dir: ""
