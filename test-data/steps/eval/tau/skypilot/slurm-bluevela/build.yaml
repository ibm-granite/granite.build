granite.build:
  name: skypilot-slurm-bluevela-eval-tau-test
  # The recipes' shape: generate on the family's GPU image, score on its CPU
  # image, bound by the granite_generation artifact -- one build test covers
  # both images.
  targets:
    tau-generate:
      environment_uri: space://environments/skypilot/slurm/bluevela
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: 5
            log_retrieval_interval_seconds: 30
            benchmark: "tau3-bench"
            image: "us.icr.io/cil15-shared-registry/gb-step-eval-tau:ce003c94"
            model_path: "ibm-granite/granite-4.2-3b"
            options: "agent=gold"
            output_root: "/proj/data-eng/llmb-read-write/eval-build-tests/tau"
            run_name: "buildtest"
            limit: "2"
            workers: "4"
            phase: "generate"
            hf_home: "/proj/data-eng/llmb-read-write/eval-build-tests/hf-home"
            sandbox_cache: "/proj/data-eng/llmb-read-write/eval-build-tests/enroot-cache"
            launcher_config:
              resources:
# Gold mode serves no model, so even the generate target (on the
            # GPU image) runs on the cpu partition.
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "cpu"
                memory: 32
                cpus: 8
              sbatch_options:
                constraint: null
    tau-score:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        generation:
          binding: tau-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: 5
            log_retrieval_interval_seconds: 30
            benchmark: "tau3-bench"
            image: "us.icr.io/cil15-shared-registry/gb-step-eval-tau-cpu:ce003c94"
            model_path: "ibm-granite/granite-4.2-3b"
            options: "agent=gold"
            # Same output dir as the generate target: the score phase reads
            # the generation.json the generate phase wrote there.
            output_root: "/proj/data-eng/llmb-read-write/eval-build-tests/tau"
            run_name: "buildtest"
            limit: "2"
            workers: "4"
            phase: "score"
            sandbox_cache: "/proj/data-eng/llmb-read-write/eval-build-tests/enroot-cache"
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "cpu"
                memory: 32
                cpus: 8
              sbatch_options:
                constraint: null
