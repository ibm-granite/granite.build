granite.build:
  name: skypilot-slurm-bluevela-eval-tau-test
  # The recipes' shape: generate on the family's GPU image, score on its CPU
  # image, bound by the granite_generation artifact -- one build test covers
  # both images.
  targets:
    tau-generate:
      environment_uri: space://environments/skypilot/slurm/bluevela
      outputs:
        granite_generation:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: 5
            log_retrieval_interval_seconds: 30
            benchmark: "tau3-bench"
            image: "us.icr.io/cil15-shared-registry/gb-step-eval-tau:ce003c94"
            model_path: "ibm-granite/granite-4.2-3b"
            options: "agent=gold"
            # Relative: composes and then resolves against the per-run
            # $GB_BUILD_WORKDIR (the output_dir rule) -- no cluster path.
            output_root: "tau"
            run_name: "buildtest"
            limit: "2"
            workers: "4"
            phase: "generate"
            # Empty = the image's node-local default: the pinned dataset
            # download lands per job (hermetic; no shared-FS path to name).
            hf_home: ""
            # Unused by this benchmark (no enroot sandboxes).
            sandbox_cache: ""
            launcher_config:
              resources:
# Gold mode serves no model, so even the generate target (on the
            # GPU image) runs on the cpu partition.
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "cpu"
                memory: 32
                cpus: 8
              sbatch_options:
                constraint: null
    tau-score:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        generation:
          binding: tau-generate.granite_generation
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tau
          config:
            poll_interval_seconds: 5
            log_retrieval_interval_seconds: 30
            benchmark: "tau3-bench"
            image: "us.icr.io/cil15-shared-registry/gb-step-eval-tau-cpu:ce003c94"
            model_path: "ibm-granite/granite-4.2-3b"
            options: "agent=gold"
            # The generate target's output dir, followed from the artifact:
            # target-runs get distinct workdirs, so take the dirname of the
            # bound generation.json -- the one path guaranteed to be where
            # generate wrote it.
            output_dir: "{{ bindings.generation.binding.path.rsplit('/', 1)[0] }}"
            limit: "2"
            workers: "4"
            phase: "score"
            # Unused by this benchmark (no enroot sandboxes).
            sandbox_cache: ""
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "cpu"
                memory: 32
                cpus: 8
              sbatch_options:
                constraint: null
