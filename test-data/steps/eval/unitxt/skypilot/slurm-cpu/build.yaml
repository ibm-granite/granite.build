granite.build:
  name: skypilot-slurm-unitxt-cpu-test
  # eval/unitxt on the local Docker SLURM cluster (via SkyPilot), CPU only.
  #
  # A PLUMBING test, not an evaluation: a 135M model on 2 instances scores ~0, and
  # no granite model is practical on CPU. What reaching SUCCESS proves:
  #   1. The required `model` input is staged and its path reaches the CLI as
  #      `--model_args pretrained=<path>` (from {{ bindings.model.binding.path }}).
  #   2. Setup's two-phase install: torch from `torch_index_url` (the PyTorch CPU
  #      index, so no CUDA libraries are pulled), then unitxt + hf_packages from
  #      PyPI, with the CPU torch kept.
  #   3. `unitxt-evaluate --model hf --trust_remote_code` completes on
  #      cards.mmlu_pro.engineering (which refuses to load without that flag).
  #   4. The output directory is registered as `results` from the marker, and the
  #      queued hfpush uploads it to a Hugging Face dataset.
  #
  # HF_TOKEN: the model pull needs none (it's public), but the results push needs
  # write access to the ibm-research org. The nightly extended suite supplies it.
  #
  # Memory: the local cluster's nodes advertise RealMemory=1024. Measured outside
  # the cluster, this run peaks at ~560 MiB RSS in bf16 (~900 MiB in fp32), hence
  # torch_dtype=bfloat16.
  targets:

    evaluate:
      environment_uri: space://environments/skypilot/slurm
      inputs:
        model:
          # Public, ~270 MB in bf16 safetensors, so the pull needs no token.
          uri: hf:///models/HuggingFaceTB/SmolLM2-135M-Instruct
      outputs:
        results:
          # A real hf:// output, so buildrunner queues an hfpush for the directory
          # the step registers. The `test_` prefix lets scripts/rm_hf_repos.py
          # (--pattern '^test_') clean these up; the short hash of the registered
          # path gives each build its own dataset.
          uri: hf://huggingface.co/datasets/ibm-research/test_unitxt-results_{{ binding.path | short_hash }}
          type: dataset
      steps:
        - step_uri: space://steps/eval/unitxt
          config:
            # Fast completion detection (the skypilot monitor's own default is
            # 300s, which would dominate wall-clock for this quick job).
            poll_interval_seconds: 5
            unitxt_config:
              tasks: "card=cards.mmlu_pro.engineering"
              model_args: "torch_dtype=bfloat16,device=cpu"
              limit: 2
              # The CPU wheel: PyPI's default Linux torch bundles several GB of
              # CUDA libraries this cluster cannot use.
              torch_index_url: "https://download.pytorch.org/whl/cpu"
            compute_config:
              # The local cluster's nodes advertise exactly 2 CPUs (3 fails with
              # "Requested node configuration is not available"). Asking for them
              # makes SLURM export SLURM_CPUS_PER_TASK, which torch's CPU threads
              # follow.
              num_cpus_per_node: 2
              num_gpus_per_node: 0
