# YAML-driven spec for test_skypilot_slurm_unitxt_cpu.py (located by the test/ <->
# test-data/ helper, so this pairing holds in both test modes; see steps/README.md).
#
# ONE target on the local Docker SLURM cluster: unitxt-evaluate in hf mode on CPU,
# against a bound hf:// model. See the sibling build.yaml for what SUCCESS proves.
targets:
  - evaluate
target_expectations:
  # step_count is 2: the queued hfpull for the hf:// model input, plus the
  # eval/unitxt step itself. The skypilot/slurm environment does not set
  # `inline: true` on its hf assetstore pull (unlike skypilot/aws), so the download
  # is a separate step. The env:// output moves no bytes, so it queues no push step
  # (the same accounting as dpk's slurm-tok).
  #
  # jobstats_count is not asserted under standalone's NoopLineageStore but is kept
  # accurate. CALIBRATE all four numbers against the first green run.
  - target_name: evaluate
    step_count: 2              # hfpull(model) + eval/unitxt
    input_artifact_count: 1    # model
    output_artifact_count: 1   # results (env://, registered inline from the marker)
    jobstats_count: 1
    # Only keys the build.yaml supplied appear in the persisted step config
    # (step-template.yaml defaults are not merged in), so assert on those.
    expected_steps:
      - step_uri: space://steps/eval/unitxt
        config:
          unitxt_config:
            tasks: "card=cards.mmlu_pro.engineering"
            torch_index_url: "https://download.pytorch.org/whl/cpu"
# The Space this test resolves space://steps/eval/unitxt (and the environment +
# monitors) through. In the step dir (Mode 1) that is the local Space rendered by
# `make space` (steps/eval/unitxt/skypilot/space/), which carries
# steps/eval/unitxt/step.yaml and chains (base_uris) to configurations/assets. When
# `make publish-step` copies this fixture into test-data/steps/ (Mode 2) it rewrites
# this line to configurations/spaces/local, resolving the PUBLISHED step instead.
space_uri: ../../../../../../configurations/spaces/local
# Happy-path run only. Skip the cancellation variant: the workload is short, so
# there is no stable RUNNING window to cancel in.
tests:
  - runner
# No injected synthetic failure: `set -euo pipefail` fails the target if the
# install or the CLI fails, so reaching SUCCESS means the evaluation completed.
simulate_step_failure: false
# One SLURM job: a runtime uv install (~1.3 GB venv with the CPU torch), the model
# and dataset downloads, then a 2-instance CPU evaluation. Generous headroom.
timeout_minutes: 30
