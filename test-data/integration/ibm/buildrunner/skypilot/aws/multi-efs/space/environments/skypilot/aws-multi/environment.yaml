# skypilot/aws environment with two shared filesystems: a BYO EFS and an
# ephemeral one gbserver provisions per build (#422).
#
# Ships a PLACEHOLDER file_system_id (fs-0abc123, as the shared-fs fixtures do),
# so no real resource id is committed. To run against AWS, use a copy with your
# own pre-provisioned EFS id (docs/environments/skypilot-aws.md, "Runbook:
# provision a shared EFS filesystem").
name: skypilot-aws-multi
type: Skypilot
subtype: aws
config:
  default_cloud: aws
  cloud_config:
    workspaces:
      default:
        aws:
          profile: gb-skypilot
  shared_workdir: /mnt/gb-shared/gbroot
  shared_filesystem:
    - provider: efs
      mount_point: /mnt/gb-shared
      efs:
        file_system_id: fs-0abc123
        region: us-east-1
    - provider: efs
      mount_point: /mnt/gb-scratch
      efs:
        provision: ephemeral
        region: us-east-1
