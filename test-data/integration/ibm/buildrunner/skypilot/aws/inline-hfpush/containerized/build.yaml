granite.build:
  name: skypilot-aws-inline-hfpush-containerized
  # Containerized counterpart of ../bare/build.yaml (#390): the same single
  # `command` step with an inline hf:// input + hf:// output and NO
  # shared_filesystem, but the step sets an image so byoc renders SkyPilot
  # image_id: docker:<image> and setup+run execute INSIDE the container. This
  # exercises the container-boundary path the bare variant never touches:
  #   * inline PULL's `hf download` (in the step's setup) must land in a cache
  #     the containerized run can read (setup+run share the container fs);
  #   * inline PUSH's epilogue runs `python ... huggingface_hub` in the run
  #     script, so the IMAGE must provide python3 + pip — hence python:3.12-slim
  #     (the inline-pull prologue pip-installs huggingface_hub[cli] into it).
  # Reaching SUCCESS proves inline pull->compute->push works from inside a
  # container on one instance.
  targets:
    inline-hfpush-command:
      # The inline aws environment (hf assetstore inline pull+push, no
      # shared_filesystem) carried by the committed Space at ../space.
      environment_uri: space://environments/skypilot/aws-inline
      inputs:
        # Real hf:// input — inline, so the download is folded into THIS command
        # step's setup (inside the container). A tiny public model, no read token.
        hf_input:
          uri: hf:///hf-internal-testing/tiny-random-gpt2
      outputs:
        # Real hf:// output — inline push folds the upload into this step's run
        # epilogue (inside the container). Pushes to the test account's OWN user
        # namespace (granite-build-test), which skips HF Enterprise resource
        # groups; needs the granite-build-test write token the extended suite runs
        # with. Static repo name (no `{{ binding.* }}`): inline push resolves the
        # destination at setup, before the produced artifact exists. Distinct from
        # the bare variant's repo so the two never collide. create_repo is
        # exist_ok=True, so re-runs overwrite it.
        hf_output:
          uri: hf://huggingface.co/datasets/granite-build-test/gb-inline-hfpush-e2e-output-container
          type: fileset
      steps:
        - step_uri: space://steps/command
          config:
            # Fast completion detection for the test (base skypilot default 300s).
            poll_interval_seconds: 5
            command_config:
              # A python image so the in-container inline pull (pip install
              # huggingface_hub[cli] + hf download) and the inline push epilogue
              # (python ... HfApi.upload) have python3 + pip available. byoc
              # renders image_id: docker:python:3.12-slim.
              image: "python:3.12-slim"
              # set -eu: a missing inline-pulled input (test -e) fails the step.
              # The inline pull folded the download into this step's setup inside
              # the container, so the input is present in the container fs here.
              # Output goes to an absolute out/ under the step's cwd; the inline
              # push epilogue reads $pwd/out from the GB_ARTIFACT_PATH marker
              # (same container, absolute local path is fine).
              command: >-
                set -eu;
                pwd=$(pwd);
                mkdir -p out;
                echo "hf input path: {{ bindings.hf_input.binding.path }}";
                test -e "{{ bindings.hf_input.binding.path }}";
                echo "verified inline-pulled hf input present from inside the container (no shared FS)";
                echo '{"artifact": "hf_output", "produced_by": "inline-hfpush-command-containerized"}' > out/result.json;
                echo "GB_ARTIFACT_ID:hf_output GB_ARTIFACT_PATH:$pwd/out"
            launcher_config:
              resources:
                # Pin the region to match the sibling aws tests / hf availability.
                infra: "aws/us-east-1"
                # t3.small = 2 vCPU / 2 GiB (~$0.02/hr): cheapest reliable size.
                instance_type: t3.small
                disk_size: 40
