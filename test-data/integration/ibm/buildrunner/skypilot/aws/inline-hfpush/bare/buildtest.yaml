# YAML spec for the BARE inline-hfpush build test (test_inline_hfpush.py).
# Issue #390: hf push is now ALWAYS a dispatched real step that reads the produced
# artifact from a shared_filesystem (BYO EFS) — the single-instance inline PUSH
# fold is gone. The hf INPUT is still inline (pull `inline: true`, #389/out of
# scope), so its download folds into the command step's setup (no separate hfpull
# step). So this target now runs as TWO steps:
#   1. the command step (inline pull folded into its setup; writes a real file and
#      emits the GB_ARTIFACT marker), then
#   2. a dispatched hfpush step that SkyPilot places on its OWN EC2 instance and
#      that reads the produced artifact back over the EFS-backed shared workdir
#      and uploads it to HF.
# `test -e` under `set -eu` fails the build if the inline-pulled input did not
# arrive, so reaching SUCCESS proves inline-pull -> compute -> dispatched-push
# (over shared FS) end to end.
targets:
  - inline-hfpush-command
target_expectations:
  - target_name: inline-hfpush-command
    # command (inline pull folded into its setup, no separate hfpull step) + the
    # dispatched hfpush step (one per output-artifact marker) = 2. This is the key
    # change from #408's single folded instance (was step_count 1): the push is now
    # a real separate step. Contrast with shared-fs (step_count 3), where the hf
    # INPUT also runs as its own hfpull step because pull is NOT inline there.
    step_count: 2
    input_artifact_count: 1 # hf input (inline-pulled in the command step's setup)
    output_artifact_count: 1 # hf output (uploaded by the dispatched hfpush step)
    jobstats_count: 1
# The committed Space (../space) carries environments/skypilot/aws-inline and
# chains base_uris to configurations/assets. The `command` and `hfpush` steps are
# gbserver builtins (space://steps/...) resolved regardless of the space. The bare
# and containerized variants live under inline-hfpush/{bare,containerized}/ and
# SHARE the one Space at inline-hfpush/space, so ../space reaches it one level up.
space_uri: ../space
# Only the basic build; skip the cancellation variant.
tests:
  - runner
# A single clean run with no injected synthetic failure: a missing input (test -e)
# or a failed inline pull / dispatched push fails the build, so SUCCESS proves the
# inline pull -> compute -> dispatched push path ran end to end.
simulate_step_failure: false
# EC2 cold-start + SkyPilot setup for the command instance PLUS the separate
# dispatched push instance, the EFS mount, and the inline hf pull + hf push. Two
# sequential instances now (command then push), so a shade higher than the old
# single-instance 25.
timeout_minutes: 35
