# Committed test Space for the gated shared-fs EFS access-point E2E build (#396).
#
# It carries only the aws-shared-fs-ap environment (environments/skypilot/aws-shared-fs-ap,
# the shared_filesystem efs block) and chains base_uris to configurations/assets,
# from which space://steps/command resolves to the PUBLISHED command step, so NO
# `make space` render is needed — the fixture is committed and self-contained.
name: shared-fs-efs-ap-e2e
secret_manager:
  type: local
  config: {}
base_uris:
  # Pull assetstores, environments, and (published) steps from configurations/assets/.
  # Relative to this space.yaml's dir: eight `..` reach the repo root (the aws test
  # tree sits at the same depth as the sibling filemount space), then
  # configurations/assets — from which space://steps/command resolves.
  - file://../../../../../../../../configurations/assets
