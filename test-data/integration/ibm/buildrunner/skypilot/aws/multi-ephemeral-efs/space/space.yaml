# Committed test Space for the gated 2-ephemeral-EFS multi-mount build (#391/#422).
#
# It carries only the aws-multi-ephemeral environment
# (environments/skypilot/aws-multi-ephemeral, a shared_filesystem list of TWO
# provision: ephemeral efs mounts) and chains base_uris to configurations/assets,
# from which space://steps/command resolves. Mirrors the single-mount
# ephemeral-efs space.yaml, so NO `make space` render is needed — the fixture is
# committed and self-contained.
name: multi-ephemeral-efs-e2e
secret_manager:
  type: local
  config: {}
base_uris:
  # Pull assetstores, environments, and (published) steps from configurations/assets/.
  # Relative to this space.yaml's dir: eight `..` reach the repo root (same depth as
  # the sibling ephemeral-efs space), then configurations/assets.
  - file://../../../../../../../../configurations/assets
