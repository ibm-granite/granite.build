# Committed test Space for the gated ephemeral-EFS E2E build (#391).
#
# It carries only the aws-ephemeral environment (environments/skypilot/aws-ephemeral,
# a shared_filesystem efs block with provision: ephemeral) and chains base_uris to
# configurations/assets, from which space://steps/command resolves. Mirrors the BYO
# shared-fs space.yaml, so NO `make space` render is needed — the fixture is
# committed and self-contained.
name: ephemeral-efs-e2e
secret_manager:
  type: local
  config: {}
base_uris:
  # Pull assetstores, environments, and (published) steps from configurations/assets/.
  # Relative to this space.yaml's dir: eight `..` reach the repo root (same depth as
  # the sibling shared-fs space), then configurations/assets.
  - file://../../../../../../../../configurations/assets
