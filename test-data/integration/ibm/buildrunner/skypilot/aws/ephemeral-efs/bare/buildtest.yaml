# YAML spec for the gated ephemeral-EFS producer->consumer build test (#391).
# Two command steps in one target: gbserver auto-provisions an EFS at setup, the
# producer writes probe.txt onto the per-run workdir, the consumer (on a SEPARATE
# instance) reads it back under `set -eu`, and teardown deprovisions the EFS.
# Reaching SUCCESS proves the ephemeral EFS was created, shared across instances,
# and consumed. No inputs/outputs (no hf/env I/O) -> no pull/push steps queued.
targets:
  - ephemeral-efs-probe
target_expectations:
  - target_name: ephemeral-efs-probe
    # Two explicit command steps; no I/O -> no hidden pull/push steps.
    step_count: 2
    input_artifact_count: 0
    output_artifact_count: 0
    # jobstats not asserted (default -1): a no-output command step records none.
# The committed Space (../space) carries environments/skypilot/aws-ephemeral and
# chains base_uris to configurations/assets, from which space://steps/command
# resolves. No `make space` render needed.
space_uri: ../space
# Only the basic build; skip the cancellation variant.
tests:
  - runner
# A single clean run with no injected synthetic failure: a missing/mismatched
# probe (test -e / grep) fails the build, so SUCCESS proves the ephemeral EFS
# provision -> cross-instance share -> teardown path worked.
simulate_step_failure: false
# EC2 cold-start + SkyPilot setup for two sequential instances plus the ephemeral
# EFS create/mount/destroy.
timeout_minutes: 40
