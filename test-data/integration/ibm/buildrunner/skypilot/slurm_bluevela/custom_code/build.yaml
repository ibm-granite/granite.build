granite.build:
  name: skypilot-bluevela-custom-code
  # Single custom_code_skypilot (BYOC) target on BlueVela SLURM (via Skypilot).
  #
  # The step clones a private GHE workload repo, materializes a hash-keyed conda/
  # micromamba environment from a conda lockfile, runs the workload's start
  # command inside that env, and captures a directory as the output artifact. It
  # also emits GB_STEP_METADATA_KEY:commit_hash so build lineage records the exact
  # commit that ran (buildtest.yaml asserts this).
  #
  # It declares an hf:// input (byoc_input), so buildrunner queues an hfpull that
  # downloads it onto the node and binds its local path — referenced in
  # setup_command via {{ bindings.byoc_input.binding.path }} to prove the binding
  # flows through. The output is an hf:// fileset, so buildrunner also queues ONE
  # hfpush after the step — step_count is therefore 3 (hfpull, custom_code_skypilot,
  # hfpush). Requires HF_TOKEN with write access to the output repo.
  #
  # The test is skipped unless GBTEST_ENABLE_MANUAL_TESTS=1.
  targets:
    custom-code-run:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # Real hf:// dataset input — buildrunner queues an hfpull step that
        # downloads it onto the compute node and binds its local path.
        byoc_input:
          uri: hf:///datasets/ibm-research/vira-intents-live
      outputs:
        # Real hf:// output — buildrunner queues an hfpush that uploads the
        # directory the step registers via its GB_ARTIFACT marker (dir_to_save).
        byoc_output:
          uri: hf://huggingface.co/datasets/ibm-research/test-byoc-output_{{ binding.path | short_hash }}
          type: fileset
      steps:
        - step_uri: space://steps/custom_code_skypilot
          config:
            # Fast completion detection for the test (base skypilot default 300s).
            poll_interval_seconds: 5
            # Single node/GPU; raise for multi-GPU workloads.
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
            byoc_config:
              # Schema: this block is the custom_code_skypilot step's own
              # byoc_config, validated at build time by that step's
              # validators/byoc_config.schema.json (json_schema) + byoc_validator.py.
              # Keys below mirror assets/steps/custom_code_skypilot/step.yaml.
              # NOTE: distinct from the `byoc` step under
              # configurations/assets/environments/skypilot/steps/byoc — same block
              # name, different schema (that step takes repo/ref/workdir/command).
              # Public Debian image with git preinstalled (the -scm variant also
              # ships curl/wget/ca-certificates, which env_provider.sh needs to
              # bootstrap micromamba). Wrapped as docker:<ref>; needs the Pyxis
              # SPANK plugin, which BlueVela provides. Set "" to run on the bare
              # launcher node instead.
              image: "docker.io/library/buildpack-deps:bookworm-scm"
              # GHE URL without https:// or .git.
              github_url: "github.ibm.com/pzerfos/MiniLMEngine"
              # branch, tag, or full 40-char SHA. Resolved to a full SHA at job
              # start and emitted as commit_hash step metadata.
              github_ref: "main"
              # (recommended: conda-lock.yml generated by conda-lock).
              conda_lockfile_path: "environment.yml"
              # repo-relative files whose content is folded into the
              # env cache key. Changing any invalidates the cached env.
              dependency_files:
                - "environment.yml"
              # Verify the bound hf:// input resolved onto the node. test -e exits
              # non-zero if the path is missing, which fails setup_command (and the
              # build) — proving the byoc_input binding flowed through.
              setup_command: >-
                test -e {{ bindings.byoc_input.binding.path }}
              # Write your artifact under $OUTPUT_PATH (== $GB_BUILD_WORKDIR/<dir_to_save>).
              start_command: "echo 123 > $OUTPUT_PATH/output.txt"
              dir_to_save: "output"
              output_name: "byoc_output"
            # Secrets: the step injects its 5 defaults (GB_SDK_GIT_PAT←GITHUB_IBM_PAT,
            # CLEARML_API_HOST, CLEARML_API_ACCESS_KEY, CLEARML_API_SECRET_KEY,
            # HF_TOKEN) automatically — no skypilot.secrets block is needed here.
            # To ADD one (e.g. WANDB_API_KEY) you must RE-LIST all 5 defaults plus
            # the addition (declaring the block REPLACES the defaults):
            # skypilot:
            #   secrets:
            #     secret_names_to_use_as_env_variable:
            #       - { env_name: GB_SDK_GIT_PAT,         secret_name: GITHUB_IBM_PAT }
            #       - { env_name: CLEARML_API_HOST,       secret_name: CLEARML_API_HOST }
            #       - { env_name: CLEARML_API_ACCESS_KEY, secret_name: CLEARML_API_ACCESS_KEY }
            #       - { env_name: CLEARML_API_SECRET_KEY, secret_name: CLEARML_API_SECRET_KEY }
            #       - { env_name: HF_TOKEN,               secret_name: HF_TOKEN }
            #       - { env_name: WANDB_API_KEY,          secret_name: WANDB_API_KEY }
