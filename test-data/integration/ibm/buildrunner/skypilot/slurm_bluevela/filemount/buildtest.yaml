# YAML-driven spec for
# test/integration/ibm/buildrunner/skypilot/slurm_bluevela/test_filemount.py.
# build_yaml defaults to ./build.yaml (sibling) when omitted.
#
# The target runs a custom step (space://steps/filemount-check) that copies a
# directory shipped next to its step.yaml via file_mounts and verifies it is
# present in the run command INSIDE a Pyxis container, on the BlueVela SLURM
# (Skypilot) path. HF-free (env:// in/out) so it is fast and needs no HF_TOKEN.
targets:
  - filemount
target_expectations:
  - target_name: filemount
    # Just the one custom step runs: the env:// input/output are no-ops on the
    # shared FS (one input + one output artifact each, no extra pull/push step),
    # and the file_mounts copy adds no step. jobstats_count is kept accurate for
    # a single step.
    step_count: 1
    input_artifact_count: 1
    output_artifact_count: 1
    jobstats_count: 1
# Co-located test space (space/ next to this file) — carries the custom
# filemount-check step and chains to the remote gb-test space (for the bluevela
# SLURM environment + assetstores) via its base_uris.
space_uri: space
# Run only the basic build (skip the cancellation variant) — this test verifies
# file_mounts, not cancel/retry behavior (covered by the sibling 1step test).
tests:
  - runner
# A single clean run with no injected synthetic failure: the step's run command
# fails the build if the mounted dir is absent, so SUCCESS proves the mount.
simulate_step_failure: false
# 20 minutes to match the other bluevela build tests — real SLURM job scheduling
# on BlueVela is slower than the local Docker SLURM cluster (which uses 10).
timeout_minutes: 20
