granite.build:
  name: skypilot-bluevela-slurm-dpk-pii-redactor
  # PII redaction through the shared `dpk` step on BlueVela SLURM (via Skypilot),
  # submitted to the gpu-mid partition. This is the REAL-CLUSTER counterpart of
  # steps/dpk/skypilot/test-data/slurm-pii/build.yaml (local Docker SLURM) and of
  # test-data/aws-pii (EC2): same step, same transform, same derivations —
  # only `environment_uri` and the memory hint differ.
  #
  # From `transform: pii_redactor` the step derives, with no step change:
  #   module -> python -m dpk_pii_redactor.runtime
  #   pip    -> data-prep-toolkit-transforms[pii-redactor]==<dpk_version>
  #
  # NO CONTAINER, SO NO PYXIS. Unlike the sibling 1step/2target fixtures — whose
  # `command` step sets command_config.image and therefore needs BlueVela's Pyxis
  # SPANK plugin — this target sets no dpk_config.dpk_image, so DPK installs with
  # pip onto the bare launcher node. That makes this fixture independent of the
  # Pyxis/enroot path: if it fails while 1step passes, the fault is in the step or
  # in DPK, not in containerization.
  #
  # ALSO NO HF WRITE. The input is a read-only hf:// pull and the output is a
  # terminal env://, so buildrunner queues an hfpull but NO hfpush. This fixture
  # therefore needs only a READ-scoped HF_TOKEN, unlike 1step/2target which push
  # to an ibm-research dataset repo and require write access.
  #
  # SEQUENTIAL BY DESIGN — do not add runtime_num_processors. No pool flag means
  # DPK's own default of 0, so this covers the sequential path (the parallel one is
  # covered by the tokenization fixtures). Each worker would otherwise hold its own
  # copy of the flair and presidio models, multiplying peak memory for no gain on a
  # single-file sample.
  #
  # Single target: a "does the step run on this cluster" proof, not a handoff test.
  # The cross-target env:///shared handoff is not covered here or anywhere — see
  # steps/dpk/skypilot/README.md's Known gaps.
  targets:

    redact:
      # The BlueVela SLURM env, resolved from the gb-test space (same space_uri
      # the sibling 1step/2target fixtures use). The gpu-mid partition comes from
      # the environment's `zone`, so no partition is set here.
      #
      # NOT overridden to a CPU partition even though this transform asks for zero
      # GPUs: gpu-mid is the environment-wide default that the sibling fixtures
      # also run on, and the env only names gpu-low for the auto-queued HF I/O
      # steps (config.steps.hfpull/hfpush). Adding a third partition name here
      # would be an untested guess about BlueVela's partition layout.
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        docs:
          # DPK's own pii_redactor test fixture (Apache-2.0), sanitized: the
          # original named a real person, replaced with Jane Doe /
          # jane.doe@example.com. Presidio matches EMAIL_ADDRESS/PERSON
          # structurally, so redaction behaves identically.
          #
          # Same dataset as the slurm-pii and aws-pii fixtures. NOTE: personal
          # namespace pending an ibm-research move; only this URI changes when
          # that access lands. Read-only, so a read-scoped HF_TOKEN suffices.
          uri: hf:///datasets/shalisha-witherspoon/dpk-pii-redactor-sample
      outputs:
        clean:
          # Terminal output — nothing downstream consumes it. env:// push is a
          # no-op that only REGISTERS this path (no transfer, no cross-node
          # read), so a node-local /tmp path is safe here. This is why it does
          # not need to sit under the env's /proj shared_workdir the way
          # 1step's hf-pushed output does.
          uri: "env:///tmp/dpk-pii-output"
          type: dataset
      steps:
        # Resolves through gb-test's own base_uri (the assets repo, at
        # steps/skypilot/dpk) — see the note in buildtest.yaml. The step's
        # environment_configs admit Skypilot with no subtype restriction, which is
        # what makes the same step usable on slurm as on aws/lsf/kubernetes.
        - step_uri: space://steps/dpk
          config:
            # Fast completion detection for the test (base skypilot default 300s),
            # matching the sibling bluevela fixtures.
            poll_interval_seconds: 5
            dpk_config:
              transform: pii_redactor
              dpk_version: "1.1.8"
              # A PATH, resolved here from this target's own declared input — the
              # byoc pattern (steps/byoc/skypilot/USAGE.md). The step never learns
              # binding NAMES, so it cannot be wrong about them.
              input_path: "{{ bindings.docs.binding.path }}"
              output: clean
              output_path: /tmp/dpk-pii-output    # matches the `clean` uri above
              args:
                # Full flag names as DPK spells them, passed through verbatim:
                # pii_redactor's flag prefix happens to equal its module suffix,
                # unlike tokenization's `tkn_`, which is exactly why the step does
                # not try to derive prefixes.
                #
                # `entities` is parsed with ast.literal_eval, so the value must be
                # a PYTHON LIST literal, not a comma-separated string.
                pii_redactor_entities: "['PERSON','EMAIL_ADDRESS']"
                pii_redactor_operator: replace
                # Required by the transform (no usable default at the CLI); names
                # the column the redacted text is written to.
                pii_redactor_transformed_contents: new_contents
                pii_redactor_score_threshold: 0.6
            launcher_config:
              resources:
                # The ACTUAL memory request. BlueVela enforces memory per job
                # (cgroups), but gbserver drops compute_config's memory floor on
                # slurm/lsf, so without this the job got the partition default:
                # sacct showed AllocCPUS=2 ReqMem=2G, and the transform step was
                # OOM-killed (OUT_OF_MEMORY 0:125, MaxRSS ~1.3G) while loading
                # flair/ner-english-large — build c82e576e, 2026-09-28. An explicit
                # launcher resources.memory is passed through on slurm; bare GiB,
                # the same form the LSF ibm-bluevela steps use.
                memory: "16"
            compute_config:
              num_gpus_per_node: 0
              # Advisory only on SLURM (see launcher_config above for the real
              # request); kept equal to it so the intent reads the same on
              # endpoints that DO honor compute_config memory.
              total_memory_per_node: 16Gi
