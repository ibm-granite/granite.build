granite.build:
  name: skypilot-bluevela-filemount-test
  # Single command-step target on BlueVela LSF (via Skypilot) that runs a custom
  # step (space://steps/filemount-check) declaring a `file_mounts` key. The mount
  # copies the `payload/` directory shipped next to the step's step.yaml onto the
  # cluster; the source is RELATIVE, so the Skypilot launcher resolves it against
  # the step.yaml's own directory (the per-run asset dir) — the behavior under
  # test. The step's run command verifies the copy landed and fails the build if
  # it did not. This is the bluevela/LSF sibling of the slurm filemount test.
  #
  # env:// (env_local) I/O is a shared-FS no-op: push/pull do nothing, so the
  # artifact registration/binding works purely on the GB_ARTIFACT_PATH string
  # and no real files need to exist on disk. Keeps the test HF-free/fast.
  targets:
    filemount:
      environment_uri: space://environments/skypilot/lsf/ibm-bluevela
      inputs:
        # env:// input: a shared-FS path pulled as a no-op. The path need not
        # exist and its value isn't asserted; it just flows to the command as a
        # binding.
        env_input:
          uri: "env:///tmp/gb-env-input.txt"
      outputs:
        # env:// output: registered inline from the GB_ARTIFACT marker the
        # command emits below. `type` is required for env:// outputs. The path is
        # arbitrary (env:// push/pull are no-ops); it just has to match the value
        # in the command's GB_ARTIFACT marker. Uses the BlueVela shared-FS
        # convention for realism.
        env_output:
          uri: "env:///proj/granite-build/g4os/gbtest/filemount/out.txt"
          type: fileset
      steps:
        # Custom test step defined in the co-located test space (space/steps/).
        # It declares a `file_mounts` key that copies the `payload/` directory
        # shipped next to its step.yaml onto the cluster, then (in its run)
        # verifies the copy landed before running the command below.
        - step_uri: space://steps/filemount-check
          config:
            # Fast completion detection for the test (base skypilot default is
            # 300s; a quick test job finishes in seconds).
            poll_interval_seconds: 5
            command_config:
              # Run the verification + command INSIDE a container image. On LSF
              # this goes through enroot (bluevela's container runtime), so the
              # file_mounts payload must be visible from within the container.
              # A minimal image that ships bash; quay.io avoids Docker Hub pull-
              # rate limits. Swap for a BlueVela-reachable registry/image if
              # quay.io is not reachable from the cluster.
              image: quay.io/fedora/fedora-minimal:42
              command: >-
                echo "env input path: {{ bindings.env_input.binding.path }}";
                echo "GB_ARTIFACT_ID:env_output GB_ARTIFACT_PATH:/proj/granite-build/g4os/gbtest/filemount/out.txt"
            compute_config:
              # CPU-only command. `total_memory_per_node` is intentionally
              # omitted: the memory floor is silently skipped on LSF/slurm (bare
              # HPC schedulers don't track memory as consumable), so it would be a
              # no-op here (unlike the slurm fixture, which sets 1Gi harmlessly).
              num_gpus_per_node: 0
            # No launcher_config.resources.cluster pin: the environment defines a
            # single allowed cluster (cloud_config.lsf.allowed_clusters:
            # [bluevela]), which SkyPilot's LSF backend deterministically selects.
