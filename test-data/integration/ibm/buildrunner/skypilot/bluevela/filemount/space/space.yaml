# Test-local space for the Skypilot/BlueVela-LSF file_mounts build test.
#
# Mirrors configurations/spaces/local so environments, assetstores, and builtin
# steps resolve from the shared assets directory — but ALSO carries the
# test-specific `steps/filemount-check` step in its own tree. The space's own
# directory is the first base_uri (see build/space.py), so
# `space://steps/filemount-check` resolves here; everything else falls through
# to configurations/assets.
name: filemount-bluevela-test
secret_manager:
  type: local
  config: {}
base_uris:
  # Pull assetstores, environments, and (builtin) steps from configurations/assets/.
  # Relative path resolves against this space.yaml's directory. Eight `..` because
  # the bluevela test tree (integration/ibm/buildrunner/skypilot/bluevela/) is one
  # level deeper than the slurm tree.
  - file://../../../../../../../../configurations/assets
variables:
  DEFAULT_ENVIRONMENT: skypilot/lsf/ibm-bluevela
