# YAML-driven spec for test/integration/ibm/buildrunner/skypilot/slurm_local/test_data_designer_rits.py.
#
# ONE target: a 4-row generation against RITS with min_records: 4, so SUCCESS means
# every row came back from the live model.
targets:
  - generate
target_expectations:
  - target_name: generate
    # No inputs, so no pull step; the env:// output moves no bytes, so no push step.
    step_count: 1
    input_artifact_count: 0
    output_artifact_count: 1    # questions (env://, registered inline from the marker)
    expected_steps:
      - step_uri: space://steps/data/data-designer
        config:
          data_designer_config:
            output: questions
            num_records: 4
# The step is not published yet, so resolve it from its locally rendered Space
# (make -C steps/data/data-designer/skypilot space). Switch to the shared
# configurations/spaces/local Space once the step is published.
space_uri: ../../../../../../../steps/data/data-designer/skypilot/space
tests:
  - runner
simulate_step_failure: false
# SLURM bring-up, a uv install of data-designer (no torch; light), then 4 RITS calls.
timeout_minutes: 30
