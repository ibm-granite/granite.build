granite.build:
  name: skypilot-kube-command-image-hf-test
  targets:
    image-run:
      environment_uri: space://environments/skypilot/kubernetes/local
      inputs:
        input_model:
          # Public dataset (same one the slurm 1step-image pulls), downloaded by a
          # separate hfpull step into the shared volume. The image step then reads
          # it from /shared — so the image needs nothing to download it itself.
          uri: hf:///datasets/ibm-research/vira-intents-live
      outputs:
        # hf:// outputs exercise hfpush on kube from an image step: the files this
        # image writes reach the separate hfpush pod via the shared volume. The
        # placeholders are filled per run by libgbtest.hfpush (org + run suffix),
        # which then checks each dataset landed on the Hub and deletes it.
        output_model1:
          uri: hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/skypilot-kube-img-test1___GBTEST_HF_PUSH_RUN__
        output_model2:
          uri: hf://huggingface.co/datasets/__GBTEST_HF_PUSH_ORG__/skypilot-kube-img-test2___GBTEST_HF_PUSH_RUN__
        env_output:
          uri: "env:///tmp/gb-env-output.txt"
          type: fileset
      steps:
        - step_uri: space://steps/command
          config:
            poll_interval_seconds: 5
            command_config:
              # Run INSIDE a container image (image_id: docker:<image>). Unlike
              # SLURM (Pyxis), kube runs images natively, so this always runs.
              #
              # The image must be Debian/Ubuntu-based OR already contain the
              # packages SkyPilot's pod bootstrap needs (rsync curl wget netcat
              # gcc patch pciutils openssh-server): it installs missing ones
              # with apt-get (sky/templates/kubernetes-ray.yml.j2). So the slurm
              # test's quay.io/fedora/fedora-minimal does not work here.
              # Plain Ubuntu (python3, no pip). public.ecr.aws mirrors the Docker
              # official images without Docker Hub's pull-rate limits.
              image: public.ecr.aws/docker/library/ubuntu:24.04
              # Fail unless (a) this really runs in the Ubuntu image and (b) the
              # input the hfpull pod wrote is visible inside it via the shared
              # volume, which the env mounts into every pod, image or not.
              # output_model1's files go in the working directory (the per-run
              # workdir on /shared), output_model2 re-pushes the input, as on slurm.
              command: >-
                . /etc/os-release; echo "running in: $PRETTY_NAME";
                case "$ID" in ubuntu) ;; *) echo "FAIL: expected the ubuntu image, got $ID"; exit 1;; esac;
                in={{ bindings.input_model.binding.path }};
                echo "input path: $in";
                test -n "$(ls -A "$in" 2>/dev/null)" || { echo "FAIL: input dir $in missing or empty in this image"; exit 1; };
                ls -la "$in";
                echo "workdir: $PWD";
                file=foo1a.json; echo '{"artifact": "output_model1", "file": "foo1a"}' > $file; echo "GB_ARTIFACT_ID:output_model1 GB_ARTIFACT_PATH:$file";
                file=foo1b.json; echo '{"artifact": "output_model1", "file": "foo1b"}' > $file; echo "GB_ARTIFACT_ID:output_model1 GB_ARTIFACT_PATH:$file";
                echo "GB_ARTIFACT_ID:output_model2 GB_ARTIFACT_PATH:$in";
                echo "pod-local output" > /tmp/gb-env-output.txt;
                echo "GB_ARTIFACT_ID:env_output GB_ARTIFACT_PATH:/tmp/gb-env-output.txt"
            compute_config:
              num_gpus_per_node: 0
              total_memory_per_node: 1Gi
