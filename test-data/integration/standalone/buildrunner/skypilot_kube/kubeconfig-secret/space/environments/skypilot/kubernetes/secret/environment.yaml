# skypilot/kubernetes/local, except the kind cluster's credentials come from the
# space secret `KIND-KUBECONFIG-SECRET` via kube_configs, not from the host's kubeconfig:
# gbserver writes it to this environment instance's own kubeconfig, which only
# its SkyPilot requests carry.
# The test runs it with a KUBECONFIG that lacks the kind context, so a launch can
# only reach the cluster through this block.
name: sky-kube-secret
type: Skypilot
subtype: kubernetes
config:
  default_cloud: kubernetes
  idle_minutes_to_autostop: 15
  shared_workdir: /shared
  kube_configs:
    - context: kind-skypilot
      # The name of a space secret, not a file. The test writes it
      # (TestSkypilotKubeKubeconfigSecret._credentials_only_from_the_secret in
      # test_skypilot_kube_kubeconfig_secret.py): the kind context's
      # kubeconfig, into the directory this space's local secret manager reads
      # (space.yaml, GBTEST_KUBE_SECRETS_DIR).
      kubeconfig: KIND-KUBECONFIG-SECRET
  cloud_config:
    kubernetes:
      allowed_contexts:
        - kind-skypilot
      context_configs:
        kind-skypilot:
          pod_config:
            spec:
              volumes:
                - name: gb-shared
                  persistentVolumeClaim:
                    claimName: gb-shared
              containers:
                # As in skypilot/kubernetes/local: reuse images already on the node.
                - name: ray-node
                  imagePullPolicy: IfNotPresent
                  volumeMounts:
                    - name: gb-shared
                      mountPath: /shared
