# skypilot/kubernetes/local, except the kind cluster's credentials come from the
# space secret `kind-kubeconfig` via kube_configs, not from the host's kubeconfig.
# The test runs it with a KUBECONFIG that lacks the kind context, so a launch can
# only reach the cluster through this block.
name: sky-kube-secret
type: Skypilot
subtype: kubernetes
config:
  default_cloud: kubernetes
  idle_minutes_to_autostop: 15
  shared_workdir: /shared
  kube_configs:
    - context: kind-skypilot
      kubeconfig: kind-kubeconfig
  cloud_config:
    kubernetes:
      allowed_contexts:
        - kind-skypilot
      context_configs:
        kind-skypilot:
          pod_config:
            spec:
              volumes:
                - name: gb-shared
                  persistentVolumeClaim:
                    claimName: gb-shared
              containers:
                # As in skypilot/kubernetes/local: reuse images already on the node.
                - name: ray-node
                  imagePullPolicy: IfNotPresent
                  volumeMounts:
                    - name: gb-shared
                      mountPath: /shared
