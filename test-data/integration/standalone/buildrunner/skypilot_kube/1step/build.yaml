granite.build:
  name: skypilot-kube-command-hf-test
  targets:
    pod-run:
      environment_uri: space://environments/skypilot/kubernetes/local
      inputs:
        input_model:
          # Public dataset (same one the slurm 1step pulls). skypilot/kubernetes/local
          # pulls it with a separate hfpull step into /shared/hf_cache on the shared
          # volume every pod mounts — the slurm model.
          uri: hf:///datasets/ibm-research/vira-intents-live
      outputs:
        env_output:
          uri: "env:///tmp/gb-env-output.txt"
          type: fileset
      steps:
        - step_uri: space://steps/command
          # The command step defaults to retry_enabled_default: false, and the
          # buildtest's simulate_step_failure only injects its synthetic failure
          # when step retry is enabled — without this the "retry" coverage passes
          # without ever retrying (the harness merely logs a warning). With it, the
          # injected failure makes AnyFailureRetryStrategy tear the pod down and
          # relaunch it under the same cluster name.
          retry_enabled: true
          config:
            poll_interval_seconds: 5
            command_config:
              # Fail loudly unless the input the hfpull step (a DIFFERENT pod) wrote
              # is visible in THIS pod — i.e. the shared volume works. Without it the
              # path exists only in the torn-down hfpull pod and `ls -A` is empty.
              command: >-
                in={{ bindings.input_model.binding.path }};
                echo "input path: $in";
                test -d "$in" || { echo "FAIL: input dir $in missing in this pod"; exit 1; };
                test -n "$(ls -A "$in")" || { echo "FAIL: input dir $in is empty in this pod"; exit 1; };
                ls -la "$in";
                echo "pod-local output" > /tmp/gb-env-output.txt;
                echo "GB_ARTIFACT_ID:env_output GB_ARTIFACT_PATH:/tmp/gb-env-output.txt"
            compute_config:
              num_gpus_per_node: 0
              total_memory_per_node: 1Gi
