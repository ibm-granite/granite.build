# YAML-driven spec for
# test/integration/standalone/buildrunner/skypilot_slurm/test_skypilot_filemount.py.
# Identical to the sibling 1step spec, but the target runs a custom step
# (space://steps/filemount-check) that copies a directory shipped next to its
# step.yaml via file_mounts and verifies it is present in the run command.
targets:
  - image-run
target_expectations:
  - target_name: image-run
    # Same shape as the 1step test: 1 hfpull (one HF input) + 1 step + 3 hfpush
    # (output_model1 emits 2 artifacts -> 2 hfpush, output_model2 emits 1 -> 1
    # hfpush). The env:// input/output are no-ops on the shared FS (one extra
    # input + output artifact each, no extra pull/push step). The file_mounts
    # copy adds no step. jobstats_count mirrors 1step (not asserted under
    # standalone's NoopLineageStore, but kept accurate).
    step_count: 5
    input_artifact_count: 2
    output_artifact_count: 3
    jobstats_count: 4
# Co-located test space (space/ next to this file) — carries the custom
# filemount-check step and chains to configurations/assets for everything else.
space_uri: space
# Run only the basic build (skip the cancellation variant) — this test verifies
# file_mounts, not cancel/retry behavior (covered by the sibling 1step test).
tests:
  - runner
# A single clean run with no injected synthetic failure: the step's run command
# fails the build if the mounted dir is absent, so SUCCESS proves the mount.
simulate_step_failure: false
timeout_minutes: 10 # Seems sufficient on mac running local slurm cluster
