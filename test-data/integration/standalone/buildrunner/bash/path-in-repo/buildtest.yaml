# Expectations for test/integration/standalone/buildrunner/bash/test_buildrunner_path_in_repo.py.
# build_yaml defaults to ./build.yaml (sibling) when omitted.
targets:
  - command
target_expectations:
  - target_name: command
    # One `command` step: the bash hf pull is inline (no extra pull step), and
    # the single hf:// input is registered as one input artifact.
    step_count: 1
    input_artifact_count: 1
    output_artifact_count: 0
# Use the shared standalone space at <repo>/configurations/spaces/local so the
# BuildRunner resolves space:// URIs without cloning from GitHub.
space_uri: ../../../../../../configurations/spaces/local
