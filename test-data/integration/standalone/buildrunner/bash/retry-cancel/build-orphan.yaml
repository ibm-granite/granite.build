granite.build:
  name: bash-retry-cancel-orphan-test
  # Long-lived workload used by test_cancel_reaps_workload_child to prove that
  # cancelling a build reaps the bash workload's process group (no orphan).
  #
  # The command writes its own shell PID to a fixed /tmp file (the same path the
  # test knows) and then sleeps far longer than the test. The test polls for that
  # file, then after cancelling asserts the PID is no longer alive
  # (os.kill(pid, 0)) — an OS-agnostic liveness check that needs no argv reading
  # (macOS cmdline() is unreliable). Killing the launch process group (what
  # cleanup_nohup does) reaps this shell and its sleep child together.
  #
  # max_retries has headroom so the chain would keep going if cancellation didn't
  # stop it.
  retries:
    max_retries: 5
  targets:
    orphan-target:
      allow_unknown: true
      environment_uri: space://environments/bash
      steps:
        - step_uri: space://steps/command
          config:
            command_config:
              command: 'echo $$ > /tmp/gborphan-5f3a9c2e-orphan-reap.pid; sleep 600'
            compute_config:
              num_nodes: 1
