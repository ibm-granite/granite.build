granite.build:
  name: mem_2target_bash
  # Two bash targets exercising the mem:// asset store for cross-target
  # output -> input binding on the in-process Bash environment. Unlike env://
  # (a shared-filesystem path), a mem:// URI is an opaque key into the build's
  # shared in-memory dict: the producer's binding `state` value is passed to the
  # consumer verbatim, so an arbitrary value survives intact (no path
  # normalisation). mem:// is registered implicitly for every environment
  # (Environment._register_default_memstore), so no `assetstores` entry is needed.
  #
  #   - `first` runs the generic `command` step and emits an
  #     `GB_ARTIFACT_ID:mem_output1 GB_ARTIFACT_STATE:mem_output1_value`
  #     marker; the command step's log_monitor registers `mem_output1_value` as
  #     the `state` of output `mem_output1` (uri mem://mem_output1), which
  #     pushasset_memstore stores in the build's shared memory.
  #   - `second` binds `first.mem_output1` as an input; pullasset_memstore reads
  #     the verbatim state back. The command ASSERTS the bound value equals
  #     `mem_output1_value` and exits non-zero (failing the target, hence the
  #     test) if it does not — proving the value flowed through the mem:// store.
  #     It then re-emits the value as its own mem:// output `mem_output2`.
  targets:
    first:
      environment_uri: space://environments/bash
      outputs:
        mem_output1:
          # mem:// output: an opaque key, not a path — no `type` needed (mem://
          # transfers nothing; the value is the binding state, not a fileset).
          uri: "mem://mem_output1"
      steps:
        - step_uri: space://steps/command
          config:
            command_config:
              command: >-
                echo "first target emitting mem:// output mem_output1";
                echo "GB_ARTIFACT_ID:mem_output1 GB_ARTIFACT_STATE:mem_output1_value"
            compute_config:
              num_nodes: 1
    second:
      environment_uri: space://environments/bash
      inputs:
        from_first:
          binding: first.mem_output1
      outputs:
        mem_output2:
          uri: "mem://mem_output2"
      steps:
        - step_uri: space://steps/command
          config:
            command_config:
              # Assert the state bound from first.mem_output1 is the exact value
              # `first` produced. The command step exits with the command's
              # status, so a mismatch (or an empty/None value if the mem:// value
              # did not flow) hard-FAILS this target and therefore the test.
              command: >-
                echo "second target received mem input: {{ bindings.from_first.binding.state }}";
                if [ "{{ bindings.from_first.binding.state }}" != "mem_output1_value" ]; then
                  echo "ERROR: expected mem_output1_value, got '{{ bindings.from_first.binding.state }}'";
                  exit 1;
                fi;
                echo "GB_ARTIFACT_ID:mem_output2 GB_ARTIFACT_STATE:{{ bindings.from_first.binding.state }}"
            compute_config:
              num_nodes: 1
