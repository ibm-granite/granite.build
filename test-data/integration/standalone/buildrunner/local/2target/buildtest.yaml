# YAML-driven spec for
# test/integration/standalone/buildrunner/local/test_buildrunner_2target.py.
# build_yaml defaults to ./build.yaml (sibling) when omitted.
#
# Two command-step targets on the in-process Bash environment. `second` binds
# `first`'s mem:// output, proving cross-target output -> input binding over the
# mem:// (in-memory) assetstore: the producer's verbatim `state` value is passed
# to the consumer without touching a filesystem.
targets:
  - first
  - second
target_expectations:
  # step_count = 1 per target: the mem:// assetstore is a no-op transfer (no
  # pull/push step is queued), so only the single `command` step is recorded.
  # mem:// push/pull register one output/input artifact each, inline.
  - target_name: first
    step_count: 1
    input_artifact_count: 0
    output_artifact_count: 1
    jobstats_count: 1
  - target_name: second
    step_count: 1
    input_artifact_count: 1
    output_artifact_count: 1
    jobstats_count: 1
# Use the shared standalone space at <repo>/configurations/spaces/local so the
# BuildRunner resolves space:// URIs (the bash environment and the command step)
# without cloning from GitHub. Relative to this YAML's directory.
space_uri: ../../../../../../configurations/spaces/local
# A happy-path binding test — no simulated failure, and skip the cancellation run
# (the command step finishes near-instantly, so cancellation can't reliably catch
# it RUNNING). Mirrors the 1step/local and command-2target fixtures.
simulate_step_failure: false
tests:
  - runner
