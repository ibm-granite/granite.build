granite.build:
  name: docker-image-hf-test
  targets:
    image-run:
      environment_uri: space://environments/docker
      inputs:
        input_model:
          uri: hf:///datasets/ibm-research/vira-intents-live
      outputs:
        output_model1:
          uri: hf://huggingface.co/datasets/ibm-research/test-output1_{{ binding.path | short_hash }}
        output_model2:
          uri: hf://huggingface.co/datasets/ibm-research/test-output2_{{ binding.path | short_hash }}
      steps:
        - step_uri: space://steps/command
          config:
            command_config:
              # Public quay.io image (no anonymous pull-rate limits, unlike
              # Docker Hub).  The docker `command` step runs `bash -c <command>`,
              # so the image must contain bash — which rules out the busybox
              # images used elsewhere in the tests (sh only).
              # We include a sleep 5 to allow the cancellation test to pass
              image: quay.io/fedora/fedora-minimal:42
              command: >-
                sleep 5;
                mkdir /gb-workspace/outputs;
                file=/gb-workspace/outputs/foo1a.json; echo '{"artifact": "output_model1", "file": "foo1a"}' > $file; echo "GB_ARTIFACT_ID:output_model1 GB_ARTIFACT_PATH:$file";
                file=/gb-workspace/outputs/foo1b.json; echo '{"artifact": "output_model1", "file": "foo1b"}' > $file; echo "GB_ARTIFACT_ID:output_model1 GB_ARTIFACT_PATH:$file";
                file=/gb-workspace/outputs/foo2.json; echo '{"artifact": "output_model2", "file": "foo2"}' > $file; echo "GB_ARTIFACT_ID:output_model2 GB_ARTIFACT_PATH:$file"
            compute_config:
              num_gpus_per_node: 0
              total_memory_per_node: 1Gi
