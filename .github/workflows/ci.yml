name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'samples/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'samples/**'
  merge_group:

jobs:
  lint:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[standalone,thirdparty,dev]"

      - name: Check formatting (isort)
        run: isort --profile black --check .

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (pylint)
        run: |
          pylint src/gbserver/
          pylint src/gbcli/
          pylint src/gbcommon/

      - name: Type check (mypy)
        continue-on-error: true
        run: |
          mypy --disable-error-code=import-untyped --ignore-missing-imports src/gbserver/
          mypy --disable-error-code=import-untyped --ignore-missing-imports src/gbcli/
          mypy --disable-error-code=import-untyped --ignore-missing-imports src/gbcommon/

  # The frontend workspace (frontend/packages/ui-core + frontend/apps/standalone) had
  # no CI coverage, so a change that broke `yarn build` or the standalone tests still
  # reported green. Matters more now that ui-core is consumed externally as a git
  # dependency: breakage here propagates to consumers.
  frontend:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No Node version is pinned anywhere in the repo (no .nvmrc/.node-version, no
      # engines field), so this is a fresh choice: 22 is the active LTS, and 20 went
      # end-of-life in April 2026.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      # Build before test, not merely conventionally: standalone's `test` script globs
      # tests/*.test.js, which includes build-output.test.js — it asserts against the
      # contents of out/ and fails if no build has run.
      - name: Build
        working-directory: frontend
        run: yarn build

      - name: Test
        working-directory: frontend
        run: yarn test

  test:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      # Let the other interpreter finish: whether a failure reproduces on both is
      # the cheapest way to tell a flake from a real break.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quick test dependencies
        run: |
          python -m pip install --upgrade pip
          make quick-tests-setup

      # Preload the images the Docker tests use from the Actions cache, so PR runs
      # don't pull from a rate-limited registry. Only pushes to main save the
      # cache; PR runs (forks included) restore from main's scope.
      - name: Restore cached Docker images
        id: docker-images-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-docker-images
          key: ci-docker-images-${{ hashFiles('test-data/ci-docker-images.env') }}

      - name: Load Docker images (pull with retry on cache miss)
        run: scripts/ci-docker-images.sh load

      # One matrix leg saves, so the two don't race to reserve the same key.
      - name: Save Docker images to cache
        if: matrix.python-version == '3.12' && github.event_name == 'push' && steps.docker-images-cache.outputs.cache-hit != 'true'
        run: scripts/ci-docker-images.sh save

      - name: Upload Docker image cache
        if: matrix.python-version == '3.12' && github.event_name == 'push' && steps.docker-images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ci-docker-images
          key: ${{ steps.docker-images-cache.outputs.cache-primary-key }}

      - name: Run quick tests
        run: make quick-tests

  demo-cpu:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[standalone,docker,dev]"

      # Same preload as the test job, for the Dockerfile's FROM image.
      - name: Restore cached Docker images
        id: docker-images-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-docker-images
          key: ci-docker-images-${{ hashFiles('test-data/ci-docker-images.env') }}

      - name: Load Docker images (pull with retry on cache miss)
        run: scripts/ci-docker-images.sh load

      - name: Build CPU test image
        run: |
          docker build -t gbserver-test-trl-unitxt:cpu \
            -f test-data/standalone-environments/docker/Dockerfile.cpu.test \
            test-data/standalone-environments/docker/

      - name: Run standalone demo (CPU)
        run: bash scripts/demo-standalone.sh
