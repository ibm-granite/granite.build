name: SLURM Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/gbserver/environment/skypilot.py'
      - 'scripts/slurm/**'
      - 'test/integration/environment/**'
      - '.github/workflows/slurm-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/gbserver/environment/skypilot.py'
      - 'scripts/slurm/**'
      - 'test/integration/environment/**'
      - '.github/workflows/slurm-integration.yml'

jobs:
  slurm-integration:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          make venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Start Docker SLURM cluster
        run: bash scripts/slurm/setup-slurm.sh

      - name: Verify SkyPilot sees SLURM
        run: sky check slurm

      - name: Run SLURM integration tests
        run: pytest -s -m skypilot_integration test/integration/environment/ -v

      - name: Teardown SLURM cluster
        if: always()
        run: bash scripts/slurm/teardown-slurm.sh
