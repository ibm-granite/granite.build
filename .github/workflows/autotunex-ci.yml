# AutoTuneX CI — path-filtered gate for the vendored autotunex/ subtree.
#
# Runs the subtree's own `cd autotunex && make check` (ruff + mypy strict + pytest —
# the gate its 1300+ tests were written against). The monorepo's repo-wide
# black/isort lint does NOT govern autotunex/: the root pyproject excludes the
# prefix ([tool.black] extend-exclude / [tool.isort] extend_skip_glob), so this
# workflow is the subtree's gate instead.
#
# A second job, fm-tune, runs the vendored src/fm-tune suite, which `make check`
# does not: the check job installs fm-tune torch-free, and most of its tests import
# the training stack. It installs fm-tune[core] and runs `make test-fm-tune`, which
# deselects the `slow` (HF weights), `gpu` (CUDA) and `full` (verl/hydra) markers.
# torch is installed first from the CPU index so [core]'s torch==2.8.0 pin is
# already met and pip skips the multi-GB default CUDA wheel; keep the two pins in
# step, or the [core] install swaps CPU torch for the CUDA wheel (slow, still green).
#
# Install extras: [dev] and [mcp] are both CI-only additions. fastmcp is an opt-in
# leaf feature that no runtime install should pay for (see pyproject.toml), but
# tests/api/test_mcp.py importorskips it — without [mcp] here that suite silently
# skips in the one place that gates and api/mcp.py stays at 27% coverage. Note it
# is a floored range (>=2.3,<4) rather than an exact pin like the base deps, so an
# upstream fastmcp release can turn this red with no local change.
#
# Trigger note: pull_request workflow definitions come from the BASE branch, so this
# job starts running on PRs only once it is on the default branch; it always runs on
# pushes to main under the autotunex/** path filter. merge_group is intentionally
# omitted so a path-skipped run cannot block the merge queue as a required check —
# add it to branch protection if you want it required.
#
# Path filter: `paths` and `paths-ignore` cannot both be set for one event, so the
# doc-only exclusions ci.yml expresses via paths-ignore are `!` negations here, which
# must follow the positive pattern to take effect. `**.md` rather than ci.yml's
# `**/*.md` so the subtree-root autotunex/README.md is covered too; autotunex/ has no
# samples/ dir to exclude. The list is repeated per event rather than shared via a
# YAML anchor, matching ci.yml.
name: AutoTuneX CI

on:
  push:
    branches: [main]
    paths:
      - 'autotunex/**'
      - '!autotunex/docs/**'
      - '!autotunex/**.md'
  pull_request:
    branches: [main]
    paths:
      - 'autotunex/**'
      - '!autotunex/docs/**'
      - '!autotunex/**.md'

jobs:
  check:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: autotunex
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (service + torch-free fm-tune catalog)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install -e "./src/fm-tune"

      - name: make check (ruff + mypy strict + pytest)
        run: make check

  fm-tune:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: autotunex
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (fm-tune[core] on CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e "./src/fm-tune[core]" pytest==9.1.1

      - name: make test-fm-tune
        run: make test-fm-tune
