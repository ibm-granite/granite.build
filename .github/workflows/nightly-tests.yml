name: Nightly Extended Tests

# Runs the heavier, live extended test suite on a nightly schedule against the
# default branch. This replaces the previously merge-triggered `extended-test`
# job in ci.yml, catching regressions caused by external/live dependencies (HF,
# SLURM) that drift independently of repo changes.
#
# NOTE: GitHub only runs `schedule` triggers on the default branch (main), so
# this workflow always tests main. Use the `workflow_dispatch` trigger to run
# it on demand from the Actions tab.

on:
  schedule:
    # 02:17 UTC daily. The off-the-hour minute avoids the congestion that
    # delays scheduled runs queued on the hour.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  extended-test:
    # Scheduled workflows also fire on a fork's own default branch, so guard
    # every job to the canonical repo — forks shouldn't run the nightly suite.
    if: github.repository == 'ibm-granite/granite.build'
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.12 just because 3.11 failed — we want both results.
      fail-fast: false
      matrix:
        # python-version: ["3.11", "3.12"]
        python-version: ["3.12"] # Only run 1 python since HF rate limit may be failing us
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install extended test dependencies
        run: |
          python -m pip install --upgrade pip
          make extended-tests-setup

      # Same preload as ci.yml, restore-only: reuse main's cached images
      # instead of pulling from a rate-limited registry mid-test.
      - name: Restore cached Docker images
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ci-docker-images
          key: ci-docker-images-${{ hashFiles('test-data/ci-docker-images.env') }}
          restore-keys: ci-docker-images-

      - name: Load Docker images (pull with retry on cache miss)
        run: scripts/ci-docker-images.sh load

      # Images only the nightly uses, in their own cache (ci.yml never saves
      # them). Non-fatal: a failed pull fails only the test that needs the image.
      - name: Restore cached nightly Docker images
        id: nightly-images-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/nightly-docker-images
          key: nightly-docker-images-${{ hashFiles('test-data/nightly-docker-images.env') }}
          restore-keys: nightly-docker-images-

      - name: Load nightly Docker images (pull with retry on cache miss)
        id: nightly-images-load
        continue-on-error: true
        run: |
          CI_DOCKER_IMAGE_LIST=test-data/nightly-docker-images.env \
          CI_DOCKER_IMAGE_CACHE_DIR="$HOME/.cache/nightly-docker-images" \
            scripts/ci-docker-images.sh load

      - name: Save nightly Docker images to cache
        if: steps.nightly-images-cache.outputs.cache-hit != 'true' && steps.nightly-images-load.outcome == 'success'
        continue-on-error: true
        run: |
          CI_DOCKER_IMAGE_LIST=test-data/nightly-docker-images.env \
          CI_DOCKER_IMAGE_CACHE_DIR="$HOME/.cache/nightly-docker-images" \
            scripts/ci-docker-images.sh save

      - name: Upload nightly Docker image cache
        if: steps.nightly-images-cache.outputs.cache-hit != 'true' && steps.nightly-images-load.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/nightly-docker-images
          key: ${{ steps.nightly-images-cache.outputs.cache-primary-key }}

      # kind pods don't see the host's images.
      - name: Load Docker images into the kind cluster
        if: steps.nightly-images-load.outcome == 'success'
        continue-on-error: true
        run: |
          source .venv/bin/activate
          CI_DOCKER_IMAGE_LIST=test-data/nightly-docker-images.env \
            scripts/ci-docker-images.sh kind-load UBUNTU_IMAGE

      - name: Run extended tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make extended-tests

      # The SkyPilot API server logs only here.
      - name: Upload SkyPilot API server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skypilot-api-server-log-${{ matrix.python-version }}
          path: ~/.sky/api_server/server.log
          if-no-files-found: ignore

  report-failure:
    # Open (or update) a tracking issue when the nightly run fails, so failures
    # are visible without watching the Actions tab. Runs only on the scheduled
    # run, not manual dispatch, to avoid noise from ad-hoc debugging.
    needs: extended-test
    if: failure() && github.event_name == 'schedule' && github.repository == 'ibm-granite/granite.build'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly extended tests failed"
          LABEL="nightly-failure"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BODY="The nightly extended test suite failed on \`main\`.

          - Run: ${RUN_URL}
          - When: ${DATE}

          See the run logs for the failing test(s)."

          # Ensure the dedup label exists (idempotent).
          gh label create "$LABEL" --color B60205 \
            --description "Automated nightly extended-test failures" 2>/dev/null || true

          # Reuse an existing open issue if one is already tracking this.
          EXISTING="$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi

  close-failure-issue:
    # When the nightly run goes green again, close any open tracking issue so it
    # doesn't linger after the underlying problem is fixed. Scheduled runs only,
    # mirroring report-failure (just success() instead of failure()), so a manual
    # workflow_dispatch run won't touch the issue. With fail-fast: false, success()
    # is true only when both 3.11 and 3.12 pass — the correct "green" condition.
    # The two jobs' if conditions are mutually exclusive, so they never both run.
    needs: extended-test
    if: success() && github.event_name == 'schedule' && github.repository == 'ibm-granite/granite.build'
    runs-on: ubuntu-latest
    steps:
      - name: Close open failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="nightly-failure"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BODY="Nightly extended tests passed on \`main\` again — closing.

          - Run: ${RUN_URL}
          - When: ${DATE}"

          # Close every open tracking issue (normally just one).
          gh issue list --state open --label "$LABEL" --json number \
            --jq '.[].number' | while read -r NUM; do
            [ -n "$NUM" ] || continue
            gh issue comment "$NUM" --body "$BODY"
            gh issue close "$NUM"
          done
