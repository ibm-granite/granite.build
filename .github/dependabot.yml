# Dependabot version updates. Only GitHub Actions for now: the workflows pin
# each action to a commit SHA with the release in a comment, and Dependabot
# updates both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for all minor and patch updates. Each major
    # upgrade comes as its own pull request, so a breaking change can be
    # traced to one action.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
