granite.build:
  name: skypilot-slurm-dpk-default-output
  # Tokenization with `output_path` OMITTED, on the local Docker SLURM cluster.
  #
  # WHAT THIS FIXTURE IS FOR: `output_path` is optional and defaults to ./output
  # in the step's working directory. The sibling fixtures both set it explicitly
  # (test-data/slurm needs a shared path for its cross-target handoff, and
  # test-data/slurm-pii declares an env:///tmp uri whose path must match), so
  # neither exercises the default. This one does.
  #
  # WHAT REACHING SUCCESS PROVES, that a render test cannot:
  #   1. The step's `mkdir -p ./output` + `OUT="$(cd "$OUT" && pwd)"` really
  #      resolves inside SkyPilot's working directory on a remote node.
  #   2. The ABSOLUTE path that lands in the GB_ARTIFACT_PATH marker is one the
  #      skypilot monitor accepts and registers as the `tokens` artifact — the
  #      monitor takes the marker path verbatim as the binding, so a relative or
  #      non-existent path would register garbage rather than fail loudly.
  #   3. The transform actually WROTE there (output_artifact_count below), rather
  #      than the step merely creating an empty directory.
  #
  # WHY NO DOWNSTREAM TARGET: the default is only safe for output no other target
  # reads. The working directory is the per-run workdir
  # (${shared_workdir}/builds/<build_id>/runs/<targetrun_id>), which is minted per
  # TARGET by setup_skypilot and rm -rf'd by teardown_skypilot when that target
  # finishes — so a consumer in another target would read a deleted directory.
  # Keeping this single-target is the point, not a shortcut; the cross-target path
  # is covered by test-data/slurm, which sets an explicit /shared output_path.
  #
  # Input is the same public hf:// dataset the tokenization fixture uses, so this
  # needs no credentials.
  targets:

    tokenize:
      environment_uri: space://environments/skypilot/slurm
      inputs:
        docs:
          # DPK's own tokenization test fixture (5 parquet, 2 deliberately empty,
          # Apache-2.0), mirrored to the Hub so it stages with no credentials.
          uri: hf:///datasets/shalisha-witherspoon/dpk-tokenization-sample
      outputs:
        tokens:
          # A PATHLESS output: nothing downstream consumes it, so the declared uri
          # names no directory the step has to match. This is what makes the
          # default appropriate here — contrast the sibling fixtures, whose uris
          # both name a path that `output_path` must equal.
          #
          # The step still registers a concrete ABSOLUTE path for this output from
          # its marker (the monitor takes the marker path verbatim), which is
          # exactly the behaviour under test.
          uri: "env:///tokens"
          type: dataset
      steps:
        - step_uri: space://steps/dpk
          config:
            # Fast completion detection (the monitor's own default is 300s, which
            # would dominate wall-clock for this quick job).
            poll_interval_seconds: 5
            dpk_config:
              # tokenization2arrow rather than pii_redactor: same derivation
              # contract, but a ~5-minute install instead of ~60 (the
              # [pii-redactor] extra pulls torch + flair + presidio). This fixture
              # is about output_path, not about dependency weight.
              transform: tokenization2arrow
              dpk_version: "1.1.8"
              input: docs
              output: tokens
              # output_path DELIBERATELY OMITTED -> ./output, absolutized by the
              # step before it emits the artifact marker. This single omission is
              # the whole point of the fixture; do not "fix" it by adding a path.
              args:
                tkn_tokenizer: hf-internal-testing/llama-tokenizer
                tkn_doc_id_column: document_id
                tkn_doc_content_column: contents
                tkn_text_lang: en
                tkn_chunk_size: 0
            compute_config:
              num_gpus_per_node: 0
              # Advisory on SLURM: the compute_config memory floor is skipped for
              # the SLURM/LSF clouds, so this will not leave the job PENDING even
              # though the local cluster's nodes advertise RealMemory=1024.
              total_memory_per_node: 4Gi
