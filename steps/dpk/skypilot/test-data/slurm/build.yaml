granite.build:
  name: skypilot-slurm-dpk-tokenize
  # DPK tokenize -> validate on the local Docker SLURM cluster (via SkyPilot),
  # exercising BOTH of the dpk step's modes with one step definition:
  #
  #   tokenize  transform mode — `transform: tokenization2arrow` is the only DPK
  #                              detail given; the step derives the python module
  #                              (dpk_tokenization2arrow.runtime) and the pip extra
  #                              (data-prep-toolkit-transforms[tokenization2arrow]).
  #   validate  command mode   — runs the step's own bundled src/validate_tokens.py.
  #                              Not a DPK transform, so it takes the verbatim
  #                              `command` escape hatch.
  #
  # CROSS-NODE HANDOFF (why the output URI is /shared and not /tmp):
  #   The two targets are separate workloads and may be scheduled on different
  #   SLURM compute nodes (c1..c4). env:// moves no bytes — EnvURI.pull() is a
  #   no-op — and the consumer's `{{ bindings.tokens.binding.path }}` resolves to
  #   the declared URI's path, so the bytes only survive the hop if `tokenize`
  #   physically writes them onto a filesystem `validate` can read. On this
  #   cluster /tmp is per-node but /shared (the slurm environment's
  #   shared_workdir) is mounted on every node. `output_path` therefore points at
  #   /shared and must match the `uri` below.
  #
  # Input is an hf:// dataset binding: the SkyPilot launcher injects
  # `hf download <repo> --local-dir <path>` into the step's setup, and the step
  # exports the staged path as $LLMB_INPUT_docs. The dataset is public, so no
  # HF_TOKEN is needed here or in CI.
  targets:

    tokenize:
      environment_uri: space://environments/skypilot/slurm
      inputs:
        docs:
          # Public dataset: DPK's own tokenization test fixture (5 parquet, 2
          # deliberately empty, Apache-2.0) mirrored to the Hub so it stages on
          # every endpoint with no credentials.
          # NOTE: personal namespace pending an org move — an ibm-research request
          # is outstanding. Only this URI changes when it lands.
          uri: hf:///datasets/shalisha-witherspoon/dpk-tokenization-sample
      outputs:
        tokens:
          # On the shared FS so `validate` can read it from any node. The
          # short_hash keys the path per run so concurrent runs don't collide;
          # it is rendered from THIS target's run metadata and the step writes to
          # the identical rendered path via output_path below.
          uri: "env:///shared/dpk-tokenize/{{ run_metadata.targetsteprun_id | short_hash }}"
          type: dataset
      steps:
        - step_uri: space://steps/dpk
          config:
            # Fast completion detection (the skypilot monitor's own default is
            # 300s, which would dominate wall-clock for this quick job).
            poll_interval_seconds: 5
            dpk_config:
              transform: tokenization2arrow
              dpk_version: "1.1.8"
              input: docs
              output: tokens
              # Must equal the `tokens` uri path above (same Jinja expression).
              output_path: "/shared/dpk-tokenize/{{ run_metadata.targetsteprun_id | short_hash }}"
              args:
                # Full flag names as DPK spells them — tokenization's prefix is
                # `tkn_`, which is NOT derivable from the module name, so the step
                # passes these through verbatim.
                tkn_tokenizer: hf-internal-testing/llama-tokenizer
                tkn_doc_id_column: document_id
                tkn_doc_content_column: contents
                tkn_text_lang: en
                tkn_chunk_size: 0
            compute_config:
              num_gpus_per_node: 0
              # The compute_config memory floor is skipped for the SLURM/LSF
              # clouds (they don't reliably track memory as a consumable), so this
              # is advisory here and will not leave the job PENDING even though the
              # local cluster's nodes advertise RealMemory=1024.
              total_memory_per_node: 4Gi

    validate:
      environment_uri: space://environments/skypilot/slurm
      inputs:
        tokens:
          # Binds tokenize.tokens, so this target is dispatched only once that
          # artifact registers. binding.path resolves to the declared /shared
          # path, readable on whichever node this lands on.
          binding: tokenize.tokens
        docs:
          # The source parquet again, so the validator's --input pass can confirm
          # every non-empty source file actually produced output — a check the
          # consistency pass cannot make, since it only sees the output side.
          uri: hf:///datasets/shalisha-witherspoon/dpk-tokenization-sample
      outputs:
        report:
          # Terminal: nothing downstream consumes it, so a node-local /tmp path is
          # fine (unlike the tokens handoff above).
          uri: "env:///tmp/dpk-validate-report"
          type: fileset
      steps:
        - step_uri: space://steps/dpk
          config:
            poll_interval_seconds: 5
            dpk_config:
              # No `transform` => command mode. Only pyarrow is installed; the
              # validator needs nothing else.
              packages: ["pyarrow"]
              # src/ is file-mounted to ./src by the step, and run starts in the
              # same working directory, so a relative path resolves. In command
              # mode the command emits its own artifact marker.
              command: |
                REPORT=/tmp/dpk-validate-report
                rm -rf "$REPORT"; mkdir -p "$REPORT"
                python src/validate_tokens.py "$LLMB_INPUT_tokens" "$REPORT" \
                  --input "$LLMB_INPUT_docs"
                echo "LLMB_ARTIFACT_ID:report LLMB_ARTIFACT_PATH:$REPORT"
            compute_config:
              num_gpus_per_node: 0
              total_memory_per_node: 4Gi
