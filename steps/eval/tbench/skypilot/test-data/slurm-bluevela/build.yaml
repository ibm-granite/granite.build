granite.build:
  name: skypilot-slurm-bluevela-eval-tbench-test
  targets:
    tbench-test:
      environment_uri: space://environments/skypilot/slurm/bluevela
      inputs:
        # The model checkpoint as a real HF artifact: the launcher queues an
        # hfpull step for it (public model, no token) and stages the download;
        # the step then serves the binding path -- the artifact flow the
        # env://-only fixtures never exercise.
        model:
          uri: "hf:///ibm-granite/granite-4.2-3b"
          type: model
      outputs:
        granite_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/eval/tbench
          config:
            poll_interval_seconds: 5
            log_retrieval_interval_seconds: 30
            benchmark: "terminal-bench-2.1"
            image: "us.icr.io/cil15-shared-registry/gb-step-eval-tbench:ce003c94"
            # The staged HF artifact path (its basename is not the
            # model name, so pin the name vLLM advertises).
            model_path: "{{ bindings.model.binding.path }}"
            served_model_name: "granite-4.2-3b"
            options: ""
            # Relative: composes and then resolves against the per-run
            # $GB_BUILD_WORKDIR (the output_dir rule) -- no cluster path.
            output_root: "tbench"
            run_name: "buildtest"
            # Smoke knob: first N examples, so the run stays minutes-scale.
            limit: "1"
            workers: "2"
            phase: "all"
            # Empty = the image's node-local default: the pinned dataset
            # download lands per job (hermetic; no shared-FS path to name).
            hf_home: ""
            # enroot squashfs cache, workdir-relative: each build pulls its
            # own task images (hermetic; no cross-environment path).
            sandbox_cache: "enroot-cache"
            launcher_config:
              resources:
                cluster: "bluevela"
                zone: "gpu-mid"
                accelerators: "H200:1"
                memory: 256
