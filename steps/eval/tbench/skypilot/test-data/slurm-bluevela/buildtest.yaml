# YAML-driven spec for test_skypilot_slurm_bluevela_eval_tbench.py (located by
# the test/ <-> test-data/ helper; see steps/README.md). A real model run of
# terminal-bench-2.1 (granite-4.2-3b served by vLLM in the job, small LIMIT), proving
# the Terminal-Bench harness inside the family image, the enroot-sandboxed task containers, and the results.json.
targets:
  - tbench-test
target_expectations:
  - target_name: tbench-test
    # One target, one step record (phase all: generate + score in one job).
    step_count: 1
    input_artifact_count: 0
    output_artifact_count: 1
    expected_steps:
      - config:
          benchmark: terminal-bench-2.1
          phase: all
# The Space rendered by `make space` (the local tbench step), as for the other
# clusters; publish-step rewrites it to configurations/spaces/local. The
# environment comes from the shared BlueVela SLURM space.
space_uri: ../../space
tests:
  - runner
simulate_step_failure: false
# Shared-partition queueing on BlueVela can take a while, plus vLLM startup.
timeout_minutes: 60
