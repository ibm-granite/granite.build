# YAML-driven spec for test_skypilot_slurm_bluevela_eval_mcpmark.py (located by
# the test/ <-> test-data/ helper; see steps/README.md). A real model run of
# mcpmark-filesystem (granite-4.2-3b served by vLLM in the job, small LIMIT), proving
# upstream's MCP harness, the filesystem MCP server in its enroot sandbox, agentic tool use against the served model, and the aggregated results.json.
targets:
- mcpmark-test
target_expectations:
- target_name: mcpmark-test
  step_count: 2
  input_artifact_count: 1
  output_artifact_count: 1
  expected_steps:
  - config:
      benchmark: mcpmark-filesystem
      phase: all
      options: task_suite=easy
    step_uri: space://steps/eval/mcpmark
space_uri: ../../space
tests:
- runner
simulate_step_failure: false
timeout_minutes: 60
