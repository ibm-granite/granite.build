# YAML-driven spec for test_skypilot_slurm_bluevela_eval_lm_eval.py (located by the
# test/ <-> test-data/ helper, so this pairing holds in both test modes; see
# steps/README.md).
#
# ONE target on an internal GPU SLURM cluster: lm_eval run on one H200, against a
# bound hf:// model. See the sibling build.yaml for what SUCCESS proves.
targets:
  - aime25
target_expectations:
  - target_name: aime25
    # hfpull(model) + eval/lm-eval + hfpush(results). The env runs the hf assetstore
    # pull and push as their own steps (on the cpu partition), not inline.
    step_count: 3
    input_artifact_count: 1    # model
    output_artifact_count: 1   # results
    # Only keys the build.yaml supplied are persisted, so these are values it set.
    expected_steps:
      - step_uri: space://steps/eval/lm-eval
        metadata_matches:
          lm_eval_version: "^0\\.4\\.13$"
        config:
          lm_eval_config:
            image: ""
            tasks: ["aime25"]
            torch_index_url: ""
            device: cuda
# The local Space rendered by `make space`; `make publish-step` rewrites this line to
# configurations/spaces/local in the published copy. The environment comes from
# configurations/assets through that space's base_uris.
space_uri: ../../space
# Happy-path run only: no stable RUNNING window to cancel in.
tests:
  - runner
# `set -euo pipefail` fails the target if the install or lm_eval fails.
simulate_step_failure: false
# Three SLURM jobs plus GPU queue time: the model pull; the step (a runtime install of
# CUDA torch and lm-eval, several GB, then 3 aime25 problems at up to ~6 minutes each);
# and the results push. Generous headroom.
timeout_minutes: 60
