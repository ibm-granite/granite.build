# YAML-driven spec for test_skypilot_slurm_bluevela_eval_officeqa.py (located
# by the test/ <-> test-data/ helper; see steps/README.md). The recipes'
# shape on a synthetic dataset: officeqa-pro generates on the family's GPU
# image (the model answers from invented gold-page contexts) and scores on
# its CPU image, bound by the granite_generation artifact, so one build test
# covers both family images with no HF gate and no token.
targets:
- officeqa-generate
- officeqa-score
target_expectations:
- target_name: officeqa-generate
  step_count: 3
  input_artifact_count: 2
  output_artifact_count: 1
  expected_steps:
  - config:
      benchmark: officeqa-pro
      phase: generate
    step_uri: space://steps/eval/officeqa
- target_name: officeqa-score
  step_count: 3
  input_artifact_count: 3
  output_artifact_count: 1
  expected_steps:
  - config:
      benchmark: officeqa-pro
      phase: score
      image: us.icr.io/cil15-shared-registry/gb-step-eval-officeqa-cpu:ce003c94
    step_uri: space://steps/eval/officeqa
space_uri: ../../space
tests:
- runner
simulate_step_failure: false
timeout_minutes: 60
