name: ifbench
version: 0.1.0
# Granite benchmark: IFBench (prompt), pass@1 loose / strict accuracy.
#
# ONE STEP PER GRANITE_EVALS IMAGE FAMILY. `benchmark` selects which
# benchmark in this family to run; every steps/eval/*/ template has the same shape
# and differs only in `name`, the family's image env var, and its defaults.
# skypilot/test/test_step_template.py holds them to that. Recipes
# (recipes/evals/ifbench/...) choose which benchmarks a model family is scored on
# and set `benchmark` per target.
#
# THE CODE LIVES IN THIS REPO. The benchmark runtime is vendored under steps/eval/src
# (core + this family's modules) and baked into the family's image by
# the Dockerfile.gpu / Dockerfile.cpu in this family's directory (see
# steps/eval/Makefile). The image is chosen at run time from config.image.
# Nothing is cloned or mounted at launch.
#
# WHAT RUNS. `granite-evals run ifbench` serves model_path with vLLM inside the
# job and runs NVIDIA NeMo-Skills' own ifbench pipeline against it, locally (no Slurm,
# no NeMo-Run): its data preparation (allenai/IFBench test file, pinned by commit and
# sha256), prompt, generation, IFBench's own strict/loose verifiers (at the IFBench
# commit ns pins, baked into the image) and ns's `if` metrics. The value is the
# prompt-level loose accuracy; details.metrics adds prompt-level strict and the
# instruction-level loose and strict accuracies. Writes one results.json (schema: granite_evals/results.py).
#
# PHASES. So that no job holds an idle GPU, recipes run this step twice on one
# output_dir: phase generate on a GPU (vLLM + the model's work only) and phase score
# on CPU (grading, no vLLM; it refuses to generate). phase all does both in one job.
#
# CUSTOM, not EVAL: gbcommon's StepType has no EVAL member.
type: custom
config:
  # The benchmark id passed to `granite-evals run`. Required, e.g. "ifbench".
  # See `granite-evals list` for this family's benchmark ids.
  benchmark: ""
  # The granite-evals image for this benchmark family (`make image-ifbench` in
  # steps/eval), pinned by its tag; results.json records the versions inside.
  # Recipes set it once, as the GRANITE_EVALS_IMAGE_IFBENCH parameter.
  image: ""
  # The checkpoint to score, as a LOCAL PATH (normally a distill-hf-export `hf_model`
  # or an hfpull binding). Required.
  model_path: ""
  # Name the model is served under; empty = basename of model_path.
  served_model_name: ""
  # Relative values resolve against $GB_BUILD_WORKDIR.
  output_dir: "output"
  # SMOKE KNOB: score only the first N examples (in the order of the pinned prepared
  # data, so two smoke runs are comparable). Empty = all 300 prompts.
  limit: ""
  # Independent generations per example (avg-of-k). Empty = benchmark default (1).
  repeats: ""
  # Concurrent requests to vLLM (NeMo-Skills max_concurrent_requests).
  workers: "64"
  # Dataset: empty = allenai/IFBench data/IFBench_test.jsonl at a fixed commit (pinned
  # in granite-evals). A prepared .jsonl or a directory holding <split>.jsonl overrides it.
  dataset: ""
  dataset_revision: ""
  # Space-separated key=value benchmark options passed as --option, e.g.
  # "temperature=0.6 max_tokens=32768" (unset sampling = the checkpoint's generation_config),
  # "ns.<key>=<value>" (any NeMo-Skills generation override). No answers=gold:
  # IFBench has no reference responses.
  options: ""
  # all | generate | score. "generate" serves the model and saves its outputs
  # (generation.json, the granite_generation artifact); "score" serves nothing and
  # grades them on CPU in the same output_dir (results.json). Recipes run
  # generate on a GPU target and score on a CPU-only target bound to it.
  phase: "all"
  # vLLM.
  tensor_parallel_size: "1"
  gpu_memory_utilization: "0.9"
  max_model_len: ""
  # Shared enroot squashfs cache, only for benchmarks that sandbox. This one doesn't.
  sandbox_cache: ""
  # Empty leaves the image's HF cache default alone.
  hf_home: ""
outputs:
  optional:
    # phase all | score: the scored results.json.
    granite_results:
      type: dataset
    # phase generate: generation.json, which the score target binds to.
    granite_generation:
      type: dataset

# No named inputs: the model checkpoint arrives as the config string
# model_path, not a binding, and recipes bind ordering-only inputs (the score
# target's generation, whose name varies by recipe) only to order targets.
# Nothing is read through bindings; allow_unknown keeps every binding valid.
inputs:
  allow_unknown: true

environment_configs:
  Skypilot:
    default_launcher: granite
    launchers:
      granite:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: '{{ ("docker:" ~ config.image) if config.image else "" }}'
          resources: {}
          run: |
            set -e
            set -o pipefail
            BENCHMARK="{{ config.benchmark }}"
            echo "=== granite $BENCHMARK on $(hostname) ==="
            nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
            # vLLM refuses to start inside an initialised torch.distributed env.
            unset RANK WORLD_SIZE LOCAL_RANK MASTER_ADDR MASTER_PORT
            # SLURM's pyxis/enroot injects the NVIDIA driver libraries at launch, after the image
            # is built, so the image's ld.so cache has no libcuda.so and Triton/torch.compile
            # fail with "libcuda.so cannot found!". Refreshing the cache is a per-step runtime
            # job (no image can do it; pyxis bypasses ENTRYPOINT). Harmless where it is not needed.
            ldconfig 2>/dev/null || true
            # The image's ENV PATH can be lost on BlueVela: the LSF provider flattens
            # enroot's layers in reverse order, so enroot's layer 0 (/etc/environment)
            # ends up under the base image's. The venv path is fixed by the image.
            export PATH="/opt/granite-evals/.venv/bin:$PATH"
            command -v granite-evals >/dev/null || { echo "granite: granite-evals not on PATH; is config.image set to a granite-evals image?"; exit 1; }
            test -n "{{ config.model_path }}" || { echo "granite: config.model_path is required"; exit 1; }

            {% if config.hf_home %}export HF_HOME="{{ config.hf_home }}"; mkdir -p "$HF_HOME"{% endif %}

            {% if config.sandbox_cache %}
            # Sandboxes: enroot inside this job's container. Image squashfs files go to
            # the shared cache; the per-sandbox rootfs goes to node-local scratch.
            export GRANITE_EVALS_SANDBOX=enroot
            export GRANITE_EVALS_ENROOT_CACHE="{{ config.sandbox_cache }}"
            SCRATCH="${TMPDIR:-/tmp}/granite-$$"
            export ENROOT_DATA_PATH="$SCRATCH/enroot-data" ENROOT_CACHE_PATH="$SCRATCH/enroot-cache" ENROOT_RUNTIME_PATH="$SCRATCH/enroot-run" ENROOT_TEMP_PATH="$SCRATCH/enroot-tmp"
            mkdir -p "$GRANITE_EVALS_ENROOT_CACHE" "$ENROOT_DATA_PATH" "$ENROOT_CACHE_PATH" "$ENROOT_RUNTIME_PATH" "$ENROOT_TEMP_PATH"
            # Nested enroot bind-mounts this job's cgroup path into each sandbox; SLURM's
            # step cgroup path carries ../.. segments that do not exist lexically, so the
            # enroot cgroup mount fails until the resolved source directory exists. Create
            # it (validated as probe6, SLURM job 432842: REPRO_EXIT=1 -> FIX_EXIT=0).
            CG=$(awk -F: '/^0::/{print $3}' /proc/self/cgroup)
            LEX=$(readlink -m "/sys/fs/cgroup/$CG")
            mkdir -p "$LEX" 2>/dev/null || true
            trap 'rm -rf "$SCRATCH"' EXIT
            {% endif %}

            OUTPUT_DIR="{{ config.output_dir }}"
            case "$OUTPUT_DIR" in /*) ;; *) OUTPUT_DIR="${GB_BUILD_WORKDIR:-$PWD}/$OUTPUT_DIR" ;; esac
            mkdir -p "$OUTPUT_DIR"

            OPTS=()
            for kv in {{ config.options }}; do OPTS+=(--option "$kv"); done

            granite-evals run "$BENCHMARK" \
              --model "{{ config.model_path }}" \
              --output-dir "$OUTPUT_DIR" \
              {% if config.served_model_name %}--served-model-name "{{ config.served_model_name }}"{% endif %} \
              {% if config.limit %}--limit {{ config.limit }}{% endif %} \
              {% if config.repeats %}--repeats {{ config.repeats }}{% endif %} \
              --workers {{ config.workers }} \
              {% if config.dataset %}--dataset "{{ config.dataset }}"{% endif %} \
              {% if config.dataset_revision %}--dataset-revision "{{ config.dataset_revision }}"{% endif %} \
              --tensor-parallel-size {{ config.tensor_parallel_size }} \
              --gpu-memory-utilization "{{ config.gpu_memory_utilization }}" \
              --phase "{{ config.phase }}" \
              {% if config.max_model_len %}--max-model-len {{ config.max_model_len }}{% endif %} \
              "${OPTS[@]}" \
              2>&1 | tee "$OUTPUT_DIR/granite.log"
            if [ "{{ config.phase }}" = generate ]; then
              RESULT_FILE="$OUTPUT_DIR/generation.json"
              test -s "$RESULT_FILE" || { echo "granite: no $RESULT_FILE"; exit 1; }
              echo "GB_ARTIFACT_ID:granite_generation GB_ARTIFACT_PATH:${RESULT_FILE}"
            else
              RESULT_FILE="$OUTPUT_DIR/results.json"
              test -s "$RESULT_FILE" || { echo "granite: no $RESULT_FILE"; exit 1; }
              echo "GB_ARTIFACT_ID:granite_results GB_ARTIFACT_PATH:${RESULT_FILE}"
            fi
    monitors:
      skypilot_monitor:
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(900) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(900) }}"
          extra_event_configs:
            - event_type: WORKLOAD_STATUS_EVENT
              line_regex: "(vLLM ready at|granite-evals: {{ config.benchmark }} =|granite-evals: \\S+ generated)"
              event_fields:
                - field_name: status
                  field_value_template: "RUNNING"
                - field_name: message
                  field_regex: ".+"
