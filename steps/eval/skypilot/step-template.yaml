name: eval
version: 1.0.0
type: EVAL
config:
  eval_config:
    # Model to evaluate (path or hub id).
    model_path: ""
    # Comma-separated benchmark/task names to run (empty => a placeholder task).
    tasks: ""
    # Directory the results file is written into (results.json is created here).
    output_dir: "output"
    per_device_eval_batch_size: 8
outputs:
  optional:
    results:
      type: dataset

environment_configs:
  Skypilot:
    default_launcher: eval
    launchers:
      eval:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          # The image_id below is rendered at `make space` time: IMAGE_REF (the
          # published, fully qualified image reference) is substituted in (see
          # steps/common.mk). The eval script (src/eval.sh) lives inside this
          # image (built from ./Dockerfile).
          image_id: "docker:${IMAGE_REF}"
          # Cloud-agnostic by default; the build supplies accelerators/cpus/memory
          # via config.launcher_config.resources.
          resources: {}
          run: |
            set -e
            echo "=== eval on $(hostname) ==="
            OUTPUT_DIR="{{ config.eval_config.output_dir }}"
            mkdir -p "$OUTPUT_DIR"
            bash /opt/eval/eval.sh \
              --model-path "{{ config.eval_config.model_path }}" \
              --tasks "{{ config.eval_config.tasks }}" \
              --output-dir "$OUTPUT_DIR" \
              --batch-size {{ config.eval_config.per_device_eval_batch_size }}
            # This step has a single, fixed output: eval.sh always writes
            # results.json into $OUTPUT_DIR. Because the path is known to the step,
            # the STEP (not the workload) registers it — keeping eval.sh free of
            # any Granite.build artifact convention. The line must start with the
            # marker for skypilot_monitor to capture it.
            RESULT_FILE="$(cd "$OUTPUT_DIR" && pwd)/results.json"
            echo "LLMB_ARTIFACT_ID:results LLMB_ARTIFACT_PATH:${RESULT_FILE}"
    monitors:
      # Standard artifact/status convention from the shipped monitor library.
      skypilot_monitor:
        ref: space://monitors/skypilot
  # Docker launcher: runs the SAME image locally against the Docker daemon. This
  # lets the step be built and tested with a locally built image and NO registry
  # publish — the docker environment's pull_policy=if-not-present uses the image
  # already in the local store (see steps/eval/skypilot/test/docker/). It shares
  # eval.sh and the artifact convention with the Skypilot launcher above; only
  # the launch wrapper differs (docker `command` vs skypilot `run:`).
  Docker:
    default_launcher: eval
    launchers:
      eval:
        type: docker
        monitors:
          - docker_log
        config:
          # IMAGE_REF (the fully qualified image reference) is substituted here at
          # `make space` time (steps/common.mk), identically to the Skypilot
          # image_id above. With the docker environment's pull_policy=if-not-present
          # a locally built image (`make image`) is used as-is: no pull, no publish.
          #
          # NOTE: IMAGE_TAG defaults to the git short SHA, so the reference frozen
          # into a PUBLISHED step.yaml (configurations/assets/.../steps/eval/) is
          # the tag from the commit `make publish-step` was last run at. To run the
          # committed Mode-2 docker test (test/steps/eval/skypilot/docker/) you
          # must have that exact local image — i.e. rebuild AND re-publish at the
          # same commit: `make -C steps/eval/skypilot image publish-step`. Otherwise
          # if-not-present finds no match and tries (and fails) to pull the
          # placeholder registry. `make test` (Mode 1) is immune: it builds and
          # renders at HEAD together, so its tags always agree.
          image: "${IMAGE_REF}"
          # The docker launcher runs `bash -c <command>`. This mirrors the
          # Skypilot `run:` block: runtime Jinja ({{ config.* }}) is resolved by
          # the build, while ${VAR}/$(...) stay shell and run in the container.
          command:
            - bash
            - -c
            - |
              set -e
              echo "=== eval (docker) on $(hostname) ==="
              OUTPUT_DIR="{{ config.eval_config.output_dir }}"
              mkdir -p "$OUTPUT_DIR"
              bash /opt/eval/eval.sh \
                --model-path "{{ config.eval_config.model_path }}" \
                --tasks "{{ config.eval_config.tasks }}" \
                --output-dir "$OUTPUT_DIR" \
                --batch-size {{ config.eval_config.per_device_eval_batch_size }}
              # Single fixed output: eval.sh writes results.json into $OUTPUT_DIR.
              # The STEP registers it (keeping eval.sh convention-free); the line
              # must start with the marker for docker_log to capture it.
              RESULT_FILE="$(cd "$OUTPUT_DIR" && pwd)/results.json"
              echo "LLMB_ARTIFACT_ID:results LLMB_ARTIFACT_PATH:${RESULT_FILE}"
    monitors:
      # Standard docker artifact/message monitor from the shipped library.
      docker_log:
        ref: space://monitors/docker
