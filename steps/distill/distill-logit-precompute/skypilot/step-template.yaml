name: distill-logit-precompute
version: 1.0.0
# Run the teacher ONCE over the corpus and keep the top-K logits per assistant token, so a
# later training run can do forward KL against a file instead of holding the teacher in
# memory.
#
# WHAT THIS IS, AND WHAT IT CAN NEVER BE. It is an optimization of the OFF-POLICY path,
# nothing more: the teacher's top-K distribution over the corpus is fixed once the corpus
# and the teacher are fixed, so computing it once and reading it back is strictly cheaper
# than loading a 30B teacher alongside the student every epoch.
#
# It is NOT a route to on-policy GOLD, and cannot be turned into one. On-policy means the
# STUDENT generates and the teacher scores text that does not exist until training time —
# there is nothing to precompute. The step's name invites exactly that misreading.
#
# WIRED INTO NO RECIPE, and that is deliberate rather than an omission. Its only consumer is
# distill-sft's `precomputed_logits_dir`, and setting that key turns that step from
# the SFT CONTROL into a forward-KL distillation ARM. A recipe wiring both is no longer
# running a control, so it must say so in its own README. Upstream ships it unwired for the
# same reason.
#
# THE FAILURE MODE IT IS BUILT AROUND: a partial precompute is STRUCTURALLY VALID. The
# output is shards/ + index.jsonl + meta.json, and the index describes whatever was actually
# written. A run that covered a tenth of the corpus, or skipped every example over
# max_length, or ran against the wrong tokenizer, produces a directory that loads, memmaps
# and trains. Nothing downstream fails. The symptom is a slightly worse student, discovered
# weeks later, with no error anywhere. Everything unusual below follows from that sentence.
#
# DATA_GENERATION, not DATA_PROCESSING: this samples from a model. That distinction is the
# one distill-corpus-prep's header draws from the other side.
type: data_generation
config:
  # ─── Source delivery ──────────────────────────────────────────────────────────
  # IDENTICAL IN EVERY PORTED DISTILLATION STEP. The block and the delimited region
  # of `run` below are asserted byte-identical across the ported steps by
  # test/test_source_contract.py — one contract, learned once. Change it here and
  # the other steps' tests fail until they are changed to match.
  code_config:
    # THE DEFAULT: an unauthenticated HTTPS clone of the public source repo at run time.
    # No /proj checkout, no BlueVela-specific path — this resolves identically on any
    # environment class that can reach github.com, which is the point: the six ported
    # distillation steps used to depend on a pre-staged /proj clone that only existed on
    # BlueVela, so this step (and every other one pinned to it) could not run anywhere
    # else. It also used to point at a personal-namespace private repo, which meant an
    # outside reader of this pin could not even inspect the code, let alone run it.
    #
    # THE SOURCE OF TRUTH IS github.com/laminair/gb-steps-distillation, a small public
    # repo holding exactly the vendored entrypoints and shared package these six steps
    # import — see its README for what it is and is not. It is NOT the shared,
    # continuously-advancing tree this pin used to track: that one broke every ported
    # step's expect_ref out from under it whenever its upstream author moved it, and the
    # failure looked like a recipe bug rather than a moved dependency. This repo only
    # advances when this pin is deliberately bumped.
    code_dir: ""
    # The commit code_dir is EXPECTED to be at. Recorded either way, but when this is
    # set and the checkout is at a different commit the step says so loudly rather
    # than training against whatever happens to be checked out. Empty => no check.
    expect_ref: "a5d59bc45524a8d75706e20d44ae1a254f273f23"
    # code_dir is empty, so this is the path actually taken: an unauthenticated HTTPS
    # clone. Public repos only — see token_secret below for why no credential is wired
    # up here on purpose.
    repo: "https://github.com/laminair/gb-steps-distillation.git"
    # Branch, tag or commit checked out after that clone. Pinned to the same commit as
    # expect_ref rather than a branch head, so two runs a week apart are the same run
    # rather than silently drifting — bump both together.
    ref: "a5d59bc45524a8d75706e20d44ae1a254f273f23"
    # Clone destination, RELATIVE to the step's working directory.
    workdir: "distill-code"
    # The NAME of a space secret holding a read-scoped credential — never a value.
    # Only consulted on the clone path. Left EMPTY on purpose: gb-steps-distillation is
    # public, so the clone needs no credential at all.
    token_secret: ""
    # The interpreter. NOT a bare `python`: this image's venv is not on PATH, and a
    # bare python resolves to the system interpreter, which has no transformers.
    python: "/stage/.venv/bin/python"
    # Optional bash run after the source resolves and before the workload, from the
    # step's working directory. Empty => skipped. Not needed on this image: it
    # already carries torch 2.8.0, transformers 5.8.0, tokenizers 0.22.1 and
    # safetensors 0.7.0, confirmed by direct measurement on a real GPU node.
    setup_command: ""

  # ─── Allocation ───────────────────────────────────────────────────────────────
  workload:
    hf_home: ""
    # ASSERTED against the GPUs actually visible in the container, not trusted.
    gpus_per_node: 8
    # 1, and unlike distill-gold's 2 this is not a topology waiting to be filled in.
    # run-precompute.sh REFUSES nodes > 1, and here that refusal protects something
    # subtler than a rendezvous: sharding is `i % num_nodes == node_id`, so a single node
    # started under a num_nodes it does not have silently precomputes ONE RESIDUE CLASS of
    # the corpus — a structurally valid directory covering a fraction of the data.
    nodes: 1

  precompute_config:
    # distill-corpus-prep's `corpus`. The SAME corpus the arm will train on: the index is
    # keyed to it, so a precompute against a different corpus is a silent mismatch.
    corpus_path: ""
    # The teacher, loaded once. This is the only step that holds it without a student.
    teacher_model_path: ""
    # Kept SEPARATE from teacher_model_path on purpose, as in the trainer: the tokenizer
    # that defines the token ids in the index need not be the model directory's own.
    teacher_tokenizer_path: ""
    # Refuse to start when the teacher's weights have been migrated to tape by GPFS. See
    # src/check_weight_residency.py: metadata only (mmlsattr, else st_blocks arithmetic),
    # never reads contents, refuses on OFFLINE or on a path it cannot stat, warns and
    # proceeds when it cannot measure, and treats a hub id as not-a-path rather than as a
    # finding.
    check_weight_residency: true
    # Proceed anyway, loudly. For when you know the recall is already under way.
    allow_offline_weights: false

    # Relative values resolve against $GB_BUILD_WORKDIR.
    output_dir: "teacher-logits"

    # Top-K per assistant token. The whole size/fidelity trade: 256 is upstream's measured
    # default. Raising it multiplies the artifact.
    top_k: 256
    dtype: "bfloat16"
    # 8192 here against the trainer's 4096, deliberately: a logit file can serve a longer
    # training budget than the one it was made for, but never a shorter one.
    max_length: 8192
    # Target tokens per shard. Shards are an implementation detail of reading the artifact
    # back, not a knob with a scientific meaning.
    shard_target_tokens: 4000000
    batch_size: 4
    seed: 0

    # drop | keep, as a --flag/--no-flag pair. A record whose `documents` list is non-empty
    # depends on grounding text granite's chat template does not render.
    ignore_documents: false

    # The completion boundary. THE TRAILING NEWLINE IS DATA — it is where the labelled span
    # begins — and it CANNOT cross gbserver's config fill as a real character: Jinja strips
    # exactly one trailing newline from each value, so '<|im_start|>assistant\n' would arrive
    # as '<|im_start|>assistant' and key the index to a span one token off. Measured on
    # distill-gold (build d8470f14) and carried the same way here: single-quoted YAML holding
    # a literal backslash-n, decoded once by the launcher inside the container.
    response_template: '<|im_start|>assistant\n'

    # The refusal threshold for skipped records, and the reason a partial precompute cannot
    # pass silently. Raise it only to measure a short slice on purpose.
    max_skip_fraction: 0.05

    # Compute even when the teacher's model and tokenizer disagree on token ids. Default
    # false and it should stay false: the index would be keyed to ids that mean something
    # else to the trainer, and the arithmetic would succeed.
    allow_tokenizer_mismatch: false

# FILESET: shards/ + index.jsonl + meta.json are a derived artifact read back by a trainer,
# not a dataset anything is filtered from. An undeclared output makes the resolver drop the
# NEWARTIFACT event and the target completes with no output AND no error.
outputs:
  required:
    teacher_logits:
      type: fileset

environment_configs:
  Skypilot:
    subtypes:
      - lsf
    default_launcher: precompute
    launchers:
      precompute:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"
          resources: {}
          file_mounts:
            src: src
          envs:
            # NO HF_HUB_OFFLINE: this step loads the TEACHER, and granite loading resolves
            # kernels-community/causal-conv1d through the Hub API, which offline mode turns
            # into OfflineModeIsEnabled after the load has begun (measured on distill-eval,
            # build 15267e81).
            HF_HOME: /opt/hf-cache
            # The image caches mamba-ssm and causal-conv1d but NOT
            # kernels-community/flash-attn2, and these resolve at import time, so the step
            # preflights them and refuses on a cold cache rather than failing after the
            # allocation (measured on distill-sft, build 0e60920a). A warm shared
            # cache via upstream's prefetch-kernels.sh is the better production answer.
            GOLD_PREFETCH_KERNELS: "1"
            PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
            DS_SKIP_CUDA_CHECK: "1"
            OMP_NUM_THREADS: "8"
          run: |
            echo "=== distill-logit-precompute on $(hostname) ==="

            # --- distill source delivery: BEGIN (identical in all ported steps) ---
            # `set -eu` is already in effect: the launcher prefixes it.
            CODE_DIR="{{ config.code_config.code_dir }}"
            REPO="{{ config.code_config.repo }}"
            REF="{{ config.code_config.ref }}"
            PYBIN="{{ config.code_config.python }}"
            WORK="${GB_BUILD_WORKDIR:-$PWD}"

            if [ -n "$CODE_DIR" ] && [ -d "$CODE_DIR/src/gb_steps_post_training" ]; then
              echo "distill: source = filesystem checkout $CODE_DIR"
              CODE_SOURCE="filesystem"
              # A shared checkout is mutable state, so say what is actually there.
              # Uncommitted edits are not fatal — someone may be deliberately testing
              # a fix — but a run whose code came from a dirty tree must not report a
              # bare commit as its provenance.
              DIRTY="$(git -C "$CODE_DIR" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
              if [ "${DIRTY:-0}" != "0" ]; then
                echo "distill: WARNING: $CODE_DIR has $DIRTY uncommitted change(s)." >&2
                echo "         This run's code is NOT the commit recorded below." >&2
              fi
              echo "GB_STEP_METADATA_KEY:distill_code_dirty GB_STEP_METADATA_VALUE:${DIRTY:-0}"
              # And fail loudly if the checkout is not where the recipe expects. A
              # silently-moved shared checkout is how two runs that report the same
              # pin end up having trained on different code.
              EXPECT_REF="{{ config.code_config.expect_ref }}"
              if [ -n "$EXPECT_REF" ]; then
                AT="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
                if [ -n "$AT" ] && [ "$AT" != "$EXPECT_REF" ]; then
                  echo "distill: FATAL: $CODE_DIR is at $AT but code_config.expect_ref" >&2
                  echo "         is $EXPECT_REF. Either check that checkout out to the" >&2
                  echo "         expected commit, or change expect_ref deliberately:" >&2
                  echo "           git -C $CODE_DIR fetch --all" >&2
                  echo "           git -C $CODE_DIR checkout $EXPECT_REF" >&2
                  exit 1
                fi
              fi
            elif [ -n "$REPO" ]; then
              CODE_DIR="$WORK/{{ config.code_config.workdir }}"
              CODE_SOURCE="git"
              TOKEN_VAR="{{ config.code_config.token_secret }}"
              # Indirect expansion, with :- so `set -u` does not abort when the space
              # has no such secret. The dispatcher runs this with `bash <file>`, so
              # bash-isms are available. Guarded on TOKEN_VAR itself: a public repo
              # leaves token_secret empty, and "${!:-}" is a bash syntax error
              # ("invalid variable name"), not an empty expansion.
              TOKEN=""
              if [ -n "$TOKEN_VAR" ]; then
                TOKEN="${!TOKEN_VAR:-}"
              fi
              echo "distill: source = git clone $REPO (ref=${REF:-<default>}) -> $CODE_DIR"
              rm -rf "$CODE_DIR"
              if [ -n "$TOKEN" ]; then
                # GIT_ASKPASS, not a token in the URL: the URL form puts the secret in
                # argv (readable via /proc on a shared node) and persists it into
                # .git/config on the SHARED filesystem. The helper is written 0700 into
                # the node's own tmp and deleted immediately after use.
                ASKPASS="$(mktemp)"
                cat > "$ASKPASS" <<'ASKPASS_EOF'
            #!/bin/sh
            case "$1" in
              Username*) printf '%s' "x-access-token" ;;
              *)         printf '%s' "$GB_DISTILL_TOKEN" ;;
            esac
            ASKPASS_EOF
                chmod 700 "$ASKPASS"
                CLONE_RC=0
                GB_DISTILL_TOKEN="$TOKEN" GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
                  git clone --quiet "$REPO" "$CODE_DIR" || CLONE_RC=$?
                rm -f "$ASKPASS"
                if [ "$CLONE_RC" != "0" ]; then
                  echo "distill: FATAL: clone of $REPO failed (rc=$CLONE_RC) using the token in" >&2
                  echo "         \$$TOKEN_VAR. Check that secret's scope, not this step." >&2
                  exit 1
                fi
              elif [ -n "$TOKEN_VAR" ]; then
                echo "distill: FATAL: code_config.token_secret names '$TOKEN_VAR' but this" >&2
                echo "         space has no secret by that name. Either create that secret," >&2
                echo "         or leave code_config.token_secret empty if $REPO is public." >&2
                exit 1
              else
                # No token_secret configured at all: REPO is a public clone, same as an
                # anonymous `git clone` from a terminal.
                CLONE_RC=0
                git clone --quiet "$REPO" "$CODE_DIR" || CLONE_RC=$?
                if [ "$CLONE_RC" != "0" ]; then
                  echo "distill: FATAL: unauthenticated clone of $REPO failed (rc=$CLONE_RC)." >&2
                  echo "         If this repo is private, set code_config.token_secret." >&2
                  exit 1
                fi
              fi
              if [ -n "$REF" ]; then
                git -C "$CODE_DIR" checkout --quiet "$REF"
              fi
              if [ ! -d "$CODE_DIR/src/gb_steps_post_training" ]; then
                echo "distill: FATAL: $REPO@${REF:-default} has no src/gb_steps_post_training." >&2
                exit 1
              fi
            else
              echo "distill: FATAL: no source. code_config.code_dir ('$CODE_DIR') does not" >&2
              echo "         contain src/gb_steps_post_training, and code_config.repo is empty." >&2
              exit 1
            fi

            # The package ROOT, not the distillation/ directory: every module is
            # imported by its full dotted path, so a flat path does not resolve. The
            # absence of this export is what killed two upstream jobs at import time.
            export PYTHONPATH="$CODE_DIR/src${PYTHONPATH:+:$PYTHONPATH}"

            # Lineage. A filesystem checkout is mutable and a clone may name a branch,
            # so record the resolved commit either way. NEVER fail the build for
            # metadata — and written as a full if/fi rather than `[ -n "$X" ] && echo`,
            # which under `set -e` aborts the run when X is empty.
            CODE_SHA="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
            if [ -n "$CODE_SHA" ]; then
              echo "GB_STEP_METADATA_KEY:distill_code_commit GB_STEP_METADATA_VALUE:$CODE_SHA"
            else
              echo "distill: WARNING: $CODE_DIR is not a git checkout, so this run has no" >&2
              echo "         record of which code ran." >&2
            fi
            echo "GB_STEP_METADATA_KEY:distill_code_source GB_STEP_METADATA_VALUE:$CODE_SOURCE"
            {% if config.code_config.setup_command %}
            echo "distill: running setup_command in $(pwd)"
            {{ config.code_config.setup_command }}
            {% endif %}
            # --- distill source delivery: END

            # The image's venv is NOT on PATH, and run-precompute.sh calls both
            # `"$PYBIN" -m ...` and a BARE `accelerate` (ACCELERATE="${ACCELERATE:-accelerate}").
            # Without this the run reaches the launch and dies rc=127 — measured on
            # distill-sft, build 75fa47d2. The dispatcher runs this with
            # `bash <file>` (non-login), so the export sticks.
            export PATH=/stage/.venv/bin:$PATH
            export ACCELERATE="$(dirname "$PYBIN")/accelerate"

            # PRECOMPUTE_SRC and LIB_DIR, not CHECKOUT_ROOT. The script resolves each from
            # EITHER the image's vendor/ tree or $CHECKOUT_ROOT/..., and a non-image step has
            # no vendor/ tree — but it computes CHECKOUT_ROOT UNCONDITIONALLY as three levels
            # above STEP_HOME, which assumes the step directory sits inside the checkout. So
            # exporting CHECKOUT_ROOT is silently discarded; these two are the guarded knobs.
            # Learned the expensive way on distill-sft (builds 739898ab, 07b9e09a).
            export PRECOMPUTE_SRC="$CODE_DIR/src/gb_steps_post_training/distillation"
            export LIB_DIR="$CODE_DIR/steps/distill-logit-precompute/src/lib"

            # This step reads the teacher and nothing else, so a teacher on tape is the whole
            # step waiting on a recall. Metadata only; refuses only on an authoritative
            # OFFLINE. teacher_tokenizer_path is not checked: a tokenizer overlay has no
            # shards.
            {% if config.precompute_config.check_weight_residency %}
            "$PYBIN" ./src/check_weight_residency.py \
              {% if config.precompute_config.allow_offline_weights %}--allow-offline{% endif %} \
              "teacher={{ config.precompute_config.teacher_model_path }}"
            {% endif %}

            # Absolutise before the script runs: IT prints the artifact marker, from its own
            # OUTPUT_DIR, and the monitor hands that path to the env:// store.
            OUT_DIR="{{ config.precompute_config.output_dir }}"
            case "$OUT_DIR" in /*) ;; *) OUT_DIR="$WORK/$OUT_DIR" ;; esac

            # Decode the response template's escape. The sentinel is load-bearing: $(...)
            # strips trailing newlines too, so the obvious form loses the very character this
            # carries.
            RT_RAW='{{ config.precompute_config.response_template }}'
            RESPONSE_TEMPLATE="$(printf '%b.' "$RT_RAW")"
            RESPONSE_TEMPLATE="${RESPONSE_TEMPLATE%.}"

            # NO ARTIFACT MARKER HERE, deliberately: run-precompute.sh prints it from its own
            # publish path, including on the already-done SKIP branch. Upstream's template
            # echoed it a SECOND time after the script returned, which would register two
            # NEWARTIFACT events for one id — the same duplication the distill-eval port
            # dropped.
            PYBIN="$PYBIN" bash ./src/run-precompute.sh \
              --corpus-path "{{ config.precompute_config.corpus_path }}" \
              --teacher-model-path "{{ config.precompute_config.teacher_model_path }}" \
              --teacher-tokenizer-path "{{ config.precompute_config.teacher_tokenizer_path }}" \
              --output-dir "$OUT_DIR" \
              --top-k {{ config.precompute_config.top_k }} \
              --dtype "{{ config.precompute_config.dtype }}" \
              --max-length {{ config.precompute_config.max_length }} \
              --shard-target-tokens {{ config.precompute_config.shard_target_tokens }} \
              --batch-size {{ config.precompute_config.batch_size }} \
              --seed {{ config.precompute_config.seed }} \
              --response-template "$RESPONSE_TEMPLATE" \
              --max-skip-fraction {{ config.precompute_config.max_skip_fraction }} \
              {% if config.precompute_config.ignore_documents %}--ignore-documents{% else %}--no-ignore-documents{% endif %} \
              {% if config.precompute_config.allow_tokenizer_mismatch %}--allow-tokenizer-mismatch{% else %}--no-allow-tokenizer-mismatch{% endif %} \
              --gpus-per-node {{ config.workload.gpus_per_node }} \
              --nodes {{ config.workload.nodes }} \
              --hf-home "{{ config.workload.hf_home }}"
    monitors:
      skypilot_monitor:
        # `periodic` retrieval: one forward pass of a 30B teacher over a real corpus is an
        # hours-long job, and the library default on_completion surfaces nothing until the
        # end — so a stalled run looks identical to a slow one.
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(900) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(900) }}"
