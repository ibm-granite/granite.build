name: corpus-prep
version: 1.0.0
# Turns a conversation dataset into the GOLD training corpus: filter by rendered length,
# apply a think-tag policy, enforce the completion boundary, split deterministically, and
# record what was done in a manifest the trainer checks.
#
# THE CORPUS IS TEXT, NOT TOKENS. The output is a JSONL of `messages` conversations and
# contains no token ids at all — the trainer tokenizes at train time. It is nevertheless
# TOKENIZER-SPECIFIC, and that is not a contradiction: every decision about WHICH
# conversations survive is measured in tokens. A conversation is kept or dropped by its
# RENDERED length against max_length, and the completion boundary is checked by rendering
# with return_assistant_tokens_mask=True and requiring a non-empty mask. Both answers move
# when the tokenizer moves, and nothing downstream re-checks lengths — so a corpus built
# with the wrong tokenizer is not a crash, it is a training set quietly containing examples
# the trainer will truncate.
#
# DATA_PROCESSING and not DATA_GENERATION: nothing is sampled from a model here. Generating
# data from the teacher is distill-logit-precompute's job.
type: data_processing
config:
  # ─── Corpus ───────────────────────────────────────────────────────────────────
  corpus_config:
    # The source dataset and the tokenizer are target INPUTS, not config keys — see
    # `inputs:` below.
    dataset_split: "train"
    dataset_config: ""

    # Relative values resolve against $GB_BUILD_WORKDIR.
    out_dir: "corpus"

    # ── Filtering policy. Every one of these changes WHICH examples survive, so every one
    # is explicit here rather than defaulted inside the script.
    #
    # MUST equal the trainer's max_length and the eval steps'. They are separate keys
    # because the steps are separately schedulable and the recipe is what ties them
    # together; a corpus filtered at a larger length silently contains examples the trainer
    # truncates, and nothing downstream re-checks.
    max_length: 4096
    # drop | truncate. drop is the default because a truncated conversation ends mid
    # assistant turn, which teaches the student to produce unterminated answers.
    length_policy: "drop"
    # keep | strip | require. Reasoning corpora carry <think>...</think> inside the
    # ASSISTANT content. keep trains on the traces, strip trains on answers only, require
    # restricts the corpus to records that have a trace at all. There is no safe default:
    # the three produce different students from the same input.
    think_policy: "keep"
    # last_message | all_assistant. last_message matches GOLD's last_message_only and is
    # ENFORCED, not assumed: a conversation whose final turn is not the assistant's would
    # contribute no loss under that setting, so it is dropped and counted rather than
    # silently trained on as a no-op.
    completion_boundary: "last_message"
    min_messages: 2
    # drop | keep. A record whose `documents` list is non-empty depends on grounding text
    # that granite's chat template does not render, so under `keep` the student is trained
    # to produce an answer from evidence it was never shown. It is a KEY rather than a
    # hard-coded default because the choice is template-dependent: the script measures
    # whether the tokenizer's template actually renders `documents` and warns on either
    # disagreement. Pair granite with a RAG-aware template and `keep` becomes correct.
    documents_policy: "drop"

    # ── Splitting. Deterministic from seed alone.
    eval_fraction: 0.0
    seed: 42
    # Stop after N KEPT examples. 0 = no limit. For smoke runs, where the point is to prove
    # the wiring rather than to build a corpus.
    max_examples: 0

    # Write each emitted row's content id INTO the row, so the trainer can report which
    # rows it actually consumed after its own arm-dependent filtering, and so any holder of
    # train.jsonl can recompute the id and verify it. Default false MIRRORS the script's
    # own default deliberately: the step's default must not be a policy the script has not
    # yet validated on a real run. Flip both together, not this one alone.
    emit_row_id: false

    # Overrides HF_HOME for this step only. Empty leaves the launcher's value.
    hf_home: ""

# `corpus` is the TRAIN JSONL FILE, not out_dir, and that is a contract rather than a
# stylistic choice, for two independent reasons:
#   1. the trainer dispatches on the SUFFIX — a `.jsonl` path is read with pandas, anything
#      else goes to load_dataset(), which fails on a directory holding a manifest;
#   2. the trainer finds the manifest as `corpus_path.parent / corpus_manifest.json`, which
#      only resolves if corpus_path is the file. Point it at the directory and the tokenizer
#      guard goes quiet again.
#
# eval.jsonl is deliberately NOT declared: it exists only when eval_fraction > 0, and a
# declared-but-absent output is a resolver failure. A recipe that needs it reads it from the
# manifest's splits.eval.path.
#
# I/O schema, validated against the build.yaml target at build time: a target that
# does not bind a required input fails validation before anything is queued. The
# run script reads each one as {{ bindings.<name>.binding.path }}. allow_unknown
# stays true so a recipe can bind extra inputs purely to order targets.
inputs:
  allow_unknown: true
  required:
    # A .jsonl of conversation records (or a directory load_dataset() accepts). The
    # image runs with HF_HUB_OFFLINE=1, so bind a local file, not a hub id.
    source_dataset:
      type: dataset
      accept: [uri, binding]
    # The tokenizer that DEFINES this corpus. Normally distill-tokenizer-align's
    # `retagged_student`. Not decoration: max_length filtering and the completion-boundary
    # check are both measured on the RENDERED, TOKENIZED conversation, so the surviving set
    # of examples is a function of this directory. Its identity is copied into
    # corpus_manifest.json, and the trainer refuses a student whose tokenizer identity
    # differs.
    tokenizer:
      type: model
      accept: [uri, binding]
outputs:
  required:
    corpus:
      type: dataset

environment_configs:
  Skypilot:
    subtypes:
      - lsf
      - slurm
    default_launcher: prep
    launchers:
      prep:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/gb-step-distillation-cpu:6fb1236"
          # No GPU: this renders and counts tokens on CPU.
          resources: {}
          envs:
            HF_HUB_OFFLINE: "1"
          run: |
            echo "=== distill-corpus-prep on $(hostname) ==="

            # The inputs used to be config keys. A recipe that still sets one would
            # otherwise be ignored silently, so refuse it.
            {% for key in ("dataset", "tokenizer") if config.corpus_config[key] is defined %}
            echo "distill-corpus-prep: FATAL: corpus_config.{{ key }} is no longer read; bind the target input instead (see this step's README)" >&2
            exit 1
            {% endfor %}

            # --- distill source: baked into the image, nothing cloned or mounted ---
            # DISTILL_HOME, the venv (VIRTUAL_ENV) and PYTHONPATH are all set by the image's
            # own ENV lines. The interpreter is asked of uv rather than hardcoded.
            PYBIN="$(uv python find)"
            CODE_DIR="${DISTILL_HOME:?DISTILL_HOME is set by the image}"
            WORK="${GB_BUILD_WORKDIR:-$PWD}"
            echo "GB_STEP_METADATA_KEY:distill_code_source GB_STEP_METADATA_VALUE:baked-image"
            echo "GB_STEP_METADATA_KEY:distill_code_commit GB_STEP_METADATA_VALUE:a5d59bc45524a8d75706e20d44ae1a254f273f23"
            # --- distill source: END ---

            # Absolutise before the marker: the monitor hands this path to the env:// store,
            # possibly from another host, and a relative env: URI is rejected at config load.
            OUT_DIR="{{ config.corpus_config.out_dir }}"
            case "$OUT_DIR" in /*) ;; *) OUT_DIR="$WORK/$OUT_DIR" ;; esac

            # Per-step HF_HOME override, if the recipe set one.
            HF_HOME_CFG="{{ config.corpus_config.hf_home }}"
            if [ -n "$HF_HOME_CFG" ]; then
              export HF_HOME="$HF_HOME_CFG"
            fi

            "$PYBIN" "$DISTILL_HOME/steps/corpus-prep/prep_corpus.py" \
              --dataset "{{ bindings.source_dataset.binding.path }}" \
              --dataset-split "{{ config.corpus_config.dataset_split }}" \
              --dataset-config "{{ config.corpus_config.dataset_config }}" \
              --tokenizer "{{ bindings.tokenizer.binding.path }}" \
              --out-dir "$OUT_DIR" \
              --max-length {{ config.corpus_config.max_length }} \
              --length-policy "{{ config.corpus_config.length_policy }}" \
              --think-policy "{{ config.corpus_config.think_policy }}" \
              --completion-boundary "{{ config.corpus_config.completion_boundary }}" \
              --min-messages {{ config.corpus_config.min_messages }} \
              --documents-policy "{{ config.corpus_config.documents_policy }}" \
              --eval-fraction {{ config.corpus_config.eval_fraction }} \
              --seed {{ config.corpus_config.seed }} \
              --max-examples {{ config.corpus_config.max_examples }} \
              --hf-home "{{ config.corpus_config.hf_home }}" \
              {% if config.corpus_config.emit_row_id %}--emit-row-id{% else %}--no-emit-row-id{% endif %}

            # The FILE, per the outputs comment above.
            echo "GB_ARTIFACT_ID:corpus GB_ARTIFACT_PATH:${OUT_DIR}/train.jsonl"
    monitors:
      skypilot_monitor:
        ref: space://monitors/skypilot
