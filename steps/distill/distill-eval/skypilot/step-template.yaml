name: distill-eval
version: 1.0.0
# Measures HOW FAR THE STUDENT'S next-token distribution is from the TEACHER'S on a
# held-out corpus, and writes the result as an artifact. This is the read on whether
# distillation transferred anything, and unlike a capability benchmark it needs no labels.
#
# WHY THIS EXISTS WHEN WE ALREADY HAVE bfcl-eval. BFCL scores tool-calling against ground
# truth — "is the student right?". It structurally cannot answer "did the student move
# toward the TEACHER?", because that is a distance between two models' distributions on the
# same inputs, not a property of one model's outputs. A recipe wires BOTH: bfcl-eval for
# capability, this for transfer. They are not substitutes in either direction, and a recipe
# wires space://steps/bfcl-eval directly rather than having this step wrap it.
#
# CUSTOM, because measuring is not processing data, generating data, training or tuning.
# There is no EVAL member in gbcommon's StepType enum; `type` is a free string, so it would
# be easy to invent one, and the sibling steps' rule applies — do not.
type: custom
config:
  # ─── Source delivery ──────────────────────────────────────────────────────────
  # IDENTICAL IN EVERY PORTED DISTILLATION STEP. The block and the delimited region
  # of `run` below are asserted byte-identical across the ported steps by
  # test/test_source_contract.py — one contract, learned once. Change it here and
  # the other steps' tests fail until they are changed to match.
  code_config:
    # THE DEFAULT: an unauthenticated HTTPS clone of the public source repo at run time.
    # No /proj checkout, no BlueVela-specific path — this resolves identically on any
    # environment class that can reach github.com, which is the point: the six ported
    # distillation steps used to depend on a pre-staged /proj clone that only existed on
    # BlueVela, so this step (and every other one pinned to it) could not run anywhere
    # else. It also used to point at a personal-namespace private repo, which meant an
    # outside reader of this pin could not even inspect the code, let alone run it.
    #
    # THE SOURCE OF TRUTH IS github.com/laminair/gb-steps-distillation, a small public
    # repo holding exactly the vendored entrypoints and shared package these six steps
    # import — see its README for what it is and is not. It is NOT the shared,
    # continuously-advancing tree this pin used to track: that one broke every ported
    # step's expect_ref out from under it whenever its upstream author moved it, and the
    # failure looked like a recipe bug rather than a moved dependency. This repo only
    # advances when this pin is deliberately bumped.
    code_dir: ""
    # The commit code_dir is EXPECTED to be at. Recorded either way, but when this is
    # set and the checkout is at a different commit the step says so loudly rather
    # than training against whatever happens to be checked out. Empty => no check.
    expect_ref: "a5d59bc45524a8d75706e20d44ae1a254f273f23"
    # code_dir is empty, so this is the path actually taken: an unauthenticated HTTPS
    # clone. Public repos only — see token_secret below for why no credential is wired
    # up here on purpose.
    repo: "https://github.com/laminair/gb-steps-distillation.git"
    # Branch, tag or commit checked out after that clone. Pinned to the same commit as
    # expect_ref rather than a branch head, so two runs a week apart are the same run
    # rather than silently drifting — bump both together.
    ref: "a5d59bc45524a8d75706e20d44ae1a254f273f23"
    # Clone destination, RELATIVE to the step's working directory.
    workdir: "distill-code"
    # The NAME of a space secret holding a read-scoped credential — never a value.
    # Only consulted on the clone path. Left EMPTY on purpose: gb-steps-distillation is
    # public, so the clone needs no credential at all.
    token_secret: ""
    # The interpreter. NOT a bare `python`: this image's venv is not on PATH, and a
    # bare python resolves to the system interpreter, which has no transformers.
    python: "/stage/.venv/bin/python"
    # Optional bash run after the source resolves and before the workload, from the
    # step's working directory. Empty => skipped. Not needed on this image: it
    # already carries torch 2.8.0, transformers 5.8.0, tokenizers 0.22.1 and
    # safetensors 0.7.0, confirmed by direct measurement on a real GPU node.
    setup_command: ""

  # ─── Evaluation ───────────────────────────────────────────────────────────────
  eval_config:
    # Paths, not HF repo ids: the student is a checkpoint this pipeline produced and the
    # teacher for this pairing is not publicly fetchable.
    #
    # distill-hf-export's `hf_model` for a post-training measurement, or
    # distill-tokenizer-align's `retagged_student` for the t=0 baseline that makes the
    # post-training number mean something. A divergence with no baseline is a number
    # without a direction.
    student_model: ""
    # OPTIONAL, and the emptiness is meaningful rather than sloppy: with no teacher only
    # single-model metrics (entropy) are computable, and asking for jsd without one is
    # REFUSED rather than defaulted. Normally the same teacher the trainer used, so the
    # divergence is measured against the model that actually taught.
    teacher_model: ""
    # distill-corpus-prep's corpus — ITS EVAL SPLIT, not the split the student trained on.
    # Measured on training data, a divergence reports how well the student memorised the
    # teacher's outputs on seen inputs: the one thing distillation is guaranteed to
    # improve, and therefore the least informative thing to check.
    corpus: ""

    # Relative values resolve against $GB_BUILD_WORKDIR.
    output_dir: "eval"

    # jsd | kld | rkld | entropy, comma-separated. All four are reductions over the SAME
    # pair of logit tensors, so listing four costs ONE forward pass over the corpus.
    #   jsd     symmetric, bounded by ln2, and the arm's own training objective. The
    #           headline number.
    #   kld     forward KL: penalises the student for missing teacher mass (mode-covering).
    #   rkld    reverse KL: penalises mass where the teacher has none (mode-seeking).
    #           Reported alongside kld because which one moved says WHICH WAY the student is
    #           wrong, and a single symmetric number cannot.
    #   entropy the student alone. The only metric computable with no teacher, and the one
    #           that catches a collapsed student whose divergence happens to look fine.
    metrics: "jsd,kld,rkld,entropy"

    # A divergence mean stabilises well before a corpus is exhausted, and each sample is a
    # forward pass through the teacher, so this is a cost knob with a real ceiling on its
    # usefulness. SAMPLED with --seed rather than taken as a prefix: corpora are often
    # sorted by source or length, so a prefix measures one slice and the mean moves when
    # this number changes.
    max_samples: 256
    seed: 42

    # SHOULD MATCH THE TRAINING RUN'S max_length, and this is the least cosmetic key here.
    # Too small a value damages the measurement in two ways, one loud and one SILENT:
    #   - a record whose PROMPT alone exceeds max_length is dropped outright;
    #   - a record whose prompt fits but whose answer does not is scored on a PREFIX of
    #     that answer — and this one leaves no trace in n_samples, so a clean-looking jsd
    #     can be a mean over half-read completions.
    # Only long conversations are hit by either, so a too-small value reports a
    # length-biased estimate as the divergence. max_incomplete_fraction is the refusal
    # threshold over both cases combined; set it to 1.0 to measure a short slice on purpose.
    max_length: 4096
    max_incomplete_fraction: 0.25

    batch_size: 4
    # bfloat16 matches training. float32 doubles memory for a metric whose differences are
    # far larger than bf16's error, but it is there for a suspicious result.
    dtype: "bfloat16"

    # Compute even when the two tokenizers disagree on token ids. Default false and it
    # should stay false: index i denotes a different token to each model, so the arithmetic
    # SUCCEEDS and measures nothing. Kept as a knob only because a deliberate
    # cross-tokenizer experiment may want the number anyway.
    allow_tokenizer_mismatch: false

# FILESET, not DATASET: this directory holds metrics.json and per_sample.jsonl, which are a
# measurement OF a model, not data anything trains on. Both are real members of
# gbcommon.types.artifact.ArtifactType, so the distinction costs nothing to get right — and
# an undeclared output would be worse than a mistyped one, because the resolver drops a
# NEWARTIFACT event whose id is not declared here and the target then completes with no
# output AND no error.
outputs:
  required:
    eval_metrics:
      type: fileset

environment_configs:
  Skypilot:
    subtypes:
      - lsf
    default_launcher: eval
    launchers:
      eval:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/kd-sandbox-distill:0.1.0-uv"
          # REAL GPU WORK, unlike the three ported steps before it: two models' forward
          # passes over the corpus. Accelerators come from the build.yaml so one step
          # serves a 3B-teacher smoke run and a 30B-teacher reference run.
          resources: {}
          file_mounts:
            src: src
          envs:
            # NO HF_HUB_OFFLINE here, unlike the three tokenizer-only ported steps —
            # and that is measured, not stylistic. This step loads MODELS, and granite
            # 4.x is hybrid Mamba: at load time the `kernels` package resolves
            # kernels-community/causal-conv1d through the Hub API, so offline mode
            # fails with OfflineModeIsEnabled *after* the load has started (build
            # 15267e81). distill-gold — the step that demonstrably loads a granite 4.x
            # student and a 30B teacher on this same image — sets HF_HOME and leaves
            # the Hub reachable, so that is the proven configuration and this matches
            # it. distill-logit-precompute will need the same, for the same reason.
            #
            # align, corpus-prep and hf-export keep HF_HUB_OFFLINE=1 because they touch
            # only tokenizers and configs, where "a missing local file fails here
            # rather than silently fetching" is a property worth having.
            HF_HOME: /opt/hf-cache
          run: |
            echo "=== distill-eval on $(hostname) ==="

            # --- distill source delivery: BEGIN (identical in all ported steps) ---
            # `set -eu` is already in effect: the launcher prefixes it.
            CODE_DIR="{{ config.code_config.code_dir }}"
            REPO="{{ config.code_config.repo }}"
            REF="{{ config.code_config.ref }}"
            PYBIN="{{ config.code_config.python }}"
            WORK="${GB_BUILD_WORKDIR:-$PWD}"

            if [ -n "$CODE_DIR" ] && [ -d "$CODE_DIR/src/gb_steps_post_training" ]; then
              echo "distill: source = filesystem checkout $CODE_DIR"
              CODE_SOURCE="filesystem"
              # A shared checkout is mutable state, so say what is actually there.
              # Uncommitted edits are not fatal — someone may be deliberately testing
              # a fix — but a run whose code came from a dirty tree must not report a
              # bare commit as its provenance.
              DIRTY="$(git -C "$CODE_DIR" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
              if [ "${DIRTY:-0}" != "0" ]; then
                echo "distill: WARNING: $CODE_DIR has $DIRTY uncommitted change(s)." >&2
                echo "         This run's code is NOT the commit recorded below." >&2
              fi
              echo "GB_STEP_METADATA_KEY:distill_code_dirty GB_STEP_METADATA_VALUE:${DIRTY:-0}"
              # And fail loudly if the checkout is not where the recipe expects. A
              # silently-moved shared checkout is how two runs that report the same
              # pin end up having trained on different code.
              EXPECT_REF="{{ config.code_config.expect_ref }}"
              if [ -n "$EXPECT_REF" ]; then
                AT="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
                if [ -n "$AT" ] && [ "$AT" != "$EXPECT_REF" ]; then
                  echo "distill: FATAL: $CODE_DIR is at $AT but code_config.expect_ref" >&2
                  echo "         is $EXPECT_REF. Either check that checkout out to the" >&2
                  echo "         expected commit, or change expect_ref deliberately:" >&2
                  echo "           git -C $CODE_DIR fetch --all" >&2
                  echo "           git -C $CODE_DIR checkout $EXPECT_REF" >&2
                  exit 1
                fi
              fi
            elif [ -n "$REPO" ]; then
              CODE_DIR="$WORK/{{ config.code_config.workdir }}"
              CODE_SOURCE="git"
              TOKEN_VAR="{{ config.code_config.token_secret }}"
              # Indirect expansion, with :- so `set -u` does not abort when the space
              # has no such secret. The dispatcher runs this with `bash <file>`, so
              # bash-isms are available. Guarded on TOKEN_VAR itself: a public repo
              # leaves token_secret empty, and "${!:-}" is a bash syntax error
              # ("invalid variable name"), not an empty expansion.
              TOKEN=""
              if [ -n "$TOKEN_VAR" ]; then
                TOKEN="${!TOKEN_VAR:-}"
              fi
              echo "distill: source = git clone $REPO (ref=${REF:-<default>}) -> $CODE_DIR"
              rm -rf "$CODE_DIR"
              if [ -n "$TOKEN" ]; then
                # GIT_ASKPASS, not a token in the URL: the URL form puts the secret in
                # argv (readable via /proc on a shared node) and persists it into
                # .git/config on the SHARED filesystem. The helper is written 0700 into
                # the node's own tmp and deleted immediately after use.
                ASKPASS="$(mktemp)"
                cat > "$ASKPASS" <<'ASKPASS_EOF'
            #!/bin/sh
            case "$1" in
              Username*) printf '%s' "x-access-token" ;;
              *)         printf '%s' "$GB_DISTILL_TOKEN" ;;
            esac
            ASKPASS_EOF
                chmod 700 "$ASKPASS"
                CLONE_RC=0
                GB_DISTILL_TOKEN="$TOKEN" GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
                  git clone --quiet "$REPO" "$CODE_DIR" || CLONE_RC=$?
                rm -f "$ASKPASS"
                if [ "$CLONE_RC" != "0" ]; then
                  echo "distill: FATAL: clone of $REPO failed (rc=$CLONE_RC) using the token in" >&2
                  echo "         \$$TOKEN_VAR. Check that secret's scope, not this step." >&2
                  exit 1
                fi
              elif [ -n "$TOKEN_VAR" ]; then
                echo "distill: FATAL: code_config.token_secret names '$TOKEN_VAR' but this" >&2
                echo "         space has no secret by that name. Either create that secret," >&2
                echo "         or leave code_config.token_secret empty if $REPO is public." >&2
                exit 1
              else
                # No token_secret configured at all: REPO is a public clone, same as an
                # anonymous `git clone` from a terminal.
                CLONE_RC=0
                git clone --quiet "$REPO" "$CODE_DIR" || CLONE_RC=$?
                if [ "$CLONE_RC" != "0" ]; then
                  echo "distill: FATAL: unauthenticated clone of $REPO failed (rc=$CLONE_RC)." >&2
                  echo "         If this repo is private, set code_config.token_secret." >&2
                  exit 1
                fi
              fi
              if [ -n "$REF" ]; then
                git -C "$CODE_DIR" checkout --quiet "$REF"
              fi
              if [ ! -d "$CODE_DIR/src/gb_steps_post_training" ]; then
                echo "distill: FATAL: $REPO@${REF:-default} has no src/gb_steps_post_training." >&2
                exit 1
              fi
            else
              echo "distill: FATAL: no source. code_config.code_dir ('$CODE_DIR') does not" >&2
              echo "         contain src/gb_steps_post_training, and code_config.repo is empty." >&2
              exit 1
            fi

            # The package ROOT, not the distillation/ directory: every module is
            # imported by its full dotted path, so a flat path does not resolve. The
            # absence of this export is what killed two upstream jobs at import time.
            export PYTHONPATH="$CODE_DIR/src${PYTHONPATH:+:$PYTHONPATH}"

            # Lineage. A filesystem checkout is mutable and a clone may name a branch,
            # so record the resolved commit either way. NEVER fail the build for
            # metadata — and written as a full if/fi rather than `[ -n "$X" ] && echo`,
            # which under `set -e` aborts the run when X is empty.
            CODE_SHA="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
            if [ -n "$CODE_SHA" ]; then
              echo "GB_STEP_METADATA_KEY:distill_code_commit GB_STEP_METADATA_VALUE:$CODE_SHA"
            else
              echo "distill: WARNING: $CODE_DIR is not a git checkout, so this run has no" >&2
              echo "         record of which code ran." >&2
            fi
            echo "GB_STEP_METADATA_KEY:distill_code_source GB_STEP_METADATA_VALUE:$CODE_SOURCE"
            {% if config.code_config.setup_command %}
            echo "distill: running setup_command in $(pwd)"
            {{ config.code_config.setup_command }}
            {% endif %}
            # --- distill source delivery: END

            # Absolutised here rather than in the script, because the SCRIPT prints the
            # artifact marker (see below) and the monitor hands that path to the env://
            # store, possibly from another host.
            OUT_DIR="{{ config.eval_config.output_dir }}"
            case "$OUT_DIR" in /*) ;; *) OUT_DIR="$WORK/$OUT_DIR" ;; esac

            # NO ARTIFACT MARKER HERE, deliberately. run-eval.sh prints it from its own
            # publish_artifacts(), which it calls on BOTH the success path and the
            # already-measured SKIP path — a resumed recipe whose eval says "already done"
            # and then publishes nothing has broken whatever reads eval_metrics. Upstream's
            # template echoed it a SECOND time after the script returned, which would
            # register two NEWARTIFACT events for one id.
            PYBIN="$PYBIN" bash ./src/run-eval.sh \
              --student-model "{{ config.eval_config.student_model }}" \
              --teacher-model "{{ config.eval_config.teacher_model }}" \
              --corpus "{{ config.eval_config.corpus }}" \
              --out-dir "$OUT_DIR" \
              --metrics "{{ config.eval_config.metrics }}" \
              --max-samples {{ config.eval_config.max_samples }} \
              --max-length {{ config.eval_config.max_length }} \
              --max-incomplete-fraction {{ config.eval_config.max_incomplete_fraction }} \
              --batch-size {{ config.eval_config.batch_size }} \
              --seed {{ config.eval_config.seed }} \
              --dtype "{{ config.eval_config.dtype }}" \
              {% if config.eval_config.allow_tokenizer_mismatch %}--allow-tokenizer-mismatch{% else %}--no-allow-tokenizer-mismatch{% endif %}
    monitors:
      skypilot_monitor:
        # Artifact/binding convention from the shipped library, overridden to `periodic`
        # retrieval for the same reason distill-gold overrides it: a teacher forward pass
        # over 256 samples is not a seconds-long job, and the default on_completion mode
        # surfaces nothing until the end — so a stalled run looks identical to a slow one.
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(300) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(300) }}"
