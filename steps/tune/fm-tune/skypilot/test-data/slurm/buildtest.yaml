# Spec for test_skypilot_slurm_tune_fm_tune.py (see steps/README.md "Two test modes").
targets:
  - tune
target_expectations:
  - target_name: tune
    # The skypilot/slurm env does NOT set `inline: true` on its hf assetstore
    # pull, so each hf:// input queues its own hfpull step (2) plus the fm-tune
    # step (see steps/data/dpk/skypilot/test-data/slurm-tok/buildtest.yaml).
    # The env:// output moves no bytes, so no push step.
    step_count: 3              # hfpull(dataset) + hfpull(base_model) + fm-tune
    input_artifact_count: 2
    output_artifact_count: 1
    expected_steps:
      - step_uri: space://steps/tune/fm-tune
        config:
          fm_tune_config:
            tuning_algo: lora
            autotune: false
space_uri: ../../space
tests:
  - runner
simulate_step_failure: false
# First run builds the [core] venv (torch, transformers, ray) on a bare node.
timeout_minutes: 60
