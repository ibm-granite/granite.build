granite.build:
  name: skypilot-slurm-bluevela-byoc-test
  targets:
    byoc-run:
      # The goal is to run with this shared environment.yaml 
      environment_uri: space://environments/skypilot/slurm/ibm-bluevela
      # But, if you want to test some local environment customizations, then
      # add your own environment.yaml next to this build.yaml and use this environment_uri
      # environment_uri: file:.   # ./environment.yaml
      inputs:
        # env:// input: a no-op pull; it just flows to the command as a binding.
        env_input:
          uri: "env:///tmp/gb-env-input.txt"
      outputs:
        # env:// output: registered inline from the command's GB_ARTIFACT marker.
        env_output:
          uri: "env:///tmp/gb-byoc-output.txt"
          type: fileset
      steps:
        # The byoc step from the Space rendered by `make space` (the local source).
        - step_uri: space://steps/misc/byoc
          config:
            poll_interval_seconds: 5
            # CPU-only, and bluevela rejects GPU-less jobs on the env's gpu-mid
            # zone, so run on the cpu partition and drop the env-wide h200
            # constraint (as the env does for its hfpull/hfpush steps).
            zone: cpu
            launcher_config:
              sbatch_options:
                constraint: null
            byoc_config:
              # Bare launcher node (no container).
              image: ""
              repo: "https://github.com/octocat/Hello-World.git"
              ref: ""
              workdir: "code"
              # run requires this sentinel, so SUCCESS proves setup_command ran.
              setup_command: >-
                echo byoc-setup-ran > code/setup_marker
              command: >-
                test -f code/setup_marker;
                echo "setup marker: $(cat code/setup_marker)";
                echo "env input path: {{ bindings.env_input.binding.path }}";
                echo "GB_ARTIFACT_ID:env_output GB_ARTIFACT_PATH:/tmp/gb-byoc-output.txt"
            compute_config:
              num_gpus_per_node: 0
