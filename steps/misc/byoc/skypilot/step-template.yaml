name: byoc
version: 1.0.0
type: exec
config:
  byoc_config:
    # Public container image the step runs in. Defaults to a small public image
    # (quay.io/fedora/fedora-minimal:42, same as other builds that need a generic
    # image) so a build that does not choose one still runs in a working
    # container; set to "" to run on the bare launcher node instead (e.g. on a
    # cluster without Pyxis, which cannot run container images). This is a RUNTIME
    # choice (rendered by Jinja from the build.yaml), not a custom image built by
    # this step's Makefile.
    image: "quay.io/fedora/fedora-minimal:42"
    # Public git repository cloned into the step's working directory during `setup`.
    repo: ""
    # Optional branch, tag, or commit to check out after cloning.
    ref: ""
    # Subdirectory (under the step's working directory) the repo is cloned into.
    workdir: "code"
    # Command executed by `run`, from the step's working directory (the workdir
    # root — the same directory setup runs in). cd into the cloned repo yourself
    # if needed, e.g. "cd code && python main.py".
    command: ""
    # Optional bash command run during `setup`, after the repo is cloned, from
    # the step's working directory (the workdir root — cd into the repo yourself
    # if needed, e.g. "cd code && pip install -r requirements.txt"). Empty =>
    # skipped.
    setup_command: ""

# Any number of inputs, by design: byoc runs a free-form
# command, and the build author references each declared input in it as
# {{ bindings.<name>.binding.path }}. There is no fixed set of names to declare;
# allow_unknown keeps every target input valid. See USAGE.md, "Inputs (any number)".
inputs:
  allow_unknown: true

environment_configs:
  Skypilot:
    default_launcher: byoc
    launchers:
      byoc:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          # Runtime Jinja: an empty image renders to "" (bare launcher node);
          # otherwise the public image is wrapped as SkyPilot `docker:<ref>`.
          image_id: '{{ ("docker:" ~ config.byoc_config.image) if config.byoc_config.image else "" }}'
          # Cloud-agnostic: the build supplies cpus/memory/accelerators via
          # config.launcher_config.resources.
          resources: {}
          # Optional helper assets shipped alongside the step. A relative dest
          # lands at ./src, relative to the step's working directory (the same
          # directory setup and run start in).
          file_mounts:
            src: src
          # setup runs once at cluster bring-up: fetch the code. setup starts in
          # the step's working directory, so a relative CODE_DIR clones under it
          # without the step needing to know its absolute path.
          setup: |
            set -eu
            REPO="{{ config.byoc_config.repo }}"
            REF="{{ config.byoc_config.ref }}"
            CODE_DIR="{{ config.byoc_config.workdir }}"
            if [ -z "$REPO" ]; then
              echo "byoc: config.byoc_config.repo is empty; nothing to clone" >&2
              exit 1
            fi
            # The clone needs git, and setup_command only runs after it, so a
            # build cannot install git itself. Slim images (the default
            # fedora-minimal, the official pytorch/pytorch images) have none, so
            # install it here; an image that has git skips this. conda is tried
            # first: it needs no root (enroot containers on LSF run as the
            # submitting user) and installs into its own prefix, leaving the
            # image's Python env alone. The prefix is APPENDED to PATH, so it
            # never shadows a tool the image has; run adds it again.
            GIT_PREFIX="$(pwd)/.byoc-git"
            PATH="$PATH:$GIT_PREFIX/bin"
            if ! command -v git >/dev/null 2>&1; then
              echo "byoc: git is not in the image; installing it"
              if command -v conda >/dev/null 2>&1; then
                # HOME may be / (enroot) and the image's package cache
                # root-owned, so conda's cache goes to a scratch dir, removed
                # once git is in. Some conda releases' default libmamba solver
                # finds no conda-forge package at all (conda 25.1.0 in
                # pytorch/pytorch:2.6.0); the classic solver then still works.
                CONDA_SCRATCH="$(pwd)/.byoc-git-scratch"
                byoc_conda_git() {
                  rm -rf "$GIT_PREFIX"
                  HOME="$CONDA_SCRATCH" CONDA_PKGS_DIRS="$CONDA_SCRATCH/pkgs" \
                    conda create -y -q -p "$GIT_PREFIX" "$@" -c conda-forge --override-channels git
                }
                byoc_conda_git || byoc_conda_git --solver classic
                rm -rf "$CONDA_SCRATCH"
              elif [ "$(id -u)" != 0 ]; then
                echo "byoc: git is not in the image and cannot be installed: there is no conda and the container is not root; use an image that has git or conda" >&2
                exit 1
              elif command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y -q git
              elif command -v microdnf >/dev/null 2>&1; then
                microdnf install -y git
              else
                echo "byoc: git is not in the image and cannot be installed: no conda, apt-get, dnf or microdnf; use an image that has git" >&2
                exit 1
              fi
            fi
            echo "byoc: cloning $REPO -> $CODE_DIR"
            rm -rf "$CODE_DIR"
            git clone "$REPO" "$CODE_DIR"
            if [ -n "$REF" ]; then
              echo "byoc: checking out $REF"
              git -C "$CODE_DIR" checkout "$REF"
            fi
            # Optional user setup command, run from the workdir root after the
            # clone. Gated by a Jinja expression (like image_id above) so the raw
            # command is injected verbatim rather than through a shell variable
            # (which would need quoting). set -eu is in effect: a failure here
            # fails the build, just as a failed clone does.
            SETUP_ENABLED="{{ 'yes' if config.byoc_config.setup_command else '' }}"
            if [ -n "$SETUP_ENABLED" ]; then
              # Still in setup's working directory, so the command runs relative
              # to it — e.g. "cd code && pip install ...".
              echo "byoc: running setup_command in $(pwd)"
              {{ config.byoc_config.setup_command }}
            fi
          # run executes the user-defined command from the step's working
          # directory — the same directory setup starts in. The command cd's into
          # the cloned repo itself if it needs to; CODE_DIR is relative and
          # file-mounted helpers are available at ./src.
          run: |
            set -eu
            CODE_DIR="{{ config.byoc_config.workdir }}"
            # The git setup installed when the image has none (see setup). run is
            # a new shell, so put it on PATH again, for the lineage below and for
            # the command.
            PATH="$PATH:$(pwd)/.byoc-git/bin"
            # Record the resolved commit as step metadata so build lineage captures
            # exactly which commit was built (build.yaml may pin only a branch/tag,
            # or nothing). Defensive: never fail the build for lineage metadata,
            # even though set -eu is in effect. `-C` reads the repo without cd'ing.
            COMMIT_SHA="$(git -C "$CODE_DIR" rev-parse HEAD 2>/dev/null || true)"
            [ -n "$COMMIT_SHA" ] && echo "GB_STEP_METADATA_KEY:commit_hash GB_STEP_METADATA_VALUE:$COMMIT_SHA"
            echo "byoc: running command in $(pwd)"
            {{ config.byoc_config.command }}
            # Markers the skypilot monitor captures (print at the start of a line):
            #   register an output artifact:
            #     echo "GB_ARTIFACT_ID:<output-id> GB_ARTIFACT_PATH:<abs-path>"
            #   record step metadata (merged into StoredStepRun.metadata, surfaced
            #   in lineage):
            #     echo "GB_STEP_METADATA_KEY:<key> GB_STEP_METADATA_VALUE:<value>"
    monitors:
      # Standard artifact/status convention from the shipped monitor library.
      skypilot_monitor:
        ref: space://monitors/skypilot
