#####
# nemo-rl-sft — single-node, multi-GPU SFT on the reusable `nemo-rl` step.
#
# ONE target. The step picks examples/run_sft.py + examples/configs/sft.yaml in
# the NGC image, injects the bound base model as policy.model_name, trains,
# converts the final DCP checkpoint to HF, and registers it as the `model`
# artifact. ClearML is left in `auto` (default): it turns ON only if CLEARML_*
# server creds are present in the step env, and is a clean no-op otherwise.
#
# `dataset` is intentionally UNBOUND, so sft.yaml's built-in HF dataset is used.
# To train on your own data, bind a `dataset` input AND set
# nemo_rl_config.dataset_override_key to the Hydra key for that config's path.
#
# Portable via --param: swap ENVIRONMENT and the model URI scheme.
#
# Render/submit:
#   gb build render -f build.yaml --param-file parameters.yaml           # inspect
#   gb build start  -f build.yaml --param-file parameters.yaml           # aws
#
# NOTE: meta-llama/Llama-3.2-1B is a GATED model — the launcher's inline
# `hf download` needs HF_TOKEN in the step env (a GB space secret), or swap
# BASE_MODEL for a public model.
#####
granite.build:
  name: nemo-rl-sft

  targets:

    train:
      environment_uri: space://environments/$${ENVIRONMENT}
      inputs:
        # hf:// binding: the SkyPilot launcher injects `hf download` into setup
        # and exposes the local path, which the step feeds to Hydra as
        # policy.model_name. A prior-step model binding works here too.
        base_model:
          uri: "$${BASE_MODEL}"
      outputs:
        # The converted HF model. type: model is required; registered inline
        # from the step's artifact marker (env:// moves no bytes on a terminal
        # target). nemo_rl_config.output below names THIS entry.
        model:
          uri: "$${MODEL_URI}"
          type: model
      steps:
        - step_uri: space://steps/train/nemo-rl
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            nemo_rl_config:
              algorithm: sft
              config_name: sft.yaml
              output: model
              # Hydra overrides, rendered after `--` as key=value. A per-run
              # value comes from a $${...} param, resolved at render time.
              overrides:
                sft.max_num_steps: "$${MAX_STEPS}"
              # Optional ClearML grouping; only used if ClearML is enabled.
              clearml_project: "$${CLEARML_PROJECT}"
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${NUM_GPUS_PER_NODE}
              # Required: the SkyPilot accelerator type for your endpoint. The
              # step requests "<gpu_model>:<num_gpus_per_node>" GPUs and pins
              # NeMo-RL's cluster.gpus_per_node to num_gpus_per_node.
              gpu_model: "$${GPU_MODEL}"
