name: lm-engine-pretrain
version: 0.1.0
# Pretrain an lm-engine model from scratch on the SkyPilot environment
# (kubernetes subtype: Vela).
#
# Source: steps/train/lm-engine/pretrain/skypilot/ — published by `make publish-step`;
# do not edit the copy under configurations/assets. See USAGE.md.
#
# THE IMAGE IS NOT BUILT HERE. lm-engine and its dependencies live in the family
# image built by steps/train/lm-engine/Makefile and shared with the sibling
# `lm-engine-export` step. A run picks it at launch from config.image; nothing is
# cloned at launch. The step's own Python/bash helpers live in src/ and are
# file-mounted into the run (.gbignore keeps them out of the Jinja pass).
#
# The launcher exports this config as environment variables and hands the job to
# src/run_pretrain.sh, which renders lm-engine's config.yml (src/render_config.py)
# from the resume decision (src/resume.py), launches torchrun, and on rank 0 runs
# the checkpoint watcher (src/ckpt_watch.py) that emits the mid-run checkpoint
# artifacts. The `data-check` phase runs src/data_check.py instead and exits.
#
type: training
config:
  # The lm-engine image, pinned by tag (`make image` in steps/train/lm-engine).
  # Recipes set it once, as the LME_IMAGE parameter. Required.
  image: ""
  # What the job does: "train" runs pretraining; "data-check" only validates and
  # summarises the tokenized corpus and exits (no optimizer, no checkpoints).
  phase: "train"
  # The run's stable training directory, identical across every attempt of a build
  # (the recipe sets it to $RUN_DIR/train on the shared filesystem) so a relaunch
  # resumes from the checkpoints the previous attempt wrote. A per-run workdir path
  # would be deleted at target teardown. Required.
  train_dir: ""
  # Every lm-engine knob, as the nested mapping lm-engine's config.yml expects.
  # src/render_config.py renders it; its DEFAULT_KNOBS table is the authority on which
  # keys are accepted.
  #
  # THIS MUST BE COMPLETE. DEFAULT_KNOBS is a reference for recipes and tests, never
  # merged at run time, so a partial mapping is not filled in from it: `{}` fails
  # render_config.validate and the step exits 2 (which is the intended behaviour -- it
  # fails before the allocation rather than deep inside lm-engine). A recipe passes
  # every key; test_pretrain_recipe holds the recipe's key set equal to DEFAULT_KNOBS.
  lme: {}
  # Comma-separated optimizer step counts at which the run emits a checkpoint
  # artifact mid-run, e.g. "2000,4000". Each rung N needs a matching
  # checkpoint_<N> output declared by the recipe. Empty = only the final checkpoint.
  ckpt_rungs: ""
  # Emit the mid-run checkpoint artifacts at all. False (the default) runs the
  # training without the rank-0 watcher, so a plain run declares no rungs.
  emit_checkpoint_artifacts: false
  # How often the rank-0 watcher looks for a newly completed rung.
  checkpoint_watch_interval_seconds: 60
  # Fail the step when the job produced no optimizer progress, instead of
  # reporting success for a job that started and wrote nothing.
  require_progress: true
  # Resume from this checkpoint directory instead of the latest one under
  # train_dir. Empty = auto-detect (fresh start when train_dir holds no checkpoint).
  resume_from_checkpoint_dir: ""
  # Cluster facts from the site file (interface names, HCA lists, timeouts),
  # exported verbatim into the job's environment. Keys are used as given, so this
  # is where a cluster's NCCL_* and UCX_* settings belong — not in the template.
  nccl_env: {}
  nccl_debug: "WARN"
  wandb:
    project: ""
    # "offline" keeps the run from needing a WANDB_API_KEY; "online" needs one,
    # "disabled" turns tracking off entirely.
    mode: "offline"
    name: ""
    entity: ""
outputs:
  optional:
    # The final checkpoint of a `train` run. Optional: a `data-check` run emits
    # nothing, and a recipe may only want the rungs.
    checkpoint:
      type: model
    # checkpoint_<N>, one per entry in ckpt_rungs, are declared by the recipe —
    # the step cannot name them, since the rungs are a build-time choice.

# No named inputs: the corpus and the tokenizer arrive through config.lme, as
# paths inside the image or on the cluster's shared filesystem, not as bindings.
# Recipes bind ordering-only inputs (a corpus-prep target's output, say), whose
# names vary by recipe, so allow_unknown keeps every such binding valid.
inputs:
  allow_unknown: true

environment_configs:
  Skypilot:
    default_launcher: lm-engine-pretrain
    launchers:
      lm-engine-pretrain:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: '{{ ("docker:" ~ config.image) if config.image else "" }}'
          resources: {}
          # src/ holds the step's Python helpers and entry point; SkyPilot copies
          # the tree into the run's working directory (fm-tune does the same).
          file_mounts:
            src: src
          # Nothing is computed here that the job could compute itself: this block
          # turns `config` into the environment src/run_pretrain.sh documents, and
          # the script owns every decision. The two render-time checks below are
          # the exception — a config gbserver can reject when it creates the step
          # costs no allocation.
          run: |
            {#- q: shell-quote one value; a YAML null renders as empty, like an unset key. -#}
            {%- macro q(v) -%}'{{ ("" if v is none else v) | string | replace("'", "'\"'\"'") }}'{%- endmacro -%}
            {#- The spellings gbserver's Jinja accepts for a true flag; it has no `bool` filter. -#}
            {%- set _true = [true, "true", "True", "1", 1] -%}
            {%- if not config.train_dir %}{{ raise_error("lm-engine-pretrain: config.train_dir is required; set it to a path on the cluster's shared filesystem that is stable across attempts of this build.") }}{% endif %}
            {%- if config.phase not in ["train", "data-check"] %}{{ raise_error("lm-engine-pretrain: config.phase must be 'train' or 'data-check', got '" ~ config.phase ~ "'.") }}{% endif %}
            {#- num_nodes is the build's, not the step's: gbserver fills this block from
                the merged config at step creation, and a build that never sets
                compute_config gets one node. -#}
            {%- if config.compute_config is defined and config.compute_config is not none and config.compute_config is not mapping %}{{ raise_error("lm-engine-pretrain: config.compute_config must be a mapping, got '" ~ config.compute_config ~ "'.") }}{% endif %}
            {%- set compute = config.compute_config if (config.compute_config is defined and config.compute_config) else {} %}
            {%- set num_nodes = (compute.get("num_nodes") or 1) | int -%}
            # ── what the job is ──
            export TRAIN_DIR={{ q(config.train_dir) }}
            export LME_PHASE={{ q(config.phase) }}
            export LME_KNOBS_JSON={{ q(config.lme | json_dumps) }}
            export LME_RUNGS={{ q(config.ckpt_rungs) }}
            export LME_EMIT={{ q("true" if config.emit_checkpoint_artifacts in _true else "false") }}
            export LME_WATCH_INTERVAL={{ q(config.checkpoint_watch_interval_seconds) }}
            export LME_RESUME_SRC={{ q(config.resume_from_checkpoint_dir) }}
            export LME_REQUIRE_PROGRESS={{ q("true" if config.require_progress in _true else "false") }}
            # retry_workload relaunches into the same per-run workdir, so the file
            # handshakes under the build-stable train_dir need a name that changes per
            # attempt. GB_SKYPILOT_CLUSTER_NAME carries the relaunch counter
            # (gb-...-r<attempt>, skypilot.py _cluster_name_for); GB_TARGETRUN_ID and
            # GB_SKYPILOT_LAUNCH_ID are replayed unchanged and cannot tell two attempts
            # apart. Every node of one attempt reads the same value, which is the point.
            export GB_ATTEMPT_TOKEN="$(printf '%s' "${GB_SKYPILOT_CLUSTER_NAME:-${GB_SKYPILOT_LAUNCH_ID:-local}}" | tr -c 'A-Za-z0-9._-' '_')"
            # ── code facts: this step's defaults, the same on every cluster ──
            export NCCL_TIMEOUT=10800000
            export CUDA_DEVICE_MAX_CONNECTIONS=1
            export PYTORCH_ALLOC_CONF=expandable_segments:True
            export OMP_NUM_THREADS=1
            export TOKENIZERS_PARALLELISM=false
            export TRITON_CACHE_DIR=/tmp/triton
            export HOME=/tmp
            export NCCL_IGNORE_CPU_AFFINITY=1
            export NCCL_SOCKET_NTHREADS=2
            export CUDA_DEVICE_ORDER=PCI_BUS_ID
            export CUDA_MODULE_LOADING=LAZY
            export NCCL_ALGO=Ring
            export NCCL_DEBUG={{ q(config.nccl_debug) }}
            {%- if num_nodes > 1 %}
            # ── cluster facts: config.nccl_env, verbatim, keys as the site file spells them ──
            {%- for key, value in (config.nccl_env or {}) | dictsort %}
            export {{ key }}={{ q(value) }}
            {%- endfor %}
            {%- else %}
            # One node: there is no inter-node traffic to route, so InfiniBand is
            # turned off and the cluster's nccl_env is not applied.
            export NCCL_IB_DISABLE=1
            {%- endif %}
            {%- if config.wandb.project %}
            # ── W&B: rendered only when wandb.project is set ──
            export WANDB_PROJECT={{ q(config.wandb.project) }}
            export WANDB_MODE={{ q(config.wandb.mode) }}
            {%- if config.wandb.name %}
            export WANDB_NAME={{ q(config.wandb.name) }}
            {%- endif %}
            {%- if config.wandb.entity %}
            export WANDB_ENTITY={{ q(config.wandb.entity) }}
            {%- endif %}
            {%- endif %}
            bash ./src/run_pretrain.sh
    monitors:
      skypilot_monitor:
        # Artifact/binding convention from the shipped library, with `periodic` log
        # retrieval: the rank-0 watcher's GB_ARTIFACT_ID lines are what dispatch the
        # mid-run export targets, and the default on_completion mode parses the job
        # log only once, at terminal status — which for a training run that lasts
        # hours is long after every rung it announced.
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(300) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(300) }}"
          extra_event_configs:
            # Progress, so a long run is visibly alive between checkpoints: the
            # per-node banner run_pretrain.sh prints at startup, and lm-engine's own
            # training log line (it logs `step = <n>` each log_interval).
            - event_type: WORKLOAD_STATUS_EVENT
              line_regex: "(lm-engine: node_rank=|step = )"
              event_fields:
                - field_name: status
                  field_value_template: "RUNNING"
                - field_name: message
                  field_regex: ".+"
