[project]
name = "distill-gold-train-step"
version = "0.1.0"
description = "Runtime environment for the logit-distill step -- GOLD knowledge distillation (TRL + DeepSpeed ZeRO-3 + vLLM) from a Granite 4.2 teacher into a retagged Granite 4.1 student."
# 3.12 EXACTLY, expressed as a range of one minor version, and that is deliberate.
# ">=3.11" was aspirational: the only interpreter this code has ever run under is the
# CPython 3.12 in the environment this step was validated against, and with an open upper
# bound `uv lock` resolved against CPython 3.14 -- i.e. it would have locked a graph for an
# interpreter nothing here has ever executed. Pinning the minor version makes the lock
# below describe the interpreter that actually runs, and makes a base image with a
# different python fail loudly at `uv sync` instead of quietly resolving a different
# dependency graph. Widen it by testing on the wider interpreter, not by editing this line.
requires-python = ">=3.12,<3.13"

# NOTE ON PINS. Every version constraint below is a finding, not a preference, and the
# reason belongs next to it -- the whole point of a maintained collection over an
# exploratory checkout is that nobody has to guess later why a bound exists.
#
# WHERE THESE NUMBERS COME FROM. Not from taste and not from "latest": they are the
# versions actually present in the environment every recorded successful run of this code
# used -- including the run that trained this step's off-policy arm end-to-end through the
# rendered step command. Read out of that venv's installed metadata on 2026-08-25.
#
# EXCEPT the vLLM upgrade (#676), which moved vllm to its latest release and with it trl,
# torch (transitively, through vllm), transformers, accelerate, huggingface_hub, kernels and
# datasets OFF that environment, and the image from CUDA 12.8 to CUDA 13. Those pins are
# NOT from a recorded run. Their evidence is a resolve, an image build and the
# import/patch probes named in each comment; until a training run on that image, they are
# built and probed, not trained.
#
# HOW FAR THE PINS ARE VERIFIED. `uv lock` resolves them against PyPI (see uv.lock, and
# `uv lock --check` re-verifies), and the image build installs exactly that lock
# (`uv sync --locked` in the Dockerfile), including `deepspeed`, which is sdist-only and
# builds against the base image's CUDA toolkit. For the pins the venv above recorded,
# that venv proves the set runs; for the #676 pins, see their comments.
#
# WHY EXACT `==` AND NOT RANGES, for this step specifically. This code reaches into
# private surfaces of the pinned packages: custom_gold_trainer.py and sft.py override
# private trainer methods of trl's GOLDTrainer and SFTTrainer, hub_kernel_pins.py
# registers modules under the names transformers' granitemoehybrid code imports, and the
# kernel gate reads kernels' and huggingface_hub's on-disk cache layout. An override of a
# private method is not version-tolerant: when upstream moves it, the override is never
# called, quietly. The monkeypatches the trl 0.26.2 / vLLM 0.11.0 stack needed (trl's
# `_vllm_ascend_available`, `trl.scripts.vllm_serve.sanitize_logprob`, and vLLM's granite
# and granitemoehybrid `__init__`s) were deleted in #676; patch_targets.py records why and
# fails if one of those bugs comes back. A range would let a resolver pick a release this
# code does not describe. Bumping any of them is therefore a deliberate change with its
# own test, not a resolver's choice -- run patch_targets.py after it.
dependencies = [
    # GOLD lives in trl.experimental.gold, which is not a stable public API: the module
    # path and GOLDConfig's field set have both moved between releases, and
    # src/gb_steps_post_training/distillation/custom_gold_config.py subclasses GOLDConfig
    # directly.
    #
    # 1.18.2 EXACTLY (#676; was 0.26.2), the latest trl. 0.26.2 requires vllm<0.12, so
    # the vLLM upgrade below forces a trl 1.x. 1.18.2's `vllm` extra declares
    # vllm>=0.23,<0.34, which is why vllm is 0.33.0 and not the latest 0.34.0 (the extra is
    # not installed, so the resolver would not enforce it; the range is trl's statement of
    # what it supports). It needs datasets>=4.7 and accelerate>=1.11
    # (both satisfied below). Its optional extras ask for deepspeed>=0.18.6 and
    # liger-kernel>=0.8.2; neither extra is installed here (see those pins).
    #
    # What 0.26.2 needed working around is gone in 1.x: trl/import_utils.py now has
    # its own `_is_package_available` that returns a plain bool unless asked for the
    # version, has no `_vllm_ascend_available` at all, and `is_weave_available()` calls
    # it directly, so the tuple-guard failures (`No module named 'vllm_ascend'` /
    # `'weave'`) cannot happen. That is why gold.py and run_vllm_serve.py no longer patch
    # it (deleted in #676) and why weave is no longer installed.
    #
    # custom_gold_trainer.py and custom_gold_config.py are ported to 1.18.2's
    # GOLDTrainer/GOLDConfig and its vLLM client and server (#676): VENDORED.md lists the
    # decisions, and logit-distill's test_trl1_port.py pins each of them.
    "trl==1.18.2",
    # A 5.x-only codebase in ways that are load-bearing rather than incidental: the chat template is read from `chat_template.jinja` as a FILE and
    # not from tokenizer_config.json (patches/granite-chat-template-generation-markers/),
    # the legacy vocab.json/merges.txt sidecars are inert (docs/tokenizer_mismatch.md),
    # `rope_theta` has moved into `config.rope_parameters` (which is what gold.py's vLLM
    # patches existed for; vllm reads rope_parameters itself now), and the
    # tuple-returning `_is_package_available` trl 0.26.2 tripped over is a transformers
    # change. Held exactly because the vLLM pin below has to agree with it and one of them
    # moving alone is the failure mode.
    #
    # 5.20.2 EXACTLY (#676; was 5.8.0, the recorded environment's version, which also
    # carried a HIGH advisory fixed in 5.10.0). vllm 0.33.0 requires >=5.16.1,<5.21, and
    # 5.20.2 is the newest release in that range. The move is NOT a bug-fix release: 5.16
    # changed how the granitemoehybrid modeling code finds the Mamba2 kernels (it binds
    # whatever `causal_conv1d` / `mamba_ssm` package is importable when the module is
    # imported, instead of lazy_load_kernel through _HUB_KERNEL_MAPPING), which is why
    # hub_kernel_pins.py was rewritten, and it requires kernels>=0.17.2,<0.18 (the kernels
    # pin). It loads flash-attn2 at major version 3 (5.22 loads 4); gold-kernels.sh reads
    # that from transformers. patch_targets.py probes the transformers surface this code
    # still depends on.
    "transformers==5.20.2",
    # accelerate is the DeepSpeed integration layer here, not a
    # convenience: configs/distillation/deepspeed/accelerate_deepspeed_zero3.yaml is an
    # ACCELERATE config, the launcher invokes `accelerate launch`, and ZeRO-3 checkpoint
    # saving (zero3_save_16bit_model) is what makes hf-export a selector rather
    # than a converter. The accelerate/deepspeed/torch triple is the one this step has
    # actually trained and resumed under, confirmed by direct measurement -- 1.12.0 with
    # torch 2.8.0.
    #
    # 1.16.0 EXACTLY (#676; was 1.12.0), the latest. Not forced by a resolver: 1.12.0
    # still resolves. Raised because every release through 1.14.0 has a HIGH advisory
    # (PYSEC-2026-3804, path traversal in load_checkpoint_in_model's weight_map) and
    # because torch moves from 2.8 to 2.14 anyway, so the trained triple is gone either
    # way. Imports in the dev image; not yet trained or resumed.
    "accelerate==1.16.0",
    # 0.17.5 EXACTLY, which is what `deepspeed<0.17.6` already meant in practice: 0.17.5
    # was the newest release under that ceiling and is the version installed in the
    # sandbox venv. The ceiling was inherited from the recorded environment with NO
    # recorded reason, and this pin does not invent one -- it records that the only
    # version this code has ever run under is 0.17.5 and stops a resolver from choosing
    # differently. What breaks at 0.17.6+ is still unknown; finding out is a deliberate
    # experiment (one bump, one training run, one recorded result), not something to
    # discover during a distillation run on preemptable capacity. Kept at 0.17.5 through
    # #676 for that reason, although trl 1.18.2's (uninstalled) `deepspeed` extra asks for
    # >=0.18.6. Under torch 2.14.0 it builds and imports in the dev image, but its JIT ops
    # do NOT compile: torch >= 2.12 headers need C++20, and 0.17.5's op builder compiles the
    # host side as C++17 (`#error C++20 or later compatible compiler is required to use
    # PyTorch`, FusedAdam, measured in the dev image). deepspeed 0.19.5 is the first release
    # that passes -std=c++20 for torch >= 2.12. Kept anyway because nothing here builds an
    # op: the ZeRO-3 config (configs/deepspeed/accelerate_deepspeed_zero3.yaml) names no
    # DeepSpeed optimizer and offloads nothing, so transformers' torch optimizer is used.
    # A config that needs a DeepSpeed op (cpu_adam offload, FusedAdam) needs >= 0.19.5.
    "deepspeed==0.17.5",
    # Serves the STUDENT for on-policy rollouts (lmbda > 0), not the teacher -- the teacher
    # is sharded by the trainer's own ZeRO-3.
    #
    # 0.33.0 EXACTLY (#676; was 0.11.0, which has two CRITICAL advisories: an RCE in video
    # processing, fixed in 0.14.1, and an OpenAI-server auth bypass, fixed in 0.22.0).
    # 0.33.0 is the newest release inside trl 1.18.2's declared range (vllm>=0.23,<0.34;
    # see the trl pin), and osv reports no advisory for it (0.26.0, the newest that
    # resolved with transformers 5.8.0, had 18 HIGH). The latest, 0.34.0, has none either,
    # but no trl release supports it yet and it needs filelock>=4.2.4: revisit when the
    # next trl release does. 0.33.0 forces torch==2.14.0 (torchvision 0.29.0, torchaudio
    # 2.11.0), transformers>=5.16.1,<5.21 and huggingface_hub>=1.31.
    #
    # It is coupled to BOTH neighbours. Downwards: the Mamba2 Hub kernels are resolved
    # per torch/CUDA variant (torch214-cxx11-cu130-x86_64-linux now), so a torch bump
    # needs a kernel revision that ships that variant (hub_kernel_pins.py). torch is not
    # listed here: the default PyPI torch 2.14.0 wheel is the CUDA 13.0 build vLLM's
    # default wheel is built against, so no index pin is needed to choose its source, and
    # vllm's exact pin already fixes its version. vLLM publishes no cu128 wheel for any
    # release with the CRITICAL fixes (0.33.0 has only the default CUDA 13 wheel), which
    # is why the image moved to CUDA 13 (Dockerfile). Upwards: gold.py and
    # run_vllm_serve.py patched `GraniteMoeHybridAttention.__init__` and
    # `GraniteDecoderLayer.__init__` inside vllm.model_executor for vLLM 0.11.0; vLLM
    # 0.33.0 passes `config.rope_parameters` itself, so #676 deleted both patches
    # (patch_targets.py guards against the bug's return).
    "vllm==0.33.0",
    # Mamba2 mixer kernels for Granite 4 hybrid models, loaded from the Hub by
    # hub_kernel_pins.prepare_hub_kernels at entrypoint import time. The HF cache the step
    # mounts must be warm for the pinned revision and this image's torch/CUDA variant, or
    # the step fails after allocation; see gold-kernels.sh's kernel gate (it downloads on
    # a miss by default) and hub_kernel_pins.py.
    #
    # 0.17.3 EXACTLY (#676 / #763; was 0.12.3). Forced three ways: 0.12.3 requires
    # huggingface_hub<2.0; it reads only the "model" type kernel repositories, which
    # Hugging Face is removing (kernel-type repositories need kernels>=0.14); and
    # transformers 5.20.2 accepts only kernels>=0.17.2,<0.18. 0.17.3 is the newest in
    # that range. The private API this code used (`kernels.utils.install_kernel`,
    # `_import_from_path`) no longer exists; hub_kernel_pins.py now calls the public
    # `kernels.get_kernel` and gold-kernels.sh `kernels.install_kernel`. Still exact,
    # because the gate and the loader depend on how kernels lays out and resolves its
    # cache offline (refs for a `version=`, snapshots for a commit).
    "kernels==0.17.3",
    # Exact for the same reason as kernels: the kernel gate and the offline loads read
    # the HF cache, so its on-disk layout is part of this step's contract rather than an
    # implementation detail it is insulated from. (This replaces a >=0.25.0 floor that
    # predated the kernel preflight.)
    #
    # 2.4.0 EXACTLY (#676; was 1.14.0), the latest. vllm 0.33.0 and datasets 5.x need
    # >=1.31, kernels 0.17 >=1.10. A MAJOR version: the 2.x cache changes the offline
    # kernel loads depend on are handled in hub_kernel_pins.make_offline_readable.
    "huggingface_hub==2.4.0",
    # Liger fused-linear JSD, for loss_arm=liger_fused_jsd. Optional at runtime for the
    # default jsd arm, but the arm must not be a config value that fails on import.
    # 0.6.4 is the sandbox version; the arm itself is a scaffold and has not been trained,
    # so this pin records what is installed rather than what has been exercised.
    # trl 1.x's own is_liger_kernel_available() requires >=0.8.2 and so reports False
    # for 0.6.4, and its GOLD trainer has no liger path at all. This code gates on
    # transformers' check instead (custom_gold_trainer.py, sft.py), which needs >=0.3.0,
    # and liger_losses.py imports liger_kernel directly, so 0.6.4 still serves the arm.
    # Imports under torch 2.14.0 / triton 3.8.0 in the dev image. Not raised in #676:
    # raising it belongs with the first training run of the arm.
    "liger-kernel==0.6.4",
    # Declared because gold.py imports `datasets.{Dataset, DatasetDict, load_dataset,
    # load_from_disk}` directly and data-prep's output is consumed through them, so
    # datasets is a direct dependency of this step whether or not it is listed; listing it
    # is what makes the version a decision instead of a side effect (an unconstrained
    # resolve once picked 5.0.1, a MAJOR version ahead of anything this code had run under).
    #
    # 5.2.0 EXACTLY (#676; was 4.4.1, the recorded environment's version), the latest.
    # trl 1.x requires datasets>=4.7; 5.2.0 caps fsspec<=2026.9.0, which admits the
    # fsspec release that fixes its HIGH advisory (constraint below). A MAJOR version
    # against what this code has run under: 5.2.0's save_to_disk refuses a format with a
    # transform, which student-sft's preprocessing cache hit (sft.py, _run_map_chain).
    "datasets==5.2.0",
    # render_gold_config.py's only third-party dependency. Deliberately NOT pinned exactly:
    # nothing here touches a private pyyaml surface, safe_load/safe_dump are stable across
    # its releases, and an exact pin on a leaf utility only creates conflicts with whatever
    # else the base image has installed.
    "pyyaml",
    # Tracking backends. EXACT pins, matching this step's convention rather than the ranges
    # `uv add` writes: unlike pyyaml above, these are not leaf utilities whose surface is stable
    # -- transformers' ClearMLCallback drives them through an env-var contract (CLEARML_PROJECT,
    # CLEARML_TASK, CLEARML_LOG_MODEL) that a backend release can reinterpret, and this is the
    # step whose run IS the deliverable. Pinning also brings them under a companion
    # pin-verification tool, which checks only the exact pins for this step -- a range here
    # would be declared but unchecked.
    "clearml==2.1.12",
    "wandb==0.28.2",
    # weave is NOT listed any more (#676; was weave==0.53.12). This code never used it:
    # trl 0.26.2's callbacks.py imported it behind a tuple-returning guard that was truthy
    # with weave absent, so it had to be installed for `from trl import ...` to work.
    # trl 1.x's guard returns a bool (see the trl pin), so with weave absent
    # trl.trainer.callbacks skips the import; verified by import in the dev image.
    # A transitive dependency, pinned because 4.70.0 (what the lock resolved) breaks the
    # Mamba2 kernel fetch: huggingface_hub's snapshot_download hands thread_map a
    # generator, and tqdm 4.70's _min_map_len then calls min() on an empty sequence, so
    # `install_kernel("kernels-community/mamba-ssm")` raises "min() iterable argument is
    # empty" on a cold cache. causal-conv1d and flash-attn2 download fine, which is why
    # only the student-sft and teacher-logits steps (the GOLD_PREFETCH_KERNELS=1 launchers)
    # failed. Measured in the a20c8f39 image: 4.70.0 fails, 4.67.1 downloads the kernel.
    # Not re-measured under huggingface_hub 2.4.0 (#676), so the pin stays.
    "tqdm==4.67.1",
]

[dependency-groups]
dev = ["pytest"]

# Not a package in its own right -- this pyproject.toml exists only so uv lock/uv sync can
# produce a reproducible venv for the step's runtime, not to build a wheel. Same as every
# other step in this repo.
[tool.uv]
package = false
constraint-dependencies = [
    "certifi>=2026.10.18",
    "pillow>=13.0.0",
    "pyjwt>=2.14.0",
    "aiohttp>=3.14.4",
    "dnspython>=2.9.2",
    "graphql-core>=3.3.1",
    "msgpack>=1.2.3",
    "urllib3>=2.8.0",
    # The fix for fsspec's HIGH advisory (GHSA-27vj-qcqg-25rc); datasets 5.2.0 admits it.
    "fsspec>=2026.6.0",
    # vllm 0.11.0 capped setuptools<80; vllm now allows <81, so setuptools can take the
    # release that vendors fixed jaraco.context and wheel copies.
    "setuptools>=80.10.2",
    # A CEILING, not a fix: filelock 4.x changes UnixFileLock's behaviour on shared lock
    # directories (4.2.12 refuses, with PermissionError, a lock file another account owns
    # under a sticky parent), and these steps share one HF cache across accounts on
    # group-shared filesystems. vllm 0.33.0 accepts filelock>=3.20.3 and torch 2.14.0 any,
    # so without this the resolver is free to take 4.x. Moving to 4.x is its own,
    # cluster-tested change (#752; see scan-ignore). vllm 0.34.0 requires >=4.2.4, so
    # the next vllm raise brings that test with it.
    "filelock<4",
]
