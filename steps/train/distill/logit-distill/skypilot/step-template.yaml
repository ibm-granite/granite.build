name: logit-distill
version: 1.0.0
# GOLD knowledge distillation (generalized JSD) of a small student from a larger
# teacher, via the SkyPilot LSF or SLURM cloud (one step, both subtypes — see
# `environment_configs.Skypilot.subtypes` below).
#
# Division of labour, which is what keeps this step small: the provisioner
# (LSF's bsub/blaunch/enroot, or SLURM's sbatch/srun/pyxis) already owns job
# submission, the multi-node fan-out, and container image import/creation. The
# per-node topology this step reads (SKYPILOT_NODE_RANK / _NUM_NODES /
# _NODE_IPS / _NUM_GPUS_PER_NODE) is SkyPilot's own generic, backend-agnostic
# set — confirmed present on both subtypes directly from `sky`'s own source
# (`sky/backends/task_codegen.py`; SLURM's executor re-asserts rank/node-count/
# node-ips at run time in `sky/skylet/executor/slurm.py`). `MASTER_ADDR`/
# `MASTER_PORT` have no SkyPilot-generic equivalent (LSF's own provisioner sets
# them; SLURM's doesn't), so this step derives both itself from the generic
# vars instead of reading provisioner-specific names — see the topology
# snapshot below. This keeps the script itself ignorant of which subtype it is
# running on: no `{% if %}`/subtype branching inside `run`, matching this
# repo's convention (a prior attempt at subtype branching inside a shared
# step, `dpk`'s CPU auto-sizing, was implemented and reverted as an
# anti-pattern — "a default that helps on slurm and harms on kubernetes is
# worse than none"). Genuinely subtype-specific concerns (NCCL tuning) stay
# out of this step entirely and come from each environment's own
# `nccl_tuning_file`, the same way LSF's already does.
#
# So the launcher scripts from the ansible path are NOT ported here — this step
# replaces only their inner logic: render the trainer's config, then start
# accelerate with this node's rank.
#
# The trainer itself (gold.py, custom_gold_trainer.py, run_vllm_serve.py, and their
# shared helpers) is the same in-repo package every other distillation step uses
# (steps/train/distill/src/), baked into the shared GPU image -- not a separate
# checkout. This used to be a distinct `kd_code_dir` pointing at a live /proj
# checkout, which meant a trainer fix landed without touching granite.build at the
# cost of the checkout being unpinned, and meant the trainer's own source could not
# be inspected without filesystem access to that path. Keeping it in this repo
# makes the trainer itself pinned, versioned, and publicly readable like the rest
# of this collection.
type: training
config:
  # ─── Source delivery ──────────────────────────────────────────────────────────
  # NO code_config HERE (no distill step has one): this step's
  # trainer source (gb_steps_post_training, including the locally-folded-in
  # on-policy study fields -- see steps/train/distill/src/VENDORED.md) is baked
  # directly into the shared GPU image (steps/train/distill/images/gpu/Dockerfile COPYs
  # steps/train/distill/src/) rather than cloned at job-launch time. gold is the one
  # ported step that runs multi-node, where a runtime clone needs its own
  # rank-0-clones/others-wait guard against a real race (measured on build
  # 7e9995b3) -- baking the source into the image sidesteps that race entirely
  # instead of guarding it, and gives every recipe the vendored trainer's
  # fields unconditionally with no checkout to point at. See the static
  # CODE_DIR/PYBIN at the top of `run` below instead of a clone.
  # ── Per-checkpoint artifact emission ──────────────────────────────────────
  # OFF by default, and that default is the contract: with it off this step emits
  # exactly one artifact, `checkpoint`, at the end of the run — which is what every
  # single-checkpoint recipe binds and what they all did before this existed.
  #
  # ON, a background watcher on rank 0 polls the checkpoint directory during training
  # and emits `checkpoint_<N>` per HF checkpoint-<N> dir as soon as it is completely
  # written. A recipe that declares matching `checkpoint_<N>` outputs can then export
  # and evaluate rung N while the run is still training, instead of after it — see
  # recipes/granite4-350m/lsf/distill-checkpoint-eval, where that turns ~36 GPU-h of
  # eval from a serial tail into work overlapped with a 13-hour epoch.
  #
  # The emitted ids are a CONTRACT with the recipe: a rung whose checkpoint dir the
  # trainer never writes is an artifact never emitted, and a target bound to it waits
  # forever with no error. Hence the zero-emission guard in run: below, and hence the
  # recipe tests that assert every rung is a multiple of save_steps.
  emit_checkpoint_artifacts: false
  # How often that watcher polls. Lower detects a new checkpoint sooner and costs a
  # directory listing; the log-scrape interval of the monitor is the other half of
  # the latency, since an emitted line is only seen when the logs are next pulled.
  checkpoint_watch_interval_seconds: 60
  # ── Resume from an earlier run ────────────────────────────────────────────
  # EMPTY by default, and then nothing below renders. Set, it names the checkpoint
  # directory of an earlier run of this step — the `<run_name>_node<N>` directory
  # holding its checkpoint-<N> subdirectories, e.g.
  #   /proj/.../builds/<build>/runs/<run>/checkpoints/<run_name>_node2
  #
  # Needed because the checkpoint directory is under GB_BUILD_WORKDIR, which is new
  # for every build and target run, so the trainer's own auto-resume (gold.py
  # resumes when its output_dir already holds a checkpoint-*) never finds an
  # earlier run's checkpoints. (An automatic retry_workload relaunch reuses the
  # workdir, and with it what the failed attempt wrote; see the resume block.)
  # Before the trainer starts, rank 0 hardlinks every COMPLETE checkpoint-<N> from
  # here into this run's checkpoint directory; the trainer then resumes from the
  # highest checkpoint-<N> in that directory — weights, optimizer, scheduler, RNG and
  # data position. That one's trainer_state.json is then rewritten to this run's
  # save_steps and logging_steps: HF restores the state whole, so the run would
  # otherwise save on the source's grid.
  #
  # Three consequences to know before setting it:
  #  * The world size must match the source's. A ZeRO-3 checkpoint holds one
  #    optimizer shard per rank, so the step refuses a source saved by a different
  #    number of ranks rather than letting DeepSpeed fail after allocation.
  #  * The schedule must match too (max_steps, batch sizes, learning rate). The
  #    trainer restores the scheduler's state, not its shape; nothing checks this.
  #  * With emit_checkpoint_artifacts on, every seeded checkpoint is emitted as
  #    checkpoint_<N> again, so its downstream export and eval targets re-run. That
  #    is also what keeps them from waiting forever on a rung this run never writes.
  #
  # Hardlinks, not copies: no data is duplicated and the source is never modified
  # (the trainer only ever deletes whole checkpoint directories, which unlinks this
  # run's names and leaves the source's). Falls back to a real copy across
  # filesystems.
  resume_from_checkpoint_dir: ""
  # Whether the seeded checkpoints are emitted as checkpoint_<N> again. TRUE by
  # default, which is what a recipe whose ladder still names those rungs needs: their
  # export targets are bound to the ids and would otherwise wait forever. FALSE when
  # the seeded rungs were already exported and evaluated by the stopped run and the
  # relaunch's ladder names only the rungs still to come -- then the watcher treats
  # them as already emitted and only checkpoints this run writes are announced.
  # Has no effect unless both resume_from_checkpoint_dir and
  # emit_checkpoint_artifacts are set.
  resume_emit_seeded: true
  # ── Stable training directory ─────────────────────────────────────────────
  # Empty = today's behaviour (checkpoints under GB_BUILD_WORKDIR). The distill recipe sets
  # <WORKDIR_ROOT>/<RUN_NAME>/<build_id>/train: it survives build-level retries (same build id,
  # new per-run workdir) and post-build cleanup; a new build gets a new directory.
  #
  # Set, the checkpoint directory is <train_dir>/checkpoints/<run_name>_node<N> and the
  # rendered config sits beside it, so a build-level retry resumes from what the failed
  # attempt wrote rather than from step 0. Before the trainer starts, rank 0 moves a
  # half-written checkpoint aside (as a retry_workload relaunch always has) and, with
  # emit_checkpoint_artifacts on, re-emits checkpoint_<N> for every complete checkpoint
  # already there: gbserver only re-checks a downstream export once its input binding is
  # delivered again, and without it those targets are never dispatched on the retry while
  # the build still reports SUCCESS (test/unit/buildrunner/
  # test_checkpoint_consumer_reuse_on_retry.py). resume_from_checkpoint_dir then only
  # seeds an EMPTY train_dir: once the directory holds checkpoints of its own, they win.
  train_dir: ""
  # With train_dir set: refuse to train when the two previous attempts in this train_dir both
  # failed to raise the highest complete checkpoint (a deterministic failure would otherwise burn
  # every retry; one transient failure before the next save is let through). Once refused, every
  # later attempt in the train_dir is refused at once. See src/progress_check.py.
  require_progress: true
  # ── Rollout server stop file ──────────────────────────────────────────────
  # EMPTY (default) = off, and nothing below renders. Set it to a path on a filesystem
  # the rollout server's node shares, and to the same path as
  # student-rollout-generator's vllm_config.stop_file. When this script exits non-zero,
  # rank 0 writes the file atomically (tmp + mv): this target run's GB_TARGETRUN_ID,
  # then a reason line. The server polls for it and stops at once, failing its own
  # target. Without it, a failed trainer strands the server: the teardown target is
  # gated on this target's checkpoint, which a failed run never emits, so the build
  # stays RUNNING until the server's max_lifetime_seconds. A successful run never
  # writes it, so a normal teardown is unchanged.
  rollout_stop_file: ""
  gold_config:
    # ── Code and image ──────────────────────────────────────────────────────
    # DeepSpeed ZeRO-3 accelerate config, relative to $DISTILL_HOME (/opt/distill).
    ds_config: "configs/deepspeed/accelerate_deepspeed_zero3.yaml"
    # Names the checkpoint directory and the rendered config. The node count is
    # appended at runtime, from the allocation, so the two cannot disagree.
    run_name: "gold"

    # ── Model and data ──────────────────────────────────────────────────────
    # The student, the teacher and the corpus are target INPUTS, not config keys —
    # see `inputs:` below.
    #
    # Refuse to start when the student or teacher path names weights GPFS has
    # migrated to tape. Reading those back is a per-shard recall of minutes to
    # hours, inside a GPU allocation, and the failure it produces downstream does
    # not look like a storage problem. The check is metadata-only (mmlsattr, and
    # st_blocks arithmetic where mmlsattr cannot answer), it never touches file
    # contents, and it refuses on OFFLINE -- GPFS's own verdict, or a large file
    # with almost nothing allocated -- or on a path it cannot stat at all. If it
    # cannot measure, it warns and proceeds. A hub id rather than a path is not a
    # finding either. On BlueVela the environment bind-mounts /usr/lpp/mmfs so
    # the container gets mmlsattr's answer rather than only the arithmetic's.
    check_weight_residency: true
    # Proceed anyway. Announces itself in the log; for the case where you know
    # the recall is already running.
    allow_offline_weights: false

    # ── Training hyperparameters ────────────────────────────────────────────
    num_train_epochs: 1.0
    # Cap the run by optimizer steps rather than by epochs. 0 leaves the key out
    # of the rendered config entirely, so an epoch-bounded run is unaffected;
    # any positive value overrides num_train_epochs in the trainer. This is what
    # a run over a corpus too large to epoch through needs — one epoch of the
    # 802,027-row reference corpus is 4,177 steps at effective batch 192.
    max_steps: 0
    # Seed for the training data SAMPLER only. -1 leaves the key out of the rendered
    # config, so the sampler follows the trainer's `seed` (42) as it always has. Set it
    # when initialising from another run's checkpoint over the same corpus: at the same
    # seed and geometry the new run draws the very batches the old one trained on.
    data_seed: -1
    learning_rate: 1.0e-05
    min_lr: 1.0e-06
    warmup_ratio: 0.05
    # Adam's beta2. -1 leaves the key out and the trainer keeps 0.999, whose
    # second-moment average spans ~1,000 steps; 0.95 spans ~20. A stock
    # TrainingArguments field, so not a trainer extension.
    adam_beta2: -1.0
    # The sampler. EMPTY leaves the key out (the trainer's "random", seeded by
    # data_seed). "sequential" feeds the corpus in file order -- the only setting under
    # which a corpus whose row order is part of its design (rows front-loaded into the
    # first steps) reaches the trainer in that order.
    train_sampling_strategy: ""
    lr_scheduler_type: cosine_with_min_lr
    per_device_train_batch_size: 1
    # Effective batch = per_device * grad_accum * nodes * gpus_per_node. The
    # reference run is 192 (1 x 6 x 4 x 8); halving the nodes wants 12 here to
    # hold that, since the LR schedule was tuned against it.
    gradient_accumulation_steps: 6
    max_completion_length: 4096
    max_length: 16384
    gradient_checkpointing: true
    # Keep the whole trajectory: an early, less-forgotten checkpoint is often the
    # best one to evaluate, and a small limit deletes it irrecoverably.
    # The renderer has always emitted this; it is a config key so a run can turn
    # checkpointing off ("no") without editing the step. "steps" pairs with
    # save_steps below and is what every validated reference config sets.
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 20
    logging_steps: 5
    dataset_num_proc: 64

    # ── GOLD / distillation loss ────────────────────────────────────────────
    temperature: 1.0
    # 0 => off-policy: every node trains on the fixed dataset, no vLLM.
    lmbda: 0.0
    beta: 0.0
    # granite's logits_scaling=10 overflows the fused bf16 JSD kernel -> NaN loss.
    use_liger_fused_jsd: false

    # The objective as a validated PRESET, instead of nine booleans a build may combine
    # freely. EMPTY BY DEFAULT and empty means unchanged: the flags above stay
    # authoritative, every existing recipe renders exactly the config it rendered before,
    # and the escape hatch those recipes' READMEs document (--param
    # USE_LIGER_FUSED_JSD=true) keeps working.
    #
    # Naming an arm buys two things a boolean cannot. First, the arm sets the switches the
    # renderer has no flag for at all (use_kl_interpolation, use_adaptive_kld, use_distillm2,
    # use_distillm2_like, use_reversed_distillm2_like, use_uld_loss, use_ce_loss). Second,
    # it enforces that arm's requirements -- several of which exist because OUTSIDE them the
    # arm does not fail, it silently becomes a different arm, which no later step could
    # detect. See LOSS_ARMS in src/render_gold_config.py, which lists each arm and why.
    loss_arm: ""
    # Verify the student's tokenizer is the one the corpus was built with. Off by default;
    # ON is worth it for any build that chains distill-corpus-prep into this step, because
    # a mismatch does not error -- it trains on mis-segmented text at full speed with a
    # falling loss.
    check_corpus_tokenizer: false
    # Check every key this step is about to emit that upstream trl's GOLDConfig does not
    # define (the on-policy shaping pair, min_completion_length, the lmbda ramp window,
    # stop_at_step) against the
    # baked-in trainer's dataclass (steps/train/distill/src/), and refuse before accelerate
    # launches.
    #
    # ON by default: the vendor pin could in principle be bumped to a commit whose fields
    # drift from what this template emits, and the two ways that goes wrong are both
    # expensive. TrlParser rejects an unknown top-level key only after the teacher has
    # loaded on every node of a held allocation, and min_completion_length fails the
    # other way, silently, by never reaching the sampler at all. Costs one import of a
    # package the image's own PYTHONPATH already provides.
    #
    # It only looks at keys that are actually emitted, so a recipe leaving all of them at
    # their defaults never triggers it. Set false only to render deliberately against a
    # trainer you know differs.
    verify_trainer_accepts_keys: true
    # Required for completion masking; the nothink chat template has no
    # {% generation %} tag, so this is what locates the span.
    #
    # A trailing line boundary must be written as the two-character escape \n, not
    # as a real newline: gbserver fills every config string through Jinja, which
    # strips exactly one trailing newline from each value, so a real one never
    # reaches this step. render_gold_config.py decodes the escape once, in the
    # container. The default below wants no line boundary and so carries none.
    response_template: "<|im_start|>assistant"

    # ── NCCL / distributed diagnostics ──────────────────────────────────────
    # Empty disables NCCL's own logging. Set to INFO (with nccl_debug_subsys
    # INIT,NET) to see which transport and HCA each rank selected — the only way
    # to tell an IB path from a silent TCP fallback, or to see where a collective
    # stalls. Verbose, so off by default.
    nccl_debug: ""
    nccl_debug_subsys: "INIT,NET"
    # Collective timeout. The reference launcher uses 3600000 (1 h) to survive a
    # slow 30B teacher forward without spurious aborts. Lower it for debugging so
    # a hang reports in minutes rather than tying up an allocation.
    nccl_timeout_ms: 3600000
    # Whether torch's monitor thread may abort a stalled collective. The
    # reference launcher disables this; we default it ON deliberately, because
    # with it off a deadlock does not fail — it hangs forever holding the
    # allocation, producing no diagnostic at all. Set false only to reproduce the
    # reference launcher's exact behaviour.
    nccl_enable_monitoring: true
    # NCCL_IB_HCA for this run, overriding the environment's nccl_tuning_file (which
    # only sets it when unset). EMPTY => not touched, and the tuning file's value
    # stands. Exported from the run block, never as a launcher env, because an empty
    # env value would reach NCCL as "use every HCA" -- storage NICs included.
    # Keep the tuning file's exclusions when adding one, e.g. on BlueVela
    # "^=mlx5_1,mlx5_6,mlx5_8" drops the mlx5_8 rail on top of the storage NICs.
    nccl_ib_hca: ""

    # ── On-policy (online), default off ─────────────────────────────────────
    # >0 dedicates the LAST N nodes to serving the student under vLLM and trains
    # on the rest. On-policy continues from a good off-policy checkpoint, so bind
    # the `student` input to that checkpoint rather than the base overlay.
    vllm_num_servers: 0
    # An EXTERNAL vLLM server is the optional `vllm` input — see `inputs:` below.
    # server = talk to a vLLM HTTP server; the reference launcher's value. Only
    # consulted on the on-policy path.
    vllm_mode: "server"
    # How often, in optimizer steps, the trainer pushes its updated weights to the
    # server. The reference launcher uses 1: on-policy means generating from the
    # CURRENT student, so a larger value samples from a staler policy.
    vllm_sync_frequency: 1
    top_p: 0.95
    use_sampled_opd_loss: false
    last_message_only: false
    clip_alpha: 0.1
    opd_importance_sampling: false
    # constant, or linear to ramp lmbda from lmbda_init up to lmbda across training —
    # off-policy early, where the corpus signal is, on-policy later, where the
    # student's own degenerate regions are. Both need a vLLM server, so the renderer
    # refuses linear at vllm_num_servers 0 rather than leaving it inert.
    lmbda_schedule: "constant"
    lmbda_init: 0.0
    # The linear ramp's window: it starts at lmbda_ramp_start_step (lmbda_init before
    # it) and reaches lmbda after lmbda_ramp_steps steps; 0 ramps until max_steps. The
    # renderer refuses either with a constant schedule. stop_at_step saves and ends
    # training at that step while max_steps -- and the LR schedule built from it --
    # stays as it is: what a resume of a longer run needs to train a fixed number of
    # extra steps on its original schedule. All three are vendored-trainer fields
    # (steps/train/distill/src/VENDORED.md).
    lmbda_ramp_start_step: 0
    lmbda_ramp_steps: 0
    stop_at_step: 0
    # vLLM min_tokens for the student's rollout. >0 blocks the immediate-EOS mode
    # collapse. The vendored trainer sends it as min_tokens in every request's
    # generation_kwargs, which trl 0.26's vllm_serve applies to SamplingParams.
    min_completion_length: 0

# I/O schema, validated against the build.yaml target at build time: a target that
# does not bind a required input fails validation before anything is queued. The
# run script reads path inputs as {{ bindings.<name>.binding.path }} and the
# mem:// `vllm` input as {{ bindings.vllm.binding.state }}. allow_unknown stays true
# so a recipe can bind extra inputs purely to order targets.
inputs:
  allow_unknown: true
  required:
    # Student init.
    student:
      type: model
      accept: [uri, binding]
    # Frozen, forward-only in the training loop.
    teacher:
      type: model
      accept: [uri, binding]
    # distill-corpus-prep's `corpus`. Must be think-filtered ("nothink"): an
    # assistant completion containing an inline <think>...</think> breaks gold's
    # completion extraction.
    corpus:
      type: dataset
      accept: [uri, binding]
  optional:
    # An EXTERNAL vLLM server, reached by URL, instead of carving nodes out of
    # this allocation: bind distill-vllm-server's mem:// `vllm_url`. When
    # bound, EVERY node here trains and the role split below does not happen; the
    # trainer is given the address on gold.py's command line. Unbound keeps the
    # in-allocation split that gold_config.vllm_num_servers alone selects.
    #
    # NOT YET RUN ON A CLUSTER. The trainer pushes updated student weights to the
    # server over NCCL (the reference launcher's VLLM_NCCL_COORDINATOR_PORT), so
    # an external server means a NCCL process group spanning two LSF allocations.
    # Whether that works here is the open question this path exists to answer.
    vllm:
      type: fileset
      accept: [binding]

outputs:
  optional:
    checkpoint:
      type: model

environment_configs:
  Skypilot:
    # Shared across LSF and SLURM: the topology this step reads is SkyPilot's
    # own generic SKYPILOT_* set (see the header comment above), not a
    # provisioner-specific contract, so one step serves both. Still excludes
    # aws/kubernetes: the image is an SM90 (H100) build that cannot run on
    # A100, and those subtypes aren't validated for this step yet.
    subtypes:
      - lsf
      - slurm
    default_launcher: gold
    launchers:
      gold:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          image_id: "docker:us.icr.io/cil15-shared-registry/gb-step-distillation-gpu:e2c0ab49"
          # Node count and accelerators come from the build.yaml
          # (compute_config.num_nodes and launcher_config.resources) so one step
          # serves the smoke and reference runs.
          resources: {}
          envs:
            # The SLURM executor runs the task under `env -u PYTHONPATH` and without
            # VIRTUAL_ENV, so the image's ENV values for both are gone at run time.
            PYTHONPATH: /opt/distill/src
            VIRTUAL_ENV: /stage/.venv
            TORCH_NCCL_ENABLE_MONITORING: '{{ "1" if config.gold_config.nccl_enable_monitoring else "0" }}'
            TORCH_NCCL_TIMEOUT_MS: "{{ config.gold_config.nccl_timeout_ms }}"
            NCCL_TIMEOUT: "{{ config.gold_config.nccl_timeout_ms }}"
            NCCL_DEBUG: "{{ config.gold_config.nccl_debug }}"
            NCCL_DEBUG_SUBSYS: "{{ config.gold_config.nccl_debug_subsys }}"
            USE_LIBUV: "0"
            PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
            DS_SKIP_CUDA_CHECK: "1"
            OMP_NUM_THREADS: "8"
          # NCCL_IB_HCA / NCCL_SOCKET_IFNAME are deliberately absent: the
          # environment's nccl_tuning_file is sourced outside the container
          # before the enroot config is written, and the generated environ()
          # forwards the outer environment. Confirm on a real run with
          # `grep NCCL_ job.log`; if that file does not set them, add both here.
          run: |
            {% set train_dir = config.train_dir | default("") | string | trim -%}
            {% set resume_src = config.resume_from_checkpoint_dir | default("") | string | trim -%}
            {% set rollout_stop = config.rollout_stop_file | default("") | string | trim -%}
            {% set vllm_server_url = bindings.vllm.binding.state | string | trim if bindings.vllm is defined else "" %}
            # The inputs used to be config keys. A recipe that still sets one would
            # otherwise be ignored silently, so refuse it.
            {% for key in ("model_name_or_path", "teacher_model_name_or_path", "dataset_name", "vllm_server_url") if config.gold_config[key] is defined %}
            echo "logit-distill: FATAL: gold_config.{{ key }} is no longer read; bind the target input instead (see this step's README)" >&2
            exit 1
            {% endfor %}

            # This node's rank. SKYPILOT_NODE_RANK is SkyPilot's own generic var,
            # confirmed present on both the lsf and slurm subtypes (see the header
            # comment) — unlike RANK, which only LSF's provisioner sets.
            NODE_RANK="${SKYPILOT_NODE_RANK:-0}"
            {%- if rollout_stop %}

            # ── Rollout server stop file ──
            # Rendered only when rollout_stop_file is set. Armed first, so a failure
            # anywhere below stops the rollout server, not only the trainer's own. A
            # later EXIT trap on rank 0 (the resume handshake, the checkpoint watcher)
            # calls this too, so it stays armed until the script ends; the script's
            # exit status is unchanged by it.
            ROLLOUT_STOP_FILE="{{ rollout_stop }}"
            rollout_stop_on_exit() {
              [ "$1" -ne 0 ] || return 0
              [ "$NODE_RANK" = "0" ] || return 0
              mkdir -p "$(dirname "$ROLLOUT_STOP_FILE")" 2>/dev/null || true
              if printf '%s\nlogit-distill rank 0 exited with status %s\n' \
                  "${GB_TARGETRUN_ID:-unknown}" "$1" > "$ROLLOUT_STOP_FILE.tmp.$$" 2>/dev/null \
                && mv -f "$ROLLOUT_STOP_FILE.tmp.$$" "$ROLLOUT_STOP_FILE" 2>/dev/null; then
                echo "logit-distill: exited with status $1; wrote $ROLLOUT_STOP_FILE to stop the rollout server" >&2
              else
                rm -f "$ROLLOUT_STOP_FILE.tmp.$$" 2>/dev/null || true
                echo "logit-distill: exited with status $1; could not write $ROLLOUT_STOP_FILE, so the rollout server runs until its lifetime cap" >&2
              fi
            }
            trap 'rollout_stop_on_exit $?' EXIT
            {%- endif %}

            # --- distill source: baked into the shared GPU image, no clone ---
            # Like every other distillation step, this step's trainer source
            # and venv are both baked into steps/train/distill/images/gpu/Dockerfile at build time,
            # not cloned/synced at job-launch time -- see the "Source delivery" comment
            # above config: for why. Both paths are fixed by that Dockerfile's own
            # COPY/ENV lines; nothing here resolves them dynamically.
            PYBIN="python"
            export PATH="$VIRTUAL_ENV/bin:$PATH"
            CODE_DIR="${DISTILL_HOME:?DISTILL_HOME is set by the image}"
            # PYTHONPATH=/opt/distill/src is already set by the image
            # itself (ENV PYTHONPATH in steps/train/distill/images/gpu/Dockerfile); nothing to export
            # here.
            #
            # The commit is a fixed fact of the image, not something to discover via
            # `git rev-parse` at run time (the baked-in tree is a COPY, not a checkout --
            # see steps/train/distill/src/VENDORED.md), so it's recorded as a literal here,
            # matching the SAME commit every other distillation step records.
            echo "GB_STEP_METADATA_KEY:distill_code_source GB_STEP_METADATA_VALUE:baked-image"
            echo "GB_STEP_METADATA_KEY:distill_code_commit GB_STEP_METADATA_VALUE:a5d59bc45524a8d75706e20d44ae1a254f273f23"
            # --- distill source: END ---

            # Snapshot the rest of the node-level topology from SkyPilot's own
            # generic vars (NODE_RANK was already read above, before source
            # delivery). SKYPILOT_NODE_IPS is newline-joined and rank-ordered
            # (confirmed in SkyPilot's own task_codegen.py), so its first line
            # is always rank 0's address — already an IP, unlike LSF's
            # MASTER_ADDR, which is a short hostname needing /etc/hosts
            # resolution. MASTER_PORT has no SkyPilot-generic equivalent on
            # either subtype, so it's derived the same way LSF's own
            # provisioner derives its port from LSB_JOBID
            # (sky/provision/lsf/instance.py): offset a base port by the job
            # id mod 1000, using SKYPILOT_INTERNAL_JOB_ID instead since that
            # one is generic (confirmed set on both subtypes in
            # sky/backends/task_codegen.py).
            NODES="${SKYPILOT_NUM_NODES:-1}"
            GPUS="${SKYPILOT_NUM_GPUS_PER_NODE:-8}"
            MADDR="$(printf '%s\n' "${SKYPILOT_NODE_IPS:?SKYPILOT_NODE_IPS not set by the provisioner}" | head -n1)"
            MPORT=$((29500 + (${SKYPILOT_INTERNAL_JOB_ID:-0} % 1000)))

            # GPU allocation check (ibm-granite/granite.build#604). On Slurm 25.11.x an
            # --overlap job step -- SkyPilot's container keeper is one -- can be granted
            # fewer of the job's GPUs than the job holds (SchedMD bug 24862, fixed in
            # 26.05.3), and the container keeps the keeper's device set. Ranks past the
            # visible count would then bind a GPU another rank already holds and fail
            # later, far from the cause. Refuse here instead. `nvidia-smi -L` lists what
            # the container's device cgroup grants and ignores CUDA_VISIBLE_DEVICES; a
            # failed or missing nvidia-smi (0 listed) proves nothing, so only an
            # undercount it reports is refused. Nothing is rewritten or worked around:
            # the check holds whether the fix lands in Slurm or in SkyPilot.
            GPU_WANT="${SKYPILOT_NUM_GPUS_PER_NODE:-0}"
            case $GPU_WANT in ''|*[!0-9]*) GPU_WANT=0 ;; esac
            GPU_SEEN="$(nvidia-smi -L 2>/dev/null | grep -c '^GPU ' || true)"
            case $GPU_SEEN in ''|*[!0-9]*) GPU_SEEN=0 ;; esac
            GPU_DEVS="$(ls /dev/nvidia[0-9]* 2>/dev/null | tr '\n' ' ' || true)"
            echo "logit-distill: gpu check: allocated=$GPU_WANT visible=$GPU_SEEN CUDA_VISIBLE_DEVICES='${CUDA_VISIBLE_DEVICES:-<unset>}' SLURM_JOB_GPUS='${SLURM_JOB_GPUS:-}' SLURM_STEP_GPUS='${SLURM_STEP_GPUS:-}' devices='$GPU_DEVS'"
            if [ "$GPU_SEEN" -ge 1 ] && [ "$GPU_SEEN" -lt "$GPU_WANT" ]; then
              echo "logit-distill: FATAL: $GPU_WANT GPU(s) were allocated (SKYPILOT_NUM_GPUS_PER_NODE) but this container can access only $GPU_SEEN (nvidia-smi -L). On SLURM this is ibm-granite/granite.build#604; rerun, or report the node." >&2
              exit 1
            fi

            # Weight residency, BEFORE the role split below: the vLLM branch `exec`s, so a
            # check placed after it would never run on the node that serves the student --
            # which loads the student too. Every node checks (metadata-only, a few
            # mmlsattr calls), because a rank-0-only check that refused would leave the
            # other ranks waiting on a rendezvous that is never coming.
            {% if config.gold_config.check_weight_residency %}
            "$PYBIN" "$DISTILL_HOME/steps/logit-distill/check_weight_residency.py" \
              {% if config.gold_config.allow_offline_weights %}--allow-offline{% endif %} \
              "student={{ bindings.student.binding.path }}" \
              "teacher={{ bindings.teacher.binding.path }}"
            {% endif %}

            # MADDR is already an IP (see above), unlike LSF's short-hostname
            # MASTER_ADDR, so no /etc/hosts/getent resolution is needed here —
            # accelerate gets the address directly.
            MIP="$MADDR"
            echo "logit-distill: master $MADDR -> $MIP:$MPORT"

            VLLM_SERVERS={{ config.gold_config.vllm_num_servers | int }}

            # Identity derives from the ALLOCATION, never from a build parameter,
            # so the checkpoint path cannot claim a node count the run did not have.
            CONFIG_NAME="{{ config.gold_config.run_name }}_node${NODES}"
            {%- if train_dir %}
            # train_dir is stable for the whole build (see config: above), unlike the
            # per-run GB_BUILD_WORKDIR, so a build-level retry finds its checkpoints here.
            TRAIN_DIR="{{ train_dir }}"
            TRAIN_DIR="${TRAIN_DIR%/}"
            CKPT_DIR="$TRAIN_DIR/checkpoints/${CONFIG_NAME}"
            CFG="$TRAIN_DIR/gold_config_${CONFIG_NAME}.yaml"
            {%- else %}
            CKPT_DIR="${GB_BUILD_WORKDIR:-$PWD}/checkpoints/${CONFIG_NAME}"
            CFG="${GB_BUILD_WORKDIR:-$PWD}/gold_config_${CONFIG_NAME}.yaml"
            {%- endif %}

            # The trainer's commit is already recorded above as distill_code_commit,
            # by the (now unconditional) source-delivery block: the trainer and the
            # rest of this collection are the same baked package, so there is nothing
            # left to record separately here.
            {% set _true = [true, "true", "True", "1", 1] -%}
            {% if resume_src or train_dir %}
            {%- if train_dir %}
            # ── train_dir: prepare the checkpoint dir an earlier attempt may have left ──
            # Rendered whenever train_dir is set. Rank 0 moves a half-written checkpoint
            # aside, seeds from resume_from_checkpoint_dir only if nothing is left, checks
            # the attempt made progress (require_progress), and checks and rewrites the
            # checkpoint the trainer will resume from, all while the other ranks wait on
            # the handshake below. With resume_from_checkpoint_dir set, the seeding and
            # its checks are the ones documented under "Resume" next.
            {%- endif %}
            {%- if resume_src %}
            # ── Resume: seed this run's checkpoint dir from an earlier run ──
            # Rendered only when resume_from_checkpoint_dir is set. Runs BEFORE the
            # checkpoint watcher starts, so the watcher never sees a half-linked
            # directory, and before any rank reaches gold.py's checkpoint glob, so
            # every rank makes the same resume-or-not decision. A split decision
            # (rank 0 resumes, a worker starts fresh) would hang in the first
            # collective rather than fail.
            RESUME_SRC="{{ config.resume_from_checkpoint_dir | string | trim }}"
            RESUME_SRC="${RESUME_SRC%/}"
            {%- endif %}
            # rank 0 -> the other ranks: this attempt's token once the seed is done,
            # "failed:<token>" if rank 0 exits first. A retry_workload relaunch reuses
            # GB_BUILD_WORKDIR, so a marker already here is the previous attempt's and
            # must not release anyone; the token is built as the clone handshake's is.
            RESUME_SEEDED="$CKPT_DIR/.resume-seeded"
            RESUME_TOKEN="${GB_SKYPILOT_LAUNCH_ID:-}:${SKYPILOT_INTERNAL_JOB_ID:-}:${LSB_JOBID:-${SLURM_JOB_ID:-}}"
            # The watcher's completeness test: these bracket HF Trainer's whole save
            # sequence, so a checkpoint the source run was killed while writing is
            # skipped rather than resumed from. Weights are model.safetensors, or the
            # index save_pretrained writes after the last shard of sharded ones.
            RESUME_SENTINELS="tokenizer.json trainer_state.json"
            resume_complete() {
              [ -f "$1/model.safetensors" ] || [ -f "$1/model.safetensors.index.json" ] \
                || return 1
              for sentinel in $RESUME_SENTINELS; do
                [ -f "$1/$sentinel" ] || return 1
              done
            }
            # ZeRO optimizer shards in a checkpoint: one per training rank. The tr
            # strips the padding BSD wc adds, so the count prints the same everywhere.
            resume_shards() {
              find "$1" -mindepth 2 -maxdepth 2 -path '*/global_step*/*' \
                -name '*optim_states.pt' 2>/dev/null | wc -l | tr -d '[:space:]'
            }
            # get_last_checkpoint's name rule, ^checkpoint-[0-9]+$: HF never loads
            # anything else, so nothing else is seeded, checked or picked.
            resume_is_checkpoint() {
              base="${1##*/}"
              step="${base#checkpoint-}"
              [ -d "$1" ] && [ "$step" != "$base" ] && [ -n "$step" ] \
                && [ -n "${step##*[!0-9]*}" ]
            }
            if [ "$NODE_RANK" = "0" ]; then
              mkdir -p "$CKPT_DIR"
              # Any exit before the seed is done tells the waiting ranks at once,
              # rather than after their 900s.
              trap '{% if rollout_stop %}_rc=$?; {% endif %}[ "$(cat "$RESUME_SEEDED" 2>/dev/null || true)" = "$RESUME_TOKEN" ] \
                || { printf "failed:%s\n" "$RESUME_TOKEN" > "$RESUME_SEEDED.tmp.$$" \
                && mv -f "$RESUME_SEEDED.tmp.$$" "$RESUME_SEEDED"; } 2>/dev/null || true{% if rollout_stop %}; rollout_stop_on_exit "$_rc"{% endif %}' EXIT
              {%- if not train_dir %}
              if [ ! -d "$RESUME_SRC" ]; then
                echo "logit-distill: FATAL: resume_from_checkpoint_dir '$RESUME_SRC' is not a directory." >&2
                exit 1
              fi
              {%- endif %}
              # An EXTERNAL server (the `vllm` input bound) is another target's allocation:
              # every node here trains, whatever vllm_num_servers says. Only the
              # in-allocation split gives nodes to vLLM -- see "Node roles" below.
              {% if vllm_server_url %}
              RESUME_WORLD=$(( NODES * GPUS ))
              {% else %}
              RESUME_WORLD=$(( (NODES - VLLM_SERVERS) * GPUS ))
              {% endif %}
              # What a failed attempt was writing when it died: rank 0's files missing,
              # or fewer optimizer shards than ranks (a node died mid DeepSpeed save;
              # this run's own attempts all share its topology). HF would pick it if it
              # is the highest and fail on every rank; moved aside instead, out of HF's
              # and the watcher's checkpoint-* pattern. Kept for diagnosis: the per-run
              # workdir, and these with it, is reaped when the target run tears down.
              for ckpt in "$CKPT_DIR"/checkpoint-*; do
                resume_is_checkpoint "$ckpt" || continue
                shards="$(resume_shards "$ckpt")"
                if resume_complete "$ckpt" \
                  && { [ "$shards" -eq 0 ] || [ "$shards" -ge "$RESUME_WORLD" ]; }; then
                  continue
                fi
                aside="$CKPT_DIR/incomplete-${ckpt##*/}.$(date +%Y%m%dT%H%M%S)"
                mv "$ckpt" "$aside"
                echo "logit-distill: resume: moved incomplete ${ckpt##*/} aside to ${aside##*/}"
              done
              {%- if train_dir %}
              # Under train_dir the moved-aside ones stay for diagnosis: it is not reaped
              # with the target run. Every checkpoint-<N> left is complete, so any one of
              # them means an earlier attempt of this build trained here.
              RESUME_HELD=""
              TRAIN_SEEDED=""
              for ckpt in "$CKPT_DIR"/checkpoint-*; do
                if resume_is_checkpoint "$ckpt"; then
                  RESUME_HELD=1
                  break
                fi
              done
              {%- endif %}
              {%- if resume_src %}
              {%- if train_dir %}
              # The source only ever seeds an empty train_dir: what an earlier attempt of
              # this build wrote there is further along the same lineage.
              if [ -n "$RESUME_HELD" ]; then
                echo "logit-distill: resume: train_dir already holds checkpoints; ignoring resume_from_checkpoint_dir"
              else
              TRAIN_SEEDED=1
              if [ ! -d "$RESUME_SRC" ]; then
                echo "logit-distill: FATAL: resume_from_checkpoint_dir '$RESUME_SRC' is not a directory." >&2
                exit 1
              fi
              {%- endif %}
              RESUME_COUNT=0
              SEED_TOP=""
              for ckpt in "$RESUME_SRC"/checkpoint-*; do
                resume_is_checkpoint "$ckpt" || continue
                if ! resume_complete "$ckpt"; then
                  echo "logit-distill: resume: skipping incomplete $(basename "$ckpt")"
                  continue
                fi
                if [ -e "$CKPT_DIR/$(basename "$ckpt")" ]; then
                  echo "logit-distill: resume: $(basename "$ckpt") already present, not re-seeded"
                else
                  cp -al "$ckpt" "$CKPT_DIR/" 2>/dev/null || cp -a "$ckpt" "$CKPT_DIR/"
                  echo "logit-distill: resume: seeded $(basename "$ckpt") from $RESUME_SRC"
                fi
                RESUME_COUNT=$(( RESUME_COUNT + 1 ))
                # Numeric, not lexical: checkpoint-500 sorts after checkpoint-1500.
                step="${ckpt##*/checkpoint-}"
                if [ -z "$SEED_TOP" ] || [ "$step" -gt "$SEED_TOP" ]; then
                  SEED_TOP="$step"
                fi
              done
              if [ "$RESUME_COUNT" -eq 0 ]; then
                echo "logit-distill: FATAL: no complete checkpoint-* under '$RESUME_SRC'." >&2
                echo "  Resuming was asked for, so starting from step 0 instead would" >&2
                echo "  silently spend the whole schedule again." >&2
                exit 1
              fi
              {%- if train_dir %}
              fi
              {%- endif %}
              {%- endif %}
              {%- if train_dir and config.require_progress | default(true) in _true %}
              # After the move-aside and the seed, so a half-written checkpoint does not
              # count and a first attempt is measured from what it was seeded with; before
              # anything is emitted and before accelerate. Exit 3 is a refusal: the EXIT
              # trap above releases the waiting ranks with "failed:<token>".
              #
              # The attempt is the TARGET RUN: gbserver exports GB_TARGETRUN_ID to every
              # SkyPilot launch (skypilot.py _launch_env_layers). A retry_workload relaunch
              # replays the same launch, and so the same id (and reuses GB_BUILD_WORKDIR,
              # .../runs/<targetrun_id>); a build-level retry creates new target runs.
              ATTEMPT_ID="${GB_TARGETRUN_ID:-}"
              if [ -z "$ATTEMPT_ID" ]; then
                echo "logit-distill: FATAL: GB_TARGETRUN_ID is not set, so require_progress cannot tell a relaunch from a retry; set require_progress: false to train without the check." >&2
                exit 1
              fi
              "$PYBIN" "$DISTILL_HOME/steps/logit-distill/progress_check.py" \
                --train-dir "$TRAIN_DIR" --ckpt-dir "$CKPT_DIR" --attempt-id "$ATTEMPT_ID"
              {%- endif %}
              # Every check below is on the checkpoint the trainer resumes from:
              # gold.py calls train(resume_from_checkpoint=True), and HF's
              # get_last_checkpoint takes the highest checkpoint-<N> in CKPT_DIR. After a
              # retry that can be one the failed attempt wrote, above everything seeded.
              # Every checkpoint-<N> left here is complete.
              RESUME_CKPT=""
              for ckpt in "$CKPT_DIR"/checkpoint-*; do
                resume_is_checkpoint "$ckpt" || continue
                step="${ckpt##*/checkpoint-}"
                if [ -z "$RESUME_CKPT" ] || [ "$step" -gt "${RESUME_CKPT##*/checkpoint-}" ]; then
                  RESUME_CKPT="$ckpt"
                fi
              done
              {%- if train_dir %}
              if [ -z "$RESUME_CKPT" ]; then
                echo "logit-distill: train_dir: no checkpoint yet; the trainer starts from step 0"
              else
              {%- endif %}
              RESUME_NAME="${RESUME_CKPT##*/}"
              # A ZeRO-3 checkpoint holds one optimizer shard per rank and DeepSpeed
              # cannot load it at another world size. Checked here, on a CPU-cheap
              # count, rather than discovered by every rank after allocation.
              RESUME_SHARDS="$(resume_shards "$RESUME_CKPT")"
              if [ "$RESUME_SHARDS" -gt 0 ] && [ "$RESUME_SHARDS" -ne "$RESUME_WORLD" ]; then
                echo "logit-distill: FATAL: $RESUME_NAME holds $RESUME_SHARDS ZeRO optimizer shards" >&2
                echo "  but this run trains on $RESUME_WORLD ranks. Resume with the source's topology." >&2
                exit 1
              fi
              # HF Trainer restores trainer_state.json whole on resume, and with it the
              # SOURCE run's save_steps and logging_steps: this run's --save-steps is
              # replaced with a warning nobody sees, and every rung of this run's
              # ladder that is not also on the source's grid is never written (build
              # 4c758672, A1: a 250-step ladder on c2000's 1000). Rewrite both in the
              # checkpoint the trainer resumes from. Single-quoted so an unsubstituted
              # value reaches its FATAL message instead of tripping `set -u`.
              "$PYBIN" "$DISTILL_HOME/steps/logit-distill/align_resume_state.py" --checkpoint "$RESUME_CKPT" \
                --save-steps '{{ config.gold_config.save_steps }}' \
                --logging-steps '{{ config.gold_config.logging_steps }}'
              {%- if train_dir %}
              if [ -z "$TRAIN_SEEDED" ]; then
                echo "logit-distill: train_dir: the trainer resumes from $RESUME_NAME, written by an earlier attempt of this build"
              fi
              {%- endif %}
              {%- if resume_src %}
              {%- if train_dir %}
              if [ -n "$TRAIN_SEEDED" ]; then
              {%- endif %}
              echo "logit-distill: resume: $RESUME_COUNT checkpoint(s) seeded; the trainer resumes from $RESUME_NAME"
              # Lineage is the seed: the source's highest complete checkpoint. A higher
              # one here was written by an earlier attempt of this run, from that seed.
              if [ "$RESUME_NAME" != "checkpoint-$SEED_TOP" ]; then
                echo "logit-distill: resume: $RESUME_NAME was written by an earlier attempt of this run, after the seed"
              fi
              echo "GB_STEP_METADATA_KEY:resumed_from GB_STEP_METADATA_VALUE:$RESUME_SRC/checkpoint-$SEED_TOP"
              {%- if train_dir %}
              fi
              {%- endif %}
              {%- endif %}
              {%- if train_dir %}
              fi
              {%- endif %}
              printf '%s\n' "$RESUME_TOKEN" > "$RESUME_SEEDED.tmp.$$"
              mv -f "$RESUME_SEEDED.tmp.$$" "$RESUME_SEEDED"
              {% if rollout_stop %}trap 'rollout_stop_on_exit $?' EXIT{% else %}trap - EXIT{% endif %}
            else
              # The checkpoint dir is on the shared filesystem, so rank 0's marker is
              # visible here once it is written. Bounded, for a rank 0 that died
              # without its EXIT trap running.
              waited=0
              while :; do
                seed="$(cat "$RESUME_SEEDED" 2>/dev/null || true)"
                [ "$seed" = "$RESUME_TOKEN" ] && break
                if [ "$seed" = "failed:$RESUME_TOKEN" ]; then
                  echo "logit-distill: FATAL: rank 0 failed to {{ "prepare" if train_dir else "seed" }} $CKPT_DIR; its log says why." >&2
                  exit 1
                fi
                if [ "$waited" -ge 900 ]; then
                  echo "logit-distill: FATAL: rank 0 did not finish seeding $CKPT_DIR within 900s." >&2
                  exit 1
                fi
                sleep 5
                waited=$(( waited + 5 ))
              done
              echo "logit-distill: rank $NODE_RANK: resume seed present after ${waited}s"
            fi
            {% endif %}
            {% if config.emit_checkpoint_artifacts in _true %}
            # ── Per-checkpoint artifact emission ────────────────────────────
            # Rendered only when emit_checkpoint_artifacts is on, so the
            # single-checkpoint recipes get byte-identical script to before.
            #
            # HF Trainer writes each save into ${CKPT_DIR}/checkpoint-<N>, where
            # <N> is the optimizer step. A downstream export/eval target can
            # start against rung N the moment it is written rather than after the
            # whole run, but only if something says so mid-run — the final
            # artifact at the bottom of this script is emitted once, at the end.
            # So: a background loop globs the dir and emits one artifact line per
            # newly completed checkpoint, which the monitor's periodic log
            # retrieval scrapes while the job is still RUNNING.
            #
            # The emitted id is checkpoint_<N> and it MUST match the output names
            # the recipe declares on this target.
            CKPT_GLOB="checkpoint-"
            CKPT_WATCH_INTERVAL="{{ config.checkpoint_watch_interval_seconds | default(60) }}"
            # Completeness sentinels: a checkpoint is emitted only once ALL of
            # these exist. Trainer._save_checkpoint writes in a fixed order —
            # save_model (config, weights, tokenizer) -> optimizer/scheduler ->
            # rng_state -> state.save_to_json(trainer_state.json) — so requiring
            # the weights, the last tokenizer file AND trainer_state.json brackets
            # the entire write sequence. A plain non-empty check would race it and
            # hand a half-written model to an export that has already allocated.
            # Sharded weights (not this 350m pair) would need
            # model.safetensors.index.json here too.
            CKPT_SENTINELS="model.safetensors tokenizer.json trainer_state.json"
            # One marker file per emitted checkpoint. On disk rather than in a
            # shell variable because emit_new_checkpoints also runs inside the
            # backgrounded watcher subshell, whose variables never propagate back
            # to this shell — the markers are the two halves' only shared state,
            # and the final guard counts them.
            EMITTED_DIR="$(mktemp -d)"
            {% if config.resume_from_checkpoint_dir | default("") | string | trim and config.resume_emit_seeded not in _true %}
            # resume_emit_seeded is off: mark every seeded checkpoint as already
            # emitted -- seeded, meaning the source holds a complete one of that name.
            # After a retry_workload relaunch the dir also holds what the failed
            # attempt wrote, which may never have been emitted (killed between
            # watcher sweeps); those are left for the watcher.
            for ckpt in "$CKPT_DIR"/${CKPT_GLOB}*; do
              [ -d "$ckpt" ] || continue
              resume_complete "$RESUME_SRC/$(basename "$ckpt")" || continue
              touch "$EMITTED_DIR/$(basename "$ckpt")"
              echo "logit-distill: resume: not re-emitting seeded $(basename "$ckpt")"
            done
            {% endif %}

            emit_new_checkpoints() {
              for ckpt in "$CKPT_DIR"/${CKPT_GLOB}*; do
                [ -d "$ckpt" ] || continue
                base="$(basename "$ckpt")"
                step="${base#${CKPT_GLOB}}"
                marker="$EMITTED_DIR/$base"
                [ -e "$marker" ] && continue
                complete=1
                for sentinel in $CKPT_SENTINELS; do
                  [ -f "$ckpt/$sentinel" ] || { complete=0; break; }
                done
                [ "$complete" -eq 1 ] || continue
                touch "$marker"
                echo "GB_ARTIFACT_ID:checkpoint_${step} GB_ARTIFACT_PATH:${ckpt}"
              done
            }

            watch_checkpoints() {
              while true; do
                emit_new_checkpoints
                sleep "$CKPT_WATCH_INTERVAL"
              done
            }

            WATCH_PID=""
            cleanup_watcher() {
              if [ -n "$WATCH_PID" ] && kill -0 "$WATCH_PID" 2>/dev/null; then
                kill "$WATCH_PID" 2>/dev/null || true
                wait "$WATCH_PID" 2>/dev/null || true
                WATCH_PID=""
              fi
            }
            {%- if train_dir %}

            # ── Re-emit on resume ───────────────────────────────────────────
            # train_dir outlives the attempt, so it can already hold checkpoints an
            # earlier attempt emitted. gbserver re-checks a downstream export only once
            # its input binding is delivered again on the retry; undelivered, those
            # targets are never dispatched and the build still reports SUCCESS
            # (test/unit/buildrunner/test_checkpoint_consumer_reuse_on_retry.py). So
            # rank 0 emits every complete one again, at the same path, in step order,
            # before the trainer starts, and marks it so the watcher does not emit it a
            # second time. EMITTED_DIR is new per attempt; the only markers already in
            # it are the seeded rungs resume_emit_seeded: false withholds on purpose.
            # Runs after the move-aside above, so a half-written one is never emitted.
            if [ "$NODE_RANK" = "0" ]; then
              for step in $(for ckpt in "$CKPT_DIR"/checkpoint-*; do
                if resume_is_checkpoint "$ckpt" && resume_complete "$ckpt"; then
                  printf '%s\n' "${ckpt##*/checkpoint-}"
                fi
              done | sort -n); do
                [ -e "$EMITTED_DIR/checkpoint-$step" ] && continue
                touch "$EMITTED_DIR/checkpoint-$step"
                echo "GB_ARTIFACT_ID:checkpoint_${step} GB_ARTIFACT_PATH:$CKPT_DIR/checkpoint-$step"
              done
            fi
            {%- endif %}

            # RANK 0 ONLY, for the same reason the final artifact line below is
            # rank-guarded: the executor streams every node's stdout into one
            # driver log, so an unguarded marker would register the same
            # checkpoint N times. The watcher is started just before the trainer.
            if [ "$NODE_RANK" = "0" ]; then
              # EXIT-time cleanup on every path — success, trainer failure, or
              # signal — so the loop cannot outlive the script and keep emitting.
              trap '{% if rollout_stop %}_rc=$?; {% endif %}cleanup_watcher; rm -rf "$EMITTED_DIR"{% if rollout_stop %}; rollout_stop_on_exit "$_rc"{% endif %}' EXIT
              mkdir -p "$CKPT_DIR"
              watch_checkpoints &
              WATCH_PID=$!
              echo "logit-distill: watching $CKPT_DIR/${CKPT_GLOB}* every ${CKPT_WATCH_INTERVAL}s (pid $WATCH_PID)"
            fi
            {% endif %}

            # The trainer's commit is already recorded above as distill_code_commit,
            # by the (now unconditional) source-delivery block: the trainer and the
            # rest of this collection are the same baked package, so there is nothing
            # left to record separately here.

            # Rendered per node (each has its own container filesystem) but into
            # a shared path, so the content must be identical on every node — it
            # is, since every input is a build parameter except the node count.
            "$PYBIN" "$DISTILL_HOME/steps/logit-distill/render_gold_config.py" \
              --output "$CFG" \
              --total-nodes "$NODES" \
              --model-name-or-path "{{ bindings.student.binding.path }}" \
              --teacher-model-name-or-path "{{ bindings.teacher.binding.path }}" \
              --dataset-name "{{ bindings.corpus.binding.path }}" \
              --num-train-epochs {{ config.gold_config.num_train_epochs }} \
              --max-steps {{ config.gold_config.max_steps }} \
              --data-seed {{ config.gold_config.data_seed | default(-1) }} \
              --learning-rate {{ config.gold_config.learning_rate }} \
              --min-lr {{ config.gold_config.min_lr }} \
              --warmup-ratio {{ config.gold_config.warmup_ratio }} \
              --lr-scheduler-type "{{ config.gold_config.lr_scheduler_type }}" \
              --per-device-train-batch-size {{ config.gold_config.per_device_train_batch_size }} \
              --gradient-accumulation-steps {{ config.gold_config.gradient_accumulation_steps }} \
              --max-completion-length {{ config.gold_config.max_completion_length }} \
              --max-length {{ config.gold_config.max_length }} \
              --gradient-checkpointing {{ config.gold_config.gradient_checkpointing }} \
              --save-strategy "{{ config.gold_config.save_strategy }}" \
              --save-steps {{ config.gold_config.save_steps }} \
              --save-total-limit {{ config.gold_config.save_total_limit }} \
              --logging-steps {{ config.gold_config.logging_steps }} \
              --dataset-num-proc {{ config.gold_config.dataset_num_proc }} \
              --temperature {{ config.gold_config.temperature }} \
              --lmbda {{ config.gold_config.lmbda }} \
              --beta {{ config.gold_config.beta }} \
              --use-liger-fused-jsd {{ config.gold_config.use_liger_fused_jsd }} \
              --lmbda-schedule "{{ config.gold_config.lmbda_schedule | default('constant') }}" \
              --lmbda-init {{ config.gold_config.lmbda_init | default(0.0) }} \
              --min-completion-length {{ config.gold_config.min_completion_length | default(0) }} \
              --lmbda-ramp-start-step {{ config.gold_config.lmbda_ramp_start_step | default(0) }} \
              --lmbda-ramp-steps {{ config.gold_config.lmbda_ramp_steps | default(0) }} \
              --stop-at-step {{ config.gold_config.stop_at_step | default(0) }} \
              --adam-beta2 {{ config.gold_config.adam_beta2 | default(-1.0) }} \
              --train-sampling-strategy "{{ config.gold_config.train_sampling_strategy | default('') }}" \
              --loss-arm "{{ config.gold_config.loss_arm }}" \
              --verify-trainer-accepts-keys {{ config.gold_config.verify_trainer_accepts_keys | default(true) }} \
              --check-corpus-tokenizer {{ config.gold_config.check_corpus_tokenizer }} \
              --response-template '{{ config.gold_config.response_template }}' \
              --vllm-num-servers {{ config.gold_config.vllm_num_servers }} \
              --top-p {{ config.gold_config.top_p }} \
              --use-sampled-opd-loss {{ config.gold_config.use_sampled_opd_loss }} \
              --last-message-only {{ config.gold_config.last_message_only }} \
              --clip-alpha {{ config.gold_config.clip_alpha }} \
              --opd-importance-sampling {{ config.gold_config.opd_importance_sampling }} \
              --vllm-server-url "{{ vllm_server_url }}"

            if [ "$NODE_RANK" = "0" ]; then
              echo "--- rendered gold config ($CFG) ---"
              cat "$CFG"
              echo "--- end gold config ---"
            fi
            mkdir -p "$CKPT_DIR"

            {% if config.gold_config.nccl_ib_hca | default("") | string | trim %}
            export NCCL_IB_HCA="{{ config.gold_config.nccl_ib_hca | string | trim }}"
            echo "logit-distill: rank $NODE_RANK: NCCL_IB_HCA overridden to $NCCL_IB_HCA"
            {% endif %}

            # Node roles, three cases.
            #
            # 1. EXTERNAL server (the `vllm` input bound): the server lives in another
            #    target's allocation and this one is all trainers. The address is
            #    split out of the URL here rather than templated, because it is only
            #    known at run time — it arrives through a mem:// binding.
            # 2. In-allocation split (`vllm` unbound, vllm_num_servers > 0):
            #    the LAST N nodes serve, matching the reference launcher.
            # 3. Off-policy (the default): every node trains.
            VLLM_URL="{{ vllm_server_url }}"
            VLLM_ARGS=""
            if [ -n "$VLLM_URL" ]; then
              # http://host:port -> host, port. Strip the scheme, then split on the
              # LAST colon so an IPv6 literal or a missing port is not silently
              # mangled into something that fails at connect time instead of here.
              _hostport="${VLLM_URL#*://}"
              _hostport="${_hostport%%/*}"
              case "$_hostport" in
                *:*) VLLM_HOST="${_hostport%:*}"; VLLM_PORT="${_hostport##*:}" ;;
                *)   VLLM_HOST="$_hostport";      VLLM_PORT="8001" ;;
              esac
              if [ -z "$VLLM_HOST" ]; then
                echo "logit-distill: FATAL: could not parse a host out of vllm_server_url '$VLLM_URL'" >&2
                exit 1
              fi
              TRAINER_NODES="$NODES"
              VLLM_ARGS="--vllm_mode {{ config.gold_config.vllm_mode }}"
              VLLM_ARGS="$VLLM_ARGS --vllm_sync_frequency {{ config.gold_config.vllm_sync_frequency }}"
              VLLM_ARGS="$VLLM_ARGS --vllm_server_host $VLLM_HOST --vllm_server_port $VLLM_PORT"
              echo "logit-distill: external vLLM server at $VLLM_HOST:$VLLM_PORT; all $NODES node(s) train"
            else
              TRAINER_NODES=$(( NODES - VLLM_SERVERS ))
              if [ "$VLLM_SERVERS" -gt 0 ] && [ "$NODE_RANK" -ge "$TRAINER_NODES" ]; then
                echo "logit-distill: rank $NODE_RANK serving the student under vLLM"
                # SLURM's pyxis/enroot builds this container in a separate srun
                # from the one that injects the NVIDIA driver, so the image's
                # own /etc/ld.so.cache misses libcuda.so and Triton's driver
                # discovery (which checks `ldconfig -p` before falling back to
                # LD_LIBRARY_PATH) fails with "libcuda.so cannot found!".
                # Unconditional and harmless where the gap doesn't exist (LSF,
                # or a cache that's already current) — see
                # steps/train/distill/images/gpu/README.md.
                ldconfig 2>/dev/null || true
                exec "$PYBIN" -m gb_steps_post_training.distillation.run_vllm_serve \
                  --port "${KD_VLLM_API_PORT:-8001}" \
                  --model "{{ bindings.student.binding.path }}" \
                  --gpu-memory-utilization 0.9 \
                  --tensor-parallel-size 1 \
                  --data-parallel-size "$GPUS" \
                  --log_level warning \
                  --max-model-len {{ config.gold_config.max_length }}
              fi
            fi

            # --use_vllm is stated in BOTH directions below, from the same
            # vllm_num_servers that gates every other on-policy key. gold.py
            # defaults it to False and custom_gold_trainer.py:2003 branches on it:
            # False sends generation down the local ZeRO-3 path
            # (generate_on_policy_outputs) rather than to the server. Emitted only
            # negatively — as it was until now — an on-policy run allocates a vLLM
            # node, health-checks it, plumbs its address in, then generates locally
            # and leaves the server idle. Build d77546a9 did exactly that, logged
            # not one request against the server, and died in the local path.
            echo "logit-distill: rank $NODE_RANK/$NODES training ($TRAINER_NODES trainer node(s)), master $MADDR:$MPORT"
            accelerate launch \
              --num_processes $(( TRAINER_NODES * GPUS )) \
              --num_machines "$TRAINER_NODES" \
              --machine_rank "$NODE_RANK" \
              --main_process_ip "$MIP" \
              --main_process_port "$MPORT" \
              --config_file "$CODE_DIR/{{ config.gold_config.ds_config }}" \
              -m gb_steps_post_training.distillation.gold \
              --config "$CFG" \
              --output_dir "$CKPT_DIR" \
              --use_vllm={{ 'True' if config.gold_config.vllm_num_servers | int > 0 else 'False' }} \
              $VLLM_ARGS

            {% if config.emit_checkpoint_artifacts in _true %}
            # The trainer has exited. Stop the watcher, then sweep once more for
            # anything written between its last poll and that exit — including the
            # final checkpoint, which on a run bounded by an epoch rather than by
            # save_steps is written at a step no save grid names.
            if [ "$NODE_RANK" = "0" ]; then
              cleanup_watcher
              emit_new_checkpoints

              # Fail LOUDLY on zero, because the alternative failure is silent:
              # a recipe's checkpoint_<N> outputs would never be produced, every
              # export/eval target bound to them would stay unready, and the build
              # would hang with no error to read. Count the markers, not a shell
              # variable — see EMITTED_DIR above.
              EMITTED_COUNT="$(find "$EMITTED_DIR" -mindepth 1 -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d '[:space:]')"
              if [ "$EMITTED_COUNT" -eq 0 ]; then
                echo "logit-distill: FATAL: no checkpoint dirs matched '${CKPT_DIR}/${CKPT_GLOB}*'." >&2
                echo "  emit_checkpoint_artifacts is on, so a recipe is bound to" >&2
                echo "  checkpoint_<N> ids that will now never arrive. Either the run" >&2
                echo "  never reached save_steps, or the trainer's checkpoint dir" >&2
                echo "  naming changed — align CKPT_GLOB and the recipe's ladder." >&2
                exit 1
              fi
              echo "logit-distill: emitted $EMITTED_COUNT per-checkpoint artifact(s)"
            fi
            {% endif %}

            # Rank 0 only: the executor streams every node's output into one
            # driver log, so an unguarded marker would register N artifacts.
            if [ "$NODE_RANK" = "0" ]; then
              echo "GB_ARTIFACT_ID:checkpoint GB_ARTIFACT_PATH:${CKPT_DIR}"
            fi
    monitors:
      skypilot_monitor:
        # Artifact/binding convention from the shipped library; overridden to
        # `periodic` retrieval because a distillation run lasts hours and the
        # default on_completion surfaces nothing until the end.
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(900) }}"
          log_retrieval:
            mode: "{{ config.log_retrieval_mode | default('periodic') }}"
            interval_seconds: "{{ config.log_retrieval_interval_seconds | default(900) }}"
          extra_event_configs:
          # TRL logs a metrics dict, not open-instruct's "Step: N" banner. Pin
          # this against real job_log output from the first smoke run.
          - event_type: WORKLOAD_STATUS_EVENT
            line_regex: "'loss':"
            event_fields:
              - field_name: status
                field_value_template: "RUNNING"
              - field_name: message
                field_regex: "\\{'loss'.+"
