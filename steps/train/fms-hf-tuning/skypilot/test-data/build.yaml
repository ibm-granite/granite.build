#####
# fms-hf-tuning: full fine-tuning, LoRA or aLoRA with foundation-model-stack's
# fms-hf-tuning, single node.
#
# ONE target. The step loads the bound base model, attaches a LoRA adapter
# (peft_method: lora), trains it with fms-hf-tuning's sft_trainer on an HF chat
# dataset (the messages column, with the model's chat template and the turn
# markers fms-hf-tuning masks on), and registers the ADAPTER as the `model`
# artifact. ClearML is `auto`: on only when CLEARML_API_HOST,
# CLEARML_API_ACCESS_KEY and CLEARML_API_SECRET_KEY reach the step env.
#
# Render (offline; prints the resolved build.yaml), then submit:
#   gb build describe -f build.yaml --raw --parameters-path parameters.yaml
#   gb build start    -f build.yaml --parameters-path parameters.yaml --dry-run
#   gb build start    -f build.yaml --parameters-path parameters.yaml
# Override one parameter with --param KEY=VALUE.
#####
granite.build:
  name: fms-hf-tuning

  targets:

    train:
      environment_uri: space://environments/$${ENVIRONMENT}
      inputs:
        base_model:
          uri: "hf:///$${BASE_MODEL_ID}"
      outputs:
        # The tuned model or adapter dir; fms_hf_tuning_config.output names this entry.
        model:
          uri: "$${MODEL_URI}"
          type: model
      steps:
        - step_uri: space://steps/train/fms-hf-tuning
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            launcher_config:
              resources:
                # GPUs are requested here; the step uses all of them.
                accelerators: "$${ACCELERATORS}"
            compute_config:
              num_nodes: 1
            fms_hf_tuning_config:
              peft_method: lora
              distributed: fsdp
              dataset_name: "$${DATASET}"
              base_model_id: "$${BASE_MODEL_ID}"
              clearml_project: "$${CLEARML_PROJECT}"
              # Any fms-hf-tuning argument, under its own name.
              args:
                r: 16
                lora_alpha: 32
                lora_dropout: 0.05
                target_modules: all-linear
                # Chat data: the conversation column and the turn markers of
                # the model's chat template (Granite 3.x shown).
                dataset_conversation_field: messages
                instruction_template: "<|start_of_role|>user<|end_of_role|>"
                response_template: "<|start_of_role|>assistant<|end_of_role|>"
                max_seq_length: 4096
                per_device_train_batch_size: 2
                gradient_accumulation_steps: 4
                learning_rate: 2.0e-04
                lr_scheduler_type: cosine
                warmup_ratio: 0.03
                num_train_epochs: 1
                gradient_checkpointing: true
                logging_steps: 10
                seed: 123
