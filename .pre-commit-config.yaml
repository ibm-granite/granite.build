repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 8.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: license-headers
        name: license headers (Apache-2.0, Granite.Build Authors)
        # Inserts any missing header and fails so the change can be reviewed and
        # staged, like black. CI runs the same script in check-only mode.
        entry: python3 scripts/check_license_headers.py --fix
        language: system
        types: [text]
