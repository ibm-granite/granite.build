repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        # --filter-files makes isort honor extend_skip_glob in pyproject.toml for the file
        # paths pre-commit passes explicitly. Overriding args drops the hook's default
        # --filter-files, so it must be repeated here.
        args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
