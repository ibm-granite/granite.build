# Containerized (docker) AutoTune run using space://steps/autotune.
# Structural reference — replace the <YOUR_*> placeholders before running.
#
# Two things differ from the bash sample, both because of Docker's config
# precedence (docs/environments/docker.md, "Image resolution" / "Environment-variable
# precedence"):
#
#   * `config.docker.image` is REQUIRED. The step.yaml deliberately pins no image,
#     because launcher_config.image outranks config.docker.image and would make the
#     image impossible to override per build. There is no environment-level default
#     either, so omitting this fails the launch with a clear error.
#   * FM_TUNE_ROOT and BACKEND go in `config.docker.env`, NOT the launcher env.
#     launcher_config.env WINS over config.docker.env (the inverse of the bash
#     environment), so anything a build needs to tune is kept out of step.yaml.
#     BASH_BUILD_VENV=false and the input wiring stay in the launcher env because
#     they are intrinsic to running this step in a container.
#
# The image must already contain fm-tune and its deps (BASH_BUILD_VENV=false means
# command.sh builds no venv and uses the image interpreter). FM_TUNE_ROOT is the
# fm-tune checkout INSIDE the image.
granite.build:
  name: autotune-docker
  version: 0.0.1
  targets:
    custom:
      environment_uri: space://environments/docker
      inputs:
        # HF inputs are bind-mounted read-only under /gb-hf-models/... and the
        # in-container path is what reaches the step as the binding.
        model:
          uri: hf:///ibm-granite/granite-4.1-3b
        dataset_files:
          uri: hf://huggingface.co/datasets/<YOUR_ORG>/<YOUR_DATASET>
      outputs:
        custom:
          # The step writes to /gb-workspace/output in the container; container paths
          # under /gb-workspace are translated back to the host path on push.
          # ABSOLUTE on purpose: gbserver resolves a relative file: URI against its
          # own CWD, not the build dir.
          # Without an explicit type the registered artifact is UNDEFINED
          # (BuildTargetOutputConfig.type), which breaks a downstream step
          # binding this as a `model` input.
          type: model
          uri: "file:<YOUR_OUTPUT_DIR>/autotune_{{ run_metadata.build_id }}/"
      steps:
        - step_uri: space://steps/autotune
          config:
            docker:
              # REQUIRED — see the header note.
              image: <YOUR_REGISTRY>/autotunex/build-runtime:21
              pull_policy: if-not-present
              env:
                # fm-tune checkout inside the image.
                FM_TUNE_ROOT: /opt/fm-tune
                # Optional. run.py defaults to torch; set mlx only on an arm64 image
                # built with fm-tune's [mlx] extra.
                BACKEND: torch
                NO_AUTOTUNE: "true"
                RUN_NAME: autotune-docker
                JOB_ID: "{{ run_metadata.build_id }}"
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
              total_memory_per_node: 32Gi
            # Inline tuning config — materialized by command.sh to a scratch dir
            # beside (not inside) the output dir, then passed as --config_file.
            autotune-config:
              tune_config:
                num_samples:
                  type: int
                  default: 2
                  min_val: 1
                  max_val: 10000
                  required: true
                  description: Number of HPO samples
              training_config:
                tuning_algorithm:
                  type: str
                  default: lora
                  values: [none, sft, lora]
                  required: true
                  description: Finetuning algorithm
                num_train_epochs:
                  type: int
                  default: 1
                  min_val: 1
                  max_val: 100
                  required: true
                  description: Training epochs
                num_gpus_per_trial:
                  type: int
                  default: 1
                  min_val: 1
                  max_val: 16
                  required: true
                  # REQUIRED: fm-tune's optimizer.setup_default_config() reads this
                  # with no default (optimizer.py:298) and fit_best_config() always
                  # calls it, so omitting it raises
                  #   TypeError: '>' not supported between 'NoneType' and 'int'
                  description: GPUs per trial (worker)
              tuners_config:
                lora:
                  title: LoRA
                  tuner_name: tuner.lora
                  description: Low rank adapter fine-tuning
                  dataset_type: dataset_type_a
                  hyperparams:
                    r:
                      type: int
                      values: [8, 16]
                      default: 16
                      min_val: 0
                      max_val: 64
                      options: [choice]
                      strategy: choice
                      for_tuner: true
                      description: Rank size
