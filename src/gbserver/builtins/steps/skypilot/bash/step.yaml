name: bash
version: 1.0.0
type: exec
config:
  bash_config:
    command: ""    # bash command to execute on the launcher node
  compute_config:
    num_gpus_per_node: 0
    total_memory_per_node: 4Gi

environment_configs:
  Skypilot:
    default_launcher: bash
    launchers:
      bash:
        type: skypilot
        monitors:
          - skypilot_monitor
        config:
          # Intentionally no image_id — runs on the bare launcher node so the
          # Pyxis SPANK plugin is not required (the local Docker SLURM
          # cluster from `make slurm-setup` does not have it).
          resources:
            cpus: "1+"
          run: |
            {{ config.bash_config.command }}
    monitors:
      # References the shipped monitor library (builtins/monitors/skypilot) as-is
      # — no environment dependency, no override. Inherits the standard artifact
      # convention (with binding) and the default poll/log_retrieval profile.
      skypilot_monitor:
        ref: space://monitors/skypilot
