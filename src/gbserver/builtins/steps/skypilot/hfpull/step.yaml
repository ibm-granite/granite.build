name: hfpull
version: 1.0.0
type: upload
config:
  retry_enabled_default: true
  retry_transparently_default: true
  gb:
    step_contents_in_env: false
  workload:
    cwd: .
  hfpull_config:
    path: <path>
    uri: <uri>
    owner: ''
    repo: ''
    revision: ''
    hf:
      type: ''
  compute_config:
    total_memory_per_node: 10Gi
environment_configs:
  Skypilot:
    default_launcher: hfpull
    launchers:
      hfpull:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          resources:
            cpus: 1+
          setup: |
            pip install --no-cache-dir 'huggingface_hub[cli]'
          run: |
            set -euo pipefail
            trap 'EC=$?; echo "hfpull failed at line $LINENO, exit code: $EC" >&2; exit $EC' ERR
            echo 'hfpull start'

            HF_DEST='{{ config.hfpull_config.path }}'
            HF_URI='{{ config.hfpull_config.uri }}'
            export HF_ENDPOINT='{{ config.hfpull_config.endpoint }}'
            HF_REPO='{{ config.hfpull_config.owner }}/{{ config.hfpull_config.repo }}'
            HF_REVISION='{{ config.hfpull_config.revision }}'
            HF_TYPE='{{ config.hfpull_config.hf.type }}'

            # Mocked when GBTEST_MOCK_HF is "true" (case-insensitive), matching
            # gbcommon.types.testing.is_hf_mocked. Forwarded as a worker env var.
            # Keep identical to the other hfpull/hfpush step scripts (lsf + skypilot);
            # skypilot embeds this inline (no shared file on the worker), so the copies
            # are kept byte-identical to prevent behavioral drift.
            hf_mocked() {
                case "${GBTEST_MOCK_HF:-}" in [Tt][Rr][Uu][Ee]) return 0 ;; *) return 1 ;; esac
            }
            if hf_mocked; then
                echo "[GBTEST_MOCK_HF] mocking hfpull — skipping real download"
                mkdir -p "${HF_DEST}"
                echo mock > "${HF_DEST}/.gbtest_mock_hfpull"
                echo "Pulled HF URI: ${HF_URI} to path ${HF_DEST}"
                echo 'hfpull end'
                exit 0
            fi

            # No HF_TOKEN required: public repos download anonymously. When set,
            # `hf download` picks up HF_TOKEN from the env for private/gated repos.

            # Cross-process download serialization + corrupt-cache self-healing,
            # mirroring gbcommon.uri.hf (HfURI.pull) for the CLI path. gbcommon is
            # not installed on the skypilot worker, so the logic is reproduced here
            # in shell (needs bash: arrays, ${var,,}, PIPESTATUS -- the run block
            # already relies on bash via `set -o pipefail` and `${var,,}` above).

            # >>> gb-hfpull shared shell: keep lsf/hfpull/command.sh and skypilot/hfpull/step.yaml in sync >>>
            # (the executable lines below are parity-checked by test_hfpull_shell_serialization)

            # Truthy-env test (matches gbcommon.uri.hf._env_flag).
            hf_env_flag() {
                local v="${1:-}"; v="${v,,}"
                # Trim leading/trailing whitespace only (matches Python str.strip); keep
                # internal spaces so 't rue' stays non-truthy as in _env_flag.
                v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
                case "$v" in 1|true|yes|on) return 0 ;; *) return 1 ;; esac
            }

            # Seconds to wait for the download lock (GB_HFPULL_LOCK_TIMEOUT,
            # default 300). Whole-second granularity (the poll loop sleeps 1s): a
            # positive sub-second value rounds up to 1 rather than truncating to 0,
            # which would fall through lock-less while the Python path honors e.g.
            # 0.5s. Invalid/non-numeric -> default; explicit 0 (or 0.0) stays 0.
            HFPULL_LOCK_TIMEOUT_DEFAULT=300
            hfpull_lock_timeout() {
                local raw="${GB_HFPULL_LOCK_TIMEOUT:-}" secs
                if [[ -z "${raw// }" ]]; then echo "${HFPULL_LOCK_TIMEOUT_DEFAULT}"; return; fi
                if [[ "${raw}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                    secs=$(( 10#${raw%%.*} ))  # base 10 so a leading zero (e.g. 08) is not octal
                    if (( secs == 0 )) && [[ ! "${raw}" =~ ^0+([.]0+)?$ ]]; then secs=1; fi
                    echo "${secs}"
                else
                    echo "Invalid GB_HFPULL_LOCK_TIMEOUT='${raw}'; using default ${HFPULL_LOCK_TIMEOUT_DEFAULT}s" >&2
                    echo "${HFPULL_LOCK_TIMEOUT_DEFAULT}"
                fi
            }

            # Best-effort mkdir lock beside the destination (matches
            # _hfpull_lock_path: <dirname dest>/.gb-hfpull-locks/<basename
            # dest>.lock). Always proceeds: on timeout or setup failure it just
            # returns, relying on huggingface_hub's own per-file locks (and the
            # self-heal below) -- it never fails the pull.
            HFPULL_LOCK_DIR=""
            HFPULL_IDENTITY="host:$(hostname)|pid:$$"
            HFPULL_LAST_OUT="$(mktemp)"

            hfpull_release_lock() {
                [[ -n "${HFPULL_LOCK_DIR}" ]] || return 0
                # Only remove a lock we still own (matches
                # SharedFileSystemLock._owned_by_us: a missing/mismatched identity
                # means a peer holds it now -> leave it).
                local owner
                owner="$(head -n1 "${HFPULL_LOCK_DIR}/lock.info" 2>/dev/null || true)"
                if [[ "${owner}" == "${HFPULL_IDENTITY}" ]]; then
                    rm -f "${HFPULL_LOCK_DIR}/lock.info" 2>/dev/null || true
                    rmdir "${HFPULL_LOCK_DIR}" 2>/dev/null || true
                fi
                HFPULL_LOCK_DIR=""
            }

            hfpull_cleanup() {
                hfpull_release_lock
                rm -f "${HFPULL_LAST_OUT}" 2>/dev/null || true
            }
            trap 'hfpull_cleanup' EXIT

            hfpull_acquire_lock() {
                local dest="$1" container lockdir timeout deadline now
                container="$(dirname "${dest}")/.gb-hfpull-locks"
                lockdir="${container}/$(basename "${dest}").lock"
                timeout="$(hfpull_lock_timeout)"
                if ! mkdir -p "${container}" 2>/dev/null; then
                    echo "hfpull: cannot create lock container ${container}; proceeding without lock" >&2
                    return 0
                fi
                deadline=$(( $(date +%s) + timeout ))
                while :; do
                    if mkdir "${lockdir}" 2>/dev/null; then
                        if printf '%s\n%s\n' "${HFPULL_IDENTITY}" "$(date +%s)" > "${lockdir}/lock.info" 2>/dev/null; then
                            HFPULL_LOCK_DIR="${lockdir}"
                        else
                            # Cannot record identity -> release() could not tell our
                            # lock from a peer's, so roll back and proceed lock-less
                            # (matches acquire()).
                            rmdir "${lockdir}" 2>/dev/null || true
                            echo "hfpull: created ${lockdir} but could not write identity; proceeding without lock" >&2
                        fi
                        return 0
                    fi
                    now="$(date +%s)"
                    if (( now >= deadline )); then
                        echo "hfpull: did not acquire download lock ${lockdir} within ${timeout}s; proceeding and relying on huggingface_hub's per-file locks" >&2
                        return 0
                    fi
                    sleep 1
                done
            }

            # One `hf download`, streaming output live while capturing it for
            # classification.
            hf_download_attempt() {
                local extra="$1"; shift
                hf download "$@" ${extra} 2>&1 | tee "${HFPULL_LAST_OUT}"
                return "${PIPESTATUS[0]}"
            }

            # Retry only on the recoverable corrupt-cache states (matches
            # _is_recoverable_hf_cache_error); fail fast on anything else.
            # Anchor .incomplete to the FileNotFoundError signature (its errno
            # text) so an unrelated failure merely naming an .incomplete path is
            # not misread as recoverable; keep "Consistency check failed" verbatim.
            HFPULL_RECOVERABLE_RE='(FileNotFoundError|No such file or directory).*\.incomplete|Consistency check failed'
            hfpull_download() {
                local force=""
                if hf_env_flag "${GB_HFPULL_FORCE:-}"; then
                    force="--force-download"
                    echo "hfpull: GB_HFPULL_FORCE set; forcing re-download" >&2
                fi
                if hf_download_attempt "${force}" "$@"; then return 0; fi
                if ! grep -Eq "${HFPULL_RECOVERABLE_RE}" "${HFPULL_LAST_OUT}"; then return 1; fi
                echo "hfpull: HF download cache looks corrupt; retrying with --force-download" >&2
                if hf_download_attempt "--force-download" "$@"; then return 0; fi
                if ! grep -Eq "${HFPULL_RECOVERABLE_RE}" "${HFPULL_LAST_OUT}"; then return 1; fi
                # Only clear the shared scratch dir when we hold the lock: unlocked, a peer
                # may be writing it and rm -rf would re-induce #320 (matches _pull_hf_repo's
                # allow_scratch_clear gate). Otherwise fail rather than clear unlocked.
                if [[ -z "${HFPULL_LOCK_DIR}" ]]; then
                    echo "hfpull: force re-download still failed; not clearing scratch cache because the download lock was not held (a peer may be writing it)" >&2
                    return 1
                fi
                echo "hfpull: force re-download still failed; clearing scratch download cache ${HF_DEST}/.cache/huggingface/download and retrying once more" >&2
                rm -rf "${HF_DEST}/.cache/huggingface/download"
                if hf_download_attempt "--force-download" "$@"; then return 0; fi
                return 1
            }
            # <<< gb-hfpull shared shell <<<

            mkdir -p "${HF_DEST}"
            echo "Pulling HF URI: ${HF_URI} to path ${HF_DEST}"

            HF_ARGS=("${HF_REPO}" --local-dir "${HF_DEST}")
            if [[ -n "${HF_REVISION}" ]]; then HF_ARGS+=(--revision "${HF_REVISION}"); fi
            if [[ -n "${HF_TYPE}" ]]; then HF_ARGS+=(--repo-type "${HF_TYPE}"); fi

            hfpull_acquire_lock "${HF_DEST}"
            echo hf download "${HF_ARGS[@]}"
            hfpull_download "${HF_ARGS[@]}"

            echo "Pulled HF URI: ${HF_URI} to path ${HF_DEST}"
            echo 'hfpull end'
    monitors:
      skypilot_monitor:
        type: skypilot_monitor
        config:
          poll_interval_seconds: 15
