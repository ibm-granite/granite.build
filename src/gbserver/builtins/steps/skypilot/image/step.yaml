name: image
version: 1.0.0
type: exec
config:
  image_config:
    command: ''
    image: ''
  compute_config:
    num_gpus_per_node: 0
    total_memory_per_node: 4Gi
environment_configs:
  Skypilot:
    default_launcher: image
    launchers:
      image:
        type: skypilot
        monitors:
        - skypilot_monitor
        config:
          image_id: docker:{{ config.image_config.image }}
          resources:
            cpus: 1+
            memory: 1+
          run: |
            {{ config.image_config.command }}
    monitors:
      # References the shipped monitor library (space://monitors/skypilot) for the
      # standard artifact convention (env:// PATH + mem:// STATE, both with
      # binding). This is a lightweight builtin used by quick/test builds, so keep
      # a small poll override for fast completion detection (base default is 60s).
      skypilot_monitor:
        ref: space://monitors/skypilot
        config:
          poll_interval_seconds: "{{ config.poll_interval_seconds | default(5) }}"
