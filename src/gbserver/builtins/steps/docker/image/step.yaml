name: image
version: 1.0.0
type: exec
config:
  image_config:
    command: ''
    image: ''
  compute_config:
    num_gpus_per_node: 0
    total_memory_per_node: 4Gi
environment_configs:
  Docker:
    launchers:
      image:
        type: docker
        monitors:
        - docker_log
        config:
          image: '{{ config.image_config.image }}'
          command:
          - bash
          - -c
          - '{{ config.image_config.command }}'
    monitors:
      # References the shipped monitor library (builtins/monitors/docker/monitor.yaml):
      # standard LLMB artifact detection (with binding) + a MESSAGE stream. No
      # environment dependency — resolves against the shipped default.
      docker_log:
        ref: space://monitors/docker
