lhpull_config:
  use_aspera: true
k8s:
  # See https://github.ibm.com/granite-dot-build/dmf-library-docker
  image: us.icr.io/cil15-shared-registry/gb-prod/dmf-library:commit-807bb8d994e22e752396b2063a47da2a0e7afebb
  env:
    HOME:
      value: "/app"
    DMF_DATASETS_CACHE:
      value: "/tmp"
    DMF_CACHE:
      value: "/tmp"
    LAKEHOUSE_ENVIRONMENT:
      value: {{ config.lhpull_config.lh.env }}
    LAKEHOUSE_TOKEN:
      valueFrom:
        secretKeyRef:
          name: {{ setup_config.space.secret }}
          key: {{ config.lhpull_config.lh.token_secretname }}