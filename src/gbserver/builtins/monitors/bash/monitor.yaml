# Shared monitor for the `log_monitor` type (Bash environment). Referenced by
# bash steps via `ref: space://monitors/bash`. Streams every log line as a
# MESSAGE_EVENT and detects the standard artifact markers (env:// PATH and
# mem:// STATE forms) plus the STEP_METADATA_KEY/VALUE step-metadata marker.
# Marker names are standardized on the GB_ prefix; the legacy LLMB_ prefix is
# still accepted for backwards compatibility with existing/external step
# implementations (every marker regex matches both). Steps that emit no markers
# simply never fire those events.
type: log_monitor
config:
  event_configs:
    - event_type: MESSAGE_EVENT
      line_regex: .*
      is_json: false
      event_fields:
        - field_name: msg
          field_regex: .*
    # filesystem-path artifact: a line that BEGINS with
    #   GB_ARTIFACT_ID:<output> GB_ARTIFACT_PATH:<path>
    # (or the legacy LLMB_ prefix) registers <path> as the artifact for the named
    # output. Consumed by any filesystem-backed store (file://, hf://, cos://,
    # lh://, env://); the output's uri scheme in build.yaml picks the handler, not
    # this marker. The `^` anchor is required because the command step echoes the
    # command back ("command step start: <cmd>"); other steps print the marker at
    # column 0, so the anchor still matches them.
    - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
      line_regex: "^(?:GB_|LLMB_)ARTIFACT_ID:.* (?:GB_|LLMB_)ARTIFACT_PATH:.*"
      is_json: false
      event_fields:
        - field_name: binding_id
          field_regex: "(?:(?<=GB_ARTIFACT_ID:)|(?<=LLMB_ARTIFACT_ID:))[^ ]+"
        - field_name: path
          field_regex: "(?:(?<=GB_ARTIFACT_PATH:)|(?<=LLMB_ARTIFACT_PATH:)).*"
          is_data: true
        - field_name: binding
          field_value_template: '{ "path": "{{ fields.data.path }}" }'
          is_json: true
    # mem:// artifact: a line that BEGINS with
    #   GB_ARTIFACT_ID:<output> GB_ARTIFACT_STATE:<value>
    # (or the legacy LLMB_ prefix) registers <value> as the artifact's `state`;
    # the mem:// store passes binding["state"] to the consumer verbatim (no path
    # normalisation), so a value like a service URL survives intact. The PATH and
    # STATE markers are mutually exclusive per line, so these two events never
    # both match a line.
    - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
      line_regex: "^(?:GB_|LLMB_)ARTIFACT_ID:.* (?:GB_|LLMB_)ARTIFACT_STATE:.*"
      is_json: false
      event_fields:
        - field_name: binding_id
          field_regex: "(?:(?<=GB_ARTIFACT_ID:)|(?<=LLMB_ARTIFACT_ID:))[^ ]+"
        - field_name: state
          field_regex: "(?:(?<=GB_ARTIFACT_STATE:)|(?<=LLMB_ARTIFACT_STATE:)).*"
          is_data: true
        - field_name: binding
          field_value_template: '{ "state": "{{ fields.data.state }}" }'
          is_json: true
    # step metadata: a line that BEGINS with
    #   GB_STEP_METADATA_KEY:<key> GB_STEP_METADATA_VALUE:<value>
    # (or the legacy LLMB_ prefix) merges <value> into the step's
    # StoredStepRun.metadata under <key> (e.g. a git commit_hash resolved at
    # runtime). Both fields are top-level, so they are splatted into
    # StepMetadataUpdateEventPayload. `^`-anchored for the same reason as the
    # artifact markers (the command step echoes the command back).
    - event_type: STEP_METADATA_UPDATE_EVENT
      line_regex: "^(?:GB_|LLMB_)STEP_METADATA_KEY:.* (?:GB_|LLMB_)STEP_METADATA_VALUE:.*"
      is_json: false
      event_fields:
        - field_name: metadata_key
          field_regex: "(?:(?<=GB_STEP_METADATA_KEY:)|(?<=LLMB_STEP_METADATA_KEY:))[^ ]+"
        - field_name: metadata_value
          # Trim trailing whitespace/carriage-return (CRLF logs) so it is not folded
          # into the value; internal spaces are preserved.
          field_regex: '(?:(?<=GB_STEP_METADATA_VALUE:)|(?<=LLMB_STEP_METADATA_VALUE:)).*?(?=\s*$)'
