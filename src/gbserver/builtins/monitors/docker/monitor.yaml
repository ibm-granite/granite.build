# Shared monitor for the `docker_log` type (Docker environment). Referenced by
# docker steps via `ref: space://monitors/docker.yaml`. Detects the standard
# LLMB env:// artifact marker (with a binding payload) and streams every other
# line as a MESSAGE_EVENT.
type: docker_log
config:
  event_configs:
    - event_type: NEWARTIFACT_IN_ENVIRONMENT_EVENT
      line_regex: LLMB_ARTIFACT_ID:.* LLMB_ARTIFACT_PATH:.*
      is_json: false
      event_fields:
        - field_name: binding_id
          field_regex: (?<=LLMB_ARTIFACT_ID:)[^ ]+
        - field_name: path
          field_regex: (?<=LLMB_ARTIFACT_PATH:).*
          is_data: true
        - field_name: binding
          field_value_template: '{ "path": "{{ fields.data.path }}" }'
          is_json: true
    - event_type: MESSAGE_EVENT
      line_regex: .*
      is_json: false
      event_fields:
        - field_name: msg
          field_regex: .*
